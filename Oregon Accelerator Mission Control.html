const SPORT_LABELS = {
  football: 'Football', basketball: "Men's Basketball", wbasketball: "Women's Basketball",
  'womens-basketball': "Women's Basketball", 'mens-basketball': "Men's Basketball",
  volleyball: 'Volleyball', baseball: 'Baseball', softball: 'Softball',
  soccer: "Soccer", 'womens-soccer': "Women's Soccer", 'mens-soccer': "Men's Soccer",
  swimming: 'Swimming & Diving', track: 'Track & Field', 'cross-country': 'Cross Country',
  golf: 'Golf', tennis: 'Tennis', wrestling: 'Wrestling', lacrosse: 'Lacrosse',
  rowing: 'Rowing', gymnastics: 'Gymnastics',
};
function parseAthleteFromUrl(url) {
  try {
    const path = new URL(url).pathname.toLowerCase();
    const parts = path.split('/').filter(Boolean);
    // e.g. /sports/football/roster/iverson-hooks/12345
    const sportIdx = parts.indexOf('sports');
    const rawSport = sportIdx >= 0 ? parts[sportIdx + 1] : null;
    const sport = rawSport ? (SPORT_LABELS[rawSport] || rawSport.split('-').map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(' ')) : null;
    const rosterIdx = parts.indexOf('roster');
    // Name slug is immediately after "roster", skip if it's numeric (that's an ID)
    const nameSlug = rosterIdx >= 0 ? parts.slice(rosterIdx + 1).find(p => !/^\d+$/.test(p)) : null;
    const name = nameSlug
      ? nameSlug.split('-').map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(' ')
      : null;
    return {
      ...(name  ? { name }  : {}),
      ...(sport ? { sport } : {}),
    };
  } catch { return {}; }
}

async function fetchAthleteFromUrl(url) {
  // Try multiple CORS proxies in sequence
  let html = '';
  const proxies = [
    u => `https://api.allorigins.win/get?url=${encodeURIComponent(u)}`,
    u => `https://corsproxy.io/?${encodeURIComponent(u)}`,
    u => `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(u)}`,
  ];
  for (const makeProxy of proxies) {
    try {
      const res = await fetch(makeProxy(url), { signal: AbortSignal.timeout(10000) });
      if (!res.ok) continue;
      const ct = res.headers.get('content-type') || '';
      // allorigins wraps in JSON; others return raw HTML
      if (ct.includes('application/json')) {
        const j = await res.json();
        html = j.contents || j.body || '';
      } else {
        html = await res.text();
      }
      if (html.length > 500) break;
    } catch {}
  }
  if (!html) throw new Error('All proxies failed');

  const doc  = new DOMParser().parseFromString(html, 'text/html');
  const data = parseAthleteFromUrl(url);
  const origin = new URL(url).origin;

  // Helper: assign only if not already set, value non-empty
  const set = (key, val) => {
    if (!val) return;
    const v = String(val).trim().replace(/\s+/g, ' ');
    if (v && !data[key]) data[key] = v;
  };
  // Force-set (overrides existing value)
  const fset = (key, val) => {
    if (!val) return;
    const v = String(val).trim().replace(/\s+/g, ' ');
    if (v) data[key] = v;
  };
  // Resolve relative URLs to absolute
  const abs = src => {
    if (!src) return src;
    src = src.trim().split(' ')[0]; // handle srcset
    if (src.startsWith('http')) return src;
    if (src.startsWith('//')) return 'https:' + src;
    try { return new URL(src, origin).href; } catch { return src; }
  };
  // Decode a Sidearm crop-service URL → original full-size image URL
  // e.g. https://images.sidearmdev.com/crop?url=ENCODED_CF_URL&width=180&height=270&type=webp
  const decodeSidearmSrc = (src) => {
    if (!src) return null;
    src = abs(src);
    try {
      const u = new URL(src);
      // Sidearm crop service: extract the inner "url" param (the actual image)
      if (u.hostname.includes('sidearmdev.com') || u.hostname.includes('sidearmcdn.com')) {
        const inner = u.searchParams.get('url');
        if (inner) return inner; // decoded CloudFront URL, full-size
      }
    } catch {}
    return src;
  };

  // ── PRIORITY 0: Sidearm data-test-id photo (runs first, wins always) ──
  // GoDucks uses <img data-test-id="s-image-resized__img"> or
  // <source data-test-id="s-image-resized__source-item--webp" srcset="...">
  const sidearmImgEl = doc.querySelector(
    'img[data-test-id="s-image-resized__img"], img[data-test-id*="s-image-resized"]'
  );
  const sidearmSrcEl = doc.querySelector(
    'source[data-test-id*="s-image-resized"][srcset], picture[data-test-id*="s-image-resized"] source[srcset]'
  );
  const rawSidearmSrc =
    sidearmImgEl?.getAttribute('src') ||
    sidearmImgEl?.getAttribute('data-src') ||
    sidearmSrcEl?.getAttribute('srcset')?.split(' ')[0] || '';
  if (rawSidearmSrc) fset('photo', decodeSidearmSrc(rawSidearmSrc));

  // ── 1. JSON-LD ────────────────────────────────────────────
  doc.querySelectorAll('script[type="application/ld+json"]').forEach(s => {
    try {
      const d = JSON.parse(s.textContent);
      const items = Array.isArray(d) ? d : [d];
      items.forEach(item => {
        const p = item['@type'] === 'Person' ? item
          : (item['@graph'] || []).find(x => x['@type'] === 'Person');
        if (!p) return;
        set('name',     p.name);
        set('position', p.jobTitle);
        // Don't override photo if already set from data-test-id
        if (!data.photo) {
          const img = p.image;
          set('photo', abs(typeof img === 'string' ? img : img?.url || img?.contentUrl));
        }
      });
    } catch {}
  });

  // ── 2. Meta tags ──────────────────────────────────────────
  const metaContent = (sel) => doc.querySelector(sel)?.getAttribute('content') || '';
  // Only use og:image as photo if nothing better was found yet
  if (!data.photo) set('photo', abs(metaContent('meta[property="og:image"]') || metaContent('meta[name="twitter:image"]')));
  const ogTitle = metaContent('meta[property="og:title"]') || metaContent('meta[name="twitter:title"]');
  if (ogTitle) set('name', ogTitle.split(/\s*[-–|·]\s*/)[0]);

  // ── 3. Sidearm S5 ("c-rosterbio" / "s-person-details__*") ─
  // GoDucks uses class names like c-rosterbio__player, s-person-details__bio-item
  // Bio rows: look for any element containing a label+value pair inside the bio page
  const bioRoot = doc.querySelector('#rosterBioPage, [class*="rosterbio"], [class*="roster-bio"], [class*="person-details"]');
  if (bioRoot) {
    // Find all text nodes that look like "Label:" followed by value text
    // Also works with structured label/value children
    bioRoot.querySelectorAll('li, div, span, p').forEach(el => {
      if (el.children.length > 6) return;
      const children = Array.from(el.children);
      // Pattern: two children where first is label, second is value
      if (children.length === 2) {
        const lbl = children[0].textContent.trim().replace(/:$/, '').toLowerCase();
        const val = children[1].textContent.trim();
        if (lbl && val && val !== lbl) applyLabelVal(lbl, val);
      }
      // Pattern: element has text like "Position: Wide Receiver"
      const raw = el.childNodes.length <= 3 ? el.textContent : '';
      const ci = raw.indexOf(':');
      if (ci > 0 && ci < 40) {
        const lbl = raw.slice(0, ci).trim().toLowerCase();
        const val = raw.slice(ci + 1).trim().split('\n')[0].trim();
        if (val && val.length < 80) applyLabelVal(lbl, val);
      }
    });
  }
  // S5 name + number
  set('name',   doc.querySelector('[class*="personal-main-title"], [class*="player__name"], [class*="player-name"] h1')?.textContent);
  set('number', doc.querySelector('[class*="personal-main-number"], [class*="jersey-number"], [class*="player-number"]')?.textContent?.replace(/\D/g,''));

  // ── 4. Classic Sidearm ("sidearm-roster-player-*") ────────
  const sdBioItems = doc.querySelectorAll('[class*="sidearm-roster-player-biographical"] li, [class*="sidearm-list-player-bio"] li');
  sdBioItems.forEach(item => {
    const label = item.querySelector('[class*="label"], b, strong')?.textContent.trim().replace(/:$/, '').toLowerCase() || '';
    const val   = item.querySelector('[class*="value"]')?.textContent.trim()
      || item.textContent.replace(label, '').replace(':', '').trim();
    if (label && val) applyLabelVal(label, val);
  });
  const sdImg = doc.querySelector('.sidearm-roster-player-image img, [class*="sidearm-roster-player-image"] img');
  if (sdImg) set('photo', abs(sdImg.getAttribute('src') || sdImg.getAttribute('data-src')));
  set('name',   doc.querySelector('.sidearm-roster-player-name h1, .sidearm-roster-player-name')?.textContent);
  set('number', doc.querySelector('.sidearm-roster-player-jersey-number, [class*="jersey-number"]')?.textContent?.replace(/\D/g,''));

  // ── 5. Generic label+value class pattern ─────────────────
  doc.querySelectorAll('[class*="bio-item"], [class*="biographical"], [class*="player-info"] li').forEach(item => {
    const labelEl = item.querySelector('[class*="label"], [class*="title"], dt, b, strong');
    const valEl   = item.querySelector('[class*="value"], [class*="data"], dd') || labelEl?.nextElementSibling;
    const label   = labelEl?.textContent.trim().replace(/:$/, '').toLowerCase() || '';
    const val     = valEl?.textContent.trim() || '';
    if (label && val && val !== label) applyLabelVal(label, val);
  });

  // ── 6. "Label: Value" colon text scanner ─────────────────
  // Catches any "Position: Wide Receiver" text in the page
  doc.querySelectorAll('li, dt, td, span, div, p').forEach(el => {
    if (el.children.length > 4) return; // skip large containers
    const text = el.textContent || '';
    const ci = text.indexOf(':');
    if (ci < 2 || ci > 45) return;
    const label = text.slice(0, ci).trim().toLowerCase();
    const val   = text.slice(ci + 1).trim().split(/\n/)[0].trim();
    if (val && val.length < 80) applyLabelVal(label, val);
  });

  // ── 7. Name / number fallbacks ────────────────────────────
  if (!data.name) {
    for (const sel of ['h1','h2','[class*="player-name"]','[class*="person-name"]']) {
      const t = doc.querySelector(sel)?.textContent.trim();
      if (t && t.length > 2 && t.length < 60) { set('name', t); break; }
    }
  }

  // ── 8. Photo fallback (if priority-0 didn't get it) ──────
  if (!data.photo) {
    const getImgSrc = (el) => {
      if (!el) return null;
      const src = el.getAttribute('src') || el.getAttribute('data-src') || el.getAttribute('data-lazy-src') || '';
      return src ? decodeSidearmSrc(src) : null;
    };
    // Try Sidearm container selectors
    for (const sel of [
      '[class*="s-person-details"] img', '[class*="s-person-media"] img',
      '[class*="rosterbio"] img', '[class*="roster-bio"] img',
      '[data-test-id*="person"] img', 'figure img',
      'img[src*="sidearmdev.com"]', 'img[src*="cloudfront.net"]',
      'img[src*="roster"]', 'img[src*="headshot"]', 'img[src*="player"]',
    ]) {
      const src = getImgSrc(doc.querySelector(sel));
      if (src && !src.match(/logo|icon|sponsor|ad[_-]/i)) { fset('photo', src); break; }
    }
  }

  // Helper called by multiple passes above
  function applyLabelVal(label, val) {
    const l = label.toLowerCase();
    if (!data.position   && l === 'position')                    set('position',   val);
    else if (!data.year  && (l === 'class' || l === 'year' || l === 'academic year')) set('year', val);
    else if (!data.hometown   && l === 'hometown')               set('hometown',   val);
    else if (!data.height     && l === 'height')                 set('height',     val);
    else if (!data.weight     && l === 'weight')                 set('weight',     val);
    else if (!data.highSchool && (l === 'high school' || l === 'hs')) set('highSchool', val);
    else if (!data.prevSchool && (l.includes('prev') || l.includes('previous') || l === 'prep school')) set('prevSchool', val);
    else if (!data.number     && (l === 'jersey' || l === 'number' || l === '#')) set('number', val.replace(/\D/g,''));
  }

  return data;
}

function AthleteDrawer({ athlete, state, setState, onClose, openCampaign }) {
  if (!athlete) return null;
  const { CAMPAIGNS } = state;
  const myCampaigns = CAMPAIGNS.filter(c => c.athleteIds.includes(athlete.id));
  const active = myCampaigns.filter(c => c.status === 'active' || c.status === 'pitching' || c.status === 'review');
  const past = myCampaigns.filter(c => c.status === 'complete');

  const updateAthlete = patch => setState(s => ({
    ...s, ATHLETES: s.ATHLETES.map(a => a.id === athlete.id ? { ...a, ...patch } : a),
  }));

  const [isDragOver, setIsDragOver] = useState(false);
  const [importState, setImportState] = useState(null);
  // null | 'loading' | { ok:true, data:{} } | { ok:false, msg:string }
  const [urlInput, setUrlInput] = useState('');
  const [selectedFields, setSelectedFields] = useState({});

  const handleUrlDrop = async (url) => {
    if (!url || !url.startsWith('http')) return;
    setUrlInput('');
    setImportState('loading');
    const initSelected = (data) => {
      const sel = {};
      Object.entries(data).forEach(([k, v]) => { if (v) sel[k] = true; });
      setSelectedFields(sel);
    };
    try {
      const data = await fetchAthleteFromUrl(url);
      setImportState({ ok: true, data });
      initSelected(data);
    } catch {
      // Fall back to URL slug parsing only
      const data = parseAthleteFromUrl(url);
      if (Object.keys(data).length > 0) {
        setImportState({ ok: true, data });
        initSelected(data);
      } else {
        setImportState({ ok: false, msg: 'Could not fetch the page. Check the URL and try again.' });
      }
    }
  };

  const FIELD_LABELS = { name:'Name', sport:'Sport', position:'Position', year:'Class', height:'Height', weight:'Weight', hometown:'Hometown', highSchool:'High School', prevSchool:'Prev. School', number:'Number', photo:'Photo' };

  return (
    <div className="oa-drawer-inner">
      <div className="oa-drawer-head">
        <div style={{ display: 'flex', alignItems: 'center', gap: 14 }}>
          {athlete.photoUrl ? (
            <img
              src={athlete.photoUrl}
              alt={athlete.name}
              className="oa-ath-avatar lg"
              style={{objectFit:'cover', objectPosition:'top'}}
              onError={e => { e.target.style.display='none'; e.target.nextSibling.style.display='flex'; }}
            />
          ) : null}
          <div className="oa-ath-avatar lg"
            style={{ background: `oklch(0.72 0.12 ${(athlete.name.charCodeAt(0) * 13) % 360})`, display: athlete.photoUrl ? 'none' : 'flex' }}>
            {athlete.name.split(' ').map(n => n[0]).slice(0,2).join('')}
          </div>
          <div>
            <div className="oa-eyebrow">Athlete · {athlete.year}</div>
            <h2 className="oa-h2" style={{margin:0}}>{athlete.name}</h2>
            <div className="oa-sub"><span>{athlete.sport} · {athlete.position}</span></div>
          </div>
        </div>
        <button className="oa-iconbtn" onClick={onClose}><Icons.X size={14}/></button>
      </div>

      <div className="oa-drawer-body">

        {/* ── URL import zone ── */}
        <div
          className={`oa-url-drop-zone${isDragOver ? ' dragover' : ''}${importState === 'loading' ? ' loading' : ''}`}
          onDragOver={e => { e.preventDefault(); setIsDragOver(true); }}
          onDragLeave={() => setIsDragOver(false)}
          onDrop={e => {
            e.preventDefault();
            setIsDragOver(false);
            const url = (e.dataTransfer.getData('text/plain') || e.dataTransfer.getData('text/uri-list') || '').trim();
            if (url) { setUrlInput(url); handleUrlDrop(url); }
          }}
        >
          {importState === 'loading' ? (
            <div style={{display:'flex',alignItems:'center',gap:10,width:'100%'}}>
              <div className="oa-spinner" style={{width:18,height:18,borderWidth:2,flexShrink:0}}/>
              <span style={{fontSize:12,color:'var(--ink-2)'}}>Fetching roster page…</span>
            </div>
          ) : (
            <div style={{display:'flex',alignItems:'center',gap:8,width:'100%'}}>
              <Icons.Link size={14} style={{color:'var(--ink-3)',flexShrink:0}}/>
              <input
                className="oa-url-import-input"
                type="url"
                placeholder="Paste or drop a roster URL…"
                value={urlInput}
                onChange={e => setUrlInput(e.target.value)}
                onKeyDown={e => { if (e.key === 'Enter' && urlInput.trim()) handleUrlDrop(urlInput.trim()); }}
                onPaste={e => {
                  // Give the paste a tick to land in the input, then auto-fire
                  setTimeout(() => {
                    const val = e.target.value.trim();
                    if (val.startsWith('http')) handleUrlDrop(val);
                  }, 0);
                }}
              />
              <button
                className="oa-btn kind-primary"
                style={{fontSize:11,padding:'5px 10px',flexShrink:0,opacity: urlInput.trim().startsWith('http') ? 1 : 0.4}}
                disabled={!urlInput.trim().startsWith('http')}
                onClick={() => handleUrlDrop(urlInput.trim())}
              >Import</button>
            </div>
          )}
        </div>

        {/* ── Import error ── */}
        {importState && importState !== 'loading' && !importState.ok && (
          <div style={{fontSize:12,color:'oklch(0.65 0.20 25)',background:'oklch(0.65 0.20 25 / 0.08)',border:'1px solid oklch(0.65 0.20 25 / 0.25)',borderRadius:8,padding:'8px 12px',marginBottom:14,display:'flex',alignItems:'center',justifyContent:'space-between',gap:8}}>
            <span>{importState.msg}</span>
            <button className="oa-iconbtn" style={{flexShrink:0}} onClick={() => setImportState(null)}><Icons.X size={11}/></button>
          </div>
        )}

        {/* ── Import preview ── */}
        {importState && importState !== 'loading' && importState.ok && (() => {
          const allKeys = Object.entries(importState.data).filter(([k,v]) => v);
          const checkedCount = allKeys.filter(([k]) => selectedFields[k]).length;
          const allChecked = checkedCount === allKeys.length;
          return (
            <div className="oa-url-import-preview">
              {/* Header row */}
              <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:8}}>
                <div style={{display:'flex',alignItems:'center',gap:8}}>
                  <span style={{fontSize:11,fontWeight:600,color:'var(--ink-2)',textTransform:'uppercase',letterSpacing:'0.06em'}}>Found on page</span>
                  <button style={{fontSize:10,color:'var(--ink-3)',background:'none',border:'none',cursor:'pointer',padding:0,textDecoration:'underline'}}
                    onClick={() => {
                      const next = {};
                      if (!allChecked) allKeys.forEach(([k]) => { next[k] = true; });
                      setSelectedFields(next);
                    }}>
                    {allChecked ? 'Deselect all' : 'Select all'}
                  </button>
                </div>
                <button className="oa-iconbtn" onClick={() => setImportState(null)}><Icons.X size={11}/></button>
              </div>

              {/* Field rows with checkboxes */}
              <div style={{display:'flex',flexDirection:'column',gap:3}}>
                {allKeys.filter(([k]) => k !== 'photo').map(([k, v]) => (
                  <label key={k} className="oa-url-import-field oa-url-import-field--check"
                    style={{cursor:'pointer', borderRadius:6, padding:'4px 6px',
                      background: selectedFields[k] ? 'var(--panel-3)' : 'transparent',
                      opacity: selectedFields[k] ? 1 : 0.45}}>
                    <input type="checkbox" checked={!!selectedFields[k]}
                      onChange={e => setSelectedFields(s => ({...s, [k]: e.target.checked}))}
                      style={{width:13,height:13,accentColor:'var(--accent)',flexShrink:0,cursor:'pointer'}}/>
                    <span style={{fontSize:11,color:'var(--ink-3)',minWidth:72,flexShrink:0}}>{FIELD_LABELS[k] || k}</span>
                    <span style={{fontSize:12,color:'var(--ink)',flex:1,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{v}</span>
                  </label>
                ))}
                {importState.data.photo && (
                  <label className="oa-url-import-field oa-url-import-field--check"
                    style={{cursor:'pointer', borderRadius:6, padding:'4px 6px', alignItems:'center',
                      background: selectedFields['photo'] ? 'var(--panel-3)' : 'transparent',
                      opacity: selectedFields['photo'] ? 1 : 0.45}}>
                    <input type="checkbox" checked={!!selectedFields['photo']}
                      onChange={e => setSelectedFields(s => ({...s, photo: e.target.checked}))}
                      style={{width:13,height:13,accentColor:'var(--accent)',flexShrink:0,cursor:'pointer'}}/>
                    <span style={{fontSize:11,color:'var(--ink-3)',minWidth:72,flexShrink:0}}>Photo</span>
                    <img src={importState.data.photo} alt="athlete"
                      style={{height:36,width:27,borderRadius:4,objectFit:'cover',objectPosition:'top'}}
                      onError={e => { e.target.style.display='none'; }}/>
                  </label>
                )}
              </div>

              {/* Footer */}
              <div style={{display:'flex',gap:8,marginTop:10,alignItems:'center'}}>
                <button className="oa-btn kind-primary" style={{flex:1,fontSize:12}}
                  disabled={checkedCount === 0}
                  onClick={() => {
                    const patch = {};
                    Object.entries(importState.data).forEach(([k, v]) => {
                      if (!selectedFields[k]) return;
                      if (k === 'photo') patch.photoUrl = v;
                      else patch[k] = v;
                    });
                    updateAthlete(patch);
                    setImportState(null);
                  }}>
                  Apply {checkedCount > 0 ? `${checkedCount} field${checkedCount > 1 ? 's' : ''}` : ''}
                </button>
                <button className="oa-btn" style={{fontSize:12}} onClick={() => setImportState(null)}>Discard</button>
              </div>
            </div>
          );
        })()}

        <div className="oa-ath-banner">
          <BannerStat label="IG Followers" value={fmt.followers(athlete.igFollowers)} sub={athlete.ig} />
          <BannerStat label="TikTok" value={fmt.followers(athlete.tiktokFollowers)} sub="followers" />
          <BannerStat label="Engagement" value={athlete.engagement + '%'} sub="avg" />
          <BannerStat label="Earnings YTD" value={fmt.money(athlete.earningsYTD)} sub={`Lifetime ${fmt.money(athlete.earningsLifetime)}`} />
        </div>

        <Section title="Bio">
          <div className="oa-kv">
            <div><span className="oa-k">Position</span><span className="oa-v">{athlete.position || '—'}</span></div>
            <div><span className="oa-k">Class</span><span className="oa-v">{athlete.year || '—'}</span></div>
            {athlete.hometown && <div><span className="oa-k">Hometown</span><span className="oa-v">{athlete.hometown}</span></div>}
            {athlete.height && <div><span className="oa-k">Height</span><span className="oa-v">{athlete.height}</span></div>}
            {athlete.weight && <div><span className="oa-k">Weight</span><span className="oa-v">{athlete.weight}</span></div>}
            {athlete.highSchool && <div><span className="oa-k">High School</span><span className="oa-v">{athlete.highSchool}</span></div>}
            {athlete.prevSchool && <div><span className="oa-k">Prev. School</span><span className="oa-v">{athlete.prevSchool}</span></div>}
          </div>
        </Section>

        <Section title="Athlete profile">
          <div className="oa-member-radar-wrap">
            <Radar values={athlete.spider}
              axes={state.ATHLETE_AXES || window.OA_DATA.ATHLETE_AXES}
              hue={(athlete.name.charCodeAt(0) * 13) % 360} size={300}/>
          </div>
        </Section>

        <Section title="Compliance">
          <div className="oa-compliance">
            <ComplianceRow label="Eligibility" val={athlete.compliance.eligibility} />
            <ComplianceRow label="Contract" val={athlete.compliance.contract} />
            <ComplianceRow label="Last review" val={fmt.dateLong(athlete.compliance.lastReview)} />
          </div>
        </Section>

        <Section title="Sport performance">
          <div className="oa-perf">
            {athlete.perf.map(p => (
              <div key={p.k} className="oa-perf-cell">
                <div className="oa-perf-v">{p.v}</div>
                <div className="oa-perf-k">{p.k}</div>
              </div>
            ))}
          </div>
        </Section>

        <Section title={`Active campaigns · ${active.length}`}>
          {active.map(c => (
            <div key={c.id} className="oa-minirow" onClick={() => openCampaign(c.id)}>
              <StatusChip status={c.status} dense />
              <span className="oa-minirow-title">{c.title}</span>
              <span className="oa-minirow-meta">{fmt.moneyShort(c.budget)}</span>
              <Icons.Arrow size={12} />
            </div>
          ))}
          {active.length === 0 && <div className="oa-empty">No active campaigns.</div>}
        </Section>

        <Section title="Contact">
          <div className="oa-kv">
            <div><span className="oa-k">Email</span><span className="oa-v">{athlete.email}</span></div>
            <div><span className="oa-k">Phone</span><span className="oa-v">{athlete.phone}</span></div>
            <div><span className="oa-k">Joined</span><span className="oa-v">{fmt.dateLong(athlete.joined)}</span></div>
            <div><span className="oa-k">Content library</span><span className="oa-v">{athlete.library} assets</span></div>
          </div>
        </Section>

        {athlete.notes && (
          <Section title="Notes">
            <div className="oa-note">{athlete.notes}</div>
          </Section>
        )}

        {past.length > 0 && (
          <Section title={`Past campaigns · ${past.length}`}>
            {past.map(c => (
              <div key={c.id} className="oa-minirow subtle" onClick={() => openCampaign(c.id)}>
                <StatusChip status={c.status} dense />
                <span className="oa-minirow-title">{c.title}</span>
                <span className="oa-minirow-meta">{fmt.moneyShort(c.budget)}</span>
                <Icons.Arrow size={12} />
              </div>
            ))}
          </Section>
        )}
      </div>
    </div>
  );
}

function BannerStat({ label, value, sub }) {
  return (
    <div className="oa-banner-stat">
      <div className="oa-banner-v">{value}</div>
      <div className="oa-banner-l">{label}</div>
      <div className="oa-banner-s">{sub}</div>
    </div>
  );
}

function Section({ title, children }) {
  return <section className="oa-dsection"><h4>{title}</h4>{children}</section>;
}

function ComplianceRow({ label, val }) {
  const lc = String(val).toLowerCase();
  const tone = lc === 'clear' || lc === 'signed' ? 'green' : (lc === 'review' || lc === 'pending') ? 'amber' : 'slate';
  return (
    <div className="oa-comp-row">
      <span className="oa-k">{label}</span>
      <span className={`oa-chip tone-${tone} dense`}><span className="oa-chip-dot"/>{val}</span>
    </div>
  );
}

// ── Campaign landing page ──────────────────────────────────
function LandingPage({ campaigns, brands, openTabs, openTab, openAddCampaign, activeCamps, pitching, review }) {
  const [search, setSearch] = useState('');
  const [statusFilter, setStatusFilter] = useState('all'); // 'all' | 'active' | 'pitching' | 'review'
  const searchRef = useRef(null);

  // Cmd/Ctrl+K focuses search
  useEffect(() => {
    const handler = (e) => {
      if ((e.metaKey || e.ctrlKey) && e.key === 'k') {
        e.preventDefault();
        searchRef.current?.focus();
      }
    };
    window.addEventListener('keydown', handler);
    return () => window.removeEventListener('keydown', handler);
  }, []);

  const statusChips = [
    { id:'active',   label:'Active',    count: activeCamps.length, color:'oklch(0.72 0.24 145)' },
    { id:'pitching', label:'Pitching',  count: pitching.length,    color:'oklch(0.72 0.22 82)'  },
    { id:'review',   label:'In Review', count: review.length,      color:'oklch(0.65 0.20 290)' },
  ];

  const q = search.trim().toLowerCase();
  const nonArchived = campaigns.filter(c => c.status !== 'complete');
  const visible = nonArchived.filter(c => {
    if (statusFilter !== 'all' && c.status !== statusFilter) return false;
    if (q) {
      const brand = brands.find(b => b.id === c.brandId);
      return c.title.toLowerCase().includes(q) || (brand?.name || '').toLowerCase().includes(q);
    }
    return true;
  });

  return (
    <div className="oa-camp-tabpanel oa-camp-landing">

      {/* ── Header row: title + search ── */}
      <div style={{display:'flex', alignItems:'center', gap:16, marginBottom:24}}>
        <div style={{flex:1}}>
          <div style={{fontSize:20, fontWeight:800, color:'var(--ink)', letterSpacing:'-0.02em', lineHeight:1.2}}>
            Campaign Command Center
          </div>
          <div style={{fontSize:12.5, color:'var(--ink-4)', marginTop:3}}>
            Click a campaign to open it as a tab
          </div>
        </div>

        {/* Search */}
        <div style={{position:'relative', flexShrink:0}}>
          <Icons.Search size={13} style={{
            position:'absolute', left:10, top:'50%', transform:'translateY(-50%)',
            color:'var(--ink-4)', pointerEvents:'none'
          }}/>
          <input
            ref={searchRef}
            value={search}
            onChange={e => setSearch(e.target.value)}
            placeholder="Search campaigns…"
            style={{
              width:220, padding:'8px 32px 8px 32px', borderRadius:9,
              border:'1px solid var(--line)', background:'var(--panel-2)',
              color:'var(--ink)', fontSize:13, outline:'none', boxSizing:'border-box',
            }}
            onFocus={e => e.target.style.borderColor='var(--accent)'}
            onBlur={e => e.target.style.borderColor='var(--line)'}
          />
          {search && (
            <button onClick={() => setSearch('')}
              style={{position:'absolute', right:8, top:'50%', transform:'translateY(-50%)',
                background:'none', border:'none', cursor:'pointer', color:'var(--ink-4)',
                display:'flex', alignItems:'center', padding:2}}>
              <Icons.X size={11}/>
            </button>
          )}
          <span style={{
            position:'absolute', right: search ? 28 : 8, top:'50%', transform:'translateY(-50%)',
            fontSize:10, color:'var(--ink-4)', fontFamily:'var(--mono)', letterSpacing:0,
            pointerEvents:'none', display: search ? 'none' : 'block',
          }}>⌘K</span>
        </div>
      </div>

      {/* ── Status filter chips ── */}
      <div style={{display:'flex', alignItems:'center', gap:8, marginBottom:24, flexWrap:'wrap'}}>
        <button
          onClick={() => setStatusFilter('all')}
          style={{
            padding:'5px 14px', borderRadius:999, fontSize:12, fontWeight:600, cursor:'pointer',
            border: statusFilter==='all' ? '1.5px solid var(--accent)' : '1px solid var(--line)',
            background: statusFilter==='all' ? 'var(--accent-wash)' : 'transparent',
            color: statusFilter==='all' ? 'var(--accent-ink)' : 'var(--ink-3)',
          }}>
          All · {nonArchived.length}
        </button>
        {statusChips.map(chip => {
          const on = statusFilter === chip.id;
          return (
            <button key={chip.id}
              onClick={() => setStatusFilter(statusFilter === chip.id ? 'all' : chip.id)}
              style={{
                padding:'5px 14px', borderRadius:999, fontSize:12, fontWeight:600, cursor:'pointer',
                border: on ? `1.5px solid ${chip.color}` : '1px solid var(--line)',
                background: on ? `${chip.color.replace(')', ' / 0.12)').replace('oklch(', 'oklch(')}` : 'transparent',
                color: on ? chip.color : 'var(--ink-3)',
                transition:'all 0.12s',
              }}>
              {chip.count} {chip.label}
            </button>
          );
        })}
        <div style={{flex:1}}/>
        <span style={{fontSize:12, color:'var(--ink-4)'}}>
          {visible.length} of {nonArchived.length} campaigns
        </span>
      </div>

      {/* ── Cards grid ── */}
      {visible.length > 0 ? (
        <div className="oa-camp-landing-grid">
          {visible.map(c => {
            const brand  = brands.find(b => b.id === c.brandId);
            const done   = c.deliverables.filter(d => d.done).length;
            const total  = c.deliverables.length;
            const pct    = total ? Math.round((done / total) * 100) : 0;
            const isOpen = openTabs.includes(c.id);
            const color  = campColorVal(c);
            return (
              <div key={c.id} className="oa-camp-landing-card"
                style={{borderTop:`3px solid ${color}`}}
                onClick={() => openTab(c.id)}>

                <div style={{display:'flex', alignItems:'flex-start', gap:12, marginBottom:14}}>
                  <div style={{width:38, height:38, borderRadius:9, background:color,
                    display:'grid', placeItems:'center', flexShrink:0,
                    color:'oklch(0.1 0.02 160)', fontSize:18}}>
                    {campIconEl(c, 16)}
                  </div>
                  <div style={{flex:1, minWidth:0}}>
                    <div style={{fontWeight:700, fontSize:13.5, color:'var(--ink)',
                      overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap', lineHeight:1.3}}>
                      {c.title}
                    </div>
                    <div style={{fontSize:12, color:'var(--ink-3)', marginTop:3}}>{brand?.name}</div>
                  </div>
                  <StatusChip status={c.status} dense/>
                </div>

                <div style={{marginBottom:14}}>
                  <div style={{display:'flex', justifyContent:'space-between', marginBottom:5}}>
                    <span style={{fontSize:11, color:'var(--ink-4)'}}>{done}/{total} deliverables</span>
                    <span style={{fontSize:11, fontWeight:700, color:'var(--ink-3)'}}>{pct}%</span>
                  </div>
                  <div style={{height:5, background:'var(--panel-2)', borderRadius:99, overflow:'hidden'}}>
                    <div style={{height:'100%', width:`${pct}%`, background:color, borderRadius:99, transition:'width 0.4s'}}/>
                  </div>
                </div>

                <div style={{display:'flex', alignItems:'center', justifyContent:'space-between'}}>
                  <span style={{fontSize:12, fontWeight:600, color:'var(--ink-3)'}}>{fmt.moneyShort(c.budget)}</span>
                  <span style={{fontSize:11.5, fontWeight:600,
                    color: isOpen ? 'var(--accent-ink)' : 'var(--ink-4)',
                    display:'flex', alignItems:'center', gap:4}}>
                    {isOpen ? <><Icons.Eye size={11}/> Open</> : <>Open <Icons.Arrow size={11}/></>}
                  </span>
                </div>
              </div>
            );
          })}

          {/* New campaign card — only show when no filters active */}
          {!q && statusFilter === 'all' && (
            <div className="oa-camp-landing-card"
              style={{border:'1.5px dashed var(--line-2)', background:'transparent',
                alignItems:'center', justifyContent:'center', minHeight:140,
                flexDirection:'column', gap:10, color:'var(--ink-4)'}}
              onClick={openAddCampaign}>
              <div style={{width:38, height:38, borderRadius:9, border:'1.5px dashed var(--line-2)',
                display:'grid', placeItems:'center'}}>
                <Icons.Plus size={16}/>
              </div>
              <span style={{fontSize:13, fontWeight:600}}>New campaign</span>
            </div>
          )}
        </div>
      ) : (
        <div className="oa-empty big" style={{marginTop:16}}>
          {q ? `No campaigns matching "${search}"` : `No ${statusFilter} campaigns.`}
          {!q && statusFilter !== 'all' && (
            <button className="oa-btn kind-ghost" style={{marginLeft:8}}
              onClick={() => setStatusFilter('all')}>Show all</button>
          )}
        </div>
      )}
    </div>
  );
}

// ── Grainy-glass drop slot ─────────────────────────────────
function TabGlowSlot() {
  return (
    <div style={{
      width: 3,
      alignSelf: 'stretch',
      flexShrink: 0,
      margin: '4px 5px 3px',
      borderRadius: 99,
      position: 'relative',
      pointerEvents: 'none',
      // Glowing core bar
      background: 'oklch(0.88 0.20 155)',
      filter: 'url(#oa-grain)',
      boxShadow: [
        '0 0 0 1px oklch(0.78 0.26 148 / 0.6)',
        '0 0 6px 3px oklch(0.72 0.26 145 / 0.85)',
        '0 0 16px 6px oklch(0.65 0.28 155 / 0.55)',
        '0 0 32px 12px oklch(0.60 0.26 160 / 0.30)',
      ].join(', '),
      animation: 'tabSlotPulse 1.4s ease-in-out infinite',
    }}/>
  );
}

// Campaigns — overview KPIs + per-project tabs + archived workflow
function CampaignsPage({ state, setState, openCampaign, openAddCampaign, query, openAthlete }) {
  const { CAMPAIGNS, BRANDS } = state;

  const active = CAMPAIGNS.filter(c => c.status !== 'complete');
  const archived = CAMPAIGNS.filter(c => c.status === 'complete');

  const [openTabs, setOpenTabs] = useState([]);
  const [activeTabId, setActiveTabId] = useState(null);
  const [archOpen, setArchOpen] = useState(false);
  const [dragTabId, setDragTabId] = useState(null);
  const [dropIndex, setDropIndex] = useState(null);

  const openTab = (id) => {
    setOpenTabs(prev => prev.includes(id) ? prev : [...prev, id]);
    setActiveTabId(id);
  };
  const closeTab = (id) => {
    const next = openTabs.filter(t => t !== id);
    setOpenTabs(next);
    if (activeTabId === id) {
      const idx = openTabs.indexOf(id);
      setActiveTabId(next[Math.max(0, idx - 1)] ?? next[0] ?? null);
    }
  };

  const onTabDragStart = (e, id) => {
    e.dataTransfer.effectAllowed = 'move';
    // Let the browser capture the ghost first, then mark as dragging
    requestAnimationFrame(() => setDragTabId(id));
  };
  // Called on each tab's onDragOver — uses mouse X vs midpoint to determine insert index
  const onTabDragOver = (e, idx) => {
    e.preventDefault();
    e.stopPropagation();
    e.dataTransfer.dropEffect = 'move';
    const rect = e.currentTarget.getBoundingClientRect();
    const insertIdx = e.clientX < rect.left + rect.width / 2 ? idx : idx + 1;
    setDropIndex(insertIdx);
  };
  // Fired on the tabbar container itself for drop + leave
  const onTabBarDrop = (e) => {
    e.preventDefault();
    if (dragTabId === null || dropIndex === null) { setDragTabId(null); setDropIndex(null); return; }
    setOpenTabs(prev => {
      const dragIdx = prev.indexOf(dragTabId);
      if (dragIdx < 0) return prev;
      // Adjust insert index for the removed item
      const insertAt = dropIndex > dragIdx ? dropIndex - 1 : dropIndex;
      if (insertAt === dragIdx) return prev;
      const next = prev.filter(t => t !== dragTabId);
      next.splice(insertAt, 0, dragTabId);
      return next;
    });
    setDragTabId(null);
    setDropIndex(null);
  };
  const onTabBarDragLeave = (e) => {
    // Only clear when leaving the bar entirely (not moving between child tabs)
    if (!e.currentTarget.contains(e.relatedTarget)) {
      setDropIndex(null);
    }
  };
  const onTabDragEnd = () => {
    setDragTabId(null);
    setDropIndex(null);
  };

  const pitching  = CAMPAIGNS.filter(c => c.status === 'pitching');
  const activeCamps = CAMPAIGNS.filter(c => c.status === 'active');
  const review    = CAMPAIGNS.filter(c => c.status === 'review');
  const allDeliv  = CAMPAIGNS.flatMap(c => c.deliverables);
  const overdue   = allDeliv.filter(d => !d.done && fmt.daysUntil(d.due) != null && fmt.daysUntil(d.due) < 0).length;

  const restore = (id) => setState(s => ({
    ...s, CAMPAIGNS: s.CAMPAIGNS.map(c => c.id === id ? { ...c, status: 'active' } : c),
  }));

  return (
    <div className="oa-page">
      {/* ── Page header ─────────────────────────────── */}
      <div className="oa-page-head">
        <div>
          <div className="oa-eyebrow">Campaigns</div>
          <h2 className="oa-h2">Campaign overview</h2>
          <div className="oa-sub">
            <span>{activeCamps.length} active</span>
            <span className="oa-dotsep">·</span>
            <span>{pitching.length} pitching</span>
            <span className="oa-dotsep">·</span>
            <span>{archived.length} archived</span>
            <span className="oa-dotsep">·</span>
            <span>{fmt.moneyShort(activeCamps.reduce((s,c)=>s+c.budget,0))} in flight</span>
          </div>
        </div>
        <div className="oa-toolbar">
          <Button kind="primary" icon={<Icons.Plus size={14}/>} onClick={openAddCampaign}>New campaign</Button>
        </div>
      </div>

      {/* ── Overview KPIs ───────────────────────────── */}
      <div className="oa-kpi-row">
        <KPI label="Active campaigns"
          value={activeCamps.length}
          delta={fmt.moneyShort(activeCamps.reduce((s,c)=>s+c.budget,0)) + ' in flight'} />
        <KPI label="Pitching"
          value={pitching.length}
          delta={fmt.moneyShort(pitching.reduce((s,c)=>s+c.budget,0)) + ' pipeline'} />
        <KPI label="Overdue tasks"
          value={overdue}
          delta={overdue > 0 ? 'needs attention' : 'all on track'} />
      </div>

      {/* ── Pipeline bars ───────────────────────────── */}
      <div className="oa-panel" style={{marginBottom:'var(--gap)', padding:'16px 20px'}}>
        <div className="oa-pipe">
          <PipeRow label="Pitching"  count={pitching.length}    val={pitching.reduce((s,c)=>s+c.budget,0)}    tone="amber"  max={CAMPAIGNS.length} />
          <PipeRow label="Active"    count={activeCamps.length} val={activeCamps.reduce((s,c)=>s+c.budget,0)} tone="green"  max={CAMPAIGNS.length} />
        </div>
      </div>

      {/* ── Browser-style tab bar ───────────────────── */}
      <div className="oa-camp-tabbar"
        onDrop={onTabBarDrop}
        onDragOver={e => e.preventDefault()}
        onDragLeave={onTabBarDragLeave}>
        {openTabs.map((id, i) => {
          const c = CAMPAIGNS.find(x => x.id === id);
          if (!c) return null;
          const isDragging = dragTabId === id;
          const dragIdx    = openTabs.indexOf(dragTabId);
          // Show slot before this tab if dropIndex === i and it's a meaningful move
          const showSlotBefore = dropIndex === i && dragTabId &&
            i !== dragIdx && i !== dragIdx + 1;
          return (
            <React.Fragment key={id}>
              {showSlotBefore && <TabGlowSlot/>}
              <button
                className={`oa-camp-tab ${activeTabId === id ? 'on' : ''}`}
                draggable
                onDragStart={e => onTabDragStart(e, id)}
                onDragOver={e => onTabDragOver(e, i)}
                onDragEnd={onTabDragEnd}
                onClick={() => setActiveTabId(id)}
                style={{ opacity: isDragging ? 0.35 : 1, cursor: 'grab' }}>
                <span className="oa-camp-tab-dot" style={{background: campColorVal(c)}} />
                <span className="oa-camp-tab-name" title={c.title}>{c.title}</span>
                <span className="oa-camp-tab-close"
                  onClick={e => { e.stopPropagation(); closeTab(id); }}>
                  <Icons.X size={9}/>
                </span>
              </button>
            </React.Fragment>
          );
        })}
        {/* Slot after the last tab */}
        {(() => {
          const dragIdx = openTabs.indexOf(dragTabId);
          const showEnd = dropIndex === openTabs.length && dragTabId &&
            dragIdx !== openTabs.length - 1;
          return showEnd ? <TabGlowSlot key="slot-end"/> : null;
        })()}
        <button className="oa-camp-tab add"
          onDragOver={e => { e.preventDefault(); e.stopPropagation(); setDropIndex(openTabs.length); }}
          onClick={() => setActiveTabId(null)}
          title="Campaign Command Center">
          <Icons.Plus size={12}/>
        </button>
      </div>

      {/* ── Tab content or landing page ─────────────── */}
      {activeTabId && CAMPAIGNS.find(c => c.id === activeTabId) ? (
        <div className="oa-camp-tabpanel">
          <ProjectDashboard
            key={activeTabId}
            campaignId={activeTabId}
            state={state}
            setState={setState}
            inline={true}
            openTaskView={() => openCampaign(activeTabId)}
            openAthlete={openAthlete}
          />
        </div>
      ) : (
        <LandingPage
          campaigns={CAMPAIGNS} brands={BRANDS}
          openTabs={openTabs} openTab={openTab}
          openAddCampaign={openAddCampaign}
          activeCamps={activeCamps} pitching={pitching} review={review}
        />
      )}

      {/* ── Archived section ────────────────────────── */}
      {archived.length > 0 && (
        <div style={{marginTop: 36}}>
          <button className="oa-archived-toggle" onClick={() => setArchOpen(o => !o)}>
            <span className="oa-archived-toggle-caret" style={{transform: archOpen ? 'rotate(0deg)' : 'rotate(-90deg)'}}>▼</span>
            Archived · {archived.length} campaign{archived.length !== 1 ? 's' : ''}
          </button>
          {archOpen && (
            <div className="oa-archived-list">
              {archived.map(c => {
                const brand = BRANDS.find(b => b.id === c.brandId);
                const done  = c.deliverables.filter(d => d.done).length;
                const total = c.deliverables.length;
                return (
                  <div key={c.id} className="oa-archived-row">
                    <StatusChip status="complete" dense />
                    <span className="oa-archived-name">{c.title}</span>
                    <span className="oa-archived-brand">{brand?.name}</span>
                    <span className="oa-archived-dates">{fmt.date(c.start)} → {fmt.date(c.end)}</span>
                    <span className="oa-archived-budget">{fmt.moneyShort(c.budget)}</span>
                    <span className="oa-archived-tasks">{done}/{total} tasks</span>
                    <Button kind="ghost" size="sm" onClick={() => restore(c.id)}>Restore</Button>
                  </div>
                );
              })}
            </div>
          )}
        </div>
      )}
    </div>
  );
}

window.CampaignsPage = CampaignsPage;

// Clients page — directory of brand clients with add modal
function ClientsPage({ state, setState, query, openClient }) {
  const { CLIENTS, BRANDS, CAMPAIGNS, TEAM } = state;
  const [addOpen, setAddOpen] = useState(false);
  const [tier, setTier] = useState('all');
  const [status, setStatus] = useState('all');

  const tiers = ['all', ...Array.from(new Set(CLIENTS.map(c => c.tier)))];
  const statuses = ['all', 'active', 'pitching', 'dormant'];

  const filtered = CLIENTS.filter(c => {
    const b = BRANDS.find(x => x.id === c.brandId);
    if (tier !== 'all' && c.tier !== tier) return false;
    if (status !== 'all' && c.status !== status) return false;
    if (query) {
      const hay = `${b?.name} ${c.industry} ${c.hq} ${b?.contact}`.toLowerCase();
      if (!hay.includes(query.toLowerCase())) return false;
    }
    return true;
  });

  const kpis = {
    total: CLIENTS.length,
    active: CLIENTS.filter(c => c.status === 'active').length,
    pitching: CLIENTS.filter(c => c.status === 'pitching').length,
    ltv: CLIENTS.reduce((s, c) => s + c.lifetimeValue, 0),
  };

  return (
    <div className="oa-page">
      <div className="oa-page-head">
        <div>
          <div className="oa-eyebrow">Clients</div>
          <h2 className="oa-h2">Brand directory</h2>
          <div className="oa-sub">
            <span>{kpis.total} clients</span><span className="oa-dotsep">·</span>
            <span>{kpis.active} active</span><span className="oa-dotsep">·</span>
            <span>{kpis.pitching} pitching</span><span className="oa-dotsep">·</span>
            <span>{fmt.moneyShort(kpis.ltv)} lifetime</span>
          </div>
        </div>
        <div className="oa-toolbar">
          <div className="oa-seg">
            {tiers.map(t => <button key={t} className={t===tier?'on':''} onClick={()=>setTier(t)}>{t==='all'?'All tiers':t}</button>)}
          </div>
          <div className="oa-seg">
            {statuses.map(s => <button key={s} className={s===status?'on':''} onClick={()=>setStatus(s)}>{s==='all'?'All':s}</button>)}
          </div>
          <Button kind="primary" icon={<Icons.Plus size={14}/>} onClick={() => setAddOpen(true)}>Add client</Button>
        </div>
      </div>

      <div className="oa-clients-grid">
        {filtered.map(cl => {
          const b = BRANDS.find(x => x.id === cl.brandId);
          const owner = TEAM.find(t => t.id === cl.ownerId);
          const campCount = CAMPAIGNS.filter(c => c.brandId === cl.brandId).length;
          const activeCount = CAMPAIGNS.filter(c => c.brandId === cl.brandId && c.status !== 'complete').length;
          const tone = cl.status === 'active' ? 'green' : cl.status === 'pitching' ? 'amber' : 'slate';
          return (
            <div key={cl.id} className="oa-client-card" onClick={() => openClient(cl.id)}>
              <div className="oa-client-head">
                <div className="oa-client-logo">{b?.name.slice(0,2).toUpperCase()}</div>
                <div style={{minWidth:0, flex:1}}>
                  <div className="oa-client-name">{b?.name}</div>
                  <div className="oa-client-meta">{cl.industry} · {cl.hq}</div>
                </div>
                <span className={`oa-chip tone-${tone} dense`}><span className="oa-chip-dot"/>{cl.status}</span>
              </div>
              <div className="oa-client-tags">
                <span className="oa-tag">{cl.tier}</span>
                <span className="oa-tag">{cl.relationship}</span>
              </div>
              <div className="oa-client-stats">
                <Stat label="Campaigns" value={campCount} />
                <Stat label="Active" value={activeCount} />
                <Stat label="LTV" value={fmt.moneyShort(cl.lifetimeValue)} />
                <Stat label="Since" value={new Date(cl.since+'T12:00:00').getFullYear()} />
              </div>
              <div className="oa-client-foot">
                <div className="oa-owner-cell"><Avatar person={owner} size={18}/><span>{owner?.name.split(' ')[0]}</span></div>
                <span className="oa-client-contact">{b?.contact}</span>
              </div>
            </div>
          );
        })}
        {filtered.length === 0 && <div className="oa-empty big">No clients match those filters.</div>}
      </div>

      <AddClientModal open={addOpen} onClose={() => setAddOpen(false)} state={state} setState={setState} />
    </div>
  );
}

// Team page — department tabs, capacity finder, and searchable directory.
function TeamPage({ state, query, openMember }) {
  const { TEAM, DEPTS, SPIDER_AXES, CAMPAIGNS, OPS_TASKS } = state;
  const [dept, setDept] = useState('all');
  const [localSearch, setLocalSearch] = useState('');

  const allTasks = useMemo(() => [
    ...CAMPAIGNS.flatMap(c => c.deliverables.map(d => ({...d, campaignId: c.id, campaignTitle: c.title}))),
    ...OPS_TASKS.map(t => ({...t, campaignTitle: 'Ops'})),
  ], [CAMPAIGNS, OPS_TASKS]);

  const loadFor = (uid) => allTasks.filter(t => t.assignee === uid && !t.done).length;
  const ownerFor = (uid) => CAMPAIGNS.filter(c => c.ownerId === uid && c.status !== 'complete').length;

  // Capacity score: fewer open tasks = more capacity. Cap at 10 open = 0% capacity.
  const capacityFor = (uid) => {
    const load = loadFor(uid);
    return Math.max(0, Math.round((1 - load / 10) * 100));
  };

  // Search pulls from both the global query (from topbar) and the local directory search.
  const activeSearch = (localSearch || query || '').toLowerCase();

  const inDept = (p) => dept === 'all' || p.dept === dept;
  const matchesSearch = (p) => !activeSearch ||
    `${p.name} ${p.role}`.toLowerCase().includes(activeSearch);

  const directoryMembers = TEAM.filter(p => inDept(p) && matchesSearch(p))
    .sort((a, b) => a.name.localeCompare(b.name));

  const deptCounts = DEPTS.reduce((acc, d) => {
    acc[d.id] = TEAM.filter(t => t.dept === d.id).length;
    return acc;
  }, {});

  const currentDept = dept === 'all' ? null : DEPTS.find(d => d.id === dept);

  // Org hierarchy helpers
  const byRole = (roles) => roles.map(r => TEAM.find(p => p.dept === (dept === 'all' ? p.dept : dept) && p.role === r)).filter(Boolean);
  const deptMembers = (deptId) => TEAM.filter(p => p.dept === deptId);

  // Mini person card used in org chart
  const OrgCard = ({ person, size = 'md', onClick }) => {
    if (!person) return null;
    const d = DEPTS.find(x => x.id === person.dept);
    const load = loadFor(person.id);
    const sz = size === 'sm' ? 32 : 40;
    return (
      <div onClick={() => onClick && onClick(person.id)}
        style={{display:'flex', alignItems:'center', gap:10, padding: size === 'sm' ? '8px 12px' : '10px 14px',
          background:'var(--panel)', border:'1px solid var(--line)', borderRadius:10, cursor:'pointer',
          minWidth: size === 'sm' ? 160 : 190, flex:'0 0 auto',
          transition:'box-shadow 0.15s'}}
        onMouseEnter={e => e.currentTarget.style.boxShadow='var(--shadow-pop)'}
        onMouseLeave={e => e.currentTarget.style.boxShadow='none'}>
        <Avatar person={person} size={sz}/>
        <div style={{minWidth:0}}>
          <div style={{fontSize: size === 'sm' ? 12 : 13, fontWeight:700, color:'var(--ink)', whiteSpace:'nowrap', overflow:'hidden', textOverflow:'ellipsis'}}>{person.name}</div>
          <div style={{fontSize: size === 'sm' ? 10.5 : 11, color:'var(--ink-3)', whiteSpace:'nowrap', overflow:'hidden', textOverflow:'ellipsis', marginTop:1}}>{person.role}</div>
          {load > 0 && <div style={{fontSize:10, color:'var(--ink-4)', marginTop:2}}>{load} open task{load !== 1 ? 's' : ''}</div>}
        </div>
      </div>
    );
  };

  // Connector line style for org chart
  const connector = { position:'relative', display:'flex', flexDirection:'column', alignItems:'center', gap:0 };
  const vline = { width:1, background:'var(--line)', flexShrink:0 };
  const hrow  = { display:'flex', gap:12, alignItems:'flex-start', position:'relative' };

        <div style={{display:'flex', flexDirection:'column', alignItems:'flex-start', gap:0, paddingBottom:20}}>

            {gm && <OrgCard person={gm} onClick={openMember}/>}

          {agm && <>
            <div style={{...vline, height:20, marginLeft:20}}/>
            <OrgCard person={agm} onClick={openMember}/>

        </div>
      );
    }
    if (deptId === 'account') {
      const director  = TEAM.find(p => p.dept === 'account' && p.role === 'Account Manager Director');
      const brandDir  = TEAM.find(p => p.dept === 'account' && p.role === 'Brand Deals Director');

      {/* Department tabs */}
      <div className="oa-dept-tabs">
        <button
          className={`oa-dept-tab ${dept === 'all' ? 'on' : ''}`}
          onClick={() => setDept('all')}

          <div className="oa-dept-tab-body">
            <div className="oa-dept-tab-name">Everyone</div>
            <div className="oa-dept-tab-meta">{TEAM.length} people</div>
          </div>
        </button>
        {DEPTS.map(d => {
          const count = deptCounts[d.id] || 0;
          const on = dept === d.id;
          return (
            <button key={d.id}

        <section style={{padding:'0 0 4px'}}>

      {/* Directory */}

// ── Capacity finder ────────────────────────────────────────
function CapacityFinder({ state, dept, capacityFor, loadFor, ownerFor, openMember }) {
  const { TEAM, DEPTS, SPIDER_AXES } = state;
  const [filterDept, setFilterDept] = useState(dept === 'all' ? '' : dept);
  const [skill, setSkill] = useState('');

  useEffect(() => { setFilterDept(dept === 'all' ? '' : dept); }, [dept]);

  // Available skills based on dept filter
  const skillOptions = useMemo(() => {
    if (filterDept && SPIDER_AXES[filterDept]) {
      return SPIDER_AXES[filterDept].map(s => ({ id: s, label: s, deptId: filterDept }));
    }
    // aggregate across all depts
    return Object.entries(SPIDER_AXES).flatMap(([deptId, axes]) =>
      axes.map(s => ({ id: `${deptId}:${s}`, label: s, deptId, axis: s }))
    );
  }, [filterDept, SPIDER_AXES]);

  // Score each person
  const candidates = useMemo(() => {
    let people = TEAM.slice();
    if (filterDept) people = people.filter(p => p.dept === filterDept);

    return people.map(p => {
      const cap = capacityFor(p.id);
      const load = loadFor(p.id);
      const axes = SPIDER_AXES[p.dept];
      let skillScore = null;
      if (skill) {
        // skill is either the axis string (dept-filtered) or "deptId:axis"
        const [sDept, sAxis] = skill.includes(':') ? skill.split(':') : [p.dept, skill];
        if (sDept === p.dept) {
          const idx = axes?.indexOf(sAxis);
          if (idx >= 0) skillScore = p.spider[idx];
        }
      }
      // Combined score: capacity weighted + skill bonus
      let rank = cap;
      if (skill) {
        if (skillScore == null) rank = -1; // dept mismatch for this skill
        else rank = cap * 0.5 + skillScore * 10 * 0.5;
      }
      return { person: p, cap, load, skillScore, rank };
    }).filter(c => c.rank >= 0)
      .sort((a, b) => b.rank - a.rank);
  }, [TEAM, filterDept, skill, capacityFor, loadFor, SPIDER_AXES]);

  const top = candidates.slice(0, 4);

  return (
    <section className="oa-capfinder">
      <header className="oa-capfinder-head">
        <div className="oa-capfinder-title-wrap">
          <div className="oa-capfinder-icon"><Icons.Clock size={16}/></div>
          <div>
            <h3 className="oa-capfinder-title">Who's free?</h3>
            <div className="oa-sub"><span>Find a teammate with capacity to take on a new project</span></div>
          </div>
        </div>
        <div className="oa-capfinder-filters">
          <div className="oa-capfinder-filter">
            <span className="oa-capfinder-label">Department</span>
            <select value={filterDept} onChange={e => { setFilterDept(e.target.value); setSkill(''); }}>
              <option value="">Any</option>
              {DEPTS.map(d => <option key={d.id} value={d.id}>{d.label}</option>)}
            </select>
          </div>
          <div className="oa-capfinder-filter">
            <span className="oa-capfinder-label">Skill</span>
            <select value={skill} onChange={e => setSkill(e.target.value)}>
              <option value="">Any skill</option>
              {skillOptions.map(s => (
                <option key={s.id} value={filterDept ? s.label : s.id}>
                  {filterDept ? s.label : `${DEPTS.find(d=>d.id===s.deptId)?.label} — ${s.label}`}
                </option>
              ))}
            </select>
          </div>
        </div>
      </header>

      {top.length === 0 ? (
        <div className="oa-empty">No teammates match those filters.</div>
      ) : (
        <div className="oa-capfinder-grid">
          {top.map(({ person, cap, load, skillScore }, i) => {
            const d = DEPTS.find(x => x.id === person.dept);
            const capLabel = cap >= 70 ? 'Wide open' : cap >= 40 ? 'Has room' : cap >= 20 ? 'Tight' : 'Slammed';
            const capTone = cap >= 70 ? 'green' : cap >= 40 ? 'amber' : 'coral';
            return (
              <button key={person.id} className="oa-capcard"
                style={{'--cap-hue': person.hue}}
                onClick={() => openMember(person.id)}>
                {i === 0 && <div className="oa-capcard-crown">Top match</div>}
                <div className="oa-capcard-top">
                  <Avatar person={person} size={42}/>
                  <div style={{minWidth:0, flex:1}}>
                    <div className="oa-capcard-name">{person.name}</div>
                    <div className="oa-capcard-role">{person.role}</div>
                  </div>
                </div>
                <div className="oa-capcard-dept">
                  <span className="oa-dept-dot" style={{background:`oklch(0.6 0.14 ${d?.hue || 200})`}}/>
                  {d?.label}
                </div>
                <div className="oa-capcard-meter">
                  <div className="oa-capcard-meter-head">
                    <span className="oa-capcard-meter-label">Capacity</span>
                    <span className={`oa-chip tone-${capTone} dense`}>
                      <span className="oa-chip-dot"/>{capLabel}
                    </span>
                  </div>
                  <div className="oa-capbar">
                    <div className="oa-capbar-fill" style={{width: cap + '%',
                      background: `oklch(0.68 0.14 ${d?.hue || 150})`}}/>
                  </div>
                  <div className="oa-capcard-meter-foot">
                    <span className="mono">{cap}% free</span>
                    <span>{load} open {load === 1 ? 'task' : 'tasks'}</span>
                  </div>
                </div>
                {skillScore != null && (
                  <div className="oa-capcard-skill">
                    <span>{skill.split(':').pop()}</span>
                    <span className="oa-capcard-skill-score mono">{skillScore}/10</span>
                  </div>
                )}
              </button>
            );
          })}
        </div>
      )}
    </section>
  );
}

function TeamMemberDrawer({ memberId, state, onClose, openCampaign }) {
  const { TEAM, DEPTS, SPIDER_AXES, CAMPAIGNS, OPS_TASKS } = state;
  const p = TEAM.find(t => t.id === memberId);
  if (!p) return null;

  const dept   = DEPTS.find(d => d.id === p.dept);
  const axes   = SPIDER_AXES[p.dept] || ['Skill 1','Skill 2','Skill 3','Skill 4','Skill 5'];
  const spider = p.spider && p.spider.length === axes.length ? p.spider : axes.map(() => 7);

  const deliverables    = CAMPAIGNS.flatMap(c => c.deliverables.filter(d => d.assignee === p.id).map(d => ({...d, campaignTitle: c.title})));
  const ops             = OPS_TASKS.filter(t => t.assignee === p.id);
  const open            = [...deliverables, ...ops].filter(t => !t.done);
  const ownedCampaigns  = CAMPAIGNS.filter(c => c.ownerId === p.id);
  const activeCampaigns = ownedCampaigns.filter(c => c.status === 'active');
  const customDelivsReviewing = CAMPAIGNS.flatMap(c => (c.customDeliverables||[]).filter(d => d.assignee === p.id && (d.reviewStatus === 'submitted' || d.reviewStatus === 'needs_revisions')));

  const availLabel = { active: '● Active', busy: '◑ Busy', ooo: '○ Out of Office' }[p.availability || 'active'];
  const availColor = { active: 'oklch(0.72 0.24 145)', busy: 'oklch(0.75 0.18 75)', ooo: 'var(--ink-4)' }[p.availability || 'active'];

  return (
