              }}/>
          </div>
        </div>

        {/* Status */}
        <div style={{marginBottom:20}}>
          <label style={{fontSize:11, fontWeight:600, color:'var(--ink-3)', textTransform:'uppercase', letterSpacing:'0.07em', display:'block', marginBottom:6}}>Status</label>
          <div style={{display:'flex', gap:8}}>
            {POST_STATUS.map(s => (
              <button key={s.id} onClick={() => set('status', s.id)}
                style={{padding:'5px 14px', borderRadius:8, cursor:'pointer', fontSize:12, fontWeight:600,
                  border: form.status===s.id ? `1.5px solid ${s.color}` : '1px solid var(--line)',
                  background: form.status===s.id ? s.bg : 'transparent',
                  color: form.status===s.id ? s.color : 'var(--ink-3)'}}>
                {s.label}
              </button>
            ))}
          </div>
        </div>

        {/* Notes */}
        <div style={{marginBottom:20}}>
          <label style={{fontSize:11, fontWeight:600, color:'var(--ink-3)', textTransform:'uppercase', letterSpacing:'0.07em', display:'block', marginBottom:6}}>Notes</label>
          <textarea value={form.notes || ''} onChange={e => set('notes', e.target.value)}
            placeholder="Internal notes, asset links, approvals needed…"
            rows={2}
            style={{width:'100%', padding:'9px 12px', borderRadius:9, border:'1px solid var(--line)',
              background:'var(--panel-2)', color:'var(--ink)', fontSize:13, outline:'none',
              resize:'vertical', fontFamily:'inherit', boxSizing:'border-box'}}/>
        </div>

        {/* Files & Links */}
        <FileLinksEditor files={form.files || []} onChange={v => set('files', v)}/>

        <div style={{display:'flex', gap:10, justifyContent:'flex-end', marginTop:24}}>
          <button className="oa-btn" onClick={onClose}>Cancel</button>
          <button className="oa-btn kind-primary" disabled={!form.title?.trim() && !form.caption?.trim()} onClick={save}>
            {isNew ? 'Create post' : 'Save changes'}
          </button>
        </div>
      </div>
    </div>
  );
}

// ── Post Card (Board view) ─────────────────────────────────
function PostCard({ post, team, onClick, onStatusChange }) {
  const plats = getPlatforms(post);
  const s = statusOf(post.status);
  const assignee = team.find(t => t.id === post.assignee);
  const dt = post.scheduledAt ? new Date(post.scheduledAt) : null;
  const isPast = dt && dt < new Date() && post.status === 'scheduled';
  const fileCount = (post.files||[]).length;

  return (
    <div onClick={onClick}
      style={{background:'var(--panel)', border:'1px solid var(--line)', borderRadius:12,
        padding:'14px 16px', cursor:'pointer', transition:'box-shadow 0.15s, transform 0.1s',
        display:'flex', flexDirection:'column', gap:10}}
      onMouseEnter={e => { e.currentTarget.style.boxShadow='var(--shadow-pop)'; e.currentTarget.style.transform='translateY(-1px)'; }}
      onMouseLeave={e => { e.currentTarget.style.boxShadow='none'; e.currentTarget.style.transform='none'; }}>

      {/* Top row: platform + type */}
      <div style={{display:'flex', alignItems:'center', justifyContent:'space-between', gap:8}}>
        <PlatformBadge platforms={plats}/>
        <span style={{fontSize:11, color:'var(--ink-4)', fontWeight:600, background:'var(--panel-2)',
          padding:'2px 7px', borderRadius:6}}>{post.type}</span>
      </div>

      {/* Title + Caption preview */}
      {post.title && (
        <div style={{fontSize:13, fontWeight:700, color:'var(--ink)', lineHeight:1.4,
          overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap'}}>
          {post.title}
        </div>
      )}
      <div style={{fontSize: post.title ? 12 : 13, color: post.title ? 'var(--ink-3)' : 'var(--ink)', lineHeight:1.5,
        display:'-webkit-box', WebkitLineClamp:post.title ? 2 : 3, WebkitBoxOrient:'vertical', overflow:'hidden'}}>
        {post.caption}
      </div>

      {/* Hashtags preview */}
      {post.hashtags && post.hashtags.length > 0 && (
        <div style={{fontSize:11, color: platformOf(plats[0]).color, lineHeight:1.4,
          display:'-webkit-box', WebkitLineClamp:1, WebkitBoxOrient:'vertical', overflow:'hidden'}}>
          {post.hashtags.slice(0,4).map(h => `#${h}`).join(' ')}
          {post.hashtags.length > 4 && <span style={{color:'var(--ink-4)'}}> +{post.hashtags.length-4}</span>}
        </div>
      )}

      {/* Stats (published only) */}
      {post.status === 'published' && (post.likes || post.reach) ? (
        <div style={{display:'flex', gap:14, paddingTop:6, borderTop:'1px solid var(--line-2)'}}>
          {post.likes != null && <span style={{fontSize:11, color:'var(--ink-3)'}}><strong style={{color:'var(--ink)'}}>{(post.likes/1000).toFixed(post.likes>=1000?1:0)}{post.likes>=1000?'k':''}</strong> likes</span>}
          {post.reach != null && <span style={{fontSize:11, color:'var(--ink-3)'}}><strong style={{color:'var(--ink)'}}>{(post.reach/1000).toFixed(1)}k</strong> reach</span>}
          {post.comments != null && <span style={{fontSize:11, color:'var(--ink-3)'}}><strong style={{color:'var(--ink)'}}>{post.comments}</strong> comments</span>}
        </div>
      ) : null}

      {/* Footer: date + assignee + file count */}
      <div style={{display:'flex', alignItems:'center', justifyContent:'space-between', marginTop:2}}>
        <div style={{display:'flex', alignItems:'center', gap:8}}>
          <span style={{fontSize:11, color: isPast ? 'oklch(0.65 0.20 25)' : dt ? 'var(--ink-3)' : 'var(--ink-4)', display:'flex', alignItems:'center', gap:4}}>
            {dt ? (
              <><Icons.Calendar size={10}/>
                {dt.toLocaleDateString('en-US',{month:'short',day:'numeric'})}
                {' · '}
                {dt.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'})}
              </>
            ) : 'No date set'}
          </span>
          {fileCount > 0 && (
            <span style={{display:'flex', alignItems:'center', gap:3, fontSize:11,
              color:'var(--accent-ink)', background:'var(--accent-wash)',
              padding:'1px 6px', borderRadius:5, fontWeight:600}}>
              <Icons.Link size={9}/>{fileCount}
            </span>
          )}
        </div>
        {assignee ? <Avatar person={assignee} size={20}/> : <span/>}
      </div>
    </div>
  );
}

// ── OA Calendar Page ─────────────────────────────────────
function TeamCalendarPage({ state, setState, openCampaign, currentUserId }) {
  const { CAMPAIGNS, TEAM, ATHLETES, OA_EVENTS = [] } = state;
  const today = new Date(); today.setHours(0,0,0,0);
  const [monthOffset,    setMonthOffset]    = useState(0);
  const [showOAEvents,   setShowOAEvents]   = useState(true);
  const [showDeadlines,  setShowDeadlines]  = useState(true);
  const [showMine,       setShowMine]       = useState(true);
  const [editEvent,      setEditEvent]      = useState(null); // null | event obj | {_new:true, date?}

  const allPeople = [...TEAM, ...ATHLETES];
  const me = allPeople.find(p => p.id === currentUserId);

  const anchor = new Date(today.getFullYear(), today.getMonth() + monthOffset, 1);
  const monthLabel = anchor.toLocaleDateString('en-US', { month: 'long', year: 'numeric' });

  // 6-week grid
  const firstDow = anchor.getDay();
  const gridStart = new Date(anchor);
  gridStart.setDate(anchor.getDate() - firstDow);
  const cells = Array.from({ length: 42 }, (_, i) => {
    const d = new Date(gridStart); d.setDate(gridStart.getDate() + i); return d;
  });
  const weeks = Array.from({ length: 6 }, (_, w) => cells.slice(w * 7, w * 7 + 7));

  // All my tasks (deliverables assigned to me across all campaigns)
  const myTasks = useMemo(() => {
    const list = [];
    CAMPAIGNS.forEach(c => {
      (c.deliverables || []).forEach(d => {
        if (d.due && d.assignee === currentUserId)
          list.push({ ...d, _kind:'task', campaignId: c.id, campaignTitle: c.title });
      });
    });
    return list;
  }, [CAMPAIGNS, currentUserId]);

  const DOW = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const todayStr = today.toISOString().slice(0,10);

  // OA event type styles — distinct colors per type
  // meeting=blue, deadline=orange, event=purple, myTask=green
  const oaEventStyle = (type) => {
    if (type === 'meeting')  return { accent:'oklch(0.58 0.22 262)', bg:'oklch(0.58 0.22 262 / 0.13)' };
    if (type === 'deadline') return { accent:'oklch(0.62 0.22 38)',  bg:'oklch(0.62 0.22 38  / 0.13)' };
    /* event */              return { accent:'oklch(0.58 0.20 310)', bg:'oklch(0.58 0.20 310 / 0.13)' };
  };

  // Items on a given day
  const itemsOnDay = (d) => {
    const ds = d.toISOString().slice(0,10);
    const oaItems = OA_EVENTS.filter(e => e.date === ds && (
      (e.type === 'deadline' ? showDeadlines : showOAEvents)
    ));
    const myItems = showMine ? myTasks.filter(t => t.due === ds) : [];
    return { oaItems, myItems };
  };

  // Counts for this month
  const inMonth = (dateStr) => { const d = new Date(dateStr); return d.getFullYear() === anchor.getFullYear() && d.getMonth() === anchor.getMonth(); };
  const monthOAEvents  = OA_EVENTS.filter(e => e.type !== 'deadline' && inMonth(e.date));
  const monthDeadlines = OA_EVENTS.filter(e => e.type === 'deadline' && inMonth(e.date));
  const monthMine      = myTasks.filter(t => inMonth(t.due));

  // Toggle pill style
  const pillStyle = (active, col) => ({
    display:'flex', alignItems:'center', gap:5,
    padding:'4px 12px', borderRadius:99, fontSize:12, fontWeight:600, cursor:'pointer',
    border:`1.5px solid ${active ? col : 'var(--line)'}`,
    background: active ? col.replace(')', ' / 0.12)').replace('oklch(', 'oklch(') : 'transparent',
    color: active ? col : 'var(--ink-4)',
    transition:'all 0.15s',
  });

  // ── Event save / delete ──────────────────────────────────
  const saveEvent = (ev) => {
    setState(s => {
      const list = s.OA_EVENTS || [];
      if (ev._new) {
        const { _new, ...rest } = ev;
        return { ...s, OA_EVENTS: [...list, { ...rest, id: 'oae_' + Date.now() }] };
      }
      return { ...s, OA_EVENTS: list.map(e => e.id === ev.id ? ev : e) };
    });
    setEditEvent(null);
  };
  const deleteEvent = (id) => {
    setState(s => ({ ...s, OA_EVENTS: (s.OA_EVENTS || []).filter(e => e.id !== id) }));
    setEditEvent(null);
  };

  // ── Inline EventModal rendered via portal ─────────────────
  const EventModal = () => {
    if (!editEvent) return null;
    const isNew = !!editEvent._new;
    const [form, setForm] = useState({
      title: editEvent.title || '',
      date:  editEvent.date  || new Date().toISOString().slice(0,10),
      type:  editEvent.type  || 'meeting',
      notes: editEvent.notes || '',
    });
    const set = (k, v) => setForm(f => ({ ...f, [k]: v }));
    const typeOptions = [
      { id:'meeting',  label:'Meeting',  accent:'oklch(0.58 0.22 262)' },
      { id:'event',    label:'Event',    accent:'oklch(0.58 0.20 310)' },
      { id:'deadline', label:'Deadline', accent:'oklch(0.62 0.22 38)'  },
    ];
    const currentAccent = typeOptions.find(t => t.id === form.type)?.accent || 'var(--accent)';

    return ReactDOM.createPortal(
      <div style={{
        position:'fixed', inset:0, zIndex:2147483646,
        background:'oklch(0 0 0 / 0.55)', backdropFilter:'blur(6px)',
        display:'flex', alignItems:'center', justifyContent:'center',
      }} onClick={e => { if (e.target === e.currentTarget) setEditEvent(null); }}>
        <div style={{
          background:'var(--panel)', border:'1px solid var(--line)',
          borderRadius:16, padding:'28px 28px 24px', width:400, maxWidth:'94vw',
          boxShadow:'0 24px 64px oklch(0 0 0 / 0.42)',
          display:'flex', flexDirection:'column', gap:18,
        }}>
          {/* Modal header */}
          <div style={{display:'flex', alignItems:'center', gap:10}}>
            <div style={{width:10, height:10, borderRadius:2, background:currentAccent, flexShrink:0}}/>
            <h3 style={{margin:0, fontSize:16, fontWeight:700, flex:1}}>
              {isNew ? 'New Calendar Event' : 'Edit Event'}
            </h3>
            <button onClick={() => setEditEvent(null)} className="oa-iconbtn">
              <Icons.X size={14}/>
            </button>
          </div>

          {/* Type selector */}
          <div>
            <label style={{fontSize:11, fontWeight:700, color:'var(--ink-3)', textTransform:'uppercase', letterSpacing:'0.06em', display:'block', marginBottom:8}}>Type</label>
            <div style={{display:'flex', gap:6}}>
              {typeOptions.map(t => (
                <button key={t.id} onClick={() => set('type', t.id)} style={{
                  flex:1, padding:'7px 0', borderRadius:8, fontSize:12, fontWeight:600, cursor:'pointer',
                  border:`1.5px solid ${form.type === t.id ? t.accent : 'var(--line)'}`,
                  background: form.type === t.id ? t.accent.replace(')', ' / 0.15)').replace('oklch(', 'oklch(') : 'transparent',
                  color: form.type === t.id ? t.accent : 'var(--ink-3)',
                  transition:'all 0.14s',
                }}>{t.label}</button>
              ))}
            </div>
          </div>

          {/* Title */}
          <div>
            <label style={{fontSize:11, fontWeight:700, color:'var(--ink-3)', textTransform:'uppercase', letterSpacing:'0.06em', display:'block', marginBottom:6}}>Title</label>
            <input value={form.title} onChange={e => set('title', e.target.value)}
              placeholder="Event name…"
              style={{
                width:'100%', boxSizing:'border-box',
                padding:'9px 12px', borderRadius:8, fontSize:14,
                background:'var(--panel-2)', border:'1px solid var(--line)',
                color:'var(--ink)', outline:'none',
              }}/>
          </div>

          {/* Date */}
          <div>
            <label style={{fontSize:11, fontWeight:700, color:'var(--ink-3)', textTransform:'uppercase', letterSpacing:'0.06em', display:'block', marginBottom:6}}>Date</label>
            <input type="date" value={form.date} onChange={e => set('date', e.target.value)}
              style={{
                padding:'9px 12px', borderRadius:8, fontSize:14,
                background:'var(--panel-2)', border:'1px solid var(--line)',
                color:'var(--ink)', outline:'none', width:'100%', boxSizing:'border-box',
              }}/>
          </div>

          {/* Notes */}
          <div>
            <label style={{fontSize:11, fontWeight:700, color:'var(--ink-3)', textTransform:'uppercase', letterSpacing:'0.06em', display:'block', marginBottom:6}}>Notes <span style={{fontWeight:400, textTransform:'none', opacity:0.6}}>(optional)</span></label>
            <textarea value={form.notes} onChange={e => set('notes', e.target.value)}
              rows={3} placeholder="Any notes…"
              style={{
                width:'100%', boxSizing:'border-box', resize:'vertical',
                padding:'9px 12px', borderRadius:8, fontSize:13,
                background:'var(--panel-2)', border:'1px solid var(--line)',
                color:'var(--ink)', outline:'none', fontFamily:'inherit',
              }}/>
          </div>

          {/* Actions */}
          <div style={{display:'flex', gap:8, paddingTop:4}}>
            {!isNew && (
              <button onClick={() => { if (window.confirm('Delete this event?')) deleteEvent(editEvent.id); }}
                style={{padding:'9px 16px', borderRadius:8, fontSize:13, fontWeight:600, cursor:'pointer',
                  background:'oklch(0.55 0.22 25 / 0.12)', border:'1px solid oklch(0.55 0.22 25 / 0.35)',
                  color:'oklch(0.68 0.22 25)', transition:'background 0.14s'}}>
                Delete
              </button>
            )}
            <div style={{flex:1}}/>
            <button onClick={() => setEditEvent(null)}
              style={{padding:'9px 16px', borderRadius:8, fontSize:13, fontWeight:600, cursor:'pointer',
                background:'transparent', border:'1px solid var(--line)', color:'var(--ink-3)'}}>
              Cancel
            </button>
            <button
              disabled={!form.title.trim() || !form.date}
              onClick={() => saveEvent({ ...(isNew ? { _new:true } : { id: editEvent.id }), ...form })}
              style={{padding:'9px 20px', borderRadius:8, fontSize:13, fontWeight:700, cursor:'pointer',
                background: form.title.trim() ? currentAccent : 'var(--line)',
                border:'none', color: form.title.trim() ? '#fff' : 'var(--ink-4)',
                transition:'background 0.14s', opacity: form.title.trim() ? 1 : 0.6}}>
              {isNew ? 'Add Event' : 'Save'}
            </button>
          </div>
        </div>
      </div>,
      document.body
    );
  };

  return (
    <div style={{padding:'24px 28px', display:'flex', flexDirection:'column', gap:14, height:'100%', overflowY:'auto'}}>
    <EventModal/>
      {/* Header row */}
      <div style={{display:'flex', alignItems:'center', gap:12, flexWrap:'wrap'}}>
        <h2 style={{margin:0, fontSize:18, fontWeight:700}}>OA Calendar</h2>

        {/* Layer toggles */}
        <div style={{display:'flex', gap:6, alignItems:'center', marginLeft:8}}>
          <button
            style={pillStyle(showOAEvents, 'oklch(0.58 0.22 262)')}
            onClick={() => setShowOAEvents(v => !v)}>
            <span style={{width:7, height:7, borderRadius:99, background:'oklch(0.58 0.22 262)', flexShrink:0, opacity: showOAEvents ? 1 : 0.35}}/>

            {showOAEvents && monthOAEvents.length > 0 && <span style={{fontSize:10, fontWeight:500, opacity:0.7}}>{monthOAEvents.length}</span>}
          </button>
          <button
            style={pillStyle(showDeadlines, 'oklch(0.62 0.22 38)')}
            onClick={() => setShowDeadlines(v => !v)}>
            <span style={{width:7, height:7, borderRadius:99, background:'oklch(0.62 0.22 38)', flexShrink:0, opacity: showDeadlines ? 1 : 0.35}}/>
            Deadlines
            {showDeadlines && monthDeadlines.length > 0 && <span style={{fontSize:10, fontWeight:500, opacity:0.7}}>{monthDeadlines.length}</span>}
          </button>
          <button
            style={pillStyle(showMine, 'oklch(0.56 0.22 145)')}
            onClick={() => setShowMine(v => !v)}>
            {me && <Avatar person={me} size={14}/>}
            My Tasks
            {showMine && monthMine.length > 0 && <span style={{fontSize:10, fontWeight:500, opacity:0.7}}>{monthMine.length}</span>}
          </button>
        </div>

        {/* New Event + Month nav — pushed to right */}
        <div style={{display:'flex', alignItems:'center', gap:8, marginLeft:'auto'}}>
          <button onClick={() => setEditEvent({ _new:true })}
            style={{display:'flex', alignItems:'center', gap:6,
              padding:'8px 16px', borderRadius:8, fontSize:13, fontWeight:700, cursor:'pointer',
              background:'oklch(0.56 0.22 145)', color:'#fff', border:'none',
              boxShadow:'0 2px 8px oklch(0.56 0.22 145 / 0.35)',
              transition:'background 0.14s, box-shadow 0.14s',
            }}
            onMouseEnter={e => { e.currentTarget.style.background='oklch(0.62 0.22 145)'; e.currentTarget.style.boxShadow='0 3px 12px oklch(0.56 0.22 145 / 0.5)'; }}
            onMouseLeave={e => { e.currentTarget.style.background='oklch(0.56 0.22 145)'; e.currentTarget.style.boxShadow='0 2px 8px oklch(0.56 0.22 145 / 0.35)'; }}>
            <Icons.Plus size={13}/> New Event
          </button>
          <div style={{width:1, height:18, background:'var(--line)'}}/>
          <button className="oa-iconbtn" onClick={() => setMonthOffset(o=>o-1)} title="Previous month">
            <Icons.Caret size={12} style={{transform:'rotate(90deg)'}}/>
          </button>
          <span style={{fontSize:14, fontWeight:700, minWidth:156, textAlign:'center'}}>{monthLabel}</span>
          <button className="oa-iconbtn" onClick={() => setMonthOffset(o=>o+1)} title="Next month">
            <Icons.Caret size={12} style={{transform:'rotate(-90deg)'}}/>
          </button>
          {monthOffset !== 0 && (
            <button className="oa-btn" style={{fontSize:12}} onClick={() => setMonthOffset(0)}>Today</button>
          )}
        </div>
      </div>

      {/* DOW headers */}
      <div style={{display:'grid', gridTemplateColumns:'repeat(7, 1fr)', gap:4}}>
        {DOW.map(d => (
          <div key={d} style={{textAlign:'center', fontSize:11.5, fontWeight:700, color:'var(--ink-3)',
            textTransform:'uppercase', letterSpacing:'0.08em', padding:'3px 0'}}>{d}</div>
        ))}
      </div>

      {/* 6-week grid */}
      <div style={{display:'flex', flexDirection:'column', gap:4, flex:1}}>
        {weeks.map((week, wi) => (
          <div key={wi} style={{display:'grid', gridTemplateColumns:'repeat(7, 1fr)', gap:4}}>
            {week.map((day, di) => {
              const dayStr = day.toISOString().slice(0,10);
              const { oaItems, myItems } = itemsOnDay(day);
              const totalItems = oaItems.length + myItems.length;
              const isToday = dayStr === todayStr;
              const isCurrentMonth = day.getMonth() === anchor.getMonth();
              const isPast = day < today && !isToday;
              return (
                <div key={di}
                  onClick={e => { if (e.target === e.currentTarget) setEditEvent({ _new:true, date: dayStr }); }}
                  style={{
                    minHeight: 110, padding:'8px 8px 6px', borderRadius:10,
                    background: isToday ? 'oklch(0.72 0.24 145 / 0.07)' : isCurrentMonth ? 'var(--panel)' : 'var(--panel-2)',
                    border: isToday ? '1.5px solid oklch(0.72 0.24 145 / 0.45)' : '1px solid var(--line)',
                    opacity: !isCurrentMonth ? 0.30 : isPast ? 0.60 : 1,
                    display:'flex', flexDirection:'column', overflow:'hidden', cursor:'pointer',
                  }}>
                  {/* Date number */}
                  <div style={{marginBottom:5, lineHeight:1}}>
                    <span style={isToday ? {
                      background:'oklch(0.56 0.22 145)', color:'#fff',
                      borderRadius:99, width:22, height:22, display:'inline-grid', placeItems:'center',
                      fontSize:12, fontWeight:700,
                    } : {
                      fontSize:13, fontWeight: isCurrentMonth ? 600 : 400,
                      color: isCurrentMonth ? 'var(--ink)' : 'var(--ink-4)',
                    }}>{day.getDate()}</span>
                  </div>

                  {/* Events — left-border pill style */}
                  <div style={{display:'flex', flexDirection:'column', gap:3, flex:1, overflow:'hidden'}}>
                    {oaItems.slice(0, 3).map(e => {
                      const s = oaEventStyle(e.type);
                      return (
                        <div key={e.id}
                          onClick={() => setEditEvent(e)}
                          style={{
                            display:'flex', alignItems:'center',
                            padding:'4px 8px 4px 8px', borderRadius:5,
                            background: s.bg,
                            borderLeft: `3px solid ${s.accent}`,
                            overflow:'hidden', lineHeight:1.3, cursor:'pointer',
                            transition:'filter 0.12s',
                          }}
                          onMouseEnter={e2 => e2.currentTarget.style.filter='brightness(1.2)'}
                          onMouseLeave={e2 => e2.currentTarget.style.filter=''}>
                          <span style={{fontSize:12, color:'var(--ink)', overflow:'hidden', textOverflow:'ellipsis',
                            whiteSpace:'nowrap', flex:1, fontWeight:600}}>
                            {e.title}
                          </span>
                        </div>
                      );
                    })}
                    {myItems.slice(0, Math.max(0, 3 - oaItems.length)).map(t => (
                      <div key={t.id}
                        onClick={() => openCampaign && openCampaign(t.campaignId)}
                        style={{display:'flex', alignItems:'center', gap:5,
                          padding:'4px 8px 4px 6px', borderRadius:5, cursor:'pointer',
                          background:'oklch(0.56 0.22 145 / 0.14)',
                          borderLeft:'3px solid oklch(0.56 0.22 145)',
                          overflow:'hidden', lineHeight:1.3}}>
                        {me && <Avatar person={me} size={13} style={{flexShrink:0}}/>}
                        <span style={{fontSize:12, color:'var(--ink)', overflow:'hidden',
                          textOverflow:'ellipsis', whiteSpace:'nowrap', flex:1, fontWeight:600}}>
                          {t.title}
                        </span>
                        {t.done && <Icons.Check size={9} style={{color:'var(--accent-ink)', flexShrink:0}}/>}
                      </div>
                    ))}
                    {totalItems > 3 && (
                      <div style={{fontSize:11.5, color:'var(--ink-3)', paddingLeft:4, fontWeight:500}}>
                        +{totalItems - 3} more
                      </div>
                    )}
                  </div>
                </div>
              );
            })}
          </div>
        ))}
      </div>

      {/* Legend */}
      <div style={{display:'flex', gap:16, flexWrap:'wrap', paddingTop:6, borderTop:'1px solid var(--line-2)', alignItems:'center'}}>
        <span style={{fontSize:11, fontWeight:700, color:'var(--ink-4)', textTransform:'uppercase', letterSpacing:'0.07em'}}>Key</span>
        {[
          { label:'Meeting',  accent:'oklch(0.58 0.22 262)' },
          { label:'Event',    accent:'oklch(0.58 0.20 310)' },
          { label:'Deadline', accent:'oklch(0.62 0.22 38)'  },
        ].map(k => (
          <span key={k.label} style={{display:'flex', alignItems:'center', gap:6, fontSize:12}}>
            <span style={{width:10, height:10, borderRadius:2, background:k.accent, flexShrink:0}}/>
            <span style={{color:'var(--ink-2)', fontWeight:600}}>{k.label}</span>
          </span>
        ))}
        {me && (
          <span style={{display:'flex', alignItems:'center', gap:6, fontSize:12}}>
            <span style={{width:10, height:10, borderRadius:2, background:'oklch(0.56 0.22 145)', flexShrink:0}}/>
            <span style={{display:'flex', alignItems:'center', gap:4, color:'var(--ink-2)', fontWeight:600}}>
              <Avatar person={me} size={14}/> My task
            </span>
          </span>
        )}
        {monthMine.length > 0 && showMine && (
          <span style={{fontSize:11.5, color:'var(--ink-3)', marginLeft:'auto'}}>
            <strong>{monthMine.filter(t=>t.done).length}</strong>/{monthMine.length} of my tasks done this month
          </span>
        )}
      </div>
    </div>
  );
}

// ── Content Planner Page ──────────────────────────────────
function ContentPlannerPage({ state, setState }) {
  const { TEAM } = state;
  const posts = state.CONTENT_POSTS || [];
  const updatePosts = (next) => setState(s => ({...s, CONTENT_POSTS: next}));

  const [view, setView]           = useState('board'); // board | list | calendar
  const [filterPlatform, setFP]   = useState('all');
  const [filterStatus, setFS]     = useState('all');
  const [addOpen, setAddOpen]     = useState(false);
  const [editPost, setEditPost]   = useState(null);

  // Filtered posts
  const filtered = posts.filter(p => {
    if (filterPlatform !== 'all' && !getPlatforms(p).includes(filterPlatform)) return false;
    if (filterStatus   !== 'all' && p.status   !== filterStatus)   return false;
    return true;
  });

  const savePost = (form) => {
    if (editPost) {
      updatePosts(posts.map(p => p.id === editPost.id ? {...editPost, ...form} : p));
    } else {
      updatePosts([...posts, {...form, id:'cp_'+Date.now(), likes:0, comments:0, reach:0}]);
    }
    setAddOpen(false); setEditPost(null);
  };

  const deletePost = (id) => {
    if (confirm('Delete this post?')) updatePosts(posts.filter(p => p.id !== id));
  };

  // Stats
  const now = new Date();
  const weekFromNow = new Date(now.getTime() + 7*24*60*60*1000);
  const statsThisWeek = posts.filter(p => p.scheduledAt && new Date(p.scheduledAt) >= now && new Date(p.scheduledAt) <= weekFromNow).length;
  const statsDrafts    = posts.filter(p => p.status === 'draft').length;
  const statsScheduled = posts.filter(p => p.status === 'scheduled').length;
  const statsPublished = posts.filter(p => p.status === 'published').length;
  const totalLikes = posts.filter(p=>p.likes).reduce((s,p)=>s+(p.likes||0),0);
  const totalReach = posts.filter(p=>p.reach).reduce((s,p)=>s+(p.reach||0),0);

  return (
    <div className="oa-page">
      {/* Page header */}
      <div className="oa-page-head">
        <div>
          <div className="oa-eyebrow">Oregon Accelerator</div>
          <h2 className="oa-h2">Content Planner</h2>
          <div className="oa-sub">Social media planning for OA channels · {posts.length} posts total</div>
        </div>
        <Button kind="primary" icon={<Icons.Plus size={14}/>} onClick={() => { setEditPost(null); setAddOpen(true); }}>
          New post
        </Button>
      </div>

      {/* Stats strip */}
      <div style={{display:'grid', gridTemplateColumns:'repeat(5, 1fr)', gap:12, marginBottom:24}}>
        {[
          { label:'Drafts',       value: statsDrafts,    color:'var(--ink-3)' },
          { label:'Scheduled',    value: statsScheduled, color:'oklch(0.72 0.22 82)' },
          { label:'Due this week',value: statsThisWeek,  color:'oklch(0.72 0.18 192)' },
          { label:'Published',    value: statsPublished, color:'oklch(0.72 0.24 145)' },
          { label:'Total reach',  value: totalReach >= 1000 ? (totalReach/1000).toFixed(1)+'k' : totalReach, color:'var(--ink)' },
        ].map(s => (
          <div key={s.label} className="oa-panel" style={{padding:'14px 18px', textAlign:'center'}}>
            <div style={{fontSize:22, fontWeight:700, color:s.color, fontVariantNumeric:'tabular-nums'}}>{s.value}</div>
            <div style={{fontSize:11, color:'var(--ink-3)', marginTop:3}}>{s.label}</div>
          </div>
        ))}
      </div>

      {/* Toolbar: platform filters + view toggle */}
      <div style={{display:'flex', alignItems:'center', gap:8, marginBottom:20, flexWrap:'wrap'}}>
        {/* Platform filters */}
        <div style={{display:'flex', gap:6, flex:1, flexWrap:'wrap'}}>
          <button onClick={() => setFP('all')}
            style={{padding:'5px 13px', borderRadius:999, fontSize:12, fontWeight:600, cursor:'pointer',
              border: filterPlatform==='all' ? '1.5px solid var(--accent)' : '1px solid var(--line)',
              background: filterPlatform==='all' ? 'var(--accent-wash)' : 'transparent',
              color: filterPlatform==='all' ? 'var(--accent-ink)' : 'var(--ink-3)'}}>
            All platforms
          </button>
          {PLATFORMS.map(p => (
            <button key={p.id} onClick={() => setFP(filterPlatform===p.id ? 'all' : p.id)}
              style={{display:'flex', alignItems:'center', gap:5, padding:'5px 12px', borderRadius:999,
                fontSize:12, fontWeight:600, cursor:'pointer',
                border: filterPlatform===p.id ? `1.5px solid ${p.color}` : '1px solid var(--line)',
                background: filterPlatform===p.id ? p.bg : 'transparent',
                color: filterPlatform===p.id ? p.color : 'var(--ink-3)'}}>
              <p.Icon/>{p.label}
            </button>
          ))}
        </div>

        {/* Status filter */}
        <select value={filterStatus} onChange={e => setFS(e.target.value)}
          style={{padding:'6px 12px', borderRadius:8, border:'1px solid var(--line)',
            background:'var(--panel-2)', color:'var(--ink)', fontSize:12, outline:'none', cursor:'pointer'}}>
          <option value="all">All statuses</option>
          {POST_STATUS.map(s => <option key={s.id} value={s.id}>{s.label}</option>)}
        </select>

        {/* View toggle */}
        <div style={{display:'flex', gap:2, background:'var(--panel-2)', borderRadius:8, padding:3}}>
          {[['board','Board',<Icons.Kanban size={13}/>],['list','List',<Icons.Listbul size={13}/>],['calendar','Calendar',<Icons.Calendar size={13}/>]].map(([id,lbl,ic]) => (
            <button key={id} onClick={() => setView(id)}
              style={{display:'flex', alignItems:'center', gap:5, padding:'5px 12px', borderRadius:6, fontSize:12, fontWeight:600, cursor:'pointer',
                background: view===id ? 'var(--panel)' : 'transparent',
                color: view===id ? 'var(--ink)' : 'var(--ink-3)',
                border: view===id ? '1px solid var(--line)' : '1px solid transparent',
                boxShadow: view===id ? 'var(--shadow-card)' : 'none'}}>
              {ic} {lbl}
            </button>
          ))}
        </div>
      </div>

      {/* ── Board view ── */}
      {view === 'board' && (
        <div style={{display:'grid', gridTemplateColumns:'repeat(3, 1fr)', gap:16, alignItems:'start'}}>
          {POST_STATUS.filter(s => s.id !== 'archived').map(status => {
            const col = filtered.filter(p => p.status === status.id)
              .sort((a,b) => (a.scheduledAt||'').localeCompare(b.scheduledAt||''));
            return (
              <div key={status.id}>
                <div style={{display:'flex', alignItems:'center', gap:8, marginBottom:12, padding:'0 4px'}}>
                  <div style={{width:8, height:8, borderRadius:'50%', background:status.color, flexShrink:0}}/>
                  <span style={{fontSize:12, fontWeight:700, color:'var(--ink-2)', textTransform:'uppercase', letterSpacing:'0.06em'}}>{status.label}</span>
                  <span style={{fontSize:11, color:'var(--ink-4)', background:'var(--panel-2)', padding:'1px 7px', borderRadius:99}}>{col.length}</span>
                  <button className="oa-iconbtn sm" style={{marginLeft:'auto', opacity:0.5}}
                    onClick={() => { setEditPost(null); setAddOpen(true); }}>
                    <Icons.Plus size={11}/>
                  </button>
                </div>
                <div style={{display:'flex', flexDirection:'column', gap:10}}>
                  {col.map(post => (
                    <PostCard key={post.id} post={post} team={TEAM}
                      onClick={() => setEditPost(post)}/>
                  ))}
                  {col.length === 0 && (
                    <div style={{padding:'20px', borderRadius:12, border:'1.5px dashed var(--line-2)',
                      textAlign:'center', color:'var(--ink-4)', fontSize:12}}>
                      No {status.label.toLowerCase()} posts
                    </div>
                  )}
                </div>
              </div>
            );
          })}
        </div>
      )}

      {/* ── List view ── */}
      {view === 'list' && (
        <div className="oa-panel" style={{overflow:'hidden'}}>
          <table style={{width:'100%', borderCollapse:'collapse'}}>
            <thead>
              <tr style={{borderBottom:'1px solid var(--line)'}}>
                {['Platform','Type','Caption','Date','Assignee','Status',''].map(h => (
                  <th key={h} style={{padding:'10px 14px', textAlign:'left', fontSize:11, fontWeight:700,
                    color:'var(--ink-3)', textTransform:'uppercase', letterSpacing:'0.07em', whiteSpace:'nowrap'}}>
                    {h}
                  </th>
                ))}
              </tr>
            </thead>
            <tbody>
              {filtered.sort((a,b)=>(a.scheduledAt||'zzz').localeCompare(b.scheduledAt||'zzz')).map((post, i) => {
                const dt = post.scheduledAt ? new Date(post.scheduledAt) : null;
                const assignee = TEAM.find(t => t.id === post.assignee);
                const plats = getPlatforms(post);
                const pl = platformOf(plats[0]);
                return (
                  <tr key={post.id}
                    style={{borderBottom:'1px solid var(--line-2)', cursor:'pointer', transition:'background 0.1s'}}
                    onClick={() => setEditPost(post)}
                    onMouseEnter={e => e.currentTarget.style.background='var(--panel-2)'}
                    onMouseLeave={e => e.currentTarget.style.background='transparent'}>
                    <td style={{padding:'12px 14px', whiteSpace:'nowrap'}}>
                      <PlatformBadge platforms={plats}/>
                    </td>
                    <td style={{padding:'12px 14px', fontSize:12, color:'var(--ink-3)', fontWeight:600, whiteSpace:'nowrap'}}>
                      {post.type}
                    </td>
                    <td style={{padding:'12px 14px', maxWidth:320}}>
                      <div style={{display:'flex', alignItems:'center', gap:7}}>
                        <div style={{flex:1, minWidth:0}}>
                          {post.title && (
                            <div style={{fontSize:13, fontWeight:600, color:'var(--ink)', overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap'}}>
                              {post.title}
                            </div>
                          )}
                          <div style={{fontSize:post.title ? 11.5 : 13, color: post.title ? 'var(--ink-3)' : 'var(--ink)', overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap'}}>
                            {post.caption}
                          </div>
                        </div>
                        {(post.files||[]).length > 0 && (
                          <span title={`${post.files.length} file link${post.files.length!==1?'s':''}`}
                            style={{display:'flex', alignItems:'center', gap:3, fontSize:11,
                              color:'var(--accent-ink)', background:'var(--accent-wash)',
                              padding:'1px 6px', borderRadius:5, fontWeight:600, flexShrink:0}}>
                            <Icons.Link size={9}/>{post.files.length}
                          </span>
                        )}
                      </div>
                      {post.hashtags?.length > 0 && (
                        <div style={{fontSize:11, color:pl.color, marginTop:2}}>
                          {post.hashtags.slice(0,3).map(h=>`#${h}`).join(' ')}
                        </div>
                      )}
                    </td>
                    <td style={{padding:'12px 14px', whiteSpace:'nowrap'}}>
                      {dt ? (
                        <span style={{fontSize:12, color:'var(--ink-3)'}}>
                          <div style={{fontWeight:600, color:'var(--ink)'}}>{dt.toLocaleDateString('en-US',{month:'short',day:'numeric'})}</div>
                          <div>{dt.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'})}</div>
                        </span>
                      ) : <span style={{color:'var(--ink-4)', fontSize:12}}>—</span>}
                    </td>
                    <td style={{padding:'12px 14px'}}>
                      {assignee ? <span style={{display:'flex', alignItems:'center', gap:6}}><Avatar person={assignee} size={22}/><span style={{fontSize:12, color:'var(--ink-2)'}}>{assignee.name.split(' ')[0]}</span></span> : <span style={{color:'var(--ink-4)', fontSize:12}}>—</span>}
                    </td>
                    <td style={{padding:'12px 14px'}}>
                      <StatusBadge status={post.status}/>
                    </td>
                    <td style={{padding:'12px 14px', textAlign:'right'}}>
                      <button className="oa-iconbtn sm" style={{opacity:0.4}}
                        onClick={e => { e.stopPropagation(); deletePost(post.id); }}>
                        <Icons.X size={11}/>

              })}
              {filtered.length === 0 && (
                <tr><td colSpan={7} style={{padding:'40px', textAlign:'center', color:'var(--ink-4)', fontSize:13}}>No posts match these filters.</td></tr>
              )}

          </table>
        </div>
      )}

      {/* ── Calendar view ── */}
      {view === 'calendar' && (
        <ContentCalendar posts={filtered} team={TEAM} onClickPost={setEditPost} onNewPost={() => setAddOpen(true)}/>
      )}

      {/* Add / Edit modal */}
      {(addOpen || editPost) && (
        <PostModal
          post={editPost || null}
          state={state}
          onSave={savePost}
          onClose={() => { setAddOpen(false); setEditPost(null); }}/>
      )}
    </div>
  );
}

// ── Calendar sub-view ─────────────────────────────────────
function ContentCalendar({ posts, team, onClickPost, onNewPost }) {
  const today = new Date();
  today.setHours(0,0,0,0);
  const [monthOffset, setMonthOffset] = useState(0);

  // Anchor to first of the display month
  const anchor = new Date(today.getFullYear(), today.getMonth() + monthOffset, 1);
  const monthLabel = anchor.toLocaleDateString('en-US', { month: 'long', year: 'numeric' });

  // Build 6-week grid: pad before the 1st and after the last day to fill 42 cells
  const firstDow = anchor.getDay(); // 0=Sun
  const gridStart = new Date(anchor);
  gridStart.setDate(anchor.getDate() - firstDow);

  const cells = Array.from({ length: 42 }, (_, i) => {
    const d = new Date(gridStart);
    d.setDate(gridStart.getDate() + i);
    return d;
  });

  const weeks = Array.from({ length: 6 }, (_, w) => cells.slice(w * 7, w * 7 + 7));

  const postsOnDay = (d) => {
    const ds = d.toISOString().slice(0,10);
    return posts.filter(p => p.scheduledAt && p.scheduledAt.slice(0,10) === ds);
  };

  const DOW = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const todayStr = today.toISOString().slice(0,10);

  return (
    <div style={{display:'flex', flexDirection:'column', gap:0}}>
      {/* Calendar nav */}
      <div style={{display:'flex', alignItems:'center', gap:10, marginBottom:14}}>
        <button className="oa-iconbtn" onClick={() => setMonthOffset(o=>o-1)} title="Previous month">
          <Icons.Caret size={12} style={{transform:'rotate(90deg)'}}/>
        </button>
        <span style={{fontSize:14, fontWeight:700, color:'var(--ink)', minWidth:160, textAlign:'center'}}>{monthLabel}</span>
        <button className="oa-iconbtn" onClick={() => setMonthOffset(o=>o+1)} title="Next month">
          <Icons.Caret size={12} style={{transform:'rotate(-90deg)'}}/>
        </button>
        {monthOffset !== 0 && (
          <button className="oa-btn" style={{fontSize:12, marginLeft:4}} onClick={() => setMonthOffset(0)}>Today</button>
        )}
        <div style={{flex:1}}/>
        <button className="oa-btn kind-primary" style={{fontSize:12, display:'flex', alignItems:'center', gap:5}} onClick={onNewPost}>
          <Icons.Plus size={11}/> New post
        </button>
      </div>

      {/* Day-of-week headers */}
      <div style={{display:'grid', gridTemplateColumns:'repeat(7, 1fr)', gap:3, marginBottom:3}}>
        {DOW.map(d => (
          <div key={d} style={{textAlign:'center', fontSize:11, fontWeight:700, color:'var(--ink-4)',
            textTransform:'uppercase', letterSpacing:'0.07em', padding:'4px 0'}}>{d}</div>
        ))}
      </div>

      {/* 6-week grid */}
      {weeks.map((week, wi) => (
        <div key={wi} style={{display:'grid', gridTemplateColumns:'repeat(7, 1fr)', gap:3, marginBottom:2}}>
          {week.map((day, di) => {
            const dayStr = day.toISOString().slice(0,10);
            const dayPosts = postsOnDay(day);
            const isToday = dayStr === todayStr;
            const isCurrentMonth = day.getMonth() === anchor.getMonth();
            const isPast = day < today && !isToday;
            return (
              <div key={di}
                className="oa-content-cal-cell"
                onClick={() => { if (onNewPost && isCurrentMonth) onNewPost(day); }}
                style={{
                  minHeight: 95, padding:'6px 7px 5px', borderRadius:10,
                  background: isToday ? 'oklch(0.72 0.24 145 / 0.07)' : isCurrentMonth ? 'var(--panel)' : 'var(--panel-2)',
                  border: isToday ? '1.5px solid oklch(0.72 0.24 145 / 0.4)' : '1px solid var(--line)',
                  opacity: !isCurrentMonth ? 0.35 : isPast ? 0.65 : 1,
                  display:'flex', flexDirection:'column',
                }}>
                {/* Date number */}
                <div style={{
                  fontSize:11.5, fontWeight: isToday ? 700 : 500, marginBottom:3,
                  color: isToday ? 'oklch(0.72 0.24 145)' : isCurrentMonth ? 'var(--ink-2)' : 'var(--ink-4)',
                  display:'flex', justifyContent:'space-between', alignItems:'center',
                }}>
                  <span style={{
                    ...(isToday ? {
                      background:'oklch(0.72 0.24 145)', color:'#0a1408',
                      borderRadius:99, width:22, height:22, display:'grid', placeItems:'center', fontSize:11.5,
                    } : {}),
                  }}>{day.getDate()}</span>
                  {isCurrentMonth && (
                    <button
                      className="oa-cal-cell-add"
                      style={{opacity:0, fontSize:10, padding:'1px 5px', borderRadius:4}}
                      onClick={e => { e.stopPropagation(); onNewPost && onNewPost(day); }}
                      title="Add post">
                      <Icons.Plus size={9}/>
                    </button>
                  )}
                </div>
                {/* Posts */}
                <div style={{display:'flex', flexDirection:'column', gap:2, flex:1}}>
                  {dayPosts.slice(0,3).map(post => {
                    const plats = getPlatforms(post);
                    const pl = platformOf(plats[0]);
                    return (
                      <div key={post.id}
                        onClick={e => { e.stopPropagation(); onClickPost(post); }}
                        style={{fontSize:10.5, padding:'2px 5px', borderRadius:5,
                          background:pl.bg, color:pl.color, cursor:'pointer',
                          overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap',
                          display:'flex', alignItems:'center', gap:3, lineHeight:1.4}}>
                        <pl.Icon style={{flexShrink:0}}/>
                        <span style={{overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap', flex:1}}>
                          {post.title
                            ? post.title
                            : post.caption?.trim()
                              ? post.caption.trim().slice(0, 28) + (post.caption.trim().length > 28 ? '…' : '')
                              : post.type}
                        </span>
                        {plats.length > 1 && <span style={{flexShrink:0, opacity:0.75}}>+{plats.length-1}</span>}
                      </div>
                    );
                  })}
                  {dayPosts.length > 3 && (
                    <div style={{fontSize:10, color:'var(--ink-4)', paddingLeft:4, marginTop:1}}>
                      +{dayPosts.length-3} more
                    </div>
                  )}
                </div>
              </div>
            );
          })}
        </div>
      ))}
    </div>
  );
}

// ── Notifications panel ─────────────────────────────────────
function NotificationPanel({ state, onClose, currentUserId }) {
  const { CAMPAIGNS, TEAM, ATHLETES } = state;
  const today = new Date();

  // Persist dismissed IDs across panel open/close via localStorage
  const [dismissed, setDismissed] = useState(() => {
    try { return new Set(JSON.parse(localStorage.getItem('oa_dismissed_notifs') || '[]')); }
    catch { return new Set(); }
  });

  const dismiss = (id) => {
    setDismissed(prev => {
      const next = new Set(prev);
      next.add(id);
      try { localStorage.setItem('oa_dismissed_notifs', JSON.stringify([...next])); } catch {}
      return next;
    });
  };

  // Build notification list from real data
  const allNotifs = useMemo(() => {
    const list = [];
    CAMPAIGNS.forEach(c => {
      c.deliverables?.forEach(d => {
        if (!d.done && d.due) {
          const due = new Date(d.due);
          const daysLeft = Math.round((due - today) / 86400000);
          if (daysLeft < 0 && daysLeft >= -7) {
            const person = [...TEAM, ...ATHLETES].find(p => p.id === d.assignee);
            list.push({ id: d.id + '_overdue', type: 'overdue', title: d.title, campaign: c.title, person, daysLeft, at: d.due });
          } else if (daysLeft >= 0 && daysLeft <= 2) {
            const person = [...TEAM, ...ATHLETES].find(p => p.id === d.assignee);
            list.push({ id: d.id + '_due', type: 'due_soon', title: d.title, campaign: c.title, person, daysLeft, at: d.due });
          }
        }
      });
      c.comments?.slice(-2).forEach(cm => {
        if (cm.userId !== currentUserId) {
          const u = TEAM.find(t => t.id === cm.userId);
          list.push({ id: cm.id, type: 'comment', text: cm.text, campaign: c.title, person: u, at: cm.at });
        }
      });
    });
    return list.sort((a, b) => new Date(b.at) - new Date(a.at)).slice(0, 12);
  }, [CAMPAIGNS, TEAM, ATHLETES]);

  const visible = allNotifs.filter(n => !dismissed.has(n.id));

  const dismissAll = () => {
    setDismissed(prev => {
      const next = new Set([...prev, ...visible.map(n => n.id)]);
      try { localStorage.setItem('oa_dismissed_notifs', JSON.stringify([...next])); } catch {}
      return next;
    });
  };

  useEffect(() => {
    const close = e => { if (!e.target.closest('.oa-notif-panel')) onClose(); };
    setTimeout(() => document.addEventListener('mousedown', close), 50);
    return () => document.removeEventListener('mousedown', close);
  }, []);

  const icon = (type) => {
    if (type === 'overdue') return <span style={{fontSize:14}}>🔴</span>;
    if (type === 'due_soon') return <span style={{fontSize:14}}>🟡</span>;
    if (type === 'comment') return <span style={{fontSize:14}}>💬</span>;
    return <span style={{fontSize:14}}>🔔</span>;
  };

  return (
    <div className="oa-notif-panel" style={{
      position:'absolute', top:'calc(100% + 10px)', right:0, zIndex:300,
      width:340, maxHeight:480, overflowY:'auto',
      background:'var(--panel-solid)', border:'1px solid var(--line)',
      borderRadius:14, boxShadow:'var(--shadow-pop)', padding:'4px 0',
    }}>
      <div style={{display:'flex', alignItems:'center', justifyContent:'space-between',
        padding:'12px 16px 8px', borderBottom:'1px solid var(--line)'}}>
        <span style={{fontWeight:700, fontSize:14}}>
          Notifications{visible.length > 0 && <span style={{marginLeft:6, fontSize:11, fontWeight:600, background:'var(--accent)', color:'white', borderRadius:99, padding:'1px 6px'}}>{visible.length}</span>}
        </span>
        <div style={{display:'flex', alignItems:'center', gap:4}}>
          {visible.length > 0 && (
            <button onClick={dismissAll}
              style={{background:'none', border:'none', cursor:'pointer', fontSize:11.5, color:'var(--ink-3)',
                padding:'3px 7px', borderRadius:6, fontFamily:'var(--font)'}}
              onMouseEnter={e => e.currentTarget.style.color='var(--ink)'}
              onMouseLeave={e => e.currentTarget.style.color='var(--ink-3)'}>
              Clear all
            </button>
          )}
          <button className="oa-iconbtn sm" onClick={onClose}><Icons.X size={12}/></button>
        </div>
      </div>
      {visible.length === 0 ? (
        <div style={{padding:'32px 16px', textAlign:'center', color:'var(--ink-3)', fontSize:13}}>
          <div style={{fontSize:28, marginBottom:8}}>✅</div>
          All caught up! No new notifications.
        </div>
      ) : visible.map(n => (
        <div key={n.id}
          style={{display:'flex', alignItems:'flex-start', gap:10,
            padding:'10px 16px', borderBottom:'1px solid var(--line-2)',
            transition:'background 0.1s', cursor:'default', position:'relative'}}
          onMouseEnter={e => { e.currentTarget.style.background='var(--panel-2)'; e.currentTarget.querySelector('.oa-notif-dismiss').style.opacity='1'; }}
          onMouseLeave={e => { e.currentTarget.style.background='transparent'; e.currentTarget.querySelector('.oa-notif-dismiss').style.opacity='0'; }}>
          <div style={{marginTop:1, flexShrink:0}}>{icon(n.type)}</div>
          <div style={{flex:1, minWidth:0}}>
            <div style={{fontSize:12.5, fontWeight:500, color:'var(--ink)', lineHeight:1.4}}>
              {n.type === 'overdue' && <><strong>{n.title}</strong> is {Math.abs(n.daysLeft)}d overdue</>}
              {n.type === 'due_soon' && <><strong>{n.title}</strong> {n.daysLeft === 0 ? 'is due today' : `due in ${n.daysLeft}d`}</>}
              {n.type === 'comment' && <><strong>{n.person?.name?.split(' ')[0]}</strong> commented: "{n.text?.slice(0, 60)}{n.text?.length > 60 ? '…' : ''}"</>}
            </div>
            <div style={{fontSize:11, color:'var(--ink-3)', marginTop:2}}>{n.campaign}</div>
          </div>
          <button className="oa-notif-dismiss oa-iconbtn sm"
            style={{opacity:0, transition:'opacity 0.12s', flexShrink:0, marginTop:1}}
            title="Dismiss"
            onClick={e => { e.stopPropagation(); dismiss(n.id); }}>
            <Icons.X size={10}/>
          </button>
        </div>
      ))}
    </div>
  );
}

// Top-level App shell — Asana-style sidebar routing + project list view + task detail.
function App() {
  const [state, _setState] = useState(() => {
    const defaultPb = window.OA_DATA.PLAYBOOKS[0];
    return {
      TEAM: window.OA_DATA.TEAM,
      ATHLETES: window.OA_DATA.ATHLETES,
      BRANDS: window.OA_DATA.BRANDS,
      CLIENTS: window.OA_DATA.CLIENTS,
      // Upgrade existing campaigns: inject playbook steps with distributed due dates + realistic done status
      CAMPAIGNS: window.OA_DATA.CAMPAIGNS.map(c => {
        if (c.deliverables.some(d => d.stageId)) return c; // already staged

        const deliverables = deliFromPlaybook(defaultPb, c.id);
        const startMs  = new Date(c.start).getTime();
        const endMs    = new Date(c.end).getTime();
        const totalMs  = endMs - startMs;

        // Each stage occupies a slice of the campaign timeline
        const STAGE_WINDOWS = [
          [0.00, 0.13],  // 1 Opportunity & Prep
          [0.13, 0.21],  // 2 Discovery Call
          [0.21, 0.44],  // 3 Proposal Development
          [0.44, 0.58],  // 4 Deal Confirmation
          [0.58, 0.86],  // 5 Production
          [0.86, 1.00],  // 6 Close Out
        ];

        // How many stages are fully done based on status
        const doneStageCount = { pitching:1, active:3, review:5, complete:6, blocked:2 }[c.status] ?? 0;

        const stageIds = [...new Set(deliverables.map(d => d.stageId))];

        const withDates = deliverables.map(d => {
          const si = stageIds.indexOf(d.stageId);
          const [wStart, wEnd] = STAGE_WINDOWS[si] ?? [0.5, 0.7];
          const stageSteps = deliverables.filter(x => x.stageId === d.stageId);
          const stepIdx    = stageSteps.findIndex(x => x.id === d.id);
          const pct        = wStart + (wEnd - wStart) * (stepIdx + 1) / stageSteps.length;
          const due        = new Date(startMs + totalMs * pct).toISOString().slice(0, 10);
          const done       = si < doneStageCount;
          return { ...d, due, done };
        });

        // Seed teamIds from ownerId + existing deliverable assignees (TEAM members only)
        const teamMemberIds = new Set(window.OA_DATA.TEAM.map(t => t.id));
        const seedTeam = [...new Set([
          c.ownerId,
          ...withDates.map(d => d.assignee).filter(id => id && teamMemberIds.has(id)),
        ])].filter(Boolean);
        return { ...c, playbookId: defaultPb.id, deliverables: withDates, customDeliverables: FAKE_CUSTOM_DELIVERABLES[c.id] || [], teamIds: c.teamIds || seedTeam };
      }),
      OPS_TASKS: window.OA_DATA.OPS_TASKS,
      DEPTS: window.OA_DATA.DEPTS,
      SPIDER_AXES: window.OA_DATA.SPIDER_AXES,
      ATHLETE_AXES: window.OA_DATA.ATHLETE_AXES,
      PLAYBOOKS: window.OA_DATA.PLAYBOOKS,
      CONTENT_POSTS: window.OA_DATA.CONTENT_POSTS || [],
      OA_EVENTS: window.OA_DATA.OA_EVENTS || [],
    };
  });

  // ── Undo history ────────────────────────────────────────
  const historyRef = useRef([]);
  // Shadow setState with a history-aware version so all children get undo for free
  const setState = (updater) => {
    _setState(prev => {
      historyRef.current = [...historyRef.current.slice(-59), prev];
      return typeof updater === 'function' ? updater(prev) : updater;
    });
  };

  const defaults = window.__TWEAK_DEFAULTS || { home: 'dashboard', density: 'comfortable', dark: false };
  const [home, setHome] = useState(defaults.home);
  const [density, setDensity] = useState(defaults.density);
  const [dark, setDark] = useState(false);
  const [tweaksOpen, setTweaksOpen] = useState(false);

  // Route: { kind: 'view'|'campaign'|'team'|'mytasks'|'inbox', id?: string }
  const [route, setRoute] = useState(() => {
    try { return JSON.parse(localStorage.getItem('oa_route') || 'null') || { kind: 'view', id: defaults.home || 'dashboard' }; }
    catch { return { kind: 'view', id: defaults.home || 'dashboard' }; }
  });
  useEffect(() => { localStorage.setItem('oa_route', JSON.stringify(route)); }, [route]);
  // Redirect legacy routes
  useEffect(() => {
    if (route.kind === 'view' && route.id === 'projects') setRoute({ kind:'view', id:'campaigns' });
    // 'project' kind now opens task view (campaign) which has overview as default tab
    if (route.kind === 'project') setRoute({ kind:'campaign', id: route.id });
  }, [route.kind, route.id]);

  const [query, setQuery] = useState('');
  const [openCampId, setOpenCampId] = useState(null);   // drawer overlay (non-project routes)
  const [openAthId, setOpenAthId] = useState(null);
  const [openClientId, setOpenClientId] = useState(null);
  const [openMemberId, setOpenMemberId] = useState(null);
  const [openTaskId, setOpenTaskId] = useState(null);   // right-side task drawer, inline
  const [addCampOpen, setAddCampOpen] = useState(false);
  const [addAthOpen, setAddAthOpen] = useState(false);
  const [addClientOpen, setAddClientOpen] = useState(false);
  const [currentUserId] = useState('u4');
  const [profileOpen, setProfileOpen] = useState(false);
  const [notifOpen, setNotifOpen] = useState(false);

  useEffect(() => {
    const root = document.documentElement;
    root.setAttribute('data-theme', 'light');
    root.setAttribute('data-density', density);
  }, [dark, density]);

  useEffect(() => {
    const onMsg = (e) => {
      if (e.data?.type === '__activate_edit_mode') setTweaksOpen(true);
      else if (e.data?.type === '__deactivate_edit_mode') setTweaksOpen(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);

  // ── Cmd/Ctrl+Z → undo ───────────────────────────────────
  useEffect(() => {
    const onKeyDown = (e) => {
      if (!(e.metaKey || e.ctrlKey) || e.key !== 'z' || e.shiftKey) return;
      // Let the browser handle undo inside text inputs / textareas / contenteditable
      const tag = document.activeElement?.tagName;
      const editable = document.activeElement?.isContentEditable;
      if (tag === 'INPUT' || tag === 'TEXTAREA' || editable) return;
      if (historyRef.current.length === 0) return;
      e.preventDefault();
      const prev = historyRef.current[historyRef.current.length - 1];
      historyRef.current = historyRef.current.slice(0, -1);
      _setState(prev);
    };
    window.addEventListener('keydown', onKeyDown);
    return () => window.removeEventListener('keydown', onKeyDown);
  }, []);

  const persistTweak = (patch) => {
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits: patch }, '*');
  };

  // Navigation helpers
  const openCampaignInMain = (id) => { setRoute({ kind: 'campaign', id }); setOpenTaskId(null); };
  const openCampaignDrawer = (id) => setOpenCampId(id);
  const openAthlete = (id) => setOpenAthId(id);
  const openClient = (id) => setOpenClientId(id);
  const openMember = (id) => setOpenMemberId(id);
  const openProject = (id) => setRoute({ kind: 'project', id });

  const openCamp = state.CAMPAIGNS.find(c => c.id === openCampId);

  const searchHits = useMemo(() => {
    if (!query.trim()) return null;
    const q = query.toLowerCase();
    return {
      athletes: state.ATHLETES.filter(a => `${a.name} ${a.sport} ${a.position}`.toLowerCase().includes(q)).slice(0, 5),
      campaigns: state.CAMPAIGNS.filter(c => c.title.toLowerCase().includes(q)).slice(0, 5),
    };
  }, [query, state]);

  // Heading label for current route (for data-screen-label)
  const screenLabel = route.kind === 'view' ? `01 ${route.id}`
    : route.kind === 'campaign' ? `02 campaign ${state.CAMPAIGNS.find(c=>c.id===route.id)?.title || ''}`
    : route.kind === 'team' && route.id ? `03 team ${state.DEPTS.find(d=>d.id===route.id)?.label || ''}`
    : route.kind === 'mytasks' ? '04 my tasks'
    : route.kind === 'inbox' ? '05 inbox'
    : '01';

  return (
    <div className="oa-app asana" data-screen-label={screenLabel}>
      <Sidebar state={state} setState={setState} route={route} setRoute={setRoute} view={route}
        currentUserId={currentUserId}
        onCreate={() => setAddCampOpen(true)}
        onCreateAthlete={() => setAddAthOpen(true)}
        onCreateClient={() => setAddClientOpen(true)} />

      <main className="oa-main">
        <header className="oa-topbar">
          <div className="oa-topbar-crumbs">
            <button className="oa-iconbtn sm" onClick={() => setRoute({kind:'view', id:'dashboard'})} title="Home">
              <Icons.Home size={13}/>

              {route.kind === 'view' && (route.id?.charAt(0).toUpperCase() + route.id?.slice(1))}

              {route.kind === 'project' && state.CAMPAIGNS.find(c=>c.id===route.id)?.title}
              {route.kind === 'mytasks' && 'My tasks'}
              {route.kind === 'inbox' && 'Inbox'}
              {route.kind === 'team' && state.DEPTS.find(d=>d.id===route.id)?.label}
            </span>
          </div>
          <div className="oa-search-wrap">
            <TextInput value={query} onChange={setQuery}

              <div className="oa-search-results">
                {searchHits.athletes.length === 0 && searchHits.campaigns.length === 0 && (

                  <>
                    <div className="oa-search-head">Athletes</div>

                        <Icons.People size={12}/>

                        <span className="oa-search-sub">{a.sport}</span>

                {searchHits.campaigns.length > 0 && (

            <Dashboard state={state} setState={setState}
