    deliverables: c.deliverables.filter(d => d.id !== did),
  });

  const [dragId,           setDragId]           = useState(null);
  const [dragOver,         setDragOver]         = useState(null);
  const [openId,           setOpenId]           = useState(null);
  const [playbookBrowserOpen, setPlaybookBrowserOpen] = useState(false);

  // Close expanded card when clicking outside it
  useEffect(() => {
    if (!openId) return;
    const handler = e => {
      if (!e.target.closest('.oa-board-card.expanded')) setOpenId(null);
    };
    document.addEventListener('mousedown', handler);
    return () => document.removeEventListener('mousedown', handler);
  }, [openId]);

  const COLS = [
    { id:'todo',        label:'To Do',       color:'var(--ink-4)' },
    { id:'in_progress', label:'In Progress',  color:'oklch(0.65 0.18 240)' },
    { id:'in_review',   label:'In Review',    color:'oklch(0.78 0.18 75)' },
    { id:'done',        label:'Done',         color:'oklch(0.72 0.24 145)' },
  ];

  const getCol = d => d.done ? 'done' : (d.boardCol || 'todo');

  const moveCard = (did, toColId) => updateDeliv(did, {
    done: toColId === 'done',
    boardCol: toColId === 'done' ? undefined : toColId,
  });

  const addCard = colId => {
    const id = 'd' + Date.now();
    updateC({ deliverables: [...c.deliverables, {
      id, title: 'New task', assignee: null, due: null,
      done: colId === 'done',
      boardCol: colId === 'done' ? undefined : colId,
      section: 'Deliverables', campaign: c.id,
    }]});
    setOpenId(id);
  };

  return (
    <div style={{display:'flex', flexDirection:'column', flex:1, minHeight:0}}>
      {/* Board toolbar */}
      <div className="oa-board-toolbar">
        <button
          onClick={() => setPlaybookBrowserOpen(o => !o)}
          style={{
            display:'flex', alignItems:'center', gap:6, padding:'6px 12px',
            borderRadius:7, border:'1px solid var(--line)',
            background: playbookBrowserOpen ? 'oklch(0.72 0.24 145 / 0.12)' : 'var(--panel)',
            borderColor: playbookBrowserOpen ? 'oklch(0.72 0.24 145 / 0.5)' : 'var(--line)',
            color: playbookBrowserOpen ? 'oklch(0.65 0.22 145)' : 'var(--ink-2)',
            cursor:'pointer', fontSize:12, fontWeight:500, transition:'all 0.15s',
          }}>
          <Icons.Kanban size={13}/>
          Browse Playbook
        </button>
      </div>

    <div style={{display:'flex', gap:14, padding:'8px 24px 20px', overflowX:'auto', flex:1, minHeight:0, alignItems:'flex-start'}}>
      {COLS.map(col => {
        const items = c.deliverables.filter(d => getCol(d) === col.id);
        const isDragOver = dragOver === col.id;
        const draggingCard = dragId ? c.deliverables.find(d => d.id === dragId) : null;
        const showDropZone = isDragOver && draggingCard && getCol(draggingCard) !== col.id;

        return (
          <div key={col.id}
            className={`oa-board-col${isDragOver ? ' drag-over' : ''}`}
            style={{'--col-color': col.color}}
            onDragOver={e => { e.preventDefault(); setDragOver(col.id); }}
            onDragLeave={e => { if (!e.currentTarget.contains(e.relatedTarget)) setDragOver(null); }}
            onDrop={e => { e.preventDefault(); if (dragId) moveCard(dragId, col.id); setDragId(null); setDragOver(null); }}>

            {/* Column header */}
            <div className="oa-board-col-head">
              <span style={{fontWeight:600, fontSize:13, color:'var(--ink-1)'}}>{col.label}</span>
              <span style={{fontSize:11, color:'var(--ink-3)', background:'var(--panel)', padding:'1px 7px', borderRadius:99, minWidth:18, textAlign:'center'}}>{items.length}</span>
            </div>

            {/* Cards */}
            <div style={{display:'flex', flexDirection:'column', gap:8, padding:'12px 0', flex:1}}>
              {items.map(d => {
                const person = people.find(p => p.id === d.assignee);
                const days   = fmt.daysUntil(d.due);
                const late   = !d.done && days != null && days < 0;
                const isOpen = openId === d.id;

                return (
                  <div key={d.id}
                    draggable={!isOpen}
                    onDragStart={e => { setDragId(d.id); e.dataTransfer.effectAllowed = 'move'; }}
                    onDragEnd={() => { setDragId(null); setDragOver(null); }}
                    className={`oa-board-card${dragId === d.id ? ' dragging' : ''}${openTaskId === d.id ? ' expanded' : ''}`}
                    onClick={() => onOpenTask && onOpenTask(d.id)}>

                    {/* Title row */}
                    <div style={{display:'flex', alignItems:'flex-start', gap:8, marginBottom: isOpen || person || d.due ? 8 : 0}}>
                      <button className={`oa-check${d.done ? ' done' : ''}`}
                        style={{flexShrink:0, marginTop:1}}
                        onClick={e => { e.stopPropagation(); moveCard(d.id, d.done ? 'todo' : 'done'); }}>
                        {d.done && <Icons.Check size={10} stroke={2.4}/>}
                      </button>
                      {isOpen ? (
                        <input className="oa-inline-input"
                          defaultValue={d.title}
                          onClick={e => e.stopPropagation()}
                          onBlur={e => updateDeliv(d.id, {title: e.target.value || d.title})}
                          onKeyDown={e => { if (e.key === 'Enter') e.target.blur(); if (e.key === 'Escape') { e.target.value = d.title; e.target.blur(); } }}
                          style={{fontSize:13, fontWeight:500}}
                          autoFocus
                        />
                      ) : (
                        <span style={{
                          fontSize:13, fontWeight:500, flex:1, lineHeight:1.35,
                          textDecoration: d.done ? 'line-through' : 'none',
                          color: d.done ? 'var(--ink-3)' : 'var(--ink-1)',
                        }}>{d.title}</span>
                      )}
                    </div>

                    {/* Expanded detail fields */}
                    {isOpen && (
                      <div style={{marginLeft:26, display:'flex', flexDirection:'column', gap:8}} onClick={e => e.stopPropagation()}>
                        <div style={{display:'flex', alignItems:'center', gap:8}}>
                          <span style={{fontSize:11, color:'var(--ink-3)', width:62, flexShrink:0}}>Assignee</span>
                          <div style={{flex:1}}>
                            <SearchSelect
                              value={d.assignee || null}
                              onChange={v => updateDeliv(d.id, {assignee: v || null})}
                              placeholder="Unassigned"
                              options={[
                                ...people.map(p => ({ id: p.id, name: p.name, sub: p.role || p.sport || '', person: p }))
                              ]}
                            />
                          </div>
                        </div>
                        <div style={{display:'flex', alignItems:'center', gap:8}}>
                          <span style={{fontSize:11, color:'var(--ink-3)', width:62, flexShrink:0}}>Due date</span>
                          <input type="date" className="oa-inline-select" style={{flex:1}}
                            value={d.due || ''}
                            onChange={e => updateDeliv(d.id, {due: e.target.value || null})} />
                        </div>
                        <div style={{display:'flex', alignItems:'center', gap:8}}>
                          <span style={{fontSize:11, color:'var(--ink-3)', width:62, flexShrink:0}}>Move to</span>
                          <div style={{display:'flex', gap:5, flexWrap:'wrap'}}>
                            {COLS.filter(cl => cl.id !== col.id).map(cl => (
                              <button key={cl.id}
                                onClick={() => { moveCard(d.id, cl.id); setOpenId(null); }}
                                style={{fontSize:11, padding:'3px 9px', borderRadius:5, border:'1px solid var(--line)',
                                  background:'transparent', color:'var(--ink-2)', cursor:'pointer', transition:'background 0.1s'}}
                                onMouseEnter={e => e.currentTarget.style.background='var(--panel-2)'}
                                onMouseLeave={e => e.currentTarget.style.background='transparent'}>
                                {cl.label}
                              </button>
                            ))}
                          </div>
                        </div>
                        <div style={{display:'flex', justifyContent:'flex-end', paddingTop:2}}>
                          <button onClick={() => { removeDeliv(d.id); setOpenId(null); }}
                            style={{fontSize:11, color:'oklch(0.6 0.18 25)', background:'transparent', border:'none', cursor:'pointer', padding:'2px 4px'}}>
                            Delete
                          </button>
                        </div>
                      </div>
                    )}

                    {/* Footer: assignee + due (collapsed) */}
                    {!isOpen && (person || d.due) && (
                      <div style={{display:'flex', alignItems:'center', justifyContent:'space-between', gap:8, marginLeft:26}}>
                        {person
                          ? <div style={{display:'flex', alignItems:'center', gap:5}}>
                              <Avatar person={person} size={18}/>
                              <span style={{fontSize:11, color:'var(--ink-3)'}}>{person.name.split(' ')[0]}</span>
                            </div>
                          : <span/>}
                        {d.due && (
                          <span style={{fontSize:11, fontFamily:'var(--mono)', color: late ? 'oklch(0.7 0.2 25)' : 'var(--ink-4)'}}>
                            {late && '⚠ '}{fmt.date(d.due)}
                          </span>
                        )}
                      </div>
                    )}
                  </div>
                );
              })}

              {/* Drop zone indicator */}
              {showDropZone && <div className="oa-board-drop-zone">Drop here</div>}

              {/* Empty state */}
              {items.length === 0 && !showDropZone && (
                <div style={{fontSize:12, color:'var(--ink-4)', padding:'8px 4px', fontStyle:'italic'}}>No tasks</div>
              )}

              {/* Add task */}
              <button className="oa-board-add-btn" onClick={() => addCard(col.id)}>
                <Icons.Plus size={13}/> Add task
              </button>
            </div>
          </div>
        );
      })}

      {/* Playbook Browser panel — sticky on the right */}
      {playbookBrowserOpen && (
        <PlaybookBrowser
          state={state}
          c={c}
          updateC={updateC}
          onClose={() => setPlaybookBrowserOpen(false)}
        />
      )}
    </div>
    </div>
  );
}

// ── Timeline view ────────────────────────────────────────
function CampTimelineView({ c, state }) {
  const { TEAM, ATHLETES } = state;
  const people = [...TEAM, ...c.athleteIds.map(id => ATHLETES.find(a => a.id === id)).filter(Boolean)];
  const startMs = new Date(c.start+'T12:00:00').getTime();
  const endMs   = new Date(c.end  +'T12:00:00').getTime();
  const span    = Math.max(endMs - startMs, 1);
  const todayMs = new Date('2026-04-17T12:00:00').getTime();
  const todayPct = Math.max(0, Math.min(100, ((todayMs - startMs) / span) * 100));

  const months = [];
  const cur = new Date(startMs); cur.setDate(1);
  while (cur.getTime() <= endMs) { months.push(new Date(cur)); cur.setMonth(cur.getMonth()+1); }

  const rows = c.deliverables.filter(d => d.due).map(d => ({
    ...d, pct: Math.max(0, Math.min(98, ((new Date(d.due+'T12:00:00').getTime() - startMs) / span) * 100)),
  })).sort((a,b) => a.pct - b.pct);

  return (
    <div style={{padding:'20px 24px', flex:1, overflowY:'auto', minHeight:0}}>
      <div style={{display:'flex', borderBottom:'1px solid var(--line)', paddingBottom:8, marginBottom:4}}>
        <div style={{width:220, flexShrink:0, fontSize:11, fontWeight:600, textTransform:'uppercase', letterSpacing:'0.07em', color:'var(--ink-3)'}}>Deliverable</div>
        <div style={{flex:1, display:'flex', position:'relative'}}>
          {months.map((m,i) => (
            <div key={i} style={{flex:1, fontSize:11, color:'var(--ink-3)', fontWeight:500, whiteSpace:'nowrap', overflow:'hidden', textOverflow:'ellipsis'}}>
              {m.toLocaleDateString('en-US',{month:'short', year:'2-digit'})}
            </div>
          ))}
        </div>
      </div>
      {rows.map(d => {
        const person = people.find(p => p.id === d.assignee);
        const late = !d.done && fmt.daysUntil(d.due) != null && fmt.daysUntil(d.due) < 0;
        return (
          <div key={d.id} style={{display:'flex', alignItems:'center', height:36, borderBottom:'1px solid var(--line-2)'}}>
            <div style={{width:220, flexShrink:0, display:'flex', alignItems:'center', gap:8, paddingRight:12}}>
              {person && <Avatar person={person} size={18}/>}
              <span style={{fontSize:12.5, overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap', color:d.done?'var(--ink-3)':'var(--ink-1)', textDecoration:d.done?'line-through':'none'}}>{d.title}</span>
            </div>
            <div style={{flex:1, position:'relative', height:'100%', display:'flex', alignItems:'center'}}>
              <div style={{position:'absolute', width:'100%', height:2, background:'var(--panel)', borderRadius:1}}/>
              <div style={{position:'absolute', left:todayPct+'%', top:'10%', bottom:'10%', width:1.5, background:'oklch(0.78 0.28 145 / 0.7)', zIndex:1}}/>
              <div style={{
                position:'absolute', left:d.pct+'%', transform:'translateX(-50%)', zIndex:2,
                width:11, height:11, borderRadius:'50%',
                background: d.done ? 'oklch(0.78 0.28 145)' : late ? 'oklch(0.7 0.2 25)' : 'var(--ink-3)',
                border:'2px solid var(--bg)', boxShadow:'0 0 0 1.5px '+(d.done?'oklch(0.78 0.28 145)':late?'oklch(0.7 0.2 25)':'var(--line)'),
              }} title={d.title+' · '+fmt.date(d.due)}/>
              <span style={{position:'absolute', left:d.pct+'%', transform:'translateX(-50%)', top:'100%', fontSize:10, color:'var(--ink-4)', whiteSpace:'nowrap', marginTop:2}}>
                {fmt.date(d.due)}
              </span>
            </div>
          </div>
        );
      })}
      {rows.length === 0 && <div className="oa-empty big" style={{marginTop:32}}>No deliverables with due dates yet.</div>}
      <div style={{marginTop:32, display:'flex', alignItems:'center', gap:8, fontSize:12, color:'var(--ink-3)'}}>
        <div style={{width:12, height:12, borderRadius:'50%', background:'oklch(0.78 0.28 145)'}}/>Done
        <div style={{width:12, height:12, borderRadius:'50%', background:'oklch(0.7 0.2 25)', marginLeft:12}}/>Overdue
        <div style={{width:1.5, height:16, background:'oklch(0.78 0.28 145 / 0.7)', marginLeft:12}}/>Today
      </div>
    </div>
  );
}

// ── Calendar event popover ───────────────────────────────
function CalendarEventModal({ mode, item, date, people, onUpdate, onDelete, onAdd, onClose }) {
  const [title,       setTitle]       = useState(mode === 'edit' ? (item?.title || '') : '');
  const [newDue,      setNewDue]      = useState(date);
  const [newAssignee, setNewAssignee] = useState(null);
  const [newNotes,    setNewNotes]    = useState('');
  const titleRef = useRef(null);

  useEffect(() => { setTimeout(() => titleRef.current?.focus(), 60); }, []);

  const saveTitle = () => {
    if (mode === 'edit' && title.trim() && title.trim() !== item?.title)
      onUpdate({ title: title.trim() });
  };

  return (
    <Modal open={true} onClose={onClose} width={440}>
      {/* Header */}
      <div className="oa-modal-head">
        <h3 style={{margin:0, fontSize:15}}>
          {mode === 'new' ? 'New Task' : 'Edit Task'}
        </h3>
        <button className="oa-iconbtn" onClick={onClose}><Icons.X size={14}/></button>
      </div>

      {/* Body */}
      <div style={{padding:'16px 20px', display:'flex', flexDirection:'column', gap:12}}>

        {/* Title */}
        <div>
          <label style={{fontSize:11, color:'var(--ink-3)', display:'block', marginBottom:4}}>Title</label>
          <input ref={titleRef}
            className="oa-inline-input"
            value={title}
            onChange={e => setTitle(e.target.value)}
            onBlur={saveTitle}
            onKeyDown={e => { if (e.key === 'Enter') e.target.blur(); if (e.key === 'Escape') onClose(); }}
            placeholder="Task title…"
            style={{fontSize:13, fontWeight:600, width:'100%'}}
          />
        </div>

        {/* Due date + Assignee side by side */}
        <div style={{display:'flex', gap:12, alignItems:'flex-end'}}>
          <div style={{flex:1}}>
            <label style={{fontSize:11, color:'var(--ink-3)', display:'block', marginBottom:4}}>Due date</label>
            <input type="date" className="oa-inline-select"
              value={mode === 'edit' ? (item?.due || date) : newDue}
              onChange={e => mode === 'edit'
                ? onUpdate({ due: e.target.value })
                : setNewDue(e.target.value)}
              style={{width:'100%', fontSize:12, height:36, boxSizing:'border-box'}}
            />
          </div>
          <div style={{flex:1}}>
            <label style={{fontSize:11, color:'var(--ink-3)', display:'block', marginBottom:4}}>Assignee</label>
            <div style={{flex:1}} className="oa-cal-modal-select">
              <SearchSelect
                value={mode === 'edit' ? (item?.assignee || null) : newAssignee}
                onChange={v => mode === 'edit'
                  ? onUpdate({ assignee: v || null })
                  : setNewAssignee(v || null)}
                placeholder="Unassigned"
                options={people.map(p => ({ id: p.id, name: p.name, sub: p.role || p.sport || '', person: p }))}
              />
            </div>
          </div>
        </div>

        {/* Done toggle — edit only */}
        {mode === 'edit' && (
          <div style={{display:'flex', alignItems:'center', gap:10}}>
            <label style={{fontSize:11, color:'var(--ink-3)', width:58, flexShrink:0}}>Status</label>
            <button className={`oa-check${item?.done ? ' done' : ''}`}
              onClick={() => onUpdate({ done: !item?.done })}>
              {item?.done && <Icons.Check size={10} stroke={2.4}/>}
            </button>
            <span style={{fontSize:12, color:'var(--ink-2)'}}>{item?.done ? 'Completed' : 'In progress'}</span>
          </div>
        )}

        {/* Notes */}
        <div>
          <label style={{fontSize:11, color:'var(--ink-3)', display:'block', marginBottom:4}}>Notes</label>
          <textarea
            className="oa-inline-input"
            value={mode === 'edit' ? (item?.notes || '') : newNotes}
            onChange={e => mode === 'edit'
              ? onUpdate({ notes: e.target.value })
              : setNewNotes(e.target.value)}
            placeholder="Add notes…"
            rows={4}
            style={{width:'100%', resize:'vertical', fontSize:12, lineHeight:1.5, fontFamily:'inherit', minHeight:80}}
          />
        </div>
      </div>

      {/* Footer */}
      <div className="oa-modal-foot">
        {mode === 'edit' ? (
          <button onClick={onDelete}
            style={{fontSize:12, color:'oklch(0.6 0.18 25)', background:'transparent', border:'none', cursor:'pointer', padding:'6px 0', marginRight:'auto'}}>
            Delete task
          </button>
        ) : <span/>}
        <Button kind="ghost" onClick={onClose}>Cancel</Button>
        {mode === 'new'
          ? <Button kind="primary" onClick={() => { if (title.trim()) onAdd(title.trim(), newDue, newAssignee, newNotes); }}>Add task</Button>
          : <Button kind="primary" onClick={() => { saveTitle(); onClose(); }}>Save</Button>
        }
      </div>
    </Modal>
  );
}

// ── Calendar view ────────────────────────────────────────
function CampCalendarView({ c, state, setState }) {
  const { TEAM, ATHLETES } = state;
  const people = [...TEAM, ...c.athleteIds.map(id => ATHLETES.find(a => a.id === id)).filter(Boolean)];

  const updateC = patch => setState(s => ({
    ...s, CAMPAIGNS: s.CAMPAIGNS.map(x => x.id === c.id ? { ...x, ...patch } : x),
  }));
  const updateDeliv = (did, patch) => updateC({
    deliverables: c.deliverables.map(d => d.id === did ? { ...d, ...patch } : d),
  });
  const removeDeliv = did => updateC({
    deliverables: c.deliverables.filter(d => d.id !== did),
  });

  const [monthOffset, setMonthOffset] = useState(0);
  const [modal, setModal] = useState(null);
  // modal: { mode:'edit'|'new', itemId:string|null, date:string }

  const today = new Date('2026-04-20T12:00:00');
  const cursor = new Date(today.getFullYear(), today.getMonth() + monthOffset, 1);
  const year = cursor.getFullYear(), month = cursor.getMonth();
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const startDay = new Date(year, month, 1).getDay();

  const byDate = {};
  c.deliverables.forEach(d => {
    if (!d.due) return;
    const [y,m,day] = d.due.split('-').map(Number);
    if (y===year && m-1===month) { byDate[day] = byDate[day]||[]; byDate[day].push(d); }
  });
  const cells = [];
  for (let i=0; i<startDay; i++) cells.push(null);
  for (let d=1; d<=daysInMonth; d++) cells.push(d);
  while (cells.length%7!==0) cells.push(null);

  const openEdit = (e, item) => {
    e.stopPropagation();
    setModal({ mode:'edit', itemId:item.id, date:item.due });
  };

  const openNew = (e, day) => {
    e.stopPropagation();
    const dateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
    setModal({ mode:'new', itemId:null, date:dateStr });
  };

  // Header "Add Task" button — defaults to today if visible, else 1st of shown month
  const openNewFromHeader = () => {
    const isCurrentMonth = today.getFullYear()===year && today.getMonth()===month;
    const defaultDay = isCurrentMonth ? today.getDate() : 1;
    const dateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(defaultDay).padStart(2,'0')}`;
    setModal({ mode:'new', itemId:null, date:dateStr });
  };

  const editItem = modal?.mode === 'edit'
    ? c.deliverables.find(d => d.id === modal.itemId)
    : null;

  return (
    <div className="oa-cal" style={{padding:'20px 24px', flex:1, overflowY:'auto'}}>
      <div className="oa-cal-head">
        <div style={{display:'flex', alignItems:'center', gap:12}}>
          <h3 style={{margin:0}}>{cursor.toLocaleDateString('en-US',{month:'long',year:'numeric'})}</h3>
          <button onClick={() => openNewFromHeader()} className="oa-btn kind-primary"
            style={{display:'flex', alignItems:'center', gap:6, fontSize:12, padding:'6px 14px'}}>
            <Icons.Plus size={12}/> Add Task
          </button>
        </div>
        <div className="oa-cal-nav">
          <button onClick={()=>setMonthOffset(o=>o-1)}>‹</button>
          <button onClick={()=>setMonthOffset(0)}>Today</button>
          <button onClick={()=>setMonthOffset(o=>o+1)}>›</button>
        </div>
      </div>
      <div className="oa-cal-grid">
        {['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(d=><div key={d} className="oa-cal-dow">{d}</div>)}
        {cells.map((day,i)=>{
          const isToday = day===today.getDate() && year===today.getFullYear() && month===today.getMonth();
          const items = day ? (byDate[day]||[]) : [];
          return (
            <div key={i} className={`oa-cal-cell ${!day?'empty':''} ${isToday?'today':''}`}>
              {day && (
                <div style={{display:'flex', alignItems:'center', justifyContent:'space-between', marginBottom:2}}>
                  <div className="oa-cal-num">{day}</div>
                  <button className="oa-cal-cell-add" onClick={e=>openNew(e,day)} title="Add task">
                    <Icons.Plus size={11}/>
                  </button>
                </div>
              )}
              <div className="oa-cal-items">
                {items.slice(0,3).map(it=>(
                  <div key={it.id}
                    className={`oa-cal-item tone-green ${it.done?'done':''}`}
                    onClick={e=>openEdit(e,it)}>
                    {it.done && <Icons.Check size={9} stroke={3}/>} {it.title}
                  </div>
                ))}
                {items.length>3 && (
                  <div className="oa-cal-more" onClick={e=>openNew(e,day)}>
                    +{items.length-3} more
                  </div>
                )}
              </div>
            </div>
          );
        })}
      </div>

      {/* Centered modal */}
      {modal && (
        <CalendarEventModal
          mode={modal.mode}
          item={editItem}
          date={modal.date}
          people={people}
          onUpdate={patch => updateDeliv(modal.itemId, patch)}
          onDelete={() => { removeDeliv(modal.itemId); setModal(null); }}
          onAdd={(title, due, assignee, notes) => {
            const id = 'cal_' + Date.now();
            updateC({ deliverables: [...c.deliverables, {
              id, title, assignee: assignee||null, due,
              notes: notes||'',
              done: false, boardCol:'todo', section:'Deliverables', campaign:c.id,
            }]});
            setModal(null);
          }}
          onClose={() => setModal(null)}
        />
      )}
    </div>
  );
}

// ── Workflow builder (no-playbook mode) ──────────────────
function WorkflowBuilder({ c, state, setState, updateC, peopleOptions }) {
  const { PLAYBOOKS } = state;

  // Custom stages stored on the campaign: [{id, label}]
  const stages = c.customStages || [];
  // Deliverables keyed by stageId
  const stageMap = useMemo(() => {
    const m = new Map();
    (c.deliverables || []).forEach(d => {
      if (d.stageId) { if (!m.has(d.stageId)) m.set(d.stageId, []); m.get(d.stageId).push(d); }
    });
    return m;
  }, [c.deliverables]);

  const setStages = (next) => updateC({ customStages: next });
  const setDelis  = (next) => updateC({ deliverables: next });

  // Stage operations
  const addStage = () => {
    const id = 'cs_' + Date.now();
    setStages([...stages, { id, label: 'New Stage' }]);
    setEditingStageId(id);
  };
  const renameStage = (id, label) => setStages(stages.map(s => s.id===id ? {...s, label} : s));
  const deleteStage = (id) => {
    setStages(stages.filter(s => s.id !== id));
    setDelis((c.deliverables || []).filter(d => d.stageId !== id));
  };

  // Task operations
  const addTask = (stageId, title) => {
    if (!title.trim()) return;
    const newTask = { id:'d_'+Date.now(), title: title.trim(), stageId, done:false, assignee:null, due:null };
    setDelis([...(c.deliverables||[]), newTask]);
  };
  const deleteTask = (taskId) => setDelis((c.deliverables||[]).filter(d => d.id !== taskId));
  const toggleTask = (taskId) => setDelis((c.deliverables||[]).map(d => d.id===taskId?{...d,done:!d.done}:d));
  const renameTask = (taskId, title) => setDelis((c.deliverables||[]).map(d => d.id===taskId?{...d,title}:d));

  const [editingStageId, setEditingStageId] = useState(null);
  const [editingTaskId,  setEditingTaskId]  = useState(null);
  const [newTaskText,    setNewTaskText]    = useState({});  // stageId → string
  const [taskDragId,    setTaskDragId]     = useState(null);
  const [taskDragOver,  setTaskDragOver]   = useState(null);
  const [openDetailId,  setOpenDetailId]   = useState(null);

  const reorderTasks = (draggedId, targetId) => {
    if (draggedId === targetId) return;
    const delis = [...(c.deliverables || [])];
    const fromIdx = delis.findIndex(d => d.id === draggedId);
    const toIdx   = delis.findIndex(d => d.id === targetId);
    if (fromIdx < 0 || toIdx < 0) return;
    const [item] = delis.splice(fromIdx, 1);
    delis.splice(toIdx, 0, item);
    setDelis(delis);
  };

  // Import playbook
  const [showImport, setShowImport] = useState(false);
  const importPlaybook = (pbId) => {
    const pb = PLAYBOOKS.find(p => p.id === pbId);
    if (!pb) return;
    const newDelis = deliFromPlaybook(pb, c.id);
    const newStages = pb.stages.map(s => ({ id: s.id, label: s.label }));
    updateC({ playbookId: pb.id, customStages: newStages, deliverables: newDelis });
    setShowImport(false);
  };

  // Save as playbook
  const [showSaveAs, setShowSaveAs] = useState(false);
  const [saveAsName, setSaveAsName] = useState('');
  const saveAsPlaybook = () => {
    if (!saveAsName.trim()) return;
    const pbStages = stages.map(s => ({
      id: s.id, label: s.label,
      steps: (stageMap.get(s.id)||[]).map(d => ({ id: d.id, title: d.title, roles: d.roles||[] })),
    }));
    const newPb = { id: 'pb_'+Date.now(), name: saveAsName.trim(), stages: pbStages };
    setState(sv => ({ ...sv, PLAYBOOKS: [...sv.PLAYBOOKS, newPb] }));
    updateC({ playbookId: newPb.id });
    setSaveAsName(''); setShowSaveAs(false);
  };

  const totalTasks = (c.deliverables||[]).filter(d => stages.some(s => s.id===d.stageId)).length;
  const doneTasks  = (c.deliverables||[]).filter(d => stages.some(s => s.id===d.stageId) && d.done).length;

  return (
    <div style={{padding:'24px', flex:1, overflowY:'auto', display:'flex', flexDirection:'column', gap:20}}>

      {/* Toolbar */}
      <div style={{display:'flex', alignItems:'center', gap:10, flexWrap:'wrap'}}>
        <span style={{fontSize:12, color:'var(--ink-3)', flex:1}}>
          {stages.length === 0 ? 'No stages yet — add your first stage below' :
            `${stages.length} stage${stages.length!==1?'s':''} · ${doneTasks}/${totalTasks} tasks done`}
        </span>
        {/* Import playbook */}
        <div style={{position:'relative'}}>
          <button className="oa-btn" style={{fontSize:12}} onClick={() => { setShowImport(o=>!o); setShowSaveAs(false); }}>
            Import playbook
          </button>
          {showImport && (
            <div style={{position:'absolute', top:'calc(100% + 6px)', right:0, zIndex:30, background:'var(--panel)', border:'1px solid var(--line)', borderRadius:10, boxShadow:'var(--shadow-pop)', padding:8, minWidth:220}}>
              <div style={{fontSize:11, fontWeight:600, color:'var(--ink-3)', textTransform:'uppercase', letterSpacing:'0.06em', padding:'4px 8px 8px'}}>Choose playbook</div>
              {PLAYBOOKS.length === 0 && <div style={{fontSize:12, color:'var(--ink-3)', padding:'8px 10px'}}>No playbooks saved yet.</div>}
              {PLAYBOOKS.map(p => (
                <button key={p.id} onClick={() => importPlaybook(p.id)}
                  style={{display:'block', width:'100%', textAlign:'left', padding:'8px 10px', borderRadius:7, background:'transparent', border:'none', cursor:'pointer', fontSize:13, color:'var(--ink)'}}>
                  {p.name}
                  <span style={{fontSize:11, color:'var(--ink-3)', display:'block'}}>{p.stages.length} stages · {p.stages.reduce((n,s)=>n+s.steps.length,0)} steps</span>
                </button>
              ))}
            </div>
          )}
        </div>
        {/* Save as playbook */}
        {stages.length > 0 && (
          <div style={{position:'relative'}}>
            <button className="oa-btn kind-primary" style={{fontSize:12}} onClick={() => { setShowSaveAs(o=>!o); setShowImport(false); setSaveAsName(''); }}>
              Save as playbook
            </button>
            {showSaveAs && (
              <div style={{position:'absolute', top:'calc(100% + 6px)', right:0, zIndex:30, background:'var(--panel)', border:'1px solid var(--line)', borderRadius:10, boxShadow:'var(--shadow-pop)', padding:12, minWidth:260}}>
                <div style={{fontSize:12, color:'var(--ink-2)', marginBottom:8}}>Save this workflow as a reusable playbook</div>
                <input autoFocus value={saveAsName} onChange={e => setSaveAsName(e.target.value)}
                  onKeyDown={e => { if (e.key==='Enter') saveAsPlaybook(); if (e.key==='Escape') setShowSaveAs(false); }}
                  placeholder="Playbook name…"
                  style={{width:'100%', padding:'7px 10px', borderRadius:7, border:'1px solid var(--line)', background:'var(--panel-2)', color:'var(--ink)', fontSize:13, outline:'none', boxSizing:'border-box', marginBottom:8}}/>
                <div style={{display:'flex', gap:6}}>
                  <button className="oa-btn kind-primary" style={{flex:1, fontSize:12}} onClick={saveAsPlaybook}>Save</button>
                  <button className="oa-btn" style={{fontSize:12}} onClick={() => setShowSaveAs(false)}>Cancel</button>
                </div>
              </div>
            )}
          </div>
        )}
      </div>

      {/* Stages */}
      <div style={{display:'flex', flexDirection:'column', gap:12}}>
        {stages.map((stage, si) => {
          const tasks = stageMap.get(stage.id) || [];
          const done  = tasks.filter(t => t.done).length;
          return (
            <div key={stage.id} style={{background:'var(--panel-2)', border:'1px solid var(--line)', borderRadius:12, overflow:'hidden'}}>
              {/* Stage header */}
              <div style={{display:'flex', alignItems:'center', gap:10, padding:'12px 16px', borderBottom: tasks.length > 0 || newTaskText[stage.id] !== undefined ? '1px solid var(--line)' : 'none'}}>
                <span style={{fontSize:11, fontFamily:'var(--mono)', color:'var(--ink-3)', fontWeight:600, minWidth:18}}>{si+1}</span>
                {editingStageId === stage.id ? (
                  <input autoFocus value={stage.label}
                    onChange={e => renameStage(stage.id, e.target.value)}
                    onBlur={() => setEditingStageId(null)}
                    onKeyDown={e => { if (e.key==='Enter'||e.key==='Escape') setEditingStageId(null); }}
                    style={{flex:1, background:'transparent', border:'none', outline:'none', fontSize:14, fontWeight:600, color:'var(--ink)'}}/>
                ) : (
                  <span style={{flex:1, fontSize:14, fontWeight:600, cursor:'text'}} onDoubleClick={() => setEditingStageId(stage.id)}>
                    {stage.label}
                  </span>
                )}
                <span style={{fontSize:12, color:'var(--ink-3)', fontFamily:'var(--mono)'}}>{done}/{tasks.length}</span>
                <button className="oa-iconbtn sm" title="Rename stage" onClick={() => setEditingStageId(stage.id)}><Icons.Pencil size={11}/></button>
                <button className="oa-iconbtn sm" title="Delete stage" style={{color:'oklch(0.65 0.20 25)'}} onClick={() => deleteStage(stage.id)}><Icons.X size={11}/></button>
              </div>

              {/* Tasks */}
              <div style={{display:'flex', flexDirection:'column'}}>
                {tasks.map(task => {
                  const isDragging   = taskDragId   === task.id;
                  const isDropTarget = taskDragOver === task.id && taskDragId !== task.id;
                  return (
                    <div key={task.id}
                      draggable
                      onDragStart={e => { setTaskDragId(task.id); e.dataTransfer.effectAllowed='move'; }}
                      onDragOver={e => { e.preventDefault(); setTaskDragOver(task.id); }}
                      onDragLeave={() => setTaskDragOver(null)}
                      onDrop={e => { e.preventDefault(); reorderTasks(taskDragId, task.id); setTaskDragId(null); setTaskDragOver(null); }}
                      onDragEnd={() => { setTaskDragId(null); setTaskDragOver(null); }}
                      style={{display:'flex', alignItems:'center', gap:8, padding:'8px 12px', borderBottom:'1px solid var(--line-2)',
                        opacity: isDragging ? 0.35 : 1,
                        borderTop: isDropTarget ? '2px solid oklch(0.72 0.24 145)' : '2px solid transparent',
                        cursor:'grab', transition:'opacity 0.1s'}}
                      onMouseEnter={e => { if (!taskDragId) e.currentTarget.style.background='var(--panel-3)'; }}
                      onMouseLeave={e => e.currentTarget.style.background='transparent'}>
                      {/* Drag handle */}
                      <span style={{color:'var(--ink-4)', cursor:'grab', display:'grid', placeItems:'center', flexShrink:0}}>
                        <Icons.Grip size={11}/>
                      </span>
                      {/* Checkbox */}
                      <div onClick={() => toggleTask(task.id)} style={{
                        width:15, height:15, borderRadius:4, flexShrink:0, cursor:'pointer',
                        border: task.done ? 'none' : '1.5px solid var(--line)',
                        background: task.done ? 'oklch(0.72 0.24 145)' : 'transparent',
                        display:'grid', placeItems:'center',
                      }}>
                        {task.done && <Icons.Check size={9} stroke={3} style={{color:'#0a1408'}}/>}
                      </div>
                      {/* Title */}
                      {editingTaskId === task.id ? (
                        <input autoFocus value={task.title}
                          onChange={e => renameTask(task.id, e.target.value)}
                          onBlur={() => setEditingTaskId(null)}
                          onKeyDown={e => { if (e.key==='Enter'||e.key==='Escape') setEditingTaskId(null); }}
                          onClick={e => e.stopPropagation()}
                          style={{flex:1, background:'transparent', border:'none', outline:'none', fontSize:13, color:'var(--ink)'}}/>
                      ) : (
                        <span
                          style={{flex:1, fontSize:13, color: task.done?'var(--ink-4)':'var(--ink)', textDecoration: task.done?'line-through':'none', cursor:'pointer'}}
                          onClick={() => setOpenDetailId(task.id)}
                          onDoubleClick={e => { e.stopPropagation(); setEditingTaskId(task.id); }}
                          title="Click to open · Double-click to rename">
                          {task.title}
                        </span>
                      )}
                      <button className="oa-iconbtn sm" style={{opacity:0.4, flexShrink:0}}
                        onClick={e => { e.stopPropagation(); deleteTask(task.id); }}>
                        <Icons.X size={10}/>
                      </button>
                    </div>
                  );
                })}

                {/* Add task row */}
                <div style={{padding:'6px 16px 10px'}}>
                  {newTaskText[stage.id] !== undefined ? (
                    <div style={{display:'flex', gap:8, alignItems:'center'}}>
                      <input autoFocus
                        value={newTaskText[stage.id]}
                        onChange={e => setNewTaskText(t => ({...t, [stage.id]: e.target.value}))}
                        onKeyDown={e => {
                          if (e.key==='Enter') { addTask(stage.id, newTaskText[stage.id]); setNewTaskText(t => ({...t, [stage.id]: ''})); }
                          if (e.key==='Escape') setNewTaskText(t => { const n={...t}; delete n[stage.id]; return n; });
                        }}
                        onBlur={() => { if (newTaskText[stage.id]?.trim()) addTask(stage.id, newTaskText[stage.id]); setNewTaskText(t => { const n={...t}; delete n[stage.id]; return n; }); }}
                        placeholder="Task name…"
                        style={{flex:1, background:'transparent', border:'none', borderBottom:'1px solid var(--line)', outline:'none', fontSize:13, color:'var(--ink)', padding:'4px 0'}}/>
                      <span style={{fontSize:11, color:'var(--ink-3)'}}>↵ to add</span>
                    </div>
                  ) : (
                    <button style={{background:'none', border:'none', cursor:'pointer', fontSize:12, color:'var(--ink-3)', display:'flex', alignItems:'center', gap:5, padding:'2px 0'}}
                      onClick={() => setNewTaskText(t => ({...t, [stage.id]: ''}))}>
                      <Icons.Plus size={11}/> Add task
                    </button>
                  )}
                </div>
              </div>
            </div>
          );
        })}

        {/* Add stage button */}
        <button onClick={addStage}
          style={{display:'flex', alignItems:'center', justifyContent:'center', gap:8, padding:'14px', borderRadius:12, border:'1.5px dashed var(--line-2)', background:'transparent', cursor:'pointer', fontSize:13, color:'var(--ink-3)', transition:'all 0.15s'}}
          onMouseEnter={e => { e.currentTarget.style.borderColor='var(--accent)'; e.currentTarget.style.color='var(--accent-ink)'; e.currentTarget.style.background='oklch(0.72 0.24 145 / 0.05)'; }}
          onMouseLeave={e => { e.currentTarget.style.borderColor='var(--line-2)'; e.currentTarget.style.color='var(--ink-3)'; e.currentTarget.style.background='transparent'; }}>
          <Icons.Plus size={14}/> Add stage
        </button>
      </div>

      {/* Task detail drawer */}
      <Drawer open={!!openDetailId} onClose={() => setOpenDetailId(null)} width={560}>
        {openDetailId && (
          <TaskDetail
            taskId={openDetailId}
            campaignId={c.id}
            state={state}
            setState={setState}
            onClose={() => setOpenDetailId(null)}
          />
        )}
      </Drawer>
    </div>
  );
}

// ── Workflow view ────────────────────────────────────────
function CampWorkflowView({ c, state, setState }) {
  const updateC = patch => setState(s => ({...s, CAMPAIGNS: s.CAMPAIGNS.map(x => x.id===c.id?{...x,...patch}:x)}));
  const { PLAYBOOKS, TEAM, ATHLETES } = state;
  const athletes = c.athleteIds.map(id => ATHLETES.find(a => a.id === id)).filter(Boolean);
  const peopleOptions = [...TEAM, ...athletes];

  const pb = PLAYBOOKS.find(p => p.id === c.playbookId);

  // ── Builder mode (no playbook) ──────────────────────────
  if (!pb) {
    return <WorkflowBuilder c={c} state={state} setState={setState} updateC={updateC} peopleOptions={peopleOptions} />;
  }

  // Find the playbook for this campaign (fall back to default)
  // (pb already found above)

  // Effective stages = per-campaign overrides if set, otherwise the playbook's stages
  const effectiveStages = c.customStages || pb.stages;

  // ── Playbook mode: Import / Save as playbook toolbar ────
  const [showImportPicker, setShowImportPicker] = useState(false);
  const [saveAsName, setSaveAsName] = useState('');
  const [showSaveAs, setShowSaveAs] = useState(false);

  const importPlaybook = (pbId) => {
    const target = PLAYBOOKS.find(p => p.id === pbId);
    if (!target) return;
    const newDelis = deliFromPlaybook(target, c.id);
    updateC({ playbookId: target.id, deliverables: newDelis });
    setShowImportPicker(false);
  };

  const saveAsPlaybook = () => {
    if (!saveAsName.trim()) return;
    const stages = pb.stages.map(stage => {
      const steps = (c.deliverables || []).filter(d => d.stageId === stage.id);
      return { ...stage, steps: steps.map(d => ({ id: d.playbookStepId || d.id, title: d.title, roles: d.roles || [] })) };
    });
    const newPb = { id: 'pb_' + Date.now(), name: saveAsName.trim(), stages };
    setState(s => ({ ...s, PLAYBOOKS: [...s.PLAYBOOKS, newPb] }));
    setSaveAsName(''); setShowSaveAs(false);
  };

  // Build a map of stageId → deliverables[]
  const stageMap = useMemo(() => {
    const m = new Map();
    c.deliverables.forEach(d => {
      if (d.stageId) {
        if (!m.has(d.stageId)) m.set(d.stageId, []);
        m.get(d.stageId).push(d);
      }
    });
    return m;
  }, [c.deliverables]);

  // The "active" stage = first stage that still has incomplete steps
  const activeStageId = useMemo(() => {
    const first = effectiveStages.find(s => {
      const steps = stageMap.get(s.id) || [];
      return steps.length > 0 && steps.some(d => !d.done);
    });
    return first?.id || effectiveStages[effectiveStages.length - 1]?.id;
  }, [effectiveStages, stageMap]);

  const [selectedStageId, _setSelectedStageId] = useState(null);
  const setSelectedStageId = (id) => { _setSelectedStageId(id); setShowAddTask && setShowAddTask(false); };
  const effectiveSelected = selectedStageId || activeStageId;

  const selectedStage = effectiveStages.find(s => s.id === effectiveSelected);
  const selectedSteps = stageMap.get(effectiveSelected) || [];

  // Drag-to-reorder state for the task list
  const [taskDragId,   setTaskDragId]   = useState(null);
  const [taskDragOver, setTaskDragOver] = useState(null);

  const deleteTask = (taskId) => updateC({ deliverables: c.deliverables.filter(d => d.id !== taskId) });

  const reorderTasks = (draggedId, targetId) => {
    if (draggedId === targetId) return;
    const delis = [...c.deliverables];
    const fromIdx = delis.findIndex(d => d.id === draggedId);
    const toIdx   = delis.findIndex(d => d.id === targetId);
    if (fromIdx < 0 || toIdx < 0) return;
    const [item] = delis.splice(fromIdx, 1);
    delis.splice(toIdx, 0, item);
    updateC({ deliverables: delis });
  };

  // ── Stage editing state + helpers ───────────────────────
  const [stageDragId,       setStageDragId]       = useState(null);
  const [stageDragOver,     setStageDragOver]     = useState(null);
  const [editingStageId,    setEditingStageId]    = useState(null);
  const [editingStageLabel, setEditingStageLabel] = useState('');

  const [newTaskTitle,    setNewTaskTitle]    = useState('');
  const [showAddTask,     setShowAddTask]     = useState(false);
  const [editingTaskId,   setEditingTaskId]   = useState(null);
  const [editingTaskTitle,setEditingTaskTitle]= useState('');
  const [openDetailId,    setOpenDetailId]    = useState(null);
  const [addingApprovalFor, setAddingApprovalFor] = useState(null);

  const addTaskToStage = (stageId) => {
    const title = newTaskTitle.trim();
    if (!title || !stageId) return;
    updateC({ deliverables: [...c.deliverables, {id: 'd_' + Date.now(), title, stageId, done: false}] });
    setNewTaskTitle('');
    setShowAddTask(false);
  };

  const renameTask = (taskId, title) => {
    const trimmed = title.trim();
    if (!trimmed) return;
    updateC({ deliverables: c.deliverables.map(d => d.id === taskId ? {...d, title: trimmed} : d) });
    setEditingTaskId(null);
  };

  const getEffStages = () => c.customStages || pb.stages.map(s => ({...s}));

  const addStage = () => {
    const next = [...getEffStages(), {id: 'cs_' + Date.now(), label: 'New Stage'}];
    updateC({ customStages: next });
  };
  const renameStage = (id, label) => {
    const trimmed = label.trim();
    if (!trimmed) return;
    const next = getEffStages().map(s => s.id === id ? {...s, label: trimmed} : s);
    updateC({ customStages: next });
    setEditingStageId(null);
  };
  const deleteStage = (id) => {
    const next = getEffStages().filter(s => s.id !== id);
    updateC({ customStages: next, deliverables: c.deliverables.filter(d => d.stageId !== id) });
    if (selectedStageId === id) setSelectedStageId(null);
  };
  const reorderStages = (draggedId, targetId) => {
    if (draggedId === targetId) return;
    const arr = [...getEffStages()];
    const fromIdx = arr.findIndex(s => s.id === draggedId);
    const toIdx   = arr.findIndex(s => s.id === targetId);
    if (fromIdx < 0 || toIdx < 0) return;
    const [item] = arr.splice(fromIdx, 1);
    arr.splice(toIdx, 0, item);
    updateC({ customStages: arr });
  };

  const toggleStep = (did) => updateC({
    deliverables: c.deliverables.map(d => d.id === did ? {...d, done: !d.done} : d),
  });

  const overallDone = c.deliverables.filter(d => d.done).length;
  const overallTotal = c.deliverables.length;
  const overallPct = overallTotal ? Math.round(overallDone / overallTotal * 100) : 0;

  return (
    <div style={{padding:'24px', flex:1, overflowY:'auto', display:'flex', flexDirection:'column', gap:24}}>

      {/* ── Playbook toolbar ── */}
      <div style={{display:'flex', alignItems:'center', gap:10, flexWrap:'wrap'}}>
        <span style={{fontSize:12, color:'var(--ink-3)', flex:1}}>
          Playbook: <strong style={{color:'var(--ink-2)'}}>{pb.name}</strong>
        </span>
        <div style={{position:'relative'}}>
          <button className="oa-btn" style={{fontSize:12}} onClick={() => { setShowImportPicker(o=>!o); setShowSaveAs(false); }}>
            Import playbook
          </button>
          {showImportPicker && (
            <div style={{position:'absolute', top:'calc(100% + 6px)', right:0, zIndex:30, background:'var(--panel)', border:'1px solid var(--line)', borderRadius:10, boxShadow:'var(--shadow-pop)', padding:8, minWidth:220}}>
              <div style={{fontSize:11, fontWeight:600, color:'var(--ink-3)', textTransform:'uppercase', letterSpacing:'0.06em', padding:'4px 8px 8px'}}>Choose playbook</div>
              {PLAYBOOKS.map(p => (
                <button key={p.id} onClick={() => importPlaybook(p.id)}
                  style={{display:'block', width:'100%', textAlign:'left', padding:'8px 10px', borderRadius:7, background: p.id===c.playbookId?'var(--accent-wash)':'transparent', border:'none', cursor:'pointer', fontSize:13, color: p.id===c.playbookId?'var(--accent-ink)':'var(--ink)'}}>
                  {p.name}
                  {p.id === c.playbookId && <span style={{fontSize:11, color:'var(--accent-ink)', marginLeft:6}}>current</span>}
                </button>
              ))}
            </div>
          )}
        </div>
        <div style={{position:'relative'}}>
          <button className="oa-btn kind-primary" style={{fontSize:12}} onClick={() => { setShowSaveAs(o=>!o); setShowImportPicker(false); setSaveAsName(pb.name + ' (copy)'); }}>
            Save as playbook
          </button>
          {showSaveAs && (
            <div style={{position:'absolute', top:'calc(100% + 6px)', right:0, zIndex:30, background:'var(--panel)', border:'1px solid var(--line)', borderRadius:10, boxShadow:'var(--shadow-pop)', padding:12, minWidth:260}}>
              <div style={{fontSize:12, color:'var(--ink-2)', marginBottom:8}}>Save current workflow as a new playbook</div>
              <input autoFocus value={saveAsName} onChange={e => setSaveAsName(e.target.value)}
                onKeyDown={e => { if (e.key==='Enter') saveAsPlaybook(); if (e.key==='Escape') setShowSaveAs(false); }}
                placeholder="Playbook name…"
                style={{width:'100%', padding:'7px 10px', borderRadius:7, border:'1px solid var(--line)', background:'var(--panel-2)', color:'var(--ink)', fontSize:13, outline:'none', boxSizing:'border-box', marginBottom:8}}/>
              <div style={{display:'flex', gap:6}}>
                <button className="oa-btn kind-primary" style={{flex:1, fontSize:12}} onClick={saveAsPlaybook}>Save</button>
                <button className="oa-btn" style={{fontSize:12}} onClick={() => setShowSaveAs(false)}>Cancel</button>
              </div>
            </div>
          )}
        </div>
      </div>

      {/* ── Stage pipeline ── */}
      <div>
        <div style={{fontSize:11, fontWeight:700, textTransform:'uppercase', letterSpacing:'0.08em', color:'var(--ink-3)', marginBottom:14}}>Campaign Stages</div>
        <div style={{display:'flex', alignItems:'center', flexWrap:'wrap', gap:0}}>
          {effectiveStages.map((stage, i) => {
            const steps = stageMap.get(stage.id) || [];
            const stageDone = steps.filter(d => d.done).length;
            const stageComplete = steps.length > 0 && stageDone === steps.length;
            const isActive = stage.id === activeStageId;
            const isSelected = stage.id === effectiveSelected;
            const isDraggingStage  = stageDragId   === stage.id;
            const isDropTargetStage = stageDragOver === stage.id && stageDragId !== stage.id;
            const isEditing = editingStageId === stage.id;
            return (
              <React.Fragment key={stage.id}>
                <div
                  draggable
                  onDragStart={e => { setStageDragId(stage.id); e.dataTransfer.effectAllowed='move'; }}
                  onDragOver={e => { e.preventDefault(); setStageDragOver(stage.id); }}
                  onDragLeave={() => setStageDragOver(null)}
                  onDrop={e => { e.preventDefault(); reorderStages(stageDragId, stage.id); setStageDragId(null); setStageDragOver(null); }}
                  onDragEnd={() => { setStageDragId(null); setStageDragOver(null); }}
                  style={{
                    display:'flex', alignItems:'center', position:'relative',
                    opacity: isDraggingStage ? 0.35 : 1,
                    borderLeft: isDropTargetStage ? '2px solid oklch(0.72 0.24 145)' : '2px solid transparent',
                  }}
                >
                  {/* Drag handle */}
                  <span style={{color:'var(--ink-4)', cursor:'grab', padding:'0 3px', display:'grid', placeItems:'center', flexShrink:0}}>
                    <Icons.Grip size={11}/>
                  </span>

                  {/* Stage button / inline rename input */}
                  {isEditing ? (
                    <input
                      autoFocus
                      value={editingStageLabel}
                      onChange={e => setEditingStageLabel(e.target.value)}
                      onBlur={() => renameStage(stage.id, editingStageLabel || stage.label)}
                      onKeyDown={e => {
                        if (e.key==='Enter') renameStage(stage.id, editingStageLabel || stage.label);
                        if (e.key==='Escape') setEditingStageId(null);
                      }}
                      style={{
                        padding:'6px 10px', borderRadius:7, border:'1.5px solid oklch(0.72 0.24 145)',
                        background:'var(--panel-2)', color:'var(--ink)', fontSize:13, outline:'none',
                        fontWeight:600, minWidth:80, width: Math.max(80, editingStageLabel.length * 8 + 24) + 'px',
                      }}
                    />
                  ) : (
                    <button
                      onClick={() => setSelectedStageId(stage.id === selectedStageId ? null : stage.id)}
                      onDoubleClick={() => { setEditingStageId(stage.id); setEditingStageLabel(stage.label); }}
                      title="Click to select · Double-click to rename"
                      style={{
                        padding:'8px 12px', borderRadius:8, cursor:'pointer', fontSize:13,
                        border: isSelected ? '1.5px solid oklch(0.72 0.24 145)' : '1px solid var(--line)',
                        background: isSelected ? 'oklch(0.72 0.24 145 / 0.12)' : 'transparent',
                        color: isSelected ? 'var(--accent-ink)' : stageComplete ? 'var(--ink-4)' : isActive ? 'var(--ink-1)' : 'var(--ink-3)',
                        fontWeight: isSelected || isActive ? 600 : 400,
                        position: 'relative',
                      }}
                    >
                      {stageComplete && (
                        <span style={{position:'absolute', top:-5, right:-5, width:14, height:14, borderRadius:'50%', background:'oklch(0.72 0.24 145)', display:'grid', placeItems:'center'}}>
                          <Icons.Check size={8} stroke={3} style={{color:'#0a1408'}}/>
                        </span>
                      )}
                      <span style={{display:'flex', alignItems:'center', gap:6}}>
                        <span style={{fontSize:11, fontFamily:'var(--mono)', fontWeight:600, color: isSelected ? 'var(--accent-ink)' : 'var(--ink-3)'}}>{i+1}</span>
                        {stage.label}
                      </span>
                    </button>
                  )}

                  {/* Delete stage */}
                  <button className="oa-iconbtn sm" title="Delete stage"
                    style={{color:'var(--ink-4)', opacity:0.45, marginLeft:2, flexShrink:0}}
                    onClick={e => { e.stopPropagation(); deleteStage(stage.id); }}>
                    <Icons.X size={10}/>
                  </button>
                </div>
                {i < effectiveStages.length - 1 && (
                  <div style={{flex:'0 0 14px', height:1, background: stageComplete ? 'oklch(0.72 0.24 145 / 0.5)' : 'var(--line)', flexShrink:0}}/>
                )}
              </React.Fragment>
            );
          })}
          {/* Add stage */}
          <button className="oa-btn" style={{marginLeft: effectiveStages.length ? 10 : 0, fontSize:12, padding:'6px 10px', display:'flex', alignItems:'center', gap:5}}
            onClick={addStage}>
            <Icons.Plus size={11}/> Add stage
          </button>
        </div>

        {/* Overall progress bar */}
        <div style={{marginTop:16, display:'flex', alignItems:'center', gap:12}}>
          <div style={{flex:1, height:5, borderRadius:99, background:'var(--panel-2)', overflow:'hidden'}}>
            <div style={{height:'100%', width:overallPct+'%', background:'oklch(0.72 0.24 145)', borderRadius:99, transition:'width 0.3s'}}/>
          </div>
          <span style={{fontSize:11.5, color:'var(--ink-3)', fontFamily:'var(--mono)', flexShrink:0}}>{overallDone}/{overallTotal} steps · {overallPct}%</span>
        </div>
      </div>

      {/* ── Two-column panels ── */}
      <div style={{display:'grid', gridTemplateColumns:'1fr 1fr', gap:20, flex:1}}>

        {/* Left: selected stage checklist */}
        <div className="oa-panel" style={{padding:'16px 18px', display:'flex', flexDirection:'column', gap:0, position:'relative', zIndex:2}}>
          {/* Header */}
          <div style={{display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:12}}>
            <div style={{fontWeight:600, fontSize:13, color:'var(--ink)'}}>{selectedStage?.label || 'Select a stage'}</div>
            {selectedSteps.length > 0 && (
              <span style={{fontSize:11, color:'var(--ink-3)', fontFamily:'var(--mono)', fontWeight:600, background:'var(--panel-2)', borderRadius:6, padding:'2px 7px'}}>
                {selectedSteps.filter(d=>d.done).length}/{selectedSteps.length}
              </span>
            )}
          </div>

          {/* Task list */}
          <div style={{display:'flex', flexDirection:'column', gap:1}}>
            {selectedSteps.length === 0 && !showAddTask && (
              <div style={{fontSize:12, color:'var(--ink-4)', textAlign:'center', padding:'16px 0'}}>No tasks yet</div>
            )}
            {selectedSteps.map(d => {
              const isDragging   = taskDragId   === d.id;
              const isDropTarget = taskDragOver === d.id && taskDragId !== d.id;
              const isEditing    = editingTaskId === d.id;
              return (
                <div key={d.id}
                  draggable={!isEditing}
                  onDragStart={e => { setTaskDragId(d.id); e.dataTransfer.effectAllowed = 'move'; }}
                  onDragOver={e => { e.preventDefault(); setTaskDragOver(d.id); }}
                  onDragLeave={() => setTaskDragOver(null)}
                  onDrop={e => { e.preventDefault(); reorderTasks(taskDragId, d.id); setTaskDragId(null); setTaskDragOver(null); }}
                  onDragEnd={() => { setTaskDragId(null); setTaskDragOver(null); }}
                  className="oa-workflow-task-row"
                  style={{
                    display:'flex', alignItems:'center', gap:7, padding:'6px 6px',
                    borderRadius:8, transition:'background 0.1s, opacity 0.1s',
                    opacity: isDragging ? 0.3 : 1,
                    borderTop: isDropTarget ? '2px solid oklch(0.72 0.24 145)' : '2px solid transparent',
                  }}
                >
                  {/* Drag handle */}
                  <span className="oa-wf-grip" style={{color:'var(--ink-4)', cursor:'grab', flexShrink:0, display:'grid', placeItems:'center', opacity:0.4}}>
                    <Icons.Grip size={11}/>
                  </span>

                  {/* Checkbox */}
                  <div onClick={() => toggleStep(d.id)} style={{
                    width:16, height:16, borderRadius:4, flexShrink:0, cursor:'pointer',
                    border: d.done ? 'none' : '1.5px solid var(--line)',
                    background: d.done ? 'var(--accent)' : 'transparent',
                    display:'grid', placeItems:'center', transition:'background 0.1s',
                  }}>
                    {d.done && <Icons.Check size={9} stroke={3} style={{color:'#fff'}}/>}
                  </div>

                  {/* Title — click to open detail, double-click to rename inline */}
                  <div style={{flex:1, minWidth:0}}>
                    {isEditing ? (
                      <input
                        autoFocus
                        value={editingTaskTitle}
                        onChange={e => setEditingTaskTitle(e.target.value)}
                        onBlur={() => renameTask(d.id, editingTaskTitle || d.title)}
                        onKeyDown={e => {
                          if (e.key === 'Enter') renameTask(d.id, editingTaskTitle || d.title);
                          if (e.key === 'Escape') setEditingTaskId(null);
                        }}
                        onClick={e => e.stopPropagation()}
                        style={{width:'100%', background:'transparent', border:'none', borderBottom:'1px solid var(--accent)', outline:'none', fontSize:13, color:'var(--ink)', padding:'1px 0'}}
                      />
                    ) : (
                      <div
                        onClick={() => setOpenDetailId(d.id)}
                        onDoubleClick={e => { e.stopPropagation(); setEditingTaskId(d.id); setEditingTaskTitle(d.title); }}
                        title="Click to open · Double-click to rename"
                        style={{fontSize:13, color: d.done ? 'var(--ink-4)' : 'var(--ink)', textDecoration: d.done ? 'line-through' : 'none', lineHeight:1.4, cursor:'pointer', userSelect:'none'}}
                      >
                        {d.title}
                      </div>
                    )}
                    {!isEditing && d.roles && d.roles.length > 0 && (
                      <div style={{display:'flex', gap:3, marginTop:2, flexWrap:'wrap'}}>
                        {d.roles.map(r => (
                          <span key={r} style={{fontSize:10, fontWeight:600, color:'var(--ink-3)', background:'var(--panel-2)', border:'1px solid var(--line)', borderRadius:4, padding:'1px 5px', letterSpacing:'0.02em'}}>
                            {r}
                          </span>
                        ))}
                      </div>
                    )}
                  </div>

                  {/* Priority chip */}
                  {(() => {
                    const PRIO_CYCLE = { high: 'med', med: 'low', low: null };
                    const prio = d.priority;
                    return (
                      <span
                        className={prio ? `oa-prio prio-${prio}` : undefined}
                        onClick={e => {
                          e.stopPropagation();
                          const next = prio ? PRIO_CYCLE[prio] : 'high';
                          updateC({ deliverables: c.deliverables.map(x => x.id === d.id ? {...x, priority: next} : x) });
                        }}
                        title="Click to change priority"
                        style={{flexShrink:0, cursor:'pointer', userSelect:'none',
                          ...(prio ? {} : {fontSize:10, color:'var(--ink-4)', padding:'1px 4px'})}}
                      >
                        {prio || '—'}
                      </span>
                    );
                  })()}

                  {/* Assignee */}
                  <div onClick={e => e.stopPropagation()} style={{flexShrink:0}}>
                    <SelectPill
                      value={d.assignee || ''}
                      onChange={v => updateC({ deliverables: c.deliverables.map(x => x.id === d.id ? {...x, assignee: v || null} : x) })}
                      options={toPeopleOpts(peopleOptions)}
                      searchable
                      render={o => {
                        if (!o.value) return (
                          <span style={{width:20, height:20, borderRadius:'50%', border:'1.5px dashed var(--line)', display:'grid', placeItems:'center', flexShrink:0}}>
                            <Icons.Plus size={8} style={{color:'var(--ink-4)'}}/>
                          </span>
                        );
                        const p = peopleOptions.find(x => x.id === o.value);
                        return <Avatar person={p} size={20}/>;
                      }}
                    />
                  </div>

                  {/* Due date */}
                  <div onClick={e => e.stopPropagation()} style={{flexShrink:0}}>
                    <input type="date" className="oa-date-inline" value={d.due || ''}
                      onChange={e => updateC({ deliverables: c.deliverables.map(x =>
                        x.id === d.id ? {...x, due: e.target.value || null} : x) })}
                      style={{background:'none', border:'none', outline:'none',
                        fontSize:11.5, fontFamily:'inherit', padding:'2px 4px', borderRadius:4,
                        color: d.due && fmt.daysUntil(d.due) < 0 && !d.done ? 'oklch(0.55 0.2 25)' : 'var(--ink-3)',
                        width: d.due ? 'auto' : 90}}
                      placeholder="Due date"/>
                  </div>

                  {/* Approval */}
                  <div onClick={e => e.stopPropagation()} style={{flexShrink:0, display:'flex', alignItems:'center', gap:3, position:'relative'}}>
                    {(d.approvals || []).map(a => {
                      const ap = peopleOptions.find(p => p.id === a.userId);
                      if (!ap) return null;
                      const dotColor = a.status === 'approved' ? 'oklch(0.52 0.18 145)'
                        : a.status === 'rejected' ? 'oklch(0.55 0.22 25)' : 'oklch(0.62 0.14 75)';
                      return (
                        <div key={a.userId} title={ap.name + ' · ' + a.status}
                          style={{position:'relative', cursor:'pointer', flexShrink:0}}
                          onClick={() => updateC({ deliverables: c.deliverables.map(x =>
                            x.id === d.id ? {...x, approvals: (d.approvals||[]).filter(z => z.userId !== a.userId)} : x) })}>
                          <Avatar person={ap} size={18}/>
                          <span style={{position:'absolute', bottom:-1, right:-1, width:6, height:6,
                            borderRadius:'50%', background:dotColor, border:'1.5px solid var(--panel)'}}/>
                        </div>
                      );
                    })}
                    <div style={{position:'relative'}}>
                      <button
                        onClick={() => setAddingApprovalFor(addingApprovalFor === d.id ? null : d.id)}
                        title="Request approval"
                        style={{width:20, height:20, borderRadius:'50%', cursor:'pointer', display:'flex',
                          alignItems:'center', justifyContent:'center',
                          border:'1.5px dashed var(--ink-4)', background:'none',
                          color:'var(--ink-4)', transition:'border-color 0.1s, color 0.1s'}}
                        onMouseEnter={e => { e.currentTarget.style.borderColor='var(--accent)'; e.currentTarget.style.color='var(--accent)'; }}
                        onMouseLeave={e => { e.currentTarget.style.borderColor='var(--ink-4)'; e.currentTarget.style.color='var(--ink-4)'; }}>
                        <svg width="9" height="9" viewBox="0 0 24 24" fill="none"
                          stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
                          <path d="M12 20h9M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4Z"/>
                        </svg>
                      </button>
                      {addingApprovalFor === d.id && (
                        <>
                          <div style={{position:'fixed', inset:0, zIndex:90}}
                            onClick={() => setAddingApprovalFor(null)}/>
                          <div style={{position:'absolute', bottom:'calc(100% + 6px)', right:0, zIndex:91,
                            background:'var(--panel)', border:'1px solid var(--line)', borderRadius:10,
                            boxShadow:'0 4px 20px -4px oklch(0.15 0.10 265 / 0.18)',
                            minWidth:190, padding:'6px 0', backdropFilter:'var(--blur)'}}>
                            <div style={{fontSize:10, fontWeight:700, letterSpacing:'0.06em',
                              color:'var(--ink-4)', padding:'4px 12px 6px', textTransform:'uppercase'}}>
                              Request approval from
                            </div>
                            {peopleOptions.filter(p => !(d.approvals||[]).some(a => a.userId === p.id)).map(p => (
                              <div key={p.id}
                                onClick={() => {
                                  updateC({ deliverables: c.deliverables.map(x =>
                                    x.id === d.id ? {...x, approvals: [...(d.approvals||[]), {userId:p.id, status:'pending'}]} : x) });
                                  setAddingApprovalFor(null);
                                }}
                                style={{display:'flex', alignItems:'center', gap:9, padding:'7px 12px', cursor:'pointer'}}
                                onMouseEnter={e => e.currentTarget.style.background='var(--panel-2)'}
                                onMouseLeave={e => e.currentTarget.style.background='transparent'}>
                                <Avatar person={p} size={22}/>
                                <div>
                                  <div style={{fontSize:12.5, fontWeight:600, color:'var(--ink)'}}>{p.name}</div>
                                  <div style={{fontSize:11, color:'var(--ink-3)'}}>{p.role || p.sport || ''}</div>
                                </div>
                              </div>
                            ))}
                          </div>
                        </>
                      )}
                    </div>
                  </div>

                  {/* Delete */}
                  <button className="oa-iconbtn sm oa-wf-delete" title="Delete task"
                    style={{color:'var(--ink-4)', flexShrink:0, opacity:0}}
                    onClick={e => { e.stopPropagation(); deleteTask(d.id); }}>
                    <Icons.X size={10}/>
                  </button>
                </div>
              );
            })}
          </div>

          {/* Add task */}
          <div style={{marginTop: selectedSteps.length ? 6 : 0}}>
            {showAddTask ? (
              <div style={{display:'flex', gap:6, alignItems:'center', padding:'4px 6px'}}>
                <div style={{width:16, flexShrink:0}}/>
                <div style={{width:16, flexShrink:0}}/>
                <input
                  autoFocus
                  value={newTaskTitle}
                  onChange={e => setNewTaskTitle(e.target.value)}
                  onBlur={() => { if (newTaskTitle.trim()) addTaskToStage(effectiveSelected); else setShowAddTask(false); }}
                  onKeyDown={e => {
                    if (e.key === 'Enter') addTaskToStage(effectiveSelected);
                    if (e.key === 'Escape') { setNewTaskTitle(''); setShowAddTask(false); }
                  }}
                  placeholder="Task name…"
                  style={{flex:1, background:'transparent', border:'none', borderBottom:'1px solid oklch(0.72 0.24 145)', outline:'none', fontSize:13, color:'var(--ink)', padding:'2px 0'}}
                />
              </div>
            ) : effectiveSelected ? (
              <button
                onClick={() => setShowAddTask(true)}
                style={{display:'flex', alignItems:'center', gap:5, padding:'5px 6px', borderRadius:7, background:'none', border:'none', cursor:'pointer', fontSize:12, color:'var(--ink-4)', width:'100%', transition:'color 0.1s'}}
                onMouseEnter={e => e.currentTarget.style.color='var(--ink-2)'}
                onMouseLeave={e => e.currentTarget.style.color='var(--ink-4)'}
              >
                <Icons.Plus size={11}/> Add task
              </button>
            ) : null}
          </div>
        </div>

        {/* Right: all-stages overview */}
        <div className="oa-panel" style={{padding:'16px 18px'}}>
          <div style={{fontWeight:600, fontSize:13, marginBottom:12, color:'var(--ink)'}}>All stages</div>
          <div style={{display:'flex', flexDirection:'column', gap:10}}>
            {effectiveStages.map((stage, i) => {
              const steps = stageMap.get(stage.id) || [];
              const stageDone = steps.filter(d => d.done).length;
              const stagePct = steps.length ? Math.round(stageDone / steps.length * 100) : 0;
              const isActive = stage.id === activeStageId;
              const isSelected = stage.id === effectiveSelected;
              const stageComplete = steps.length > 0 && stageDone === steps.length;
              return (
                <div key={stage.id}
                  onClick={() => setSelectedStageId(stage.id)}
                  style={{
                    cursor:'pointer', padding:'8px 10px', borderRadius:8, transition:'background 0.1s',
                    background: isSelected ? 'oklch(0.72 0.24 145 / 0.08)' : 'transparent',
                    border: isSelected ? '1px solid oklch(0.72 0.24 145 / 0.25)' : '1px solid transparent',
                  }}
                  onMouseEnter={e => { if (!isSelected) e.currentTarget.style.background='var(--panel-2)'; }}
                  onMouseLeave={e => { if (!isSelected) e.currentTarget.style.background='transparent'; }}
                >
                  <div style={{display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:6}}>
                    <span style={{fontSize:12, fontWeight: isActive || isSelected ? 600 : 500, color: stageComplete ? 'var(--ink-3)' : isSelected ? 'var(--accent-ink)' : isActive ? 'var(--ink)' : 'var(--ink-2)'}}>
                      <span style={{fontSize:10, fontFamily:'var(--mono)', color:'var(--ink-4)', marginRight:6, fontWeight:500}}>{i+1}</span>
                      {stage.label}
                    </span>
                    <span style={{fontSize:11, color: stageComplete ? 'oklch(0.72 0.24 145)' : 'var(--ink-3)', fontFamily:'var(--mono)', fontWeight:600}}>
                      {stageComplete ? '✓' : steps.length ? `${stageDone}/${steps.length}` : '—'}
                    </span>
                  </div>
                  <div style={{height:3, borderRadius:99, background:'var(--panel)', overflow:'hidden'}}>
                    <div style={{
                      height:'100%', width:stagePct+'%', borderRadius:99, transition:'width 0.3s',
                      background: stageComplete ? 'oklch(0.72 0.24 145)' : isActive ? 'oklch(0.72 0.24 145 / 0.7)' : 'oklch(0.72 0.24 145 / 0.35)',
                    }}/>
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      </div>

      {/* Task detail drawer */}
      <Drawer open={!!openDetailId} onClose={() => setOpenDetailId(null)} width={560}>
        {openDetailId && (
          <TaskDetail
            taskId={openDetailId}
            campaignId={c.id}
            state={state}
            setState={setState}
            onClose={() => setOpenDetailId(null)}
          />
        )}
      </Drawer>
    </div>
  );
}

// ── Dashboard (analytics) view ───────────────────────────
function CampDashView({ c, state }) {
  const { TEAM, ATHLETES } = state;
  const people = [...TEAM, ...c.athleteIds.map(id => ATHLETES.find(a => a.id === id)).filter(Boolean)];
  const done = c.deliverables.filter(d => d.done).length;
  const total = c.deliverables.length;
  const pct = total ? Math.round(done/total*100) : 0;
  const overdue = c.deliverables.filter(d => !d.done && fmt.daysUntil(d.due) != null && fmt.daysUntil(d.due) < 0).length;
  const daysLeft = fmt.daysUntil(c.end);

  // by-assignee breakdown
  const byPerson = people.map(p => ({
    person: p,
    total: c.deliverables.filter(d => d.assignee===p.id).length,
    done:  c.deliverables.filter(d => d.assignee===p.id && d.done).length,
  })).filter(x => x.total > 0);
  const maxTotal = Math.max(...byPerson.map(x => x.total), 1);

  // upcoming (next 7 days)
  const upcoming = c.deliverables.filter(d => !d.done && fmt.daysUntil(d.due) != null && fmt.daysUntil(d.due) >= 0 && fmt.daysUntil(d.due) <= 7)
    .sort((a,b) => (a.due||'').localeCompare(b.due||''));

  return (
    <div style={{padding:'24px', flex:1, overflowY:'auto', display:'flex', flexDirection:'column', gap:20}}>
      <div style={{display:'grid', gridTemplateColumns:'repeat(4,1fr)', gap:14}}>
        {[
          {label:'Completion', value: pct+'%',    sub: done+' of '+total+' done'},
          {label:'Overdue',    value: overdue,     sub: overdue>0?'needs attention':'all on track', warn:overdue>0},
          {label:'Days left',  value: daysLeft==null?'—':Math.abs(daysLeft)+'d', sub: daysLeft!=null&&daysLeft<0?'past end date':'ends '+fmt.date(c.end), warn:daysLeft!=null&&daysLeft<0},
          {label:'Budget',     value: fmt.moneyShort(c.budget), sub: c.exclusivity},
        ].map(k => (
          <div key={k.label} className="oa-kpi" style={{padding:'14px 16px'}}>
            <div className="oa-kpi-label">{k.label}</div>
            <div className="oa-kpi-value" style={{color: k.warn ? 'oklch(0.7 0.2 25)' : 'inherit'}}>{k.value}</div>
            <div className="oa-kpi-delta">{k.sub}</div>
          </div>
        ))}
      </div>

      <div style={{display:'grid', gridTemplateColumns:'1fr 1fr', gap:20}}>
        {/* Workload by person */}
        <div className="oa-panel" style={{padding:'16px 20px'}}>
          <div style={{fontWeight:600, fontSize:13, marginBottom:14}}>Workload by person</div>
          {byPerson.length === 0 && <div className="oa-empty">No assignees yet.</div>}
          {byPerson.map(({person, total: t, done: d}) => (
            <div key={person.id} style={{display:'flex', alignItems:'center', gap:10, marginBottom:12}}>
              <Avatar person={person} size={24}/>
              <div style={{flex:1, minWidth:0}}>
                <div style={{display:'flex', justifyContent:'space-between', fontSize:12.5, marginBottom:4}}>
                  <span style={{fontWeight:500}}>{person.name.split(' ')[0]}</span>
                  <span style={{color:'var(--ink-3)', fontFamily:'var(--mono)', fontSize:11.5}}>{d}/{t}</span>
                </div>
                <div className="oa-progbar" style={{height:5}}>
                  <div style={{width: (d/t*100)+'%'}}/>
                </div>
              </div>
            </div>
          ))}
        </div>

        {/* Upcoming this week */}
        <div className="oa-panel" style={{padding:'16px 20px'}}>
          <div style={{fontWeight:600, fontSize:13, marginBottom:14}}>Due this week · {upcoming.length}</div>
          {upcoming.length === 0 && <div className="oa-empty">Nothing due in the next 7 days.</div>}
          {upcoming.map(d => {
            const days = fmt.daysUntil(d.due);
            const person = people.find(p => p.id===d.assignee);
            return (
