// Campaign detail drawer with deliverables, comments, files
function CampaignDrawer({ campaign, state, setState, onClose, openAthlete }) {
  if (!campaign) return null;
  const { BRANDS, ATHLETES, TEAM } = state;
  const brand = BRANDS.find(b => b.id === campaign.brandId);
  const owner = TEAM.find(t => t.id === campaign.ownerId);
  const athletes = campaign.athleteIds.map(id => ATHLETES.find(a => a.id === id)).filter(Boolean);

  const [newDeliv, setNewDeliv] = useState('');
  const [newComment, setNewComment] = useState('');
  const [showMentions, setShowMentions] = useState(false);
  const commentRef = useRef(null);

  const updateC = (patch) => setState(s => ({
    ...s, CAMPAIGNS: s.CAMPAIGNS.map(c => c.id === campaign.id ? { ...c, ...patch } : c)
  }));

  const toggleDeliv = (did) => updateC({
    deliverables: campaign.deliverables.map(d => d.id === did ? { ...d, done: !d.done } : d),
  });
  const editDeliv = (did, patch) => {
    const teamMemberIds = new Set(TEAM.map(t => t.id));
    const extraTeam = patch.assignee && teamMemberIds.has(patch.assignee)
      ? [...new Set([...(campaign.teamIds || []), patch.assignee])]
      : campaign.teamIds;
    updateC({
      deliverables: campaign.deliverables.map(d => d.id === did ? { ...d, ...patch } : d),
      ...(extraTeam !== campaign.teamIds ? { teamIds: extraTeam } : {}),
    });
  };
  const addDeliv = () => {
    if (!newDeliv.trim()) return;
    const id = 'd' + Date.now();
    updateC({ deliverables: [...campaign.deliverables, { id, title: newDeliv, assignee: owner.id, due: null, done: false, campaign: campaign.id }] });
    setNewDeliv('');
  };
  const removeDeliv = (did) => updateC({ deliverables: campaign.deliverables.filter(d => d.id !== did) });

  const addComment = () => {
    if (!newComment.trim()) return;
    const id = 'cm' + Date.now();
    updateC({ comments: [...(campaign.comments || []), { id, userId: 'u4', at: new Date().toISOString(), text: newComment }] });
    setNewComment('');
  };

  const openCount = campaign.deliverables.filter(d => !d.done).length;
  const doneCount = campaign.deliverables.length - openCount;
  const pct = campaign.deliverables.length ? Math.round(doneCount / campaign.deliverables.length * 100) : 0;

  const peopleOptions = [...TEAM, ...athletes];

  // Group deliverables by stage (for playbook-based campaigns)
  const stageGroups = useMemo(() => {
    const map = new Map();
    const ungrouped = [];
    campaign.deliverables.forEach(d => {
      if (d.stageId) {
        if (!map.has(d.stageId)) map.set(d.stageId, { id: d.stageId, label: d.stageLabel, order: d.stageOrder ?? 99, steps: [] });
        map.get(d.stageId).steps.push(d);
      } else {
        ungrouped.push(d);
      }
    });
    const groups = [...map.values()].sort((a, b) => a.order - b.order);
    return { groups, ungrouped };
  }, [campaign.deliverables]);

  const hasStages = stageGroups.groups.length > 0;

  const [collapsedStages, setCollapsedStages] = useState({});
  const toggleStageCollapse = (sid) => setCollapsedStages(cs => ({ ...cs, [sid]: !cs[sid] }));

  const renderDelivRow = (d) => {
    const person = TEAM.find(t => t.id === d.assignee) || ATHLETES.find(a => a.id === d.assignee);
    const days = fmt.daysUntil(d.due);
    return (
      <div key={d.id} className={`oa-deliv ${d.done ? 'done' : ''}`}>
        <button className={`oa-check ${d.done ? 'done' : ''}`} onClick={() => toggleDeliv(d.id)} aria-label="toggle">
          {d.done && <Icons.Check size={11} stroke={2.4} />}
        </button>
        <div className="oa-deliv-title">
          <InlineEdit value={d.title} onChange={v => editDeliv(d.id, { title: v })} />
          {d.roles && d.roles.length > 0 && (
            <div className="oa-roles-row" style={{ marginTop: 3 }}>
              {d.roles.map(r => <span key={r} className="oa-role-tag">{r}</span>)}
            </div>
          )}
        </div>
        <div className="oa-deliv-assignee">
          <SelectPill value={d.assignee || ''} onChange={v => editDeliv(d.id, { assignee: v || null })}
            options={toPeopleOpts(peopleOptions)}
            searchable
            render={o => {
              if (!o.value) return <span style={{color:'var(--ink-3)', fontSize:12}}>Assign</span>;
              const p = peopleOptions.find(x => x.id === o.value);
              return <span className="oa-owner-cell"><Avatar person={p} size={18}/>{p?.name?.split(' ')[0]}</span>;
            }} />
        </div>
        <div className={`oa-deliv-due ${days != null && days < 0 && !d.done ? 'late' : ''}`}>
          <InlineEdit value={d.due} onChange={v => editDeliv(d.id, { due: v })} asDate placeholder="Set date" />
        </div>
        <button className="oa-iconbtn sm" onClick={() => removeDeliv(d.id)} title="Remove">
          <Icons.X size={11}/>
        </button>
      </div>
    );
  };

  return (
    <div className="oa-drawer-inner">
      <div className="oa-drawer-head">
        <div style={{minWidth: 0, flex: 1}}>
          <div className="oa-eyebrow">{brand?.name} campaign</div>
          <h2 className="oa-h2" style={{margin:'4px 0 6px'}}>{campaign.title}</h2>
          <div className="oa-sub">
            <StatusChip status={campaign.status} />
            <span className="oa-dotsep">·</span>
            <span>{fmt.dateLong(campaign.start)} → {fmt.dateLong(campaign.end)}</span>
            <span className="oa-dotsep">·</span>
            <span>{fmt.money(campaign.budget)}</span>
          </div>
        </div>
        <button className="oa-iconbtn" onClick={onClose}><Icons.X size={14}/></button>
      </div>

      <div className="oa-drawer-body">
        <div className="oa-c-grid">
          <div>
            <div className="oa-k">Status</div>
            <SelectPill value={campaign.status}
              onChange={v => updateC({ status: v })}
              options={Object.keys(STATUS).map(s => ({ value: s, label: STATUS[s].label }))}
              render={o => <StatusChip status={o.value} dense />} />
          </div>
          <div>
            <div className="oa-k">Owner</div>
            <SelectPill value={campaign.ownerId}
              onChange={v => updateC({ ownerId: v })}
              options={TEAM.map(t => ({ value: t.id, label: t.name }))}
              searchable
              render={o => { const p = TEAM.find(t => t.id === o.value); return (<span className="oa-owner-cell"><Avatar person={p} size={18}/>{p?.name}</span>); }} />
          </div>
          <div>
            <div className="oa-k">Brand partner</div>
            <div className="oa-brand-pill">{brand?.name} · <span className="mono subtle">{brand?.contact}</span></div>
          </div>
          <div>
            <div className="oa-k">Budget</div>
            <div className="oa-num-big">{fmt.money(campaign.budget)}</div>
          </div>
        </div>

        <div className="oa-prog-big">
          <div className="oa-progbar big"><div style={{ width: pct + '%' }}/></div>
          <div className="oa-prog-txt"><strong>{doneCount}</strong> of {campaign.deliverables.length} deliverables · <strong>{pct}%</strong> complete</div>
        </div>

        <Section title="Assigned athletes">
          <div className="oa-chip-row">
            {athletes.map(a => (
              <div key={a.id} className="oa-person-chip" onClick={() => openAthlete(a.id)}>
                {a.photoUrl
                  ? <img src={a.photoUrl} alt={a.name} className="oa-ath-avatar sm"
                      onError={e => { e.target.style.display='none'; e.target.nextSibling.style.display='grid'; }}/>
                  : null}
                <div className="oa-ath-avatar sm"
                  style={{ background:`oklch(0.72 0.12 ${(a.name.charCodeAt(0)*13)%360})`, display: a.photoUrl?'none':'grid' }}>
                  {a.name.split(' ').map(n=>n[0]).slice(0,2).join('')}
                </div>
                <div>
                  <div className="oa-person-name">{a.name}</div>
                  <div className="oa-person-sub">{a.sport}</div>
                </div>
              </div>
            ))}
          </div>
        </Section>

        <Section title={`Deliverables · ${doneCount}/${campaign.deliverables.length}`}>
          <div className="oa-deliv-list">
            {hasStages ? (
              <>
                {stageGroups.groups.map((group) => {
                  const gDone = group.steps.filter(d => d.done).length;
                  const gPct = group.steps.length ? Math.round(gDone / group.steps.length * 100) : 0;
                  const collapsed = collapsedStages[group.id];
                  return (
                    <div key={group.id} className="oa-stage-group">
                      <div className="oa-stage-head" onClick={() => toggleStageCollapse(group.id)}>
                        <span className="oa-stage-label">{group.label}</span>
                        <span className={`oa-stage-count-pill ${gDone === group.steps.length && group.steps.length > 0 ? 'done' : ''}`}>
                          {gDone}/{group.steps.length}
                        </span>
                        <Icons.Caret size={12} style={{ color: 'var(--ink-4)', transform: collapsed ? 'rotate(-90deg)' : 'none', transition: 'transform 0.15s' }}/>
                      </div>
                      {!collapsed && group.steps.map(d => renderDelivRow(d))}
                      <div className="oa-stage-divider"/>
                    </div>
                  );
                })}
                {stageGroups.ungrouped.map(d => renderDelivRow(d))}
              </>
            ) : (
              campaign.deliverables.map(d => renderDelivRow(d))
            )}
            <div className="oa-deliv add">
              <span className="oa-check ghost"><Icons.Plus size={10}/></span>
              <input placeholder="Add a deliverable…" value={newDeliv}
                onChange={e => setNewDeliv(e.target.value)}
                onKeyDown={e => e.key === 'Enter' && addDeliv()} />
              {newDeliv && <Button size="sm" kind="primary" onClick={addDeliv}>Add</Button>}
            </div>
          </div>
        </Section>

        <Section title="Brief">
          <div className="oa-note">{campaign.description}</div>
        </Section>

        <Section title="Contract & rights">
          <div className="oa-kv">
            <div><span className="oa-k">Exclusivity</span><span className="oa-v">{campaign.exclusivity}</span></div>
            <div><span className="oa-k">Brand contact</span><span className="oa-v">{brand?.contact} · {brand?.email}</span></div>
          </div>
          <div className="oa-files">
            {campaign.files.length === 0 && <div className="oa-empty">No files attached yet.</div>}
            {campaign.files.map(f => (
              <div key={f} className="oa-file">
                <Icons.Doc size={14}/>
                <span>{f}</span>
                <span className="oa-file-size mono">PDF</span>
              </div>
            ))}
          </div>
        </Section>

        <Section title={`Comments · ${(campaign.comments||[]).length}`}>
          <div className="oa-comments">
            {(campaign.comments || []).map(cm => {
              const u = TEAM.find(t => t.id === cm.userId);
              return (
                <div key={cm.id} className="oa-comment">
                  <Avatar person={u} size={28}/>
                  <div className="oa-comment-body">
                    <div className="oa-comment-head">
                      <strong>{u?.name}</strong>
                      <span className="oa-comment-time">{new Date(cm.at).toLocaleString('en-US',{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})}</span>
                    </div>
                    <div className="oa-comment-text">{renderMentions(cm.text, TEAM)}</div>
                  </div>
                </div>
              );
            })}
          </div>
          <div className="oa-comment-compose">
            <Avatar person={TEAM.find(t => t.id === 'u4')} size={28}/>
            <div style={{flex:1, position:'relative'}}>
              <textarea
                ref={commentRef}
                placeholder="Write a comment… use @ to mention"
                value={newComment}
                onChange={e => {
                  setNewComment(e.target.value);
                  const last = e.target.value.slice(-1);
                  if (last === '@') setShowMentions(true);
                  else if (e.target.value.endsWith(' ')) setShowMentions(false);
                }}
                onKeyDown={e => { if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) { e.preventDefault(); addComment(); } }}
              />
              {showMentions && (
                <div className="oa-mention-menu">
                  {TEAM.map(u => (
                    <div key={u.id} className="oa-mention-item"
                      onClick={() => { setNewComment(v => v + u.name.split(' ')[0].toLowerCase() + ' '); setShowMentions(false); commentRef.current?.focus(); }}>
                      <Avatar person={u} size={18}/>{u.name}
                    </div>
                  ))}
                </div>
              )}
              <div className="oa-comment-actions">
                <span className="oa-comment-hint mono">⌘ + Enter</span>
                <Button kind="primary" size="sm" onClick={addComment}>Comment</Button>
              </div>
            </div>
          </div>
        </Section>
      </div>
    </div>
  );
}

function renderMentions(text, TEAM) {
  // turn @u1 references into mention chips
  const parts = text.split(/(@u\d+)/g);
  return parts.map((p, i) => {
    const m = p.match(/^@u(\d+)$/);
    if (m) {
      const u = TEAM.find(t => t.id === 'u' + m[1]);
      return <span key={i} className="oa-mention">@{u?.name || m[0]}</span>;
    }
    return <span key={i}>{p}</span>;
  });
}

// ── Create Playbook Modal ────────────────────────────
const PB_ROLES = ['AM', 'Creative', 'PR', 'Research', 'Ops', 'Brand'];

function CreatePlaybookModal({ open, onClose, state, setState, onCreated }) {
  const [name, setName] = useState('');
  const [stages, setStages] = useState([
    { id: 'ns0', label: '', steps: [{ id: 'st0', title: '', roles: [] }] },
  ]);

  const addStage = () => {
    const id = 'ns' + Date.now();
    setStages(ss => [...ss, { id, label: '', steps: [{ id: 'st' + Date.now(), title: '', roles: [] }] }]);
  };
  const removeStage = (sid) => setStages(ss => ss.filter(s => s.id !== sid));
  const updateStageName = (sid, label) => setStages(ss => ss.map(s => s.id === sid ? { ...s, label } : s));
  const addStep = (sid) => setStages(ss => ss.map(s => s.id === sid ? { ...s, steps: [...s.steps, { id: 'st' + Date.now(), title: '', roles: [] }] } : s));
  const removeStep = (sid, tid) => setStages(ss => ss.map(s => s.id === sid ? { ...s, steps: s.steps.filter(t => t.id !== tid) } : s));
  const updateStepTitle = (sid, tid, title) => setStages(ss => ss.map(s => s.id === sid ? { ...s, steps: s.steps.map(t => t.id === tid ? { ...t, title } : t) } : s));
  const toggleRole = (sid, tid, role) => setStages(ss => ss.map(s => s.id === sid ? { ...s, steps: s.steps.map(t => t.id === tid ? { ...t, roles: t.roles.includes(role) ? t.roles.filter(r => r !== role) : [...t.roles, role] } : t) } : s));

  const reset = () => { setName(''); setStages([{ id: 'ns0', label: '', steps: [{ id: 'st0', title: '', roles: [] }] }]); };

  const submit = () => {
    if (!name.trim()) return;
    const validStages = stages
      .filter(s => s.label.trim())
      .map(s => ({
        id: 'pbs_' + s.id,
        label: s.label.trim(),
        steps: s.steps.filter(t => t.title.trim()).map(t => ({ id: 'ps_' + t.id, title: t.title.trim(), roles: t.roles })),
      }));
    const pb = { id: 'pb_' + Date.now(), name: name.trim(), stages: validStages };
    setState(s => ({ ...s, PLAYBOOKS: [...s.PLAYBOOKS, pb] }));
    if (onCreated) onCreated(pb.id);
    reset(); onClose();
  };

  return (
    <Modal open={open} onClose={() => { reset(); onClose(); }} width={680}>
      <div className="oa-modal-head">
        <h3>Create playbook</h3>
        <button className="oa-iconbtn" onClick={() => { reset(); onClose(); }}><Icons.X size={14}/></button>
      </div>
      <div className="oa-form" style={{ maxHeight: '70vh', overflowY: 'auto' }}>
        <label><span>Playbook name</span><input autoFocus value={name} onChange={e => setName(e.target.value)} placeholder="e.g. Sponsored Post, Event Activation…"/></label>
        <div>
          <div style={{ fontSize: 11, fontWeight: 700, color: 'var(--ink-3)', textTransform: 'uppercase', letterSpacing: '0.07em', marginBottom: 10 }}>Stages &amp; Steps</div>
          {stages.map((stage, si) => (
            <div key={stage.id} className="oa-cpb-stage">
              <div className="oa-cpb-stage-head">
                <span style={{ fontSize: 11, fontWeight: 700, color: 'var(--ink-4)', fontFamily: 'var(--mono)', minWidth: 20 }}>{si + 1}</span>
                <input
                  className="oa-cpb-stage-name"
                  value={stage.label}
                  onChange={e => updateStageName(stage.id, e.target.value)}
                  placeholder="Stage name (e.g. Proposal Development)"
                />
                {stages.length > 1 && (
                  <button className="oa-iconbtn sm" onClick={() => removeStage(stage.id)}><Icons.X size={11}/></button>
                )}
              </div>
              <div className="oa-cpb-steps">
                {stage.steps.map((step, ti) => (
                  <div key={step.id} className="oa-cpb-step">
                    <span style={{ fontSize: 11, color: 'var(--ink-4)', fontFamily: 'var(--mono)', minWidth: 28 }}>{si + 1}.{ti + 1}</span>
                    <input
                      className="oa-cpb-step-title"
                      value={step.title}
                      onChange={e => updateStepTitle(stage.id, step.id, e.target.value)}
                      placeholder="Step title…"
                    />
                    <div className="oa-cpb-roles">
                      {PB_ROLES.map(r => (
                        <button key={r} className={`oa-cpb-role ${step.roles.includes(r) ? 'on' : ''}`}
                          onClick={() => toggleRole(stage.id, step.id, r)}>{r}</button>
                      ))}
                    </div>
                    {stage.steps.length > 1 && (
                      <button className="oa-iconbtn sm" onClick={() => removeStep(stage.id, step.id)}><Icons.X size={11}/></button>
                    )}
                  </div>
                ))}
              </div>
              <button className="oa-cpb-add-step" onClick={() => addStep(stage.id)}>
                <Icons.Plus size={12}/> Add step
              </button>
            </div>
          ))}
          <button className="oa-cpb-add-stage" onClick={addStage}>
            <Icons.Plus size={13}/> Add stage
          </button>
        </div>
      </div>
      <div className="oa-modal-foot">
        <Button kind="ghost" onClick={() => { reset(); onClose(); }}>Cancel</Button>
        <Button kind="primary" onClick={submit}>Save playbook</Button>
      </div>
    </Modal>
  );
}

function AddCampaignModal({ open, onClose, state, setState }) {
  const { BRANDS, ATHLETES, TEAM, PLAYBOOKS } = state;
  const [title, setTitle] = useState('');
  const [brandId, setBrandId] = useState(BRANDS[0]?.id);
  const [ownerId, setOwnerId] = useState(TEAM[0]?.id);
  const [selAthletes, setSelAthletes] = useState([]);
  const [budget, setBudget] = useState('');
  const [start, setStart] = useState('');
  const [end, setEnd] = useState('');
  const [playbookId, setPlaybookId] = useState('pb_default');
  const [manageOpen, setManageOpen] = useState(false);
  const [createPbOpen, setCreatePbOpen] = useState(false);

  const reset = () => {
    setTitle(''); setBrandId(BRANDS[0]?.id); setOwnerId(TEAM[0]?.id);
    setSelAthletes([]); setBudget(''); setStart(''); setEnd('');
    setPlaybookId('pb_default');
  };

  const selectedPb = playbookId === 'none' ? null : (PLAYBOOKS.find(p => p.id === playbookId) || PLAYBOOKS[0]);

  const submit = () => {
    if (!title.trim()) return;
    const id = 'c' + Date.now();
    const deliverables = selectedPb ? deliFromPlaybook(selectedPb, id) : [];
    const newC = {
      id, title: title.trim(), brandId, status: 'pitching', ownerId,
      athleteIds: selAthletes, start: start || '2026-05-01', end: end || '2026-08-01',
      budget: Number(budget) || 0, exclusivity: 'Non-exclusive',
      playbookId: selectedPb?.id || null,
      description: 'Draft brief — add details.', deliverables, files: [], comments: [],
    };
    setState(s => ({ ...s, CAMPAIGNS: [newC, ...s.CAMPAIGNS] }));
    reset(); onClose();
  };

  return (
    <>
      <Modal open={open && !manageOpen && !createPbOpen} onClose={onClose} width={740}>
        <div className="oa-modal-head">
          <h3>New campaign</h3>
          <button className="oa-iconbtn" onClick={onClose}><Icons.X size={14}/></button>
        </div>
        <div className="oa-form">
          <label><span>Title</span><input autoFocus value={title} onChange={e => setTitle(e.target.value)} placeholder="e.g. Nike Swoosh Drop Fall '26"/></label>
          <div className="oa-form-row">
            <label style={{flex:1}}><span>Brand</span>
              <SearchSelect
                value={brandId} onChange={setBrandId} placeholder="Search brands…"
                options={BRANDS.map(b => ({ id: b.id, name: b.name, sub: b.industry || '' }))}
              />
            </label>
            <label style={{flex:1}}><span>Account Manager</span>
              <SearchSelect
                value={ownerId} onChange={setOwnerId} placeholder="Search team…"
                options={TEAM.map(t => ({ id: t.id, name: t.name, sub: t.role || t.dept || '', person: t }))}
              />
            </label>
          </div>
          <label><span>Athletes</span>
            <SearchSelect
              value={selAthletes} onChange={setSelAthletes} placeholder="Search athletes…" multi
              options={ATHLETES.map(a => ({ id: a.id, name: a.name, sub: a.sport || '', person: a }))}
            />
          </label>
          <div className="oa-form-row">
            <label><span>Budget ($)</span><input type="number" value={budget} onChange={e => setBudget(e.target.value)} placeholder="50000"/></label>
            <label><span>Start</span><input type="date" value={start} onChange={e => setStart(e.target.value)}/></label>
            <label><span>End</span><input type="date" value={end} onChange={e => setEnd(e.target.value)}/></label>
          </div>

          {/* ── Playbook selector ── */}
          <div>
            <div style={{ fontSize: 11, fontWeight: 700, color: 'var(--ink-3)', textTransform: 'uppercase', letterSpacing: '0.07em', marginBottom: 8 }}>Playbook</div>
            <div className="oa-pb-select-wrap">
              <select value={playbookId} onChange={e => setPlaybookId(e.target.value)}>
                <option value="none">— No playbook —</option>
                {PLAYBOOKS.map(pb => <option key={pb.id} value={pb.id}>{pb.name}</option>)}
              </select>
              <button className="oa-pb-manage-link" onClick={() => setManageOpen(true)}>Manage playbooks</button>
            </div>
            {selectedPb ? (
              <div className="oa-pb-row" style={{ marginTop: 10 }}>
                <div className="oa-pb-row-info">
                  <div className="oa-pb-row-name">
                    {selectedPb.name}
                    {selectedPb.id === 'pb_default' && <span className="oa-pb-badge">Default</span>}
                  </div>
                  <div className="oa-pb-row-meta">
                    {selectedPb.stages.length} stages · {selectedPb.stages.reduce((n, s) => n + s.steps.length, 0)} steps — will be pre-loaded into the campaign checklist
                  </div>
                  <div className="oa-pb-stages-preview">
                    {selectedPb.stages.map(s => (
                      <div key={s.id} className="oa-pb-stage-row">
                        <span className="oa-pb-stage-dot"/>
                        <span>{s.label}</span>
                        <span className="oa-pb-stage-steps">{s.steps.length} steps</span>
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            ) : (
              <div style={{marginTop:8, fontSize:12, color:'var(--ink-3)', padding:'10px 14px', background:'var(--panel-2)', borderRadius:'var(--radius)', border:'1px solid var(--line)'}}>
                Campaign will start with an empty checklist — you can add tasks manually.
              </div>
            )}
          </div>
        </div>
        <div className="oa-modal-foot">
          <Button kind="ghost" onClick={onClose}>Cancel</Button>
          <Button kind="primary" onClick={submit}>Create campaign</Button>
        </div>
      </Modal>

      <ManagePlaybooksModal
        open={manageOpen}
        onClose={() => setManageOpen(false)}
        state={state} setState={setState}
      />
      <CreatePlaybookModal
        open={createPbOpen}
        onClose={() => setCreatePbOpen(false)}
        state={state} setState={setState}
        onCreated={(id) => setPlaybookId(id)}
      />
    </>
  );
}

function NewMenu({ onCreate, onCreateAthlete, onCreateClient }) {
  const [open, setOpen] = useState(false);
  const ref = useRef(null);

  useEffect(() => {
    if (!open) return;
    const handler = e => {
      if (ref.current && !ref.current.contains(e.target)) setOpen(false);
    };
    requestAnimationFrame(() => document.addEventListener('mousedown', handler));
    return () => document.removeEventListener('mousedown', handler);
  }, [open]);

  const pick = (fn) => { setOpen(false); fn(); };

  const options = [
    { emoji: '📣', label: 'Campaign', desc: 'New brand deal or activation', action: onCreate },
    { emoji: '🏃', label: 'Athlete',  desc: 'Add a new athlete to the roster', action: onCreateAthlete },
    { emoji: '🏢', label: 'Client',   desc: 'Add a brand or business partner', action: onCreateClient },
  ];

  return (
    <div ref={ref} className="oa-new-menu-wrap">
      {open && (
        <div className="oa-new-popover">
          {options.map(opt => (
            <button key={opt.label} className="oa-new-option" onClick={() => pick(opt.action)}>
              <div className="oa-new-option-icon">{opt.emoji}</div>
              <div className="oa-new-option-text">
                <span className="oa-new-option-label">{opt.label}</span>
                <span className="oa-new-option-desc">{opt.desc}</span>
              </div>
            </button>
          ))}
        </div>
      )}
      <button className="oa-new-btn" onClick={() => setOpen(v => !v)}>
        <Icons.Plus size={14}/> New
      </button>
    </div>
  );
}

  const activeCamps   = CAMPAIGNS.filter(c => c.status !== 'complete');
  const archivedCamps = CAMPAIGNS.filter(c => c.status === 'complete');
  const starredCamps  = CAMPAIGNS.filter(c => c.starred);

  const [starredOpen,    setStarredOpen]    = useState(true);
  const [activeSectOpen, setActiveSectOpen] = useState(true);
  const [archiveSectOpen,setArchiveSectOpen]= useState(false);
  const [pendingArchiveId, setPendingArchiveId] = useState(null);
  const [isDragging, setIsDragging] = useState(false);
  const [isDraggingOverArchive, setIsDraggingOverArchive] = useState(false);
  const [isDraggingOverStarred, setIsDraggingOverStarred] = useState(false);
  const [isDraggingOverUnstar,  setIsDraggingOverUnstar]  = useState(false);

  const pendingCamp = CAMPAIGNS.find(c => c.id === pendingArchiveId);

    setPendingArchiveId(null);

    e.stopPropagation();
    setState(s => ({
      ...s,

    }));

          <h3 style={{margin:'0 0 12px', fontSize:16, fontWeight:700}}>Archive this campaign?</h3>
          <p className="oa-confirm-body">
            <strong>{pendingCamp?.title}</strong> will be moved to Archived. All data is preserved and you can restore it at any time.
          </p>
          <div style={{display:'flex', justifyContent:'flex-end', gap:8, marginTop:24, paddingBottom:8}}>
            <Button kind="ghost" onClick={() => setPendingArchiveId(null)}>Cancel</Button>
            <Button kind="primary" onClick={confirmArchive}>Archive campaign</Button>
          </div>
        </div>
      </Modal>

      {/* Footer: New menu */}
      <NewMenu onCreate={onCreate} onCreateAthlete={onCreateAthlete} onCreateClient={onCreateClient} />
    </aside>
  );
}

function NavItem({ icon, label, count, on, onClick }) {
  return (
    <button className={`oa-navitem ${on ? 'on' : ''}`} onClick={onClick}>
      <span className="oa-navitem-icon">{icon}</span>
      <span className="oa-navitem-label">{label}</span>
      {count != null && <span className="oa-navitem-n">{count}</span>}
    </button>
  );
}

const EMOJI_FLAT = Object.values(EMOJI_DB).flat();

function campColorVal(c) {
  return c.color || `oklch(0.62 0.16 ${((c.brandId||'').charCodeAt(1)*47 + (c.id||'').charCodeAt(1)*7) % 360})`;
}
function campIconEl(c, size = 18) {
  if (c.emoji) return <span style={{fontSize: size * 0.85, lineHeight:1, userSelect:'none'}}>{c.emoji}</span>;
  const IC = Icons[c.icon || 'Kanban'] || Icons.Kanban;
  return <IC size={size}/>;
}

function CampIconPicker({ c, setState, onClose }) {
  const ref        = useRef(null);
  const searchRef  = useRef(null);
  const curColor   = campColorVal(c);
  const curEmoji   = c.emoji || null;
  const categories = Object.keys(EMOJI_DB);

  const [query, setQuery]   = useState('');
  const [cat,   setCat]     = useState(categories[0]);

  useEffect(() => {
    searchRef.current?.focus();
    const handler = e => {
      if (ref.current && !ref.current.contains(e.target)) onClose();
    };
    requestAnimationFrame(() => document.addEventListener('mousedown', handler));
    return () => document.removeEventListener('mousedown', handler);
  }, []);

  const update = patch => setState(s => ({
    ...s, CAMPAIGNS: s.CAMPAIGNS.map(x => x.id === c.id ? { ...x, ...patch } : x),
  }));

  const q = query.trim().toLowerCase();
  const visibleEmojis = q
    ? EMOJI_FLAT.filter(([e, name]) => name.includes(q) || e === q)
    : EMOJI_DB[cat] || [];

  return (
    <div ref={ref} className="oa-icon-picker" onClick={e => e.stopPropagation()}>
      {/* Preview strip */}
      <div style={{display:'flex', alignItems:'center', gap:10, marginBottom:10}}>
        <div style={{width:36, height:36, borderRadius:8, background:curColor,
          display:'grid', placeItems:'center', flexShrink:0}}>
          {campIconEl(c, 18)}
        </div>
        <div style={{flex:1, minWidth:0}}>
          <div style={{fontSize:12, fontWeight:600, color:'var(--ink-1)', overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap'}}>{c.title}</div>
          <div style={{fontSize:10.5, color:'var(--ink-3)', marginTop:1}}>Choose an emoji &amp; color</div>
        </div>
      </div>

      {/* Search */}
      <div style={{position:'relative', marginBottom:8}}>
        <span style={{position:'absolute', left:8, top:'50%', transform:'translateY(-50%)', color:'var(--ink-3)', pointerEvents:'none'}}>
          <Icons.Search size={12}/>
        </span>
        <input ref={searchRef}
          value={query} onChange={e => setQuery(e.target.value)}
          placeholder="Search emojis…"
          style={{width:'100%', background:'var(--panel-2)', border:'1px solid var(--line)',
            borderRadius:7, padding:'5px 8px 5px 26px', fontSize:12, color:'var(--ink-1)',
            outline:'none', boxSizing:'border-box'}}
        />
        {query && (
          <button onClick={() => setQuery('')}
            style={{position:'absolute', right:6, top:'50%', transform:'translateY(-50%)',
              background:'none', border:'none', cursor:'pointer', color:'var(--ink-3)', padding:2}}>
            <Icons.X size={10}/>
          </button>
        )}
      </div>

      {/* Category tabs (only when not searching) */}
      {!q && (
        <div style={{display:'flex', gap:2, overflowX:'auto', marginBottom:8, paddingBottom:2, scrollbarWidth:'none'}}>
          {categories.map(name => (
            <button key={name}
              onClick={() => setCat(name)}
              style={{flexShrink:0, padding:'3px 8px', borderRadius:5, border:'none', cursor:'pointer',
                fontSize:11, fontWeight: cat===name ? 600 : 400,
                background: cat===name ? curColor : 'var(--panel-2)',
                color: cat===name ? 'oklch(0.1 0.02 160)' : 'var(--ink-2)',
                transition:'background 0.12s, color 0.12s'}}>
              {name}
            </button>
          ))}
        </div>
      )}

      {/* Emoji grid */}
      <div style={{display:'grid', gridTemplateColumns:'repeat(8,1fr)', gap:1,
        maxHeight:168, overflowY:'auto', scrollbarWidth:'thin', marginBottom:10}}>
        {visibleEmojis.map(([em, name]) => {
          const on = curEmoji === em;
          return (
            <button key={em+name}
              className={`oa-emoji-btn${on ? ' on' : ''}`}
              style={on ? {background: curColor + '44', outline:'2px solid '+curColor, outlineOffset:'0px'} : {}}
              onClick={() => { update({ emoji: em }); }}
              title={name}>
              {em}
            </button>
          );
        })}
        {visibleEmojis.length === 0 && (
          <div style={{gridColumn:'1/-1', fontSize:12, color:'var(--ink-4)', padding:'12px 0', textAlign:'center'}}>
            No results for "{query}"
          </div>
        )}
      </div>

      {/* Color swatches */}
      <div className="oa-icon-picker-label" style={{marginBottom:6}}>Color</div>
      <div className="oa-icon-picker-colors">
        {CAMP_COLORS.map(col => (
          <button key={col}
            className={`oa-icon-picker-swatch${curColor===col ? ' on' : ''}`}
            style={{'--sw-col': col}}
            onClick={() => update({ color: col })}/>
        ))}
      </div>
    </div>
  );
}

// ── Campaign Edit Details Modal ──────────────────────────
function CampEditModal({ c, state, setState, onClose }) {
  const { BRANDS } = state;
  const updateC = patch => setState(s => ({
    ...s, CAMPAIGNS: s.CAMPAIGNS.map(x => x.id === c.id ? { ...x, ...patch } : x),
  }));

  const [form, setForm] = useState({
    title:       c.title       || '',
    description: c.description || '',
    brandId:     c.brandId     || BRANDS[0]?.id,
    start:       c.start       || '',
    end:         c.end         || '',
    budget:      c.budget      || '',
  });
  const set = (k, v) => setForm(f => ({ ...f, [k]: v }));

  const save = () => {
    updateC({
      title:       form.title.trim() || c.title,
      description: form.description.trim(),
      brandId:     form.brandId,
      start:       form.start,
      end:         form.end,
      budget:      form.budget !== '' ? Number(form.budget) : null,
    });
    onClose();
  };

  return (
    <Modal open={true} onClose={onClose} width={500}>
      <div className="oa-modal-head">
        <h3>Edit campaign details</h3>
        <button className="oa-iconbtn" onClick={onClose}><Icons.X size={14}/></button>
      </div>
      <div style={{padding:'16px 20px 8px', display:'flex', flexDirection:'column', gap:14}}>

        {/* Name */}
        <div>
          <label style={{fontSize:11, color:'var(--ink-3)', display:'block', marginBottom:4}}>Campaign name</label>
          <input className="oa-inline-input" value={form.title}
            onChange={e => set('title', e.target.value)}
            onKeyDown={e => { if (e.key === 'Enter') save(); if (e.key === 'Escape') onClose(); }}
            autoFocus
            style={{width:'100%', fontSize:14, fontWeight:600}}
          />
        </div>

        {/* Description */}
        <div>
          <label style={{fontSize:11, color:'var(--ink-3)', display:'block', marginBottom:4}}>Description</label>
          <textarea className="oa-inline-input" value={form.description}
            onChange={e => set('description', e.target.value)}
            placeholder="What is this campaign about?"
            rows={3}
            style={{width:'100%', resize:'vertical', fontSize:13, lineHeight:1.5, fontFamily:'inherit'}}
          />
        </div>

        {/* Brand */}
        <div>
          <label style={{fontSize:11, color:'var(--ink-3)', display:'block', marginBottom:4}}>Brand</label>
          <select className="oa-inline-select" value={form.brandId}
            onChange={e => set('brandId', e.target.value)} style={{width:'100%'}}>
            {BRANDS.map(b => <option key={b.id} value={b.id}>{b.name}</option>)}
          </select>
        </div>

        {/* Dates */}
        <div style={{display:'flex', gap:12}}>
          <div style={{flex:1}}>
            <label style={{fontSize:11, color:'var(--ink-3)', display:'block', marginBottom:4}}>Start date</label>
            <input type="date" className="oa-inline-select" value={form.start}
              onChange={e => set('start', e.target.value)} style={{width:'100%'}}/>
          </div>
          <div style={{flex:1}}>
            <label style={{fontSize:11, color:'var(--ink-3)', display:'block', marginBottom:4}}>End date</label>
            <input type="date" className="oa-inline-select" value={form.end}
              onChange={e => set('end', e.target.value)} style={{width:'100%'}}/>
          </div>
        </div>

        {/* Budget */}
        <div>
          <label style={{fontSize:11, color:'var(--ink-3)', display:'block', marginBottom:4}}>Budget (USD)</label>
          <input type="number" className="oa-inline-input" value={form.budget}
            onChange={e => set('budget', e.target.value)}
            placeholder="0"
            style={{width:'100%', fontSize:13}}
          />
        </div>

      </div>
      <div className="oa-modal-foot">
        <Button kind="ghost" onClick={onClose}>Cancel</Button>
        <Button kind="primary" onClick={save}>Save changes</Button>
      </div>
    </Modal>
  );
}

// ===== camp_overview_view.jsx =====
function CampOverviewView({ c, state, setState, openTaskView, openProcessView }) {
  const { BRANDS, TEAM, ATHLETES, PLAYBOOKS } = state;
  const brand     = BRANDS.find(b => b.id === c.brandId);
  const owner     = TEAM.find(t => t.id === c.ownerId);
  const athletes  = c.athleteIds.map(id => ATHLETES.find(a => a.id === id)).filter(Boolean);
  const teamExtra = (c.teamIds || []).map(id => TEAM.find(t => t.id === id)).filter(Boolean);
  const allPeople = [...TEAM, ...ATHLETES];

  const updateC = patch => setState(s => ({
    ...s, CAMPAIGNS: s.CAMPAIGNS.map(x => x.id === c.id ? {...x, ...patch} : x),
  }));

  const done     = c.deliverables.filter(d => d.done).length;
  const total    = c.deliverables.length;
  const pct      = total ? Math.round(done / total * 100) : 0;
  const daysLeft = fmt.daysUntil(c.end);
  const overdue  = c.deliverables.filter(d => !d.done && fmt.daysUntil(d.due) < 0).length;
  const openCount = total - done;

  const pb              = PLAYBOOKS && PLAYBOOKS.find(p => p.id === c.playbookId);
  const effectiveStages = pb ? (c.customStages || pb.stages) : null;

  const stageGroups = useMemo(() => {
    if (!effectiveStages || effectiveStages.length === 0) {
      return [{ id: '_all', label: 'All Tasks', tasks: c.deliverables }];
    }
    const staged = new Set(effectiveStages.map(s => s.id));
    const groups = effectiveStages
      .map(s => ({ id: s.id, label: s.label, tasks: c.deliverables.filter(d => d.stageId === s.id) }))
      .filter(g => g.tasks.length > 0);
    const unstaged = c.deliverables.filter(d => !d.stageId || !staged.has(d.stageId));
    if (unstaged.length > 0) groups.push({ id: '_other', label: 'Other', tasks: unstaged });
    if (groups.length === 0) groups.push({ id: '_all', label: 'All Tasks', tasks: c.deliverables });
    return groups;
  }, [c.deliverables, c.playbookId, c.customStages]);

  const [collapsedStages, setCollapsedStages] = useState(() => {
    const s = new Set();
    const _pb = PLAYBOOKS && PLAYBOOKS.find(p => p.id === c.playbookId);
    const _stages = _pb ? (c.customStages || _pb.stages) : null;
    if (_stages) {
      _stages.forEach(stage => {
        const tasks = c.deliverables.filter(d => d.stageId === stage.id);
        if (tasks.length > 0 && tasks.every(t => t.done)) s.add(stage.id);
      });
    }
    return s;
  });

  const toggleStage = id => setCollapsedStages(prev => {
    const next = new Set(prev);
    next.has(id) ? next.delete(id) : next.add(id);
    return next;
  });

  const [newTitle, setNewTitle] = useState('');
  const [newLink,  setNewLink]  = useState('');
  const [addingApprovalFor, setAddingApprovalFor] = useState(null);

  const addDeliverable = () => {
    if (!newTitle.trim()) return;
    updateC({ deliverables: [...c.deliverables, {
      id: 'dyn_' + Date.now(), title: newTitle.trim(), campaign: c.id,
      done: false, assignee: null, due: null, priority: null,
      ...(newLink.trim() ? { link: newLink.trim() } : {}),
    }]});
    setNewTitle(''); setNewLink('');
  };

  const teamList = useMemo(() => {
    const seen = new Set();
    return [owner, ...teamExtra].filter(p => {
      if (!p || seen.has(p.id)) return false;
      seen.add(p.id); return true;
    });
  }, [c.ownerId, c.teamIds]);

  const activity = useMemo(() => {
    const entries = [{ id: 'created', text: c.title + ' created', icon: '🚀', at: c.start }];
    c.deliverables.filter(d => d.done).forEach(d => {
      entries.push({ id: d.id + '_done', text: 'Completed: ' + d.title, icon: '✅', at: d.due || c.end });
    });
    c.deliverables.filter(d => d.assignee).slice(0, 4).forEach(d => {
      const p = allPeople.find(x => x.id === d.assignee);
      entries.push({ id: d.id + '_asgn', text: (p ? p.name : 'Someone') + ' on ' + d.title, icon: '👤', at: c.start });
    });
    return entries.sort((a, b) => new Date(b.at) - new Date(a.at)).slice(0, 8);
  }, [c]);

  return (
    <div className="oa-coverview">

      {/* ── Header ── */}
      <div className="oa-coverview-header" style={{paddingBottom:20}}>
        <div className="oa-coverview-header-top">
          <div style={{flex:1, minWidth:0}}>
            <h1 className="oa-coverview-title">
              {c.emoji && <span style={{marginRight:8}}>{c.emoji}</span>}{c.title}
            </h1>
            <div className="oa-coverview-meta">
              {brand && <span className="oa-coverview-meta-item">{brand.name}</span>}
              <span className="oa-coverview-meta-item">
                <Icons.Calendar size={11}/>
                {fmt.dateLong(c.start)} → {fmt.dateLong(c.end)}
              </span>
            </div>
          </div>
          <button className="oa-btn kind-ghost" onClick={openTaskView} style={{fontSize:12, gap:5, flexShrink:0}}>
            <Icons.Grid size={11}/> Task view
          </button>
        </div>
      </div>

      {/* ── Stat cards ── */}
      <div style={{display:'grid', gridTemplateColumns:'repeat(4,1fr)', gap:12, padding:'0 24px 16px'}}>
        <div className="oa-panel" style={{padding:'16px 18px'}}>
          <div style={{fontSize:11, fontWeight:500, color:'var(--ink-3)', marginBottom:6}}>Budget</div>
          <div style={{fontSize:26, fontWeight:700, color:'var(--ink)', lineHeight:1.1}}>{fmt.moneyShort(c.budget)}</div>
          <div style={{fontSize:11.5, color:'var(--ink-4)', marginTop:5, lineHeight:1.4}}>{c.exclusivity || 'Non-exclusive'}</div>
        </div>
        <div className="oa-panel" style={{padding:'16px 18px'}}>
          <div style={{fontSize:11, fontWeight:500, color:'var(--ink-3)', marginBottom:6}}>Progress</div>
          <div style={{fontSize:26, fontWeight:700, color:'var(--ink)', lineHeight:1.1}}>{pct}%</div>
          <div style={{fontSize:11.5, color:'var(--ink-4)', marginTop:5}}>{done} of {total} done</div>
        </div>
        <div className="oa-panel" style={{padding:'16px 18px'}}>
          <div style={{fontSize:11, fontWeight:500, color:'var(--ink-3)', marginBottom:6}}>Overdue tasks</div>
          <div style={{fontSize:26, fontWeight:700, lineHeight:1.1, color: overdue > 0 ? 'oklch(0.55 0.2 25)' : 'var(--ink)'}}>{overdue}</div>
          <div style={{fontSize:11.5, color:'var(--ink-4)', marginTop:5}}>{overdue === 0 ? 'on track' : overdue + ' past due'}</div>
        </div>
        <div className="oa-panel" style={{padding:'16px 18px'}}>
          <div style={{fontSize:11, fontWeight:500, color:'var(--ink-3)', marginBottom:6}}>Days remaining</div>

                            value={d.assignee || ''}
                            onChange={v => updateC({ deliverables: c.deliverables.map(x =>
                              x.id === d.id ? {...x, assignee: v || null} : x) })}
                            options={toPeopleOpts(allPeople)}
                            searchable
                            render={o => {
                              const p = allPeople.find(x => x.id === o.value);
                              return p ? (
                                <span style={{display:'flex', alignItems:'center', gap:5}}>
                                  <Avatar person={p} size={16}/> {p.name.split(' ')[0]}
                                </span>
                              ) : <span style={{color:'var(--ink-4)'}}>Unassigned</span>;
                            }}
                          />
                        </div>

                        {/* Due date — inline editable */}
                        <div>
                          <input type="date" className="oa-date-inline" value={d.due || ''}
                            onChange={e => updateC({ deliverables: c.deliverables.map(x =>
                              x.id === d.id ? {...x, due: e.target.value || null} : x) })}
                            style={{background:'none', border:'none', outline:'none',
                              fontSize:12, fontFamily:'inherit', padding:0, width:'100%',
                              color: isOverdue ? 'oklch(0.55 0.2 25)' : 'var(--ink-3)'}}/>
                        </div>

                        {/* Approval */}
                        <div style={{display:'flex', alignItems:'center', gap:3, position:'relative'}}>
                          {/* Existing approver avatars */}
                          {taskApprovals.map(a => {
                            const ap = allPeople.find(p => p.id === a.userId);
                            if (!ap) return null;
                            const dotColor = a.status === 'approved'
                              ? 'oklch(0.52 0.18 145)'
                              : a.status === 'rejected'
                              ? 'oklch(0.55 0.22 25)'
                              : 'oklch(0.62 0.14 75)';
                            return (
                              <div key={a.userId} title={ap.name + ' · ' + a.status}
                                style={{position:'relative', cursor:'pointer', flexShrink:0}}
                                onClick={() => updateC({ deliverables: c.deliverables.map(x =>
                                  x.id === d.id ? {...x, approvals: taskApprovals.filter(z => z.userId !== a.userId)} : x) })}>
                                <Avatar person={ap} size={20}/>
                                <span style={{position:'absolute', bottom:-1, right:-1, width:7, height:7,
                                  borderRadius:'50%', background:dotColor,
                                  border:'1.5px solid var(--panel)'}}/>
                              </div>
                            );
                          })}

                          {/* Request approval button */}
                          <div style={{position:'relative', flexShrink:0}}>
                            <button
                              onClick={e => { e.stopPropagation(); setAddingApprovalFor(addingApprovalFor === d.id ? null : d.id); }}
                              title="Request approval"
                              style={{width:22, height:22, borderRadius:'50%', cursor:'pointer', display:'flex',
                                alignItems:'center', justifyContent:'center',
                                border:'1.5px dashed var(--ink-4)', background:'none',
                                color:'var(--ink-3)', transition:'border-color 0.1s, color 0.1s'}}
                              onMouseEnter={e => { e.currentTarget.style.borderColor='var(--accent)'; e.currentTarget.style.color='var(--accent)'; }}
                              onMouseLeave={e => { e.currentTarget.style.borderColor='var(--ink-4)'; e.currentTarget.style.color='var(--ink-3)'; }}>
                              <svg width="10" height="10" viewBox="0 0 24 24" fill="none"
                                stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
                                <path d="M12 20h9M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4Z"/>
                              </svg>
                            </button>

                            {/* People picker popover */}
                            {addingApprovalFor === d.id && (
                              <>
                                <div style={{position:'fixed', inset:0, zIndex:90}}
                                  onClick={() => setAddingApprovalFor(null)}/>
                                <div style={{position:'absolute', bottom:'calc(100% + 6px)', right:0, zIndex:91,
                                  background:'var(--panel)', border:'1px solid var(--line)', borderRadius:10,
                                  boxShadow:'0 4px 20px -4px oklch(0.15 0.10 265 / 0.18)',
                                  minWidth:190, padding:'6px 0', backdropFilter:'var(--blur)'}}>
                                  <div style={{fontSize:10, fontWeight:700, letterSpacing:'0.06em',
                                    color:'var(--ink-4)', padding:'4px 12px 6px', textTransform:'uppercase'}}>
                                    Request approval from
                                  </div>
                                  {allPeople.filter(p => !taskApprovals.some(a => a.userId === p.id)).map(p => (
                                    <div key={p.id}
                                      onClick={e => {
                                        e.stopPropagation();
                                        updateC({ deliverables: c.deliverables.map(x =>
                                          x.id === d.id ? {...x, approvals: [...taskApprovals, {userId:p.id, status:'pending'}]} : x) });
                                        setAddingApprovalFor(null);
                                      }}
                                      style={{display:'flex', alignItems:'center', gap:9, padding:'7px 12px',
                                        cursor:'pointer', transition:'background 0.1s'}}
                                      onMouseEnter={e => e.currentTarget.style.background='var(--panel-2)'}
                                      onMouseLeave={e => e.currentTarget.style.background='transparent'}>
                                      <Avatar person={p} size={24}/>
                                      <div>
                                        <div style={{fontSize:12.5, fontWeight:600, color:'var(--ink)'}}>{p.name}</div>
                                        <div style={{fontSize:11, color:'var(--ink-3)'}}>{p.role || p.sport || ''}</div>
                                      </div>
                                    </div>
                                  ))}
                                  {allPeople.filter(p => !taskApprovals.some(a => a.userId === p.id)).length === 0 && (
                                    <div style={{padding:'8px 12px', fontSize:12, color:'var(--ink-3)'}}>Everyone added</div>
                                  )}
                                </div>
                              </>
                            )}
                          </div>
                        </div>

                        {/* Remove */}
                        <button onClick={() => updateC({ deliverables: c.deliverables.filter(x => x.id !== d.id) })}
                          style={{background:'none', border:'none', cursor:'pointer', color:'var(--ink-4)',
                            display:'flex', padding:2, borderRadius:4, opacity:0.6}}>
                          <Icons.X size={12}/>
                        </button>
                      </div>
                    );
                  })}
                </div>
              );
            })}

            {/* Add row */}
            <div style={{padding:'10px 18px 12px', display:'flex', flexDirection:'column', gap:5,
              borderTop: c.deliverables.length > 0 ? 'none' : undefined}}>
              <input value={newTitle} onChange={e => setNewTitle(e.target.value)}
                onKeyDown={e => e.key === 'Enter' && addDeliverable()}
                placeholder="+ Add task..."
                style={{background:'none', border:'none', outline:'none', fontSize:13,
                  color:'var(--ink)', width:'100%'}}/>
              {newTitle && (
                <div style={{display:'flex', alignItems:'center', gap:6}}>
                  <Icons.Link size={11} style={{color:'var(--ink-4)', flexShrink:0}}/>
                  <input value={newLink} onChange={e => setNewLink(e.target.value)}
                    onKeyDown={e => e.key === 'Enter' && addDeliverable()}
                    placeholder="Link (optional)..."
                    style={{background:'none', border:'none', outline:'none', fontSize:12.5,
                      color:'var(--ink)', width:'100%'}}/>
                </div>
              )}
            </div>
          </div>

          {/* Brief + Owner */}
          <div className="oa-panel" style={{padding:'16px 18px'}}>
            <div style={{fontSize:13, fontWeight:700, color:'var(--ink)', marginBottom:10}}>Brief</div>
            <textarea className="oa-coverview-desc" value={c.description || ''} rows={3}
              onChange={e => updateC({ description: e.target.value })}
              placeholder="Add a campaign brief or description..."
              style={{marginBottom:0}}/>
            {owner && (
              <div style={{marginTop:12, paddingTop:12, borderTop:'1px solid var(--line)',
                display:'flex', alignItems:'center', gap:10}}>
                <div style={{fontSize:11, fontWeight:500, color:'var(--ink-3)', flexShrink:0, width:36}}>Owner</div>
                <Avatar person={owner} size={24}/>
                <span style={{fontSize:12.5, fontWeight:600, color:'var(--ink)'}}>{owner.name}</span>
                <span style={{fontSize:11.5, color:'var(--ink-3)'}}>{owner.role || 'Account Manager'}</span>
              </div>
            )}
          </div>
        </div>

        {/* RIGHT: Team + Athletes + Activity */}
        <div style={{display:'flex', flexDirection:'column', gap:12}}>

          {/* Campaign Team */}
          <div className="oa-panel" style={{padding:0, overflow:'hidden'}}>
            <div style={{padding:'12px 16px', borderBottom:'1px solid var(--line)',
              display:'flex', alignItems:'center', gap:6}}>
              <span style={{fontSize:13, fontWeight:700, color:'var(--ink)'}}>Campaign Team</span>
              <span style={{fontSize:11.5, color:'var(--ink-3)'}}>{teamList.length} member{teamList.length !== 1 ? 's' : ''}</span>
              <Icons.Plus size={14} style={{marginLeft:'auto', color:'var(--ink-3)', cursor:'pointer'}}/>
            </div>
            <div style={{padding:'6px 0 8px'}}>
              {teamList.map(person => (
                <div key={person.id} style={{display:'flex', alignItems:'center', gap:10, padding:'6px 16px'}}>
                  <Avatar person={person} size={30}/>
                  <div style={{flex:1, minWidth:0}}>
                    <div style={{fontSize:13, fontWeight:600, color:'var(--ink)', whiteSpace:'nowrap',
                      overflow:'hidden', textOverflow:'ellipsis'}}>{person.name}</div>
                    <div style={{fontSize:11, color:'var(--ink-3)'}}>{person.role || person.dept || 'Team'}</div>
                  </div>
                </div>
              ))}
              {teamList.length === 0 && (
                <div style={{padding:'8px 16px', fontSize:12.5, color:'var(--ink-4)', fontStyle:'italic'}}>
                  No team members yet.
                </div>
              )}
            </div>
          </div>

          {/* Athletes */}
          <div className="oa-panel" style={{padding:0, overflow:'hidden'}}>
            <div style={{padding:'12px 16px', borderBottom:'1px solid var(--line)',
              display:'flex', alignItems:'center', gap:6}}>
              <span style={{fontSize:13, fontWeight:700, color:'var(--ink)'}}>Athletes</span>
              <span style={{fontSize:11.5, color:'var(--ink-3)'}}>{athletes.length} on this project</span>
              <Icons.Plus size={14} style={{marginLeft:'auto', color:'var(--ink-3)', cursor:'pointer'}}/>
            </div>
            <div style={{padding:'6px 0 8px'}}>
              {athletes.map(a => (
                <div key={a.id} style={{display:'flex', alignItems:'center', gap:10, padding:'6px 16px'}}>
                  <Avatar person={a} size={30}/>
                  <div style={{flex:1, minWidth:0}}>
                    <div style={{fontSize:13, fontWeight:600, color:'var(--ink)', whiteSpace:'nowrap',
                      overflow:'hidden', textOverflow:'ellipsis'}}>{a.name}</div>
                    <div style={{fontSize:11, color:'var(--ink-3)'}}>{a.sport}{a.position ? ' · ' + a.position : ''}</div>
                  </div>
                  <Icons.Arrow size={12} style={{color:'var(--ink-3)', flexShrink:0, cursor:'pointer'}}/>
                  <button onClick={() => updateC({ athleteIds: c.athleteIds.filter(id => id !== a.id) })}
                    style={{background:'none', border:'none', cursor:'pointer', color:'var(--ink-4)',
                      display:'flex', padding:2, flexShrink:0}}>
                    <Icons.X size={12}/>
                  </button>
                </div>
              ))}
              {athletes.length === 0 && (
                <div style={{padding:'8px 16px', fontSize:12.5, color:'var(--ink-4)', fontStyle:'italic'}}>
                  No athletes added.
                </div>
              )}
            </div>
          </div>

          {/* Activity */}
          <div className="oa-panel" style={{padding:0, overflow:'hidden'}}>
            <div style={{padding:'12px 16px', borderBottom:'1px solid var(--line)'}}>
              <span style={{fontSize:13, fontWeight:700, color:'var(--ink)'}}>Activity</span>
            </div>
            <div style={{padding:'6px 0 8px'}}>
              {activity.map(entry => (
                <div key={entry.id} style={{display:'flex', gap:10, padding:'6px 16px', alignItems:'flex-start'}}>
                  <span style={{fontSize:13, flexShrink:0}}>{entry.icon}</span>
                  <div style={{flex:1, minWidth:0}}>
                    <div style={{fontSize:12.5, color:'var(--ink)', lineHeight:1.4}}>{entry.text}</div>
                    {entry.at && (
                      <div style={{fontSize:11, color:'var(--ink-3)', marginTop:1}}>{fmt.dateLong(entry.at)}</div>
                    )}
                  </div>
                </div>
              ))}
              {activity.length === 0 && (
                <div style={{padding:'8px 16px', fontSize:12.5, color:'var(--ink-4)', fontStyle:'italic'}}>
                  No activity yet.
                </div>
              )}
            </div>
          </div>

        </div>
        {/* end RIGHT */}

      </div>
      {/* end body */}

    </div>
  );
}

// ===== campaign_list_view.jsx =====
// Asana-style campaign list view: project header, tabs, sectioned task table.
function CampaignListView({ campaignId, state, setState, onOpenTask, openTaskId, openAthlete }) {
  const { CAMPAIGNS, BRANDS, TEAM, ATHLETES, PLAYBOOKS } = state;
  const c = CAMPAIGNS.find(x => x.id === campaignId);
  if (!c) return <div className="oa-empty big">Campaign not found.</div>;
  const brand = BRANDS.find(b => b.id === c.brandId);
  const owner = TEAM.find(t => t.id === c.ownerId);

  // Derive active process stage label from playbook
  const _pb            = PLAYBOOKS && PLAYBOOKS.find(p => p.id === c.playbookId);
  const _stages        = _pb ? (c.customStages || _pb.stages) : null;
  const _activeStage   = _stages && _stages.find(s => {
    const steps = c.deliverables.filter(d => d.stageId === s.id);
    return steps.length > 0 && steps.some(d => !d.done);
  });
  const processLabel   = _activeStage ? _activeStage.label
    : (_stages && _stages.length > 0 ? _stages[_stages.length - 1].label : null);
  const [tab, setTab] = useState('overview');
  const [filterOpen, setFilterOpen] = useState(false);

  const updateC = (patch) => setState(s => ({
    ...s, CAMPAIGNS: s.CAMPAIGNS.map(x => x.id === c.id ? { ...x, ...patch } : x),
  }));
  const toggleDeliv = (did) => updateC({
    deliverables: c.deliverables.map(d => d.id === did ? { ...d, done: !d.done } : d),
  });
  const editDeliv = (did, patch) => {
    const teamMemberIds = new Set(TEAM.map(t => t.id));
    const extraTeam = patch.assignee && teamMemberIds.has(patch.assignee)
      ? [...new Set([...(c.teamIds || []), patch.assignee])]
      : c.teamIds;
    updateC({
      deliverables: c.deliverables.map(d => d.id === did ? { ...d, ...patch } : d),
      ...(extraTeam !== c.teamIds ? { teamIds: extraTeam } : {}),
    });
  };
  const addDeliv = (section) => {
    const id = 'd' + Date.now();
    updateC({ deliverables: [...c.deliverables, {
      id, title: 'New task', assignee: owner.id, due: null, done: false,
      campaign: c.id, section: section || 'Deliverables',
    }]});
  };

  const [sortBy,   setSortBy]   = useState('');       // '' | 'name' | 'due' | 'assignee'
  const [sortDir,  setSortDir]  = useState('asc');
  const [sortOpen, setSortOpen] = useState(false);
  const [groupBy,  setGroupBy]  = useState('section'); // 'section' | 'assignee' | 'status' | 'none'
  const [groupOpen, setGroupOpen] = useState(false);
  const [hiddenCols, setHiddenCols] = useState(new Set());
  const [hideOpen, setHideOpen] = useState(false);
  const [shareOpen, setShareOpen] = useState(false);
  const toggleHideCol = col => setHiddenCols(s => { const n = new Set(s); n.has(col) ? n.delete(col) : n.add(col); return n; });

  // group deliverables into sections; default Deliverables, allow Milestones tag via .section
  const sections = useMemo(() => {
    const allPeople = [...TEAM, ...c.athleteIds.map(id => ATHLETES.find(a => a.id === id)).filter(Boolean)];
    // Sort deliverables first
    const sorted = [...c.deliverables].sort((a, b) => {
      if (!sortBy) return 0;
      let av, bv;
      if (sortBy === 'name')     { av = a.title?.toLowerCase() || ''; bv = b.title?.toLowerCase() || ''; }
      if (sortBy === 'due')      { av = a.due || 'zzz'; bv = b.due || 'zzz'; }
      if (sortBy === 'assignee') { av = allPeople.find(p=>p.id===a.assignee)?.name?.toLowerCase()||'zzz'; bv = allPeople.find(p=>p.id===b.assignee)?.name?.toLowerCase()||'zzz'; }
      if (sortBy === 'status')   { av = a.done ? 1 : 0; bv = b.done ? 1 : 0; }
      const cmp = av < bv ? -1 : av > bv ? 1 : 0;
      return sortDir === 'asc' ? cmp : -cmp;
    });
    // Group
    const groups = {};
    sorted.forEach(d => {
      let k;
      if (groupBy === 'section' || groupBy === 'none') k = d.section || 'Deliverables';
      else if (groupBy === 'assignee') { const p = allPeople.find(x => x.id === d.assignee); k = p?.name || 'Unassigned'; }
      else if (groupBy === 'status')  k = d.done ? 'Complete' : 'In progress';
      else k = d.section || 'Deliverables';
      (groups[k] = groups[k] || []).push(d);
    });
    if (groupBy === 'section' && !groups['Deliverables']) groups['Deliverables'] = [];
    if (groupBy === 'section' && !groups['Milestones']) groups['Milestones'] = [];
    return groups;
  }, [c.deliverables, sortBy, sortDir, groupBy, TEAM, ATHLETES]);

  const peopleOpts = [...TEAM, ...c.athleteIds.map(id => ATHLETES.find(a => a.id === id)).filter(Boolean)];
  const [iconPickerOpen,   setIconPickerOpen]   = useState(false);
  const [confirmArchive,   setConfirmArchive]   = useState(false);
  const [editingTitle,     setEditingTitle]     = useState(false);
  const [statusPickerOpen, setStatusPickerOpen] = useState(false);
  const [caretMenuOpen,    setCaretMenuOpen]    = useState(false);
  const [editDetailsOpen,  setEditDetailsOpen]  = useState(false);

  // Close dropdowns on outside click
  useEffect(() => {
    if (!caretMenuOpen && !sortOpen && !groupOpen && !hideOpen && !shareOpen) return;
    const handler = e => {
      if (!e.target.closest('.oa-camp-status-picker') && !e.target.closest('.oa-camp-caret-menu')) {
        setStatusPickerOpen(false);
        setCaretMenuOpen(false);
      }
      if (!e.target.closest('[data-sort-menu]')) setSortOpen(false);
      if (!e.target.closest('[data-group-menu]')) setGroupOpen(false);
      if (!e.target.closest('[data-hide-menu]')) setHideOpen(false);
      if (!e.target.closest('[data-share-menu]')) setShareOpen(false);
    };
    document.addEventListener('mousedown', handler);
    return () => document.removeEventListener('mousedown', handler);
  }, [statusPickerOpen, caretMenuOpen, sortOpen, groupOpen, hideOpen, shareOpen]);

  const doArchive = () => {
    updateC({ status: 'complete' });
    setConfirmArchive(false);
  };

  return (
    <div className="oa-clv">
      <header className="oa-clv-head">
        <div className="oa-clv-titlewrap">
          <div style={{position:'relative'}}>
            <div className="oa-clv-icon"
              style={{background: campColorVal(c), cursor:'pointer', color:'oklch(0.1 0.02 160)'}}
              onClick={() => setIconPickerOpen(v => !v)}
              title="Change icon & color">
              {campIconEl(c, 18)}
            </div>
            {iconPickerOpen && (
              <div className="oa-icon-picker-pop">
                <CampIconPicker c={c} setState={setState} onClose={() => setIconPickerOpen(false)} />
              </div>
            )}
          </div>
          <div style={{minWidth:0}}>
            <div className="oa-clv-title-row">
              {editingTitle ? (
                <input className="oa-clv-title-input"
                  defaultValue={c.title}
                  autoFocus
                  onBlur={e => { updateC({ title: e.target.value.trim() || c.title }); setEditingTitle(false); }}
                  onKeyDown={e => { if (e.key === 'Enter') e.target.blur(); if (e.key === 'Escape') setEditingTitle(false); }}
                />
              ) : (
                <h2 className="oa-clv-title" onClick={() => setEditingTitle(true)} title="Click to rename">
                  {c.title}
                </h2>
              )}
              <button className="oa-iconbtn sm" title={c.starred ? 'Unstar' : 'Star campaign'}
                style={{color: c.starred ? 'oklch(0.82 0.22 82)' : undefined}}
                onClick={() => updateC({ starred: !c.starred })}>
                <Icons.Star size={13} fill={c.starred ? 'currentColor' : 'none'} stroke={c.starred ? 0 : 1.8}/>
              </button>
              {/* Caret dropdown */}
              <div style={{position:'relative'}}>
                <button className="oa-iconbtn sm" title="Campaign options"
                  onClick={() => { setCaretMenuOpen(o => !o); setStatusPickerOpen(false); }}>
                  <Icons.Caret size={11}/>
                </button>
                {caretMenuOpen && (
                  <div className="oa-camp-caret-menu">
                    <button className="oa-camp-caret-opt"
                      onClick={() => { setEditingTitle(true); setCaretMenuOpen(false); }}>
                      <Icons.Pencil size={12}/> Rename
                    </button>
                    <button className="oa-camp-caret-opt"
                      onClick={() => { setEditDetailsOpen(true); setCaretMenuOpen(false); }}>
                      <Icons.Doc size={12}/> Edit details
                    </button>
                    <div style={{height:1, background:'var(--line)', margin:'3px 4px'}}/>
                    <button className="oa-camp-caret-opt danger"
                      onClick={() => { setConfirmArchive(true); setCaretMenuOpen(false); }}>
                      <Icons.Archive size={12}/> Archive campaign
                    </button>
                  </div>
                )}
              </div>
            </div>
            <div className="oa-clv-sub">
              {processLabel && (
                <span style={{fontSize:12.5, fontWeight:600, color:'var(--accent-ink)'}}>{processLabel}</span>
              )}
              {processLabel && <span className="oa-dotsep">·</span>}
              <span>{brand?.name}</span>
            </div>
          </div>
        </div>
        <div className="oa-clv-collab">
          <AvatarStack people={[owner, ...c.athleteIds.map(id => ATHLETES.find(a => a.id === id))].filter(Boolean)} size={26} max={4}/>
          {c.status === 'complete'
            ? <Button kind="ghost" size="sm" onClick={() => updateC({ status: 'active' })}>Restore</Button>
            : <button className="oa-btn-archive" onClick={() => setConfirmArchive(true)}>
                <Icons.Archive size={12}/> Archive
              </button>
          }
          <div style={{position:'relative'}} data-share-menu>
            <Button kind="primary" size="sm" icon={<Icons.UserPlus size={12}/>} onClick={() => setShareOpen(o=>!o)}>Share</Button>
            {shareOpen && (
              <div style={{position:'absolute', top:'calc(100% + 8px)', right:0, zIndex:50,
                background:'var(--panel-solid)', border:'1px solid var(--line)', borderRadius:12,
                boxShadow:'var(--shadow-pop)', padding:16, minWidth:280}}>
                <div style={{fontWeight:700, fontSize:14, marginBottom:4}}>Share campaign</div>
                <div style={{fontSize:12, color:'var(--ink-3)', marginBottom:12}}>Team members with access:</div>
                {[c.ownerId, ...c.athleteIds].map(uid => {
                  const person = [...TEAM, ...ATHLETES].find(p => p.id === uid);
                  if (!person) return null;
                  return (
                    <div key={uid} style={{display:'flex', alignItems:'center', gap:8, padding:'6px 0', borderBottom:'1px solid var(--line-2)'}}>
                      <Avatar person={person} size={24}/>
                      <span style={{flex:1, fontSize:13}}>{person.name}</span>
                      <span style={{fontSize:11, color:'var(--ink-3)'}}>{uid === c.ownerId ? 'Owner' : 'Athlete'}</span>
                    </div>
                  );
                })}
                <div style={{marginTop:12, fontSize:12, color:'var(--ink-3)', fontStyle:'italic'}}>
                  Invite teammates by adding them to the campaign via Campaign Settings.
                </div>
                <button className="oa-btn kind-primary" style={{width:'100%', marginTop:10, fontSize:12}}
                  onClick={() => setShareOpen(false)}>Done</button>
              </div>
            )}
          </div>
        </div>
      </header>

      <div className="oa-clv-tabs">
        {['Overview','Process','Timeline','Calendar','Files'].map(t => {
          const k = t.toLowerCase();
          const on = tab === k;
          return (
            <button key={t} className={`oa-clv-tab ${on ? 'on' : ''}`} onClick={() => setTab(k)}>
              {t}
            </button>
          );
        })}
        <button className="oa-clv-tab add" title="Add custom section"
          onClick={() => { const name = window.prompt('New section name:'); if (name?.trim()) { const id = 'd_sec_' + Date.now(); updateC({ deliverables: [...c.deliverables, { id, title: 'New task', assignee: owner.id, due: null, done: false, campaign: c.id, section: name.trim() }] }); setTab('process'); } }}>
          <Icons.Plus size={11}/>
        </button>
      </div>

      {/* ── Overview tab: full project dashboard ───────── */}
      {tab === 'overview' && (
        <CampOverviewView
          key={campaignId}
          c={c}
          state={state}
          setState={setState}
          openTaskView={() => setTab('process')}
          openProcessView={() => setTab('process')}
        />
      )}

      {tab === 'timeline' && <CampTimelineView c={c} state={state} />}
      {tab === 'calendar' && <CampCalendarView c={c} state={state} setState={setState} />}
      {tab === 'process'  && <CampWorkflowView c={c} state={state} setState={setState} />}
      {tab === 'dashboard'&& <CampDashView     c={c} state={state} />}
      {tab === 'messages' && <CampMessagesView c={c} state={state} setState={setState} />}
      {tab === 'files'    && <CampFilesView    c={c} state={state} setState={setState} />}

      {/* Edit details modal */}
      {editDetailsOpen && (
        <CampEditModal c={c} state={state} setState={setState} onClose={() => setEditDetailsOpen(false)} />
      )}

      {/* Archive confirmation modal */}
      <Modal open={confirmArchive} onClose={() => setConfirmArchive(false)} width={420}>
        <div style={{padding:'24px 24px 8px'}}>
          <h3 style={{margin:'0 0 12px', fontSize:16, fontWeight:700}}>Archive this campaign?</h3>
          <p className="oa-confirm-body">
            <strong>{c.title}</strong> will be moved to Archived. All data is preserved and you can restore it at any time.
          </p>
          <div style={{display:'flex', justifyContent:'flex-end', gap:8, marginTop:24, paddingBottom:8}}>
            <Button kind="ghost" onClick={() => setConfirmArchive(false)}>Cancel</Button>
            <Button kind="primary" onClick={doArchive}>Archive campaign</Button>
          </div>
        </div>
      </Modal>
    </div>
  );
}

function TaskSection({ name, items, campaign, peopleOpts, TEAM, hiddenCols = new Set(), onToggle, onEdit, onAdd, onOpen, openTaskId }) {

        {items.map(d => {

                <span className="oa-clv-taskname">{d.title}</span>

              {!hiddenCols.has('assignee') && (
                <div className="oa-clv-cell">

// ── Playbook Browser (used inside Board view) ────────────
function PlaybookBrowser({ state, c, updateC, onClose }) {
  const { PLAYBOOKS } = state;
  const [selectedPbId, setSelectedPbId] = useState(PLAYBOOKS[0]?.id || null);
  const [collapsed, setCollapsed]       = useState({});

  const playbook = PLAYBOOKS.find(p => p.id === selectedPbId) || PLAYBOOKS[0];

  // Which playbook steps are already on this campaign's board
  // Matches by playbookStepId OR exact title — no fuzzy matching
  const addedKeys = useMemo(() => {
    const ids    = new Set();
    const titles = new Set();
    c.deliverables.forEach(d => {
      if (d.playbookStepId) ids.add(d.playbookStepId);
      if (d.title)          titles.add(d.title);
    });
    return { ids, titles };
  }, [c.deliverables]);

  const addStep = (step, stage) => {
    const id = 'pb_' + Date.now();
    updateC({ deliverables: [...c.deliverables, {
      id,
      title: step.title,
      assignee: null,
      due: null,
      done: false,
      boardCol: 'todo',
      section: stage.label,
      campaign: c.id,
      playbookStepId: step.id,
    }]});
  };

  const toggleStage = id => setCollapsed(prev => ({ ...prev, [id]: !prev[id] }));

  return (
    <div className="oa-pb-browser">
      {/* Header */}
      <div className="oa-pb-browser-head">
        <div>
          <div style={{fontSize:13, fontWeight:700, color:'var(--ink-1)', lineHeight:1.2}}>Playbook Steps</div>
          <div style={{fontSize:11, color:'var(--ink-3)', marginTop:3}}>Insert preset to-dos onto your board</div>
        </div>
        <button onClick={onClose}
          style={{background:'none', border:'none', cursor:'pointer', color:'var(--ink-3)', padding:'2px', marginTop:1, flexShrink:0}}>
          <Icons.X size={13}/>
        </button>
      </div>

      {/* Playbook selector */}
      {PLAYBOOKS.length > 1 && (
        <div style={{padding:'8px 12px', borderBottom:'1px solid var(--line)', flexShrink:0}}>
          <select className="oa-inline-select" value={selectedPbId}
            onChange={e => setSelectedPbId(e.target.value)} style={{width:'100%', fontSize:12}}>
            {PLAYBOOKS.map(pb => <option key={pb.id} value={pb.id}>{pb.name}</option>)}
          </select>
        </div>
      )}

      {/* Stages + Steps */}
      <div className="oa-pb-browser-body">
        {playbook && playbook.stages.map(stage => {
          const isCollapsed = collapsed[stage.id];
          const addedInStage = stage.steps.filter(s => addedKeys.ids.has(s.id) || addedKeys.titles.has(s.title)).length;

          return (
            <div key={stage.id}>
              {/* Stage header */}
              <button className="oa-pb-stage-btn" onClick={() => toggleStage(stage.id)}>
                <span style={{
                  fontSize: 10.5, fontWeight: 700, color: 'var(--ink-2)',
                  textTransform: 'uppercase', letterSpacing: '0.05em', flex: 1,
                }}>{stage.label}</span>
                {addedInStage > 0 && (
                  <span style={{fontSize:10, color:'oklch(0.65 0.22 145)', fontWeight:600, fontFamily:'var(--mono)'}}>
                    {addedInStage}/{stage.steps.length}
                  </span>
                )}
                <span style={{
                  fontSize: 9, color: 'var(--ink-4)',
                  transform: isCollapsed ? 'rotate(-90deg)' : 'none',
                  transition: 'transform 0.15s', display:'inline-block',
                }}>▼</span>
              </button>

              {/* Steps */}
              {!isCollapsed && stage.steps.map(step => {
                const added = addedKeys.ids.has(step.id) || addedKeys.titles.has(step.title);
                return (
                  <div key={step.id} className="oa-pb-step-row" style={{opacity: added ? 0.55 : 1}}>
                    <span style={{fontSize:12, color:'var(--ink-1)', flex:1, lineHeight:1.35}}>{step.title}</span>
                    {step.roles.length > 0 && (
                      <span style={{
                        fontSize: 9.5, color: 'var(--ink-4)', flexShrink: 0,
                        background: 'var(--panel-2)', padding: '1px 5px', borderRadius: 4,
                        border: '1px solid var(--line)',
                      }}>{step.roles[0]}</span>
                    )}
                    <button
                      className={`oa-pb-add-btn${added ? ' added' : ''}`}
                      disabled={added}
                      onClick={() => !added && addStep(step, stage)}>
                      {added ? '✓' : '+ Add'}
                    </button>
                  </div>
                );
              })}
            </div>
          );
        })}
      </div>
    </div>
  );
}

// ── Board view ──────────────────────────────────────────
function CampBoardView({ c, state, setState, onOpenTask, openTaskId }) {
  const { TEAM, ATHLETES } = state;
  const people = [...TEAM, ...c.athleteIds.map(id => ATHLETES.find(a => a.id === id)).filter(Boolean)];

  const updateC = patch => setState(s => ({
    ...s, CAMPAIGNS: s.CAMPAIGNS.map(x => x.id === c.id ? { ...x, ...patch } : x),
  }));
  const updateDeliv = (did, patch) => updateC({
    deliverables: c.deliverables.map(d => d.id === did ? { ...d, ...patch } : d),
  });
  const removeDeliv = did => updateC({
