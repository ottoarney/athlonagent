            <InboxPage state={state} currentUserId={currentUserId}
              openCampaign={openCampaignInMain} openAthlete={openAthlete} />
          )}
          {route.kind === 'team' && route.id && (
            <TeamPage state={state} query={query} openMember={openMember} filterDept={route.id} />
          )}
        </div>
      </main>

      <Drawer open={!!openCamp} onClose={() => setOpenCampId(null)} width={760}>
        {openCamp && <CampaignDrawer campaign={openCamp} state={state} setState={setState}
          onClose={() => setOpenCampId(null)}
          openAthlete={(id) => { setOpenCampId(null); setTimeout(() => openAthlete(id), 180); }} />}
      </Drawer>
      <Drawer open={!!openAth} onClose={() => setOpenAthId(null)} width={680}>
        {openAth && <AthleteDrawer athlete={openAth} state={state} setState={setState}
          onClose={() => setOpenAthId(null)}
          openCampaign={(id) => { setOpenAthId(null); setTimeout(() => openCampaignInMain(id), 180); }} />}
      </Drawer>
      <Drawer open={!!openClientId} onClose={() => setOpenClientId(null)} width={700}>
        {openClientId && <ClientDrawer clientId={openClientId} state={state} setState={setState}
          onClose={() => setOpenClientId(null)}
          openCampaign={(id) => { setOpenClientId(null); setTimeout(() => openCampaignInMain(id), 180); }} />}
      </Drawer>
      <Drawer open={!!openMemberId} onClose={() => setOpenMemberId(null)} width={680}>
        {openMemberId && <TeamMemberDrawer memberId={openMemberId} state={state}
          onClose={() => setOpenMemberId(null)}
          openCampaign={(id) => { setOpenMemberId(null); setTimeout(() => openCampaignInMain(id), 180); }} />}
      </Drawer>

      <AddCampaignModal open={addCampOpen} onClose={() => setAddCampOpen(false)} state={state} setState={setState} />
      <AddAthleteModal open={addAthOpen} onClose={() => setAddAthOpen(false)} state={state} setState={setState} />
      <AddClientModal open={addClientOpen} onClose={() => setAddClientOpen(false)} state={state} setState={setState} />

      {/* My Profile drawer */}
      <Drawer open={profileOpen} onClose={() => setProfileOpen(false)} width={500}>
        {profileOpen && <MyProfilePanel userId={currentUserId} state={state} setState={setState} onClose={() => setProfileOpen(false)}/>}
      </Drawer>

      {tweaksOpen && (
        <TweaksPanel
          home={home} setHome={v => { setHome(v); persistTweak({ home: v }); }}
          density={density} setDensity={v => { setDensity(v); persistTweak({ density: v }); }}
          dark={dark} setDark={v => { setDark(v); persistTweak({ dark: v }); }}
          onClose={() => setTweaksOpen(false)}
        />
      )}
    </div>
  );
}

// ── My Profile Panel ──────────────────────────────────────
function MyProfilePanel({ userId, state, setState, onClose }) {
  const { TEAM, CAMPAIGNS, SPIDER_AXES } = state;
  const me = TEAM.find(t => t.id === userId);
  if (!me) return null;

  const updateMe = (patch) => setState(s => ({
    ...s, TEAM: s.TEAM.map(t => t.id === userId ? { ...t, ...patch } : t),
  }));

  const axes = SPIDER_AXES['creative'] || ['Video', 'Photo', 'Graphics', 'Copy', 'Direction'];
  const spider = me.spider && me.spider.length === axes.length ? me.spider : axes.map(() => 8);

  // Stats
  const openTasks = CAMPAIGNS.flatMap(c => c.deliverables.filter(d => d.assignee === userId && !d.done));
  const ownedCampaigns = CAMPAIGNS.filter(c => c.ownerId === userId);
  const activeCampaigns = ownedCampaigns.filter(c => c.status === 'active');
  const customDelivsReviewing = CAMPAIGNS.flatMap(c => (c.customDeliverables||[]).filter(d => d.assignee === userId && (d.reviewStatus === 'submitted' || d.reviewStatus === 'needs_revisions')));

  // Photo upload
  const fileRef = useRef(null);
  const handlePhotoChange = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => updateMe({ photo: ev.target.result });
    reader.readAsDataURL(file);
  };

  const avail = me.availability || 'active';
  const availLabels = { active: '● Active', busy: '◑ Busy', ooo: '○ Out of Office' };

  return (
    <div className="oa-drawer-inner">
      {/* Header */}
      <div className="oa-drawer-head" style={{borderBottom:'1px solid var(--line)', paddingBottom:20}}>
        <div style={{display:'flex', alignItems:'flex-start', gap:16, flex:1}}>
          {/* Photo */}
          <div className="oa-profile-photo-ring">
            {me.photo
              ? <img src={me.photo} alt={me.name}/>
              : <div className="oa-profile-initials" style={{background:`oklch(0.68 0.09 ${me.hue||200})`}}>{me.initials || me.name?.slice(0,2).toUpperCase()}</div>
            }
            <button className="oa-profile-upload-btn" title="Upload photo" onClick={() => fileRef.current?.click()}>
              <Icons.Camera size={12}/>
            </button>
            <input ref={fileRef} type="file" accept="image/*" style={{display:'none'}} onChange={handlePhotoChange}/>
          </div>

          {/* Name + role + availability */}
          <div style={{flex:1, minWidth:0}}>
            <div style={{fontSize:10.5, fontWeight:700, textTransform:'uppercase', letterSpacing:'0.07em', color:'var(--ink-4)', marginBottom:4}}>
              {me.dept?.charAt(0).toUpperCase() + me.dept?.slice(1)} · Oregon Accelerator
            </div>
            <input
              value={me.name || ''}
              onChange={e => updateMe({ name: e.target.value })}
              style={{
                background:'transparent', border:'none', outline:'none',
                fontSize:20, fontWeight:700, color:'var(--ink)', fontFamily:'var(--font)',
                width:'100%', padding:0, marginBottom:2,
              }}
              placeholder="Your name"
            />
            <input
              value={me.role || ''}
              onChange={e => updateMe({ role: e.target.value })}
              style={{
                background:'transparent', border:'none', outline:'none',
                fontSize:13, color:'var(--ink-3)', fontFamily:'var(--font)',
                width:'100%', padding:0, marginBottom:10,
              }}
              placeholder="Position / Role"
            />
            <div className="oa-avail-bar">
              {['active','busy','ooo'].map(k => (
                <button key={k} className={`oa-avail-btn ${avail === k ? k+'-status' : ''}`}
                  onClick={() => updateMe({ availability: k })}>
                  {k === 'active' ? 'Active' : k === 'busy' ? 'Busy' : 'Out of Office'}
                </button>
              ))}
            </div>
          </div>
        </div>
        <button className="oa-iconbtn" onClick={onClose}><Icons.X size={14}/></button>
      </div>

      <div className="oa-drawer-body" style={{display:'flex', flexDirection:'column', gap:22}}>

        {/* Stats row */}
        <div className="oa-profile-stat-row">
          <div className="oa-profile-stat">
            <div className="oa-profile-stat-val">{ownedCampaigns.length}</div>
            <div className="oa-profile-stat-lbl">Campaigns</div>
          </div>
          <div className="oa-profile-stat">
            <div className="oa-profile-stat-val">{activeCampaigns.length}</div>
            <div className="oa-profile-stat-lbl">Active</div>
          </div>
          <div className="oa-profile-stat">
            <div className="oa-profile-stat-val">{openTasks.length}</div>
            <div className="oa-profile-stat-lbl">Open Tasks</div>
          </div>
          <div className="oa-profile-stat">
            <div className="oa-profile-stat-val">{customDelivsReviewing.length}</div>
            <div className="oa-profile-stat-lbl">In Review</div>
          </div>
        </div>

        {/* Contact info */}
        <section>
          <h4 style={{margin:'0 0 10px', fontSize:12, fontWeight:700, textTransform:'uppercase', letterSpacing:'0.07em', color:'var(--ink-4)'}}>Contact</h4>
          <div className="oa-profile-field-grid">
            <div className="oa-profile-field editable">
              <label>Email</label>
              <input value={me.email||''} onChange={e=>updateMe({email:e.target.value})} placeholder="you@oregonaccelerator.com"/>
            </div>
            <div className="oa-profile-field editable">
              <label>Phone</label>
              <input value={me.phone||''} onChange={e=>updateMe({phone:e.target.value})} placeholder="(541) 555-0000"/>
            </div>
            <div className="oa-profile-field editable">
              <label><span style={{display:'flex',alignItems:'center',gap:4}}><Icons.Slack size={10}/>Slack</span></label>
              <input value={me.slack||''} onChange={e=>updateMe({slack:e.target.value})} placeholder="@handle"/>
            </div>
            <div className="oa-profile-field editable">
              <label>LinkedIn</label>
              <input value={me.linkedin||''} onChange={e=>updateMe({linkedin:e.target.value})} placeholder="linkedin.com/in/…"/>
            </div>
            <div className="oa-profile-field editable oa-profile-field-full">
              <label>Bio</label>
              <textarea rows={4} value={me.bio||''} onChange={e=>updateMe({bio:e.target.value})}
                placeholder="A short bio about yourself, your strengths, and what you bring to the team…"/>
            </div>
          </div>
        </section>

        {/* Creative Strengths */}
        <section>
          <div style={{display:'flex', alignItems:'center', justifyContent:'space-between', marginBottom:12}}>
            <h4 style={{margin:0, fontSize:12, fontWeight:700, textTransform:'uppercase', letterSpacing:'0.07em', color:'var(--ink-4)'}}>Creative Strengths</h4>
            <span style={{fontSize:11, color:'var(--ink-4)'}}>Avg {(spider.reduce((s,v)=>s+v,0)/spider.length).toFixed(1)} / 10</span>
          </div>
          {/* Radar preview */}
          <div style={{display:'flex', justifyContent:'center', marginBottom:16}}>
            <Radar values={spider} axes={axes} hue={me.hue||200} size={220}/>
          </div>
          {/* Editable sliders */}
          <div className="oa-strength-list">
            {axes.map((axis, i) => {
              const val = spider[i] ?? 8;
              return (
                <div key={axis} className="oa-strength-row">
                  <span className="oa-strength-label">{axis}</span>
                  <div className="oa-strength-track" onClick={e => {
                    const rect = e.currentTarget.getBoundingClientRect();
                    const pct = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
                    const newVal = Math.round(pct * 10);
                    const newSpider = spider.map((v, j) => j === i ? newVal : v);
                    updateMe({ spider: newSpider });
                  }}>
                    <div className="oa-strength-fill" style={{width: (val/10*100)+'%'}}/>
                  </div>
                  <span className="oa-strength-val">{val}</span>
                  <div className="oa-strength-btns">
                    <button className="oa-strength-adj" onClick={() => {
                      if (val > 0) updateMe({ spider: spider.map((v, j) => j===i ? v-1 : v) });
                    }}>−</button>
                    <button className="oa-strength-adj" onClick={() => {
                      if (val < 10) updateMe({ spider: spider.map((v, j) => j===i ? v+1 : v) });
                    }}>+</button>
                  </div>
                </div>
              );
            })}
          </div>
        </section>

        {/* Recent owned campaigns */}
        {ownedCampaigns.length > 0 && (
          <section>
            <h4 style={{margin:'0 0 10px', fontSize:12, fontWeight:700, textTransform:'uppercase', letterSpacing:'0.07em', color:'var(--ink-4)'}}>My Campaigns</h4>
            {ownedCampaigns.map(c => (
              <div key={c.id} className="oa-minirow" style={{marginBottom:3}}>
                <StatusChip status={c.status} dense/>
                <span className="oa-minirow-title">{c.title}</span>
                <span className="oa-minirow-meta">{fmt.moneyShort(c.budget)}</span>
              </div>
            ))}
          </section>
        )}

        {/* Joined */}
        <div style={{fontSize:11.5, color:'var(--ink-4)', textAlign:'center', paddingTop:4, borderTop:'1px solid var(--line-2)'}}>
          Member since {me.joined ? new Date(me.joined+'T00:00').toLocaleDateString('en-US',{month:'long', year:'numeric'}) : 'Oregon Accelerator'}
        </div>
      </div>
    </div>
  );
}

// Simple My Tasks view - Asana-style
function MyTasksPage({ state, setState, userId, openCampaign }) {
  const { CAMPAIGNS, TEAM } = state;
  const me = TEAM.find(t => t.id === userId);
  const tasks = useMemo(() => {
    const rows = [];
    CAMPAIGNS.forEach(c => c.deliverables.forEach(d => {
      if (d.assignee === userId) rows.push({ ...d, campaign: c });
    }));
    return rows.sort((a,b) => (a.due || 'z').localeCompare(b.due || 'z'));
  }, [CAMPAIGNS, userId]);

  const toggle = (campId, did) => setState(s => ({
    ...s, CAMPAIGNS: s.CAMPAIGNS.map(c => c.id === campId
      ? {...c, deliverables: c.deliverables.map(d => d.id === did ? {...d, done:!d.done} : d)}
      : c),
  }));

  return (
    <div className="oa-page">
      <div className="oa-page-head">
        <h1><Avatar person={me} size={32}/> My tasks</h1>
      </div>
      <div className="oa-clv-table" style={{margin:0}}>
        <div className="oa-clv-thead">
          <div className="oa-clv-th name">Task</div>
          <div className="oa-clv-th">Project</div>
          <div className="oa-clv-th">Due</div>
          <div className="oa-clv-th">Status</div>
        </div>
        {tasks.map(t => {
          const days = fmt.daysUntil(t.due);
          return (
            <div key={t.id} className={`oa-clv-row ${t.done ? 'done':''}`}>
              <div className="oa-clv-cell name">
                <button className={`oa-check ${t.done ? 'done' : ''}`} onClick={() => toggle(t.campaign.id, t.id)}>
                  {t.done && <Icons.Check size={11} stroke={2.4}/>}
                </button>
                <span className="oa-clv-taskname">{t.title}</span>
              </div>
              <div className="oa-clv-cell">
                <button className="oa-tag dense" onClick={() => openCampaign(t.campaign.id)}>{t.campaign.title}</button>
              </div>
              <div className={`oa-clv-cell ${days != null && days < 0 && !t.done ? 'late' : ''}`}>
                {t.due ? fmt.date(t.due) : <span className="oa-ph">—</span>}
              </div>
              <div className="oa-clv-cell"><StatusChip status={t.campaign.status} dense/></div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

// Simple Inbox (mock notifications)
function InboxPage({ state, currentUserId, openCampaign, openAthlete }) {
  const { CAMPAIGNS, TEAM, ATHLETES } = state;
  const items = useMemo(() => {
    const out = [];
    CAMPAIGNS.slice(0, 6).forEach((c, i) => {
      const owner = TEAM.find(t => t.id === c.ownerId);
      const athlete = ATHLETES.find(a => a.id === c.athleteIds[0]);
      out.push({ id:'n'+i+'a', icon:'assigned', user: owner, text:<>assigned you to <b>{c.deliverables[0]?.title}</b> in</>, target: c, ago:'2h' });
      if (athlete) out.push({ id:'n'+i+'b', icon:'mention', user: owner, text:<>mentioned you in <b>{c.title}</b> — follow-up with {athlete.name}</>, target: c, ago:'5h' });
    });
    return out;
  }, [CAMPAIGNS]);
  return (
    <div className="oa-page">
      <div className="oa-page-head"><h1>Inbox</h1></div>
      <div className="oa-inbox">
        {items.map(it => (
          <button key={it.id} className="oa-inbox-item" onClick={() => openCampaign(it.target.id)}>
            <Avatar person={it.user} size={28}/>
            <div className="oa-inbox-body">
              <div><strong>{it.user?.name}</strong> {it.text} <span className="oa-inbox-proj">{it.target.title}</span></div>
              <div className="oa-inbox-time">{it.ago} ago</div>
            </div>
            <span className={`oa-inbox-dot ${it.icon}`}/>
          </button>
        ))}
      </div>
    </div>
  );
}

function TweaksPanel({ home, setHome, density, setDensity, dark, setDark, onClose }) {
  return (
    <div className="oa-tweaks">
      <div className="oa-tweaks-head">
        <h4>Tweaks</h4>
        <button className="oa-iconbtn" onClick={onClose}><Icons.X size={12}/></button>
      </div>
      <div className="oa-tweak-group">
        <div className="oa-tweak-label">Default home view</div>
        <div className="oa-seg sm full">
          {['dashboard','athletes','campaigns','clients','team'].map(v => (
            <button key={v} className={home === v ? 'on' : ''} onClick={() => setHome(v)}>{v}</button>
          ))}
        </div>
      </div>
      <div className="oa-tweak-group">
        <div className="oa-tweak-label">Density</div>
        <div className="oa-seg sm full">
          {['dense','comfortable','spacious'].map(v => (
            <button key={v} className={density === v ? 'on' : ''} onClick={() => setDensity(v)}>{v}</button>
          ))}
        </div>
      </div>
      <div className="oa-tweak-group">
        <div className="oa-tweak-label">Theme</div>
        <div className="oa-seg sm full">
          <button className={!dark ? 'on' : ''} onClick={() => setDark(false)}>Light</button>
          <button className={dark ? 'on' : ''} onClick={() => setDark(true)}>Dark</button>
        </div>
      </div>
    </div>
  );
}

window.App = App;

ReactDOM.createRoot(document.getElementById('root')).render(<App />);

</script>
