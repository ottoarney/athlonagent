  box-shadow: var(--shadow-card), inset 0 0 0 1px oklch(0.6 0.14 var(--tab-hue) / 0.3), var(--stroke-inner);
}
.oa-dept-tab-mark {
  width: 38px; height: 38px; border-radius: var(--radius);
  background: oklch(0.92 0.06 var(--tab-hue));
  color: oklch(0.35 0.12 var(--tab-hue));
  display: flex; align-items: center; justify-content: center;
  font-size: 12px; font-weight: 700; letter-spacing: 0.04em;
  flex-shrink: 0; box-shadow: var(--stroke-inner);
}
html[data-theme="dark"] .oa-dept-tab-mark {
  background: oklch(0.4 0.12 var(--tab-hue) / 0.4);
  color: oklch(0.9 0.12 var(--tab-hue));
}
.oa-dept-tab-body { min-width: 0; flex: 1; }
.oa-dept-tab-name { font-size: 13.5px; font-weight: 600; color: var(--ink); }
.oa-dept-tab-meta { font-size: 11.5px; color: var(--ink-3); margin-top: 2px; }

/* ── Capacity finder ────────────────── */
.oa-capfinder {
  background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius-xl);
  backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur);
  padding: 20px; margin-bottom: 24px;
  box-shadow: var(--shadow-card), var(--stroke-inner);
}
.oa-capfinder-head {
  display: flex; justify-content: space-between; gap: 20px;
  align-items: flex-start; flex-wrap: wrap;
  padding-bottom: 16px; margin-bottom: 16px;
  border-bottom: 1px solid var(--line-2);
}
.oa-capfinder-title-wrap { display: flex; gap: 12px; align-items: flex-start; }
.oa-capfinder-icon {
  width: 36px; height: 36px; border-radius: var(--radius);
  background: var(--accent-wash); color: var(--accent-ink);
  display: flex; align-items: center; justify-content: center;
  box-shadow: var(--stroke-inner); flex-shrink: 0;
}
.oa-capfinder-title { margin: 0; font-size: 16px; font-weight: 600; letter-spacing: -0.01em; }
.oa-capfinder-filters { display: flex; gap: 10px; flex-wrap: wrap; }
.oa-capfinder-filter {
  display: flex; flex-direction: column; gap: 4px;
}
.oa-capfinder-label {
  font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em;
  color: var(--ink-3); font-weight: 600;
}
.oa-capfinder-filter select {
  padding: 7px 10px; border: 1px solid var(--line); border-radius: var(--radius);
  background: var(--panel-2); color: var(--ink); font-size: 12.5px; font-weight: 500;
  font-family: var(--font); min-width: 160px;
}

.oa-capfinder-grid {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 12px;
}
.oa-capcard {
  position: relative; text-align: left;
  background: var(--panel-2); border: 1px solid var(--line-2); border-radius: var(--radius-lg);
  padding: 14px; cursor: pointer; transition: all .14s ease;
  display: flex; flex-direction: column; gap: 12px;
  box-shadow: var(--stroke-inner);
}
.oa-capcard:hover {
  background: var(--panel); transform: translateY(-2px);
  box-shadow: var(--shadow-card), var(--stroke-inner);
  border-color: oklch(0.6 0.14 var(--cap-hue) / 0.4);
}
.oa-capcard-crown {
  position: absolute; top: -8px; right: 12px;
  background: var(--accent); color: #fff;
  font-size: 9.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em;
  padding: 3px 8px; border-radius: 999px;
  box-shadow: 0 2px 6px oklch(0 0 0 / 0.2);
}
.oa-capcard-top { display: flex; gap: 10px; align-items: center; }
.oa-capcard-name { font-size: 13.5px; font-weight: 600; color: var(--ink); }
.oa-capcard-role { font-size: 11.5px; color: var(--ink-3); margin-top: 1px; }
.oa-capcard-dept {
  display: flex; align-items: center; gap: 6px;
  font-size: 11.5px; color: var(--ink-2); font-weight: 500;
}
.oa-dept-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }

.oa-capcard-meter { display: flex; flex-direction: column; gap: 6px; }
.oa-capcard-meter-head {
  display: flex; justify-content: space-between; align-items: center;
}
.oa-capcard-meter-label {
  font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em;
  color: var(--ink-3); font-weight: 600;
}
.oa-capbar {
  height: 6px; background: var(--panel-3); border-radius: 999px; overflow: hidden;
  box-shadow: var(--stroke-inner);
}
.oa-capbar.mini { height: 4px; }
.oa-capbar-fill { height: 100%; border-radius: 999px; transition: width .3s ease; }
.oa-capcard-meter-foot {
  display: flex; justify-content: space-between;
  font-size: 11px; color: var(--ink-3);
}
.oa-capcard-skill {
  display: flex; justify-content: space-between; align-items: center;
  padding: 8px 10px; background: var(--panel-3); border-radius: var(--radius);
  font-size: 11.5px; color: var(--ink-2);
}
.oa-capcard-skill-score { font-weight: 700; color: var(--ink); font-size: 12px; }

/* ── Directory ────────────────────── */
.oa-directory {
  background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius-xl);
  backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur);
  padding: 20px; box-shadow: var(--shadow-card), var(--stroke-inner);
}
.oa-directory-head {
  display: flex; justify-content: space-between; align-items: flex-end;
  gap: 20px; flex-wrap: wrap; margin-bottom: 16px;
  padding-bottom: 14px; border-bottom: 1px solid var(--line-2);
}
.oa-directory-title { margin: 0 0 2px; font-size: 16px; font-weight: 600; letter-spacing: -0.01em; }
.oa-directory-grid { display: flex; flex-direction: column; gap: 4px; }
.oa-dir-row {
  display: grid;
  grid-template-columns: 36px 1fr 160px 180px 56px 56px 14px;
  gap: 14px; align-items: center;
  padding: 10px 14px; background: var(--panel-2); border: 1px solid transparent;
  border-radius: var(--radius); cursor: pointer; transition: all .12s;
  text-align: left; min-width: 0;
}
.oa-dir-row:hover {
  background: var(--panel); border-color: var(--line-2);
  transform: translateX(2px);
}
.oa-dir-main { min-width: 0; }
.oa-dir-name { font-size: 13.5px; font-weight: 600; color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.oa-dir-role { font-size: 11.5px; color: var(--ink-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.oa-dir-dept {
  display: flex; align-items: center; gap: 6px;
  font-size: 12px; color: var(--ink-2);
}
.oa-dir-meter {
  display: flex; flex-direction: column; gap: 4px;
}
.oa-dir-load {
  text-align: center; font-size: 15px; font-weight: 700; color: var(--ink); line-height: 1;
}
.oa-dir-load-l {
  display: block; font-family: var(--font); font-size: 9px; text-transform: uppercase;
  letter-spacing: 0.08em; color: var(--ink-3); font-weight: 600; margin-top: 2px;
}

@media (max-width: 880px) {
  .oa-dir-row { grid-template-columns: 36px 1fr 56px 14px; }
  .oa-dir-dept, .oa-dir-meter, .oa-dir-load:nth-of-type(5) { display: none; }
}

/* ───────────────────────────────────────────────────────────────
   ASANA-STYLE LAYER — sidebar, project list view, task detail
   Overrides the default .oa-sidebar grid with a dedicated Sidebar.
─────────────────────────────────────────────────────────────── */

/* Variables for the Asana feel */
:root {
  --asa-sb-w: 260px;
  --asa-task-w: 50vw;
  --asa-ink:   var(--ink);
  --asa-ink-2: var(--ink-2);
  --asa-ink-3: var(--ink-3);
  --asa-line:  var(--line);
  --asa-hover: oklch(0.96 0.015 265 / 0.65);
  --asa-active: oklch(0.91 0.06 265 / 0.55);
}
html[data-theme="dark"] {
  --asa-hover: oklch(1 0 0 / 0.05);
  --asa-active: oklch(0.55 0.14 155 / 0.35);
}

/* App shell: new sidebar is authoritative when .asana */
.oa-app.asana { grid-template-columns: var(--asa-sb-w) 1fr; }
.oa-app.asana .oa-sidebar { display: flex; }    /* use original sidebar */
.oa-app.asana .oa-sb { display: none; }         /* hide asana sb */

/* ───── Sidebar ───── */
.oa-sb {
  border-right: 1px solid var(--asa-line);
  background: var(--panel-2);
  backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur);
  padding: 10px 6px 10px;
  display: flex; flex-direction: column; gap: 2px;
  overflow-y: auto; min-height: 0;
  font-size: 13px;
}
.oa-sb-top { padding: 8px 8px 10px; }
.oa-sb-create {
  display: inline-flex; align-items: center; gap: 8px;
  height: 32px; padding: 0 14px 0 8px;
  background: var(--ink);
  color: var(--panel);
  border-radius: 999px;
  font-size: 13px; font-weight: 600;
  box-shadow: 0 1px 2px oklch(0 0 0 / 0.15);
}
.oa-sb-create:hover { filter: brightness(1.08); }
.oa-sb-create-plus {
  width: 18px; height: 18px; border-radius: 50%;
  display: grid; place-items: center;
  background: oklch(0.6 0.15 30); color: #fff;
}
html[data-theme="dark"] .oa-sb-create { background: var(--panel); color: var(--ink); }

.oa-sb-main { display: flex; flex-direction: column; gap: 1px; padding: 0 4px 10px; }
.oa-sb-item {
  display: flex; align-items: center; gap: 10px;
  padding: 6px 10px; border-radius: 6px;
  color: var(--asa-ink-2); font-size: 13.5px; font-weight: 500;
  height: 30px; cursor: pointer;
  width: 100%; text-align: left;
}
.oa-sb-item:hover { background: var(--asa-hover); color: var(--asa-ink); }
.oa-sb-item.on { background: var(--asa-active); color: var(--asa-ink); font-weight: 600; }
.oa-sb-item-icon { display: grid; place-items: center; color: var(--asa-ink-3); }
.oa-sb-item.on .oa-sb-item-icon { color: var(--accent-ink); }
.oa-sb-item-label { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.oa-sb-badge {
  background: oklch(0.6 0.18 25); color: #fff; font-size: 10.5px; font-weight: 700;
  padding: 1px 6px; border-radius: 999px;
}

/* Sections */
.oa-sb-section { padding: 6px 0 2px; }
.oa-sb-section-head {
  display: flex; align-items: center; gap: 4px;
  padding: 4px 10px 4px 8px;
  color: var(--asa-ink-3);
  font-size: 11px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase;
}
.oa-sb-section-toggle {
  display: inline-flex; align-items: center; gap: 6px; flex: 1;
  color: inherit; font: inherit; text-transform: inherit; letter-spacing: inherit;
  padding: 2px 2px; border-radius: 4px;
}
.oa-sb-section-toggle:hover { background: var(--asa-hover); color: var(--asa-ink-2); }
.oa-sb-add {
  opacity: 0; transition: opacity .12s;
  width: 18px; height: 18px; border-radius: 4px; display: grid; place-items: center;
  color: var(--asa-ink-3);
}
.oa-sb-section:hover .oa-sb-add { opacity: 1; }
.oa-sb-add:hover { background: var(--asa-hover); color: var(--asa-ink); }
.oa-sb-section-body { display: flex; flex-direction: column; gap: 1px; padding: 2px 4px; }
.oa-sb-empty { padding: 6px 10px; font-size: 11.5px; color: var(--asa-ink-3); font-style: italic; }

/* Projects (rows with color mark) */
.oa-sb-proj {
  display: flex; align-items: center; gap: 10px;
  padding: 6px 10px; border-radius: 6px;
  font-size: 13.5px; color: var(--asa-ink-2); font-weight: 500;
  min-height: 30px; cursor: pointer;
}
.oa-sb-proj:hover { background: var(--asa-hover); color: var(--asa-ink); }
.oa-sb-proj.on { background: var(--asa-active); color: var(--asa-ink); font-weight: 600; }
.oa-sb-proj-mark {
  flex: 0 0 auto; width: 14px; height: 14px; border-radius: 4px;
  box-shadow: inset 0 0 0 1px oklch(0 0 0 / 0.08);
}
.oa-sb-proj-label { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
/* .oa-sb-star handled in sidebar section above */

/* Footer */
.oa-sb-foot {
  margin-top: auto; padding: 10px 8px 4px;
  display: flex; flex-direction: column; gap: 4px;
  border-top: 1px solid var(--asa-line);
}
.oa-sb-invite, .oa-sb-help {
  display: flex; align-items: center; gap: 8px;
  padding: 6px 8px; border-radius: 6px;
  font-size: 12.5px; color: var(--asa-ink-2);
}
.oa-sb-invite:hover, .oa-sb-help:hover { background: var(--asa-hover); color: var(--asa-ink); }

/* ───── Topbar crumbs ───── */
.oa-topbar-crumbs {
  display: flex; align-items: center; gap: 6px;
  font-size: 13px; color: var(--asa-ink-2);
  padding-right: 8px;
}
.oa-crumb-sep { color: var(--asa-ink-3); }
.oa-crumb-current { font-weight: 600; color: var(--asa-ink); }

/* ───── Content variants ───── */
.oa-content.no-pad { padding: 0; display: flex; flex-direction: column; min-height: 0; }
.oa-project-wrap {
  display: block; min-height: 0; height: 100%;
  background: var(--panel); position: relative;
}

/* ───── Campaign List View ───── */
.oa-clv {
  display: flex; flex-direction: column; min-width: 0; min-height: 0;
  background: var(--panel);
}
.oa-clv-head {
  display: flex; align-items: center; gap: 16px; justify-content: space-between;
  padding: 14px 24px 12px; border-bottom: 1px solid var(--asa-line);
}
.oa-clv-titlewrap { display: flex; align-items: center; gap: 12px; min-width: 0; }
.oa-clv-icon {
  width: 32px; height: 32px; border-radius: 7px;
  display: grid; place-items: center; color: #fff;
  box-shadow: inset 0 0 0 1px oklch(0 0 0 / 0.1), 0 1px 2px oklch(0 0 0 / 0.1);
  flex: 0 0 auto;
}
.oa-clv-title-row { display: flex; align-items: center; gap: 6px; }
.oa-clv-title { margin: 0; font-size: 18px; font-weight: 700; color: var(--asa-ink); letter-spacing: -0.01em; cursor: text; }
.oa-clv-title:hover { opacity: 0.8; }
.oa-clv-title-input {
  font-size: 18px; font-weight: 700; color: var(--ink-1); letter-spacing: -0.01em;
  background: var(--panel-2); border: 1.5px solid oklch(0.72 0.24 145 / 0.5);
  border-radius: 6px; padding: 2px 8px; outline: none; min-width: 240px;
}
/* Set status button */
.oa-clv-set-status {
  background: none; border: none; cursor: pointer; color: var(--ink-3);
  font-size: 12px; padding: 0; transition: color 0.12s;
}
.oa-clv-set-status:hover { color: var(--ink-1); text-decoration: underline; }
/* Status picker dropdown */
.oa-camp-status-picker {
  position: absolute; z-index: 999; top: calc(100% + 6px); left: 0;
  background: var(--panel-solid); border: 1px solid var(--line);
  border-radius: 10px; padding: 5px; min-width: 160px;
  box-shadow: 0 8px 24px oklch(0 0 0 / 0.22);
  display: flex; flex-direction: column; gap: 2px;
}
.oa-camp-status-opt {
  display: flex; align-items: center; gap: 8px; padding: 8px 10px;
  border-radius: 7px; border: none; background: none; cursor: pointer;
  font-size: 12.5px; color: var(--ink-1); width: 100%; text-align: left; transition: background 0.1s;
}
.oa-camp-status-opt:hover { background: var(--panel-2); }
.oa-camp-status-opt.on { background: var(--panel-2); font-weight: 600; }
.oa-camp-status-opt .oa-check-mark { margin-left: auto; color: oklch(0.72 0.24 145); }
/* Caret dropdown menu */
.oa-camp-caret-menu {
  position: absolute; z-index: 999; top: calc(100% + 4px); left: 0;
  background: var(--panel-solid); border: 1px solid var(--line);
  border-radius: 10px; padding: 5px; min-width: 170px;
  box-shadow: 0 8px 24px oklch(0 0 0 / 0.22);
  display: flex; flex-direction: column; gap: 2px;
}
.oa-camp-caret-opt {
  display: flex; align-items: center; gap: 9px; padding: 8px 10px;
  border-radius: 7px; border: none; background: none; cursor: pointer;
  font-size: 12.5px; color: var(--ink-1); width: 100%; text-align: left; transition: background 0.1s;
}
.oa-camp-caret-opt:hover { background: var(--panel-2); }
.oa-camp-caret-opt.danger { color: oklch(0.6 0.18 25); }
.oa-clv-sub {
  display: flex; align-items: center; gap: 8px; margin-top: 2px;
  font-size: 12px; color: var(--asa-ink-3);
}
.oa-dotsep { opacity: 0.6; }
.oa-clv-collab { display: flex; align-items: center; gap: 10px; }

/* Tabs */
.oa-clv-tabs {
  display: flex; align-items: stretch; gap: 2px;
  padding: 0 16px; border-bottom: 1px solid var(--asa-line);
  min-height: 42px; flex: 0 0 auto;
}
.oa-clv-tab {
  position: relative; padding: 10px 12px 11px;
  font-size: 13px; font-weight: 500; color: var(--asa-ink-2);
  border-bottom: 2px solid transparent;
  white-space: nowrap; background: transparent;
}
.oa-clv-tab:hover { color: var(--asa-ink); }
.oa-clv-tab.on { color: var(--asa-ink); font-weight: 600; border-bottom-color: var(--asa-ink); }
.oa-clv-tab.add { color: var(--asa-ink-3); padding: 10px 8px; }

/* Toolbar */
.oa-clv-toolbar {
  display: flex; align-items: center; gap: 4px;
  padding: 8px 20px; border-bottom: 1px solid var(--asa-line);
}
.oa-clv-tool, .oa-clv-toolbtn {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 5px 10px; border-radius: 6px;
  font-size: 12.5px; color: var(--asa-ink-2); font-weight: 500;
}
.oa-clv-tool:hover, .oa-clv-toolbtn:hover { background: var(--asa-hover); color: var(--asa-ink); }
.oa-clv-tool.on { background: var(--accent-wash); color: var(--accent-ink); }
.oa-clv-tool-n {
  background: var(--accent-ink); color: var(--panel);
  font-size: 10px; font-weight: 700;
  padding: 0 5px; border-radius: 999px; margin-left: 2px;
}

/* Table */
.oa-clv-table { display: flex; flex-direction: column; padding: 0 8px 24px; }
.oa-clv-thead, .oa-clv-row {
  display: grid;
  grid-template-columns: minmax(280px, 2fr) 150px 120px 150px 120px 40px;
  align-items: center;
  padding: 0 12px;
  border-bottom: 1px solid var(--asa-line);
}
.oa-clv-thead {
  font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em;
  color: var(--asa-ink-3); font-weight: 600;
  height: 32px;
}
.oa-clv-th { padding: 0 4px; }
.oa-clv-th.end { text-align: center; }
.oa-clv-row {
  min-height: 36px; cursor: pointer; font-size: 13px;
  transition: background .08s;
}
.oa-clv-row:hover { background: var(--asa-hover); }
.oa-clv-row.on { background: var(--asa-active); }
.oa-clv-row.done .oa-clv-taskname { color: var(--asa-ink-3); text-decoration: line-through; }
.oa-clv-cell { padding: 6px 4px; color: var(--asa-ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.oa-clv-cell.name { color: var(--asa-ink); display: flex; align-items: center; gap: 10px; font-weight: 500; }
.oa-clv-cell.end { text-align: center; }
.oa-clv-cell.late { color: oklch(0.55 0.2 25); font-weight: 600; }
.oa-clv-taskname { overflow: hidden; text-overflow: ellipsis; }
.oa-ph { color: var(--asa-ink-3); }

/* Round checkbox */
.oa-check {
  flex: 0 0 auto;
  width: 18px; height: 18px; border-radius: 50%;
  border: 1.5px solid var(--asa-ink-3);
  display: grid; place-items: center;
  background: transparent; transition: all .12s;
  color: transparent;
}
.oa-check:hover { border-color: oklch(0.55 0.18 265); color: oklch(0.55 0.18 265); }
.oa-check.done {
  background: oklch(0.48 0.22 265); border-color: oklch(0.48 0.22 265); color: #fff;
}

/* Pills */
.oa-clv-pill {
  display: inline-flex; align-items: center;
  padding: 2px 8px; border-radius: 999px;
  font-size: 11px; font-weight: 600;
  background: var(--panel-2); color: var(--asa-ink-2);
  box-shadow: inset 0 0 0 1px var(--asa-line);
}
.oa-clv-pill.dept-creative  { background: oklch(0.9 0.12 300 / 0.5); color: oklch(0.35 0.15 300); box-shadow: none; }
.oa-clv-pill.dept-strategy  { background: oklch(0.9 0.12 230 / 0.5); color: oklch(0.35 0.15 230); box-shadow: none; }
.oa-clv-pill.dept-athlete   { background: oklch(0.9 0.12 150 / 0.5); color: oklch(0.35 0.15 150); box-shadow: none; }
.oa-clv-pill.dept-business  { background: oklch(0.9 0.12 60 / 0.55); color: oklch(0.35 0.15 60); box-shadow: none; }
.oa-clv-pill.dept-ops       { background: oklch(0.9 0.08 200 / 0.5); color: oklch(0.35 0.1 200); box-shadow: none; }
.oa-clv-pill.dept-production{ background: oklch(0.9 0.12 25 / 0.5); color: oklch(0.38 0.17 25); box-shadow: none; }
html[data-theme="dark"] .oa-clv-pill {
  background: oklch(0.35 0.05 200 / 0.4); color: oklch(0.85 0.05 200);
}

/* Section groups */
.oa-clv-section { margin-top: 2px; }
.oa-clv-sectionhead {
  padding: 14px 16px 6px;
  border-bottom: 1px solid var(--asa-line);
}
.oa-clv-section-toggle {
  display: inline-flex; align-items: center; gap: 6px;
  color: var(--asa-ink); font-weight: 600; font-size: 13px;
}
.oa-clv-section-toggle:hover { color: oklch(0.5 0.15 160); }
.oa-clv-addrow {
  display: flex; align-items: center; gap: 8px;
  padding: 8px 16px; color: var(--asa-ink-3);
  font-size: 12.5px; width: 100%; text-align: left;
  border-bottom: 1px solid var(--asa-line);
}
.oa-clv-addrow:hover { color: var(--asa-ink); background: var(--asa-hover); }

/* Owner cell inside row */
.oa-owner-cell { display: inline-flex; align-items: center; gap: 6px; }

/* ───── Content Planner ───── */
.oa-cp-table th, .oa-cp-table td { vertical-align: middle; }

/* ───── Task Detail Drawer (inline right) ───── */
.oa-tdetail {
  position: fixed;
  right: 0; top: 62px; bottom: 0;
  width: 50vw; min-width: 420px; max-width: 780px;
  border-left: 1px solid var(--asa-line);
  background: var(--panel);
  display: flex; flex-direction: column;
  z-index: 80;
  box-shadow: -4px 0 32px oklch(0 0 0 / 0.20);
  animation: oa-tdetail-in 200ms ease-out;
}
@keyframes oa-tdetail-in { from { transform: translateX(16px); opacity: 0; } to { transform:none; opacity:1; } }

.oa-tdetail-head {
  display: flex; align-items: center; gap: 6px;
  padding: 9px 14px 9px 12px; border-bottom: 1px solid var(--asa-line);
  min-height: 46px; flex-shrink: 0;
}
.oa-tdetail-crumb {
  font-size: 12px; font-weight: 600; color: var(--asa-ink-3);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 200px;
}
.oa-tdetail-head-actions { display: flex; align-items: center; gap: 3px; }
.oa-tdetail-body {
  flex: 1; min-height: 0; overflow-y: auto;
  padding: 20px 24px 8px;
  display: flex; flex-direction: column; gap: 16px;
}
/* Hero: circle + big title */
.oa-tdetail-hero {
  display: flex; align-items: flex-start; gap: 12px;
}
.oa-tdetail-circle {
  width: 24px; height: 24px; border-radius: 50%; flex-shrink: 0;
  border: 2px solid oklch(0.75 0.04 200); background: transparent;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; margin-top: 5px; transition: all 0.15s;
  color: transparent;
}
.oa-tdetail-circle:hover { border-color: oklch(0.56 0.18 145); }
.oa-tdetail-circle.done {
  background: oklch(0.56 0.18 145); border-color: oklch(0.56 0.18 145); color: #fff;
}
.oa-tdetail-title-big {
  flex: 1; border: none; background: transparent; resize: none; overflow: hidden;
  font-size: 26px; font-weight: 700; color: var(--asa-ink); font-family: inherit;
  padding: 0; outline: none; line-height: 1.25; letter-spacing: -0.02em;
  min-height: 32px; width: 100%;
}
.oa-tdetail-title-big::placeholder { color: var(--asa-ink-3); }
/* Legacy title (unused but keep for safety) */
.oa-tdetail-title {
  width: 100%; border: 1px solid transparent; background: transparent;
  font-size: 22px; font-weight: 700; color: var(--asa-ink);
  padding: 6px 8px; border-radius: 6px; letter-spacing: -0.01em;
  outline: none; line-height: 1.3;
}
.oa-tdetail-title:hover { border-color: var(--asa-line); }
.oa-tdetail-title:focus { border-color: var(--accent-ink); background: var(--panel-2); }

.oa-tdetail-fields { display: grid; grid-template-columns: 120px 1fr; gap: 4px 14px; padding: 4px 0; }
.oa-tdetail-field { display: contents; }
.oa-tdetail-field.stacked .oa-tdetail-fval { grid-column: 2; display: flex; flex-direction: column; gap: 2px; }
.oa-tdetail-flabel {
  font-size: 11.5px; color: var(--asa-ink-3); font-weight: 600;
  padding: 8px 0 6px; align-self: start;
}
.oa-tdetail-fval {
  padding: 4px 0; font-size: 13px; color: var(--asa-ink);
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
}
.oa-tdetail-suffix { font-size: 11.5px; color: var(--asa-ink-3); }
.oa-tdetail-due {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 4px 10px; border-radius: 999px;
  background: var(--panel-2); color: var(--asa-ink-3);
  font-size: 12px; font-weight: 600; transition: background 0.1s;
}
.oa-tdetail-due:hover { background: var(--panel-3); color: var(--asa-ink); }
.oa-tdetail-due.has-date { background: oklch(0.9 0.12 155 / 0.5); color: oklch(0.35 0.15 150); }
.oa-tdetail-due.today { background: oklch(0.72 0.24 145 / 0.18); color: oklch(0.55 0.20 145); }
.oa-tdetail-due.overdue { background: oklch(0.65 0.20 25 / 0.15); color: oklch(0.55 0.20 25); }
[data-theme=dark] .oa-tdetail-due.has-date { background: oklch(0.35 0.10 155 / 0.4); color: oklch(0.80 0.14 155); }
[data-theme=dark] .oa-tdetail-due.today { background: oklch(0.72 0.24 145 / 0.22); color: oklch(0.82 0.20 145); }
[data-theme=dark] .oa-tdetail-due.overdue { background: oklch(0.65 0.20 25 / 0.20); color: oklch(0.78 0.18 25); }
.oa-tdetail-proj {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 3px 10px 3px 6px; border-radius: 4px; background: var(--panel-2);
  box-shadow: inset 0 0 0 1px var(--asa-line);
}
.oa-tdetail-proj-mark { width: 10px; height: 10px; border-radius: 2px; background: oklch(0.6 0.14 155); }
.oa-tdetail-proj-section { color: var(--asa-ink-3); font-size: 11.5px; }
.oa-tdetail-add {
  color: var(--asa-ink-3); font-size: 12.5px; padding: 4px 6px; border-radius: 4px;
}
.oa-tdetail-add:hover { color: var(--asa-ink); background: var(--asa-hover); }
.oa-tdetail-add.big { padding: 8px 10px; font-size: 13px; text-align: left; }
.oa-tdetail-fieldrow {
  display: flex; align-items: center; gap: 8px;
  padding: 6px 0; border-bottom: 1px dashed var(--asa-line); font-size: 12.5px;
}
.oa-tdetail-fieldrow span:nth-of-type(1) { flex: 1; color: var(--asa-ink-2); }

/* Description */
.oa-tdetail-section { display: flex; flex-direction: column; gap: 4px; }
.oa-tdetail-desc {
  width: 100%; min-height: 90px; resize: none;
  padding: 6px 2px; border: none; border-radius: 0;
  background: transparent; color: var(--asa-ink); font: inherit; font-size: 14px;
  outline: none; line-height: 1.6;
}
.oa-tdetail-desc::placeholder { color: var(--asa-ink-3); }
.oa-tdetail-desc:focus { background: transparent; }
.oa-tdetail-toolbar {
  display: flex; align-items: center; gap: 8px;
  padding: 2px 0; color: var(--asa-ink-3);
  border-top: 1px solid var(--asa-line); margin-top: 2px; padding-top: 8px;
}
.oa-tdetail-sep { width: 1px; height: 14px; background: var(--asa-line); }
/* Pinned comment bar at the very bottom of the panel */
.oa-tdetail-commentbar {
  flex-shrink: 0; display: flex; align-items: center; gap: 10px;
  padding: 10px 16px 12px; border-top: 1px solid var(--asa-line);
  background: var(--panel);
}
.oa-tdetail-commentbar input {
  flex: 1; background: var(--panel-2); border: 1px solid var(--asa-line);
  border-radius: 20px; padding: 8px 14px; font: inherit; font-size: 13px;
  color: var(--asa-ink); outline: none; transition: border-color 0.12s;
}
.oa-tdetail-commentbar input:focus { border-color: var(--accent-ink); }

/* Comments */
.oa-tdetail-comments {
  margin-top: 10px; padding-top: 14px; border-top: 1px solid var(--asa-line);
  display: flex; flex-direction: column; gap: 12px;
}
.oa-tdetail-tabs { display: flex; gap: 4px; }
.oa-tdetail-tabs button {
  padding: 4px 10px; border-radius: 999px; font-size: 12px;
  color: var(--asa-ink-3); font-weight: 500;
}
.oa-tdetail-tabs button.on { background: var(--panel-2); color: var(--asa-ink); font-weight: 600; }
.oa-comment { display: flex; gap: 10px; align-items: flex-start; }
.oa-comment-body { flex: 1; display: flex; flex-direction: column; gap: 2px; }
.oa-comment-head { display: flex; align-items: baseline; gap: 8px; font-size: 12.5px; }
.oa-comment-head strong { color: var(--asa-ink); }
.oa-comment-time { color: var(--asa-ink-3); font-size: 11px; }
.oa-comment-text { font-size: 13px; line-height: 1.5; color: var(--asa-ink); }

/* .oa-tdetail-newcomment replaced by .oa-tdetail-commentbar (pinned) */
.oa-tdetail-collab {
  display: flex; align-items: center; gap: 8px;
  font-size: 12px; color: var(--asa-ink-3);
  padding: 6px 0;
}
.oa-tdetail-leave {
  display: inline-flex; align-items: center; gap: 4px;
  color: var(--asa-ink-3); font-size: 12px; padding: 4px 8px; border-radius: 4px;
}
.oa-tdetail-leave:hover { background: var(--asa-hover); color: oklch(0.55 0.2 25); }

/* ── Task detail: metadata pill row ── */
.oa-tdetail-meta-row {
  display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
  padding: 4px 0 10px; border-bottom: 1px solid var(--asa-line);
}
.oa-meta-pill {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 5px 11px; border-radius: 999px;
  font-size: 12px; font-weight: 500; cursor: pointer;
  background: var(--panel-2); color: var(--asa-ink-2);
  border: 1px solid var(--asa-line); transition: background 0.12s, color 0.12s;
  white-space: nowrap;
}
.oa-meta-pill:hover { background: var(--panel-3); color: var(--asa-ink); }
.oa-meta-pill.overdue { background: oklch(0.65 0.20 25 / 0.12); color: oklch(0.55 0.20 25); border-color: oklch(0.65 0.20 25 / 0.25); }
.oa-meta-pill.soon    { background: oklch(0.72 0.22 55 / 0.12);  color: oklch(0.52 0.20 55);  border-color: oklch(0.72 0.22 55 / 0.25); }
[data-theme=dark] .oa-meta-pill.overdue { background: oklch(0.65 0.20 25 / 0.18); color: oklch(0.78 0.18 25); }
[data-theme=dark] .oa-meta-pill.soon    { background: oklch(0.72 0.22 55 / 0.18);  color: oklch(0.82 0.20 55); }
.oa-meta-pill.type-btn.has-type { background: oklch(0.88 0.06 240 / 0.5); color: oklch(0.38 0.10 240); border-color: oklch(0.72 0.08 240 / 0.4); }
[data-theme=dark] .oa-meta-pill.type-btn.has-type { background: oklch(0.32 0.08 240 / 0.45); color: oklch(0.78 0.10 240); }

/* ── Task detail: structured form ── */
.oa-tdetail-form {
  display: flex; flex-direction: column; gap: 16px;
  background: var(--panel-2); border: 1px solid var(--asa-line);
  border-radius: 12px; padding: 18px 20px;
}
.oa-tdetail-form-intro {
  font-size: 13px; line-height: 1.6; color: var(--asa-ink-2);
  font-style: italic; margin: 0 0 2px;
}
.oa-tdetail-form-block { display: flex; flex-direction: column; gap: 7px; }
.oa-tdetail-form-label {
  font-size: 12.5px; font-weight: 700; color: var(--asa-ink);
  letter-spacing: -0.01em;
}
.oa-tdetail-form-input {
  width: 100%; padding: 9px 12px; border-radius: 8px;
  border: 1px solid var(--asa-line); background: var(--panel);
  color: var(--asa-ink); font: inherit; font-size: 13px;
  outline: none; transition: border-color 0.12s;
  box-sizing: border-box;
}
.oa-tdetail-form-input:focus { border-color: var(--accent-ink); }
.oa-tdetail-form-textarea {
  width: 100%; padding: 9px 12px; border-radius: 8px;
  border: 1px solid var(--asa-line); background: var(--panel);
  color: var(--asa-ink); font: inherit; font-size: 13px;
  outline: none; resize: vertical; min-height: 80px;
  transition: border-color 0.12s; box-sizing: border-box; line-height: 1.55;
}
.oa-tdetail-form-textarea:focus { border-color: var(--accent-ink); }
.oa-tdetail-platforms { display: flex; flex-direction: column; gap: 6px; }
.oa-tdetail-platform-row {
  display: flex; align-items: center; gap: 12px;
  padding: 10px 14px; border-radius: 8px; cursor: pointer;
  background: var(--panel); border: 1px solid var(--asa-line);
  font-size: 13px; font-weight: 500; color: var(--asa-ink);
  transition: background 0.1s, border-color 0.1s; user-select: none;
}
.oa-tdetail-platform-row:hover { background: var(--panel-3); }
.oa-tdetail-platform-row.checked { border-color: oklch(0.56 0.18 145 / 0.5); background: oklch(0.56 0.18 145 / 0.06); }
[data-theme=dark] .oa-tdetail-platform-row.checked { background: oklch(0.56 0.18 145 / 0.10); }
.oa-tdetail-checkbox {
  width: 17px; height: 17px; border-radius: 4px; flex-shrink: 0;
  border: 2px solid var(--asa-line); background: var(--panel);
  display: flex; align-items: center; justify-content: center;
  transition: background 0.12s, border-color 0.12s;
}
.oa-tdetail-checkbox.checked {
  background: oklch(0.56 0.18 145); border-color: oklch(0.56 0.18 145); color: #fff;
}

/* ───── Campaign Overview ───── */
.oa-coverview { display: flex; flex-direction: column; flex: 1; overflow-y: auto; min-height: 0; }
.oa-coverview-header {
  flex-shrink: 0; padding: 28px 28px 0;
  display: flex; flex-direction: column; gap: 16px;
  border-bottom: 1px solid var(--line);
  padding-bottom: 20px;
}
.oa-coverview-header-top { display: flex; align-items: flex-start; gap: 16px; }
.oa-coverview-title {
  font-size: 22px; font-weight: 700; color: var(--ink);
  letter-spacing: -0.02em; line-height: 1.2; margin: 0 0 8px;
}
.oa-coverview-meta { display: flex; align-items: center; flex-wrap: wrap; gap: 4px 16px; }
.oa-coverview-meta-item {
  display: flex; align-items: center; gap: 5px;
  font-size: 12.5px; color: var(--ink-3);
}
.oa-coverview-stats-row {
  display: flex; align-items: center; gap: 0;
  background: var(--panel-2); border: 1px solid var(--line);
  border-radius: 10px; padding: 10px 16px; flex-wrap: wrap;
}
.oa-coverview-stat-pill { display: flex; flex-direction: column; gap: 2px; flex: 1; min-width: 60px; }
.oa-coverview-stat-val { font-size: 18px; font-weight: 700; color: var(--ink); line-height: 1; }
.oa-coverview-stat-lbl { font-size: 10.5px; color: var(--ink-3); font-weight: 500; }
.oa-coverview-stat-pill-div { width: 1px; background: var(--line); height: 32px; flex-shrink: 0; margin: 0 16px; }
.oa-coverview-prog { display: flex; flex-direction: column; gap: 6px; }
.oa-coverview-prog-labels { display: flex; justify-content: space-between; font-size: 12px; }
.oa-coverview-desc {
  width: 100%; background: var(--panel-2); border: 1px solid var(--line);
  border-radius: 8px; outline: none;
  font: inherit; font-size: 13.5px; line-height: 1.6; color: var(--ink);
  resize: none; padding: 10px 12px; min-height: 68px;
  box-sizing: border-box; transition: border-color 0.15s, box-shadow 0.15s;
}
.oa-coverview-desc:hover { border-color: var(--line-2); }
.oa-coverview-desc:focus { border-color: var(--accent); box-shadow: 0 0 0 3px oklch(0.78 0.28 145 / 0.12); background: var(--panel); }
.oa-coverview-desc::placeholder { color: var(--ink-3); }
.oa-coverview-body {
  display: grid; grid-template-columns: 210px 1fr 210px;
  gap: 0; padding: 0; align-items: start; flex: 1;
}
.oa-coverview-col {
  display: flex; flex-direction: column; gap: 0;
  padding: 20px 20px 32px; border-right: 1px solid var(--line);
}
.oa-coverview-col:last-child { border-right: none; }
.oa-coverview-section { display: flex; flex-direction: column; gap: 8px; margin-bottom: 24px; }
.oa-coverview-section:last-child { margin-bottom: 0; }
.oa-coverview-section-head {
  display: flex; align-items: center; gap: 6px;
  font-size: 11px; font-weight: 700; color: var(--ink-3);
  letter-spacing: 0.06em; text-transform: uppercase;
  padding-bottom: 8px; border-bottom: 1px solid var(--line);
  margin-bottom: 4px;
}
.oa-coverview-member { display: flex; align-items: center; gap: 10px; padding: 6px 0; border-bottom: 1px solid var(--line); }
.oa-coverview-member:last-of-type { border-bottom: none; }
.oa-coverview-group {
  background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 13px 14px;
  display: flex; flex-direction: column; gap: 10px; cursor: pointer; transition: border-color 0.12s, box-shadow 0.12s;
  margin-bottom: 8px;
}
.oa-coverview-group:last-of-type { margin-bottom: 0; }
.oa-coverview-group:hover { border-color: var(--accent); box-shadow: 0 2px 8px oklch(0 0 0 / 0.05); }
.oa-coverview-group-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.oa-coverview-group-name { font-size: 13.5px; font-weight: 600; color: var(--ink); }
.oa-coverview-group-count { font-size: 12px; color: var(--ink-3); font-weight: 500; flex-shrink: 0; }
.oa-coverview-act-item { display: flex; gap: 10px; padding: 6px 0; border-bottom: 1px solid var(--line); }
.oa-coverview-act-item:last-of-type { border-bottom: none; }
.oa-coverview-stat {
  background: var(--panel-2); border: 1px solid var(--line); border-radius: 9px; padding: 12px 14px;
}

/* ───── Inbox / My tasks ───── */
.oa-inbox { display: flex; flex-direction: column; gap: 2px; padding: 4px 0 20px; }
.oa-inbox-item {
  display: flex; align-items: flex-start; gap: 12px; text-align: left;
  padding: 12px 16px; border-radius: 8px;
  transition: background .08s;
  position: relative;
}
.oa-inbox-item:hover { background: var(--asa-hover); }
.oa-inbox-body { flex: 1; display: flex; flex-direction: column; gap: 2px; }
.oa-inbox-body > div:first-child { font-size: 13px; color: var(--asa-ink); }
.oa-inbox-proj {
  display: inline-block; padding: 1px 8px; border-radius: 4px; margin-left: 4px;
  background: var(--accent-wash); color: var(--accent-ink); font-size: 11.5px; font-weight: 600;
}
.oa-inbox-time { font-size: 11.5px; color: var(--asa-ink-3); }
.oa-inbox-dot {
  width: 7px; height: 7px; border-radius: 50%; margin-top: 8px;
  background: oklch(0.6 0.2 25);
}
.oa-inbox-dot.mention { background: oklch(0.6 0.18 300); }
.oa-inbox-dot.assigned { background: oklch(0.6 0.18 150); }

/* Buttons: small ghost/toolbar */
.oa-iconbtn.sm { width: 24px; height: 24px; border-radius: 5px; }

/* Slight adjustments to Avatar */
.oa-owner-cell .oa-avatar { flex: 0 0 auto; }

/* Screen readers */
.sr { position: absolute; left: -9999px; }

/* ── OA Dark Brand ──────────────────────────────────────── */

/* Grain texture overlay — adds the noise/film grain from reference */
html[data-theme="dark"] .oa-app::after {
  content: '';
  position: fixed; inset: 0; z-index: 0; pointer-events: none;
  opacity: 0.04;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.82' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='256' height='256' filter='url(%23n)'/%3E%3C/svg%3E");
  background-size: 256px 256px;
  mix-blend-mode: screen;
}

/* Sidebar: near-black solid, green-tinted lines */
html[data-theme="dark"] .oa-sidebar {
  background: oklch(0.065 0.025 162 / 0.98);
  border-right: 1px solid oklch(0.78 0.28 145 / 0.14);
  backdrop-filter: none; -webkit-backdrop-filter: none;
}
html[data-theme="dark"] .oa-sidebar-foot {
  border-top-color: oklch(0.78 0.28 145 / 0.14);
}

/* Brand mark: dark bg so the metallic OA logo pops */
html[data-theme="dark"] .oa-brand-mark {
  background: oklch(0.1 0.02 165 / 0.9) !important;
  border: 1px solid oklch(0.78 0.28 145 / 0.3);
  box-shadow: 0 0 18px oklch(0.78 0.28 145 / 0.18), inset 0 1px 0 oklch(1 0 0 / 0.06);
  overflow: hidden;
}

/* Active navitem: neon green icon + ghost green bg */
html[data-theme="dark"] .oa-navitem.on {
  background: oklch(0.78 0.28 145 / 0.1);
  box-shadow: none;
}
html[data-theme="dark"] .oa-navitem.on .oa-navitem-icon { color: oklch(0.82 0.26 145); }
html[data-theme="dark"] .oa-navitem.on .oa-navitem-n {
  background: oklch(0.78 0.28 145 / 0.2);
  color: oklch(0.88 0.22 145);
}
html[data-theme="dark"] .oa-navitem:hover { background: oklch(1 0 0 / 0.04); }

/* Topbar: dark solid */
html[data-theme="dark"] .oa-topbar {
  background: oklch(0.07 0.02 162 / 0.95);
  border-bottom-color: oklch(0.78 0.28 145 / 0.12);
}

/* Primary button: OA neon green */
html[data-theme="dark"] .oa-btn.kind-primary {
  background: oklch(0.78 0.28 145);
  color: oklch(0.1 0.04 160);
  box-shadow: 0 0 16px oklch(0.78 0.28 145 / 0.3);
}
html[data-theme="dark"] .oa-btn.kind-primary:hover {
  background: oklch(0.83 0.27 145);
  box-shadow: 0 0 22px oklch(0.78 0.28 145 / 0.45);
}

/* KPI cards: subtle green border accent */
html[data-theme="dark"] .oa-kpi {
  border: 1px solid oklch(0.78 0.28 145 / 0.1);
}
html[data-theme="dark"] .oa-kpi:hover { border-color: oklch(0.78 0.28 145 / 0.22); }

/* Green tone chips: brighter + neon-correct */
html[data-theme="dark"] .tone-green .oa-chip-dot,
html[data-theme="dark"] .oa-chip.tone-green .oa-chip-dot { background: oklch(0.78 0.28 145); }

/* Campaign tab bar: neon green active underline */
html[data-theme="dark"] .oa-camp-tab {
  background: oklch(1 0 0 / 0.04);
}
html[data-theme="dark"] .oa-camp-tab:hover {
  background: var(--glass-2);
  color: var(--ink-2);
}
html[data-theme="dark"] .oa-camp-tab.on {
  border-bottom-color: var(--green-bright);
  color: oklch(0.90 0.24 145);
  background: oklch(0.78 0.28 145 / 0.10);
  box-shadow: none;
}
html[data-theme="dark"] .oa-camp-tab.on .oa-camp-tab-dot { box-shadow: 0 0 8px currentColor; }

// Generate deliverables array from a playbook for a new campaign
function deliFromPlaybook(playbook, campaignId) {
  return playbook.stages.flatMap((stage, si) =>
    stage.steps.map((step, sti) => ({
      id: `${step.id}_${campaignId}`,
      title: step.title,
      assignee: null,
      due: null,
      done: false,
      campaign: campaignId,
      stageId: stage.id,
      stageLabel: stage.label,
      stageOrder: si,
      roles: step.roles,
    }))
  );
}

// Shared UI atoms for Mission Control
const { useState, useEffect, useRef, useMemo, useCallback } = React;

// ─── Avatar ───────────────────────────────────────────────
function Avatar({ person, size = 24, ring = false }) {
  if (!person) return (
    <div className="oa-avatar" style={{
      width: size, height: size, background: 'var(--panel-2)',
      color: 'var(--ink-3)', fontSize: size * 0.42,
      boxShadow: ring ? '0 0 0 2px var(--bg)' : 'none',
    }}>·</div>
  );
  const bg = `oklch(0.68 0.09 ${person.hue || 200})`;
  const shadow = ring ? '0 0 0 2px var(--bg)' : 'none';
  if (person.photo) {
    return (
      <div title={person.name} style={{
        width: size, height: size, borderRadius: '50%', overflow: 'hidden', flexShrink: 0,
        boxShadow: shadow, display: 'inline-block',
      }}>
        <img src={person.photo} alt={person.name} style={{width:'100%',height:'100%',objectFit:'cover',display:'block'}}/>
      </div>
    );
  }
  return (
    <div className="oa-avatar" title={person.name} style={{
      width: size, height: size, background: bg,
      color: '#fff', fontSize: size * 0.4, fontWeight: 600,
      boxShadow: shadow,
    }}>{person.initials || person.name?.slice(0,2).toUpperCase()}</div>
  );
}

function AvatarStack({ people = [], size = 24, max = 4 }) {
  const shown = people.slice(0, max);
  const overflow = people.length - shown.length;
  return (
    <div className="oa-stack" style={{ '--sz': size + 'px' }}>
      {shown.map((p, i) => (
        <div key={p?.id || i} style={{ marginLeft: i === 0 ? 0 : -size * 0.3 }}>
          <Avatar person={p} size={size} ring />
        </div>
      ))}
      {overflow > 0 && (
        <div className="oa-avatar" style={{
          width: size, height: size, marginLeft: -size * 0.3,
          background: 'var(--panel-2)', color: 'var(--ink-2)',
          fontSize: size * 0.38, fontWeight: 600,
          boxShadow: '0 0 0 2px var(--bg)',
        }}>+{overflow}</div>
      )}
    </div>
  );
}

const STATUS = {
  pitching: { label: 'Pitching',  tone: 'amber' },
  active:   { label: 'Active',    tone: 'green' },

};

function StatusChip({ status, dense }) {
  const s = STATUS[status] || { label: status, tone: 'slate' };
  return (

}

// ─── Button ───────────────────────────────────────────────
function Button({ kind = 'ghost', size = 'md', icon, children, onClick, type = 'button', style }) {
  return (
    <button type={type} onClick={onClick}
      className={`oa-btn kind-${kind} size-${size}`} style={style}>
      {icon && <span className="oa-btn-icon">{icon}</span>}
      {children && <span>{children}</span>}
    </button>
  );
}

// ─── Input ────────────────────────────────────────────────
function TextInput({ value, onChange, placeholder, icon, style, onKeyDown, autoFocus }) {
  return (
    <label className="oa-input" style={style}>
      {icon && <span className="oa-input-icon">{icon}</span>}
      <input value={value || ''} onChange={e => onChange(e.target.value)}
        placeholder={placeholder} onKeyDown={onKeyDown} autoFocus={autoFocus} />
    </label>
  );
}

// ─── Drawer ───────────────────────────────────────────────
function Drawer({ open, onClose, children, width = 720 }) {
  useEffect(() => {
    if (!open) return;
    const onKey = (e) => e.key === 'Escape' && onClose();
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, [open, onClose]);
  return (
    <>
      <div className={`oa-scrim ${open ? 'open' : ''}`} onClick={onClose} />
      <aside className={`oa-drawer ${open ? 'open' : ''}`} style={{ width }}>
        {children}
      </aside>
    </>
  );
}

// ─── Modal ────────────────────────────────────────────────
function Modal({ open, onClose, children, width = 520 }) {
  useEffect(() => {
    if (!open) return;
    const onKey = (e) => e.key === 'Escape' && onClose();
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, [open, onClose]);
  if (!open) return null;
  return (
    <div className="oa-modal-wrap" onClick={onClose}>
      <div className="oa-modal" style={{ width }} onClick={e => e.stopPropagation()}>
        {children}
      </div>
    </div>
  );
}

// ─── Inline editable cell ─────────────────────────────────
function InlineEdit({ value, onChange, placeholder, asDate, style }) {
  const [editing, setEditing] = useState(false);
  const [v, setV] = useState(value || '');
  useEffect(() => setV(value || ''), [value]);
  if (editing) {
    return (
      <input
        autoFocus
        type={asDate ? 'date' : 'text'}
        className="oa-inline-input"
        value={v}
        onChange={e => setV(e.target.value)}
        onBlur={() => { setEditing(false); if (v !== value) onChange(v); }}
        onKeyDown={e => {
          if (e.key === 'Enter') { e.target.blur(); }
          if (e.key === 'Escape') { setV(value || ''); setEditing(false); }
        }}
        style={style}
      />
    );
  }
  return (
    <span className="oa-inline-cell" onClick={() => setEditing(true)} style={style}>
      {value || <span className="oa-ph">{placeholder || '—'}</span>}
    </span>
  );
}

  const [open, setOpen] = useState(false);
  const [q, setQ] = useState('');
  const ref = useRef(null);
  const inputRef = useRef(null);

  useEffect(() => {
    const close = (e) => { if (ref.current && !ref.current.contains(e.target)) { setOpen(false); setQ(''); } };
    window.addEventListener('mousedown', close);
    return () => window.removeEventListener('mousedown', close);
  }, []);
  useEffect(() => { if (open && searchable) { setQ(''); requestAnimationFrame(() => inputRef.current?.focus()); } }, [open]);

  const ql = q.toLowerCase();
  const filtered = (searchable && q)
    ? options.filter(o => (o.label + ' ' + (o.sub || '') + ' ' + (o.group || '')).toLowerCase().includes(ql))
    : options;

  const current = options.find(o => o.value === value);
  const hasGroups = options.some(o => o.group);

  // Build ordered group map preserving insertion order
  const groupMap = hasGroups ? (() => {
    const m = new Map();
    filtered.forEach(o => {
      const g = o.group || '';
      if (!m.has(g)) m.set(g, []);
      m.get(g).push(o);
    });
    return m;
  })() : null;

  // renderOpt is for DROPDOWN rows — always shows full name/role regardless of the `render` prop
  // (the `render` prop is only for the collapsed trigger button)
  const renderOpt = (o) => {
    const isOn = o.value === value;
    if (o.person) return (
      <span style={{display:'flex', alignItems:'center', gap:10, width:'100%'}}>
        <Avatar person={o.person} size={30}/>
        <span style={{flex:1, minWidth:0}}>
          <div style={{fontSize:13, fontWeight:500, color:'var(--ink)', lineHeight:1.3}}>{o.label}</div>
          {o.sub && <div style={{fontSize:11, color:'var(--ink-3)', marginTop:1}}>{o.sub}</div>}
        </span>
        {isOn && <Icons.Check size={12} style={{color:'var(--accent-ink)', flexShrink:0}}/>}
      </span>
    );
    // Non-person options (no `render` fallback here — render prop is trigger-only)
    if (render) return render(o);
    return (
      <span style={{display:'flex', alignItems:'center', justifyContent:'space-between', width:'100%'}}>
        {o.label}
        {isOn && <Icons.Check size={12} style={{color:'var(--accent-ink)'}}/>}
      </span>
    );
  };

  return (
    <div className="oa-select" ref={ref}>
      <button className="oa-select-btn" onClick={() => setOpen(v => !v)}>
        {current ? (render ? render(current) : current.label) : <span className="oa-ph">{placeholder || 'Select'}</span>}
        <Icons.Caret size={12} />
      </button>
      {open && (
        <div className={`oa-select-menu${hasGroups ? ' oa-select-menu--people' : ''}`}>
          {searchable && (
            <div className="oa-select-search">
              <Icons.Search size={11} style={{color:'var(--ink-3)', flexShrink:0}}/>
              <input ref={inputRef} value={q} onChange={e => setQ(e.target.value)}
                placeholder="Search by name or department…" onClick={e => e.stopPropagation()}/>
              {q && <button onClick={() => setQ('')} style={{background:'none', border:'none', cursor:'pointer', color:'var(--ink-3)', padding:0, display:'flex'}}><Icons.X size={10}/></button>}
            </div>
          )}

          {hasGroups ? (
            <div className="oa-select-groups-body">
              {/* "No assignee" row (group === null) */}
              {groupMap.has(null) && groupMap.get(null).map(o => (
                <div key={o.value} className={`oa-select-opt oa-select-opt--unassign ${o.value === value ? 'on' : ''}`}
                  onClick={() => { onChange(o.value); setOpen(false); setQ(''); }}>
                  <span style={{width:28, height:28, borderRadius:'50%', border:'1.5px dashed var(--line)', display:'grid', placeItems:'center', flexShrink:0}}>
                    <Icons.Plus size={10} style={{color:'var(--ink-4)'}}/>
                  </span>
                  <span style={{fontSize:13, color:'var(--ink-3)', flex:1}}>{o.label}</span>
                  {o.value === value && <Icons.Check size={12} style={{color:'var(--accent-ink)'}}/>}
                </div>
              ))}
              {/* Grouped people */}
              {[...groupMap.entries()].filter(([g]) => g !== null).map(([group, items]) => (
                <div key={group} className="oa-select-group">
                  <div className="oa-select-group-hd">{group}</div>
                  {items.map(o => (
                    <div key={o.value} className={`oa-select-opt oa-select-opt--person ${o.value === value ? 'on' : ''}`}
                      onClick={() => { onChange(o.value); setOpen(false); setQ(''); }}>
                      {renderOpt(o)}
                    </div>
                  ))}
                </div>
              ))}
              {filtered.filter(o => o.group !== null).length === 0 && q && (
                <div className="oa-ss-empty">No results for "{q}"</div>
              )}
            </div>
          ) : (
            <>
              {filtered.map(o => (
                <div key={o.value} className={`oa-select-opt ${o.value === value ? 'on' : ''}`}
                  onClick={() => { onChange(o.value); setOpen(false); setQ(''); }}>
                  {renderOpt(o)}
                </div>
              ))}
              {filtered.length === 0 && <div className="oa-ss-empty">No results for "{q}"</div>}
            </>
          )}
        </div>
      )}
    </div>
  );
}

// SearchSelect — modal-grade searchable single/multi picker
// options: [{ id, name, sub?, person? }]  (person = full person obj for avatar)
function SearchSelect({ value, onChange, options, placeholder='Select…', multi=false }) {
  const [open, setOpen] = useState(false);
  const [q, setQ]       = useState('');
  const ref      = useRef(null);
  const inputRef = useRef(null);

  useEffect(() => {
    if (!open) return;
    setQ('');
    requestAnimationFrame(() => inputRef.current?.focus());
    const h = e => { if (ref.current && !ref.current.contains(e.target)) setOpen(false); };
    requestAnimationFrame(() => document.addEventListener('mousedown', h));
    return () => document.removeEventListener('mousedown', h);
  }, [open]);

  const filtered = q
    ? options.filter(o => (o.name + ' ' + (o.sub||'')).toLowerCase().includes(q.toLowerCase()))
    : options;

  const selectedArr = multi
    ? options.filter(o => (value||[]).includes(o.id))
    : null;
  const selectedOne = !multi ? options.find(o => o.id === value) : null;

  const toggle = id => {
    if (multi) {
      const arr = value || [];
      onChange(arr.includes(id) ? arr.filter(x => x !== id) : [...arr, id]);
    } else {
      onChange(id);
      setOpen(false);
    }
  };

  return (
    <div ref={ref} className="oa-ss">
      <button type="button" className="oa-ss-trigger" onClick={() => setOpen(v => !v)}>
        <span className="oa-ss-val">
          {multi
            ? (selectedArr.length > 0
                ? <span style={{color:'var(--ink-1)'}}>{selectedArr.length} selected</span>
                : <span className="oa-ph">{placeholder}</span>)
            : selectedOne
              ? (<>{selectedOne.person && <Avatar person={selectedOne.person} size={18}/>}<span style={{overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{selectedOne.name}</span></>)
              : <span className="oa-ph">{placeholder}</span>
          }
        </span>
        <Icons.Caret size={11} style={{flexShrink:0, color:'var(--ink-3)'}}/>
      </button>

      {multi && selectedArr.length > 0 && (
        <div className="oa-ss-chips">
          {selectedArr.map(s => (
            <span key={s.id} className="oa-ss-chip">
              {s.person && <Avatar person={s.person} size={14}/>}
              <span>{s.name.split(' ')[0]}</span>
              <button type="button" className="oa-ss-chip-x"
                onClick={e => { e.stopPropagation(); toggle(s.id); }}>×</button>
            </span>
          ))}
        </div>
      )}

      {open && (
        <div className="oa-ss-menu">
          <div className="oa-ss-input-wrap">
            <Icons.Search size={12} style={{color:'var(--ink-3)',flexShrink:0}}/>
            <input ref={inputRef} value={q} onChange={e => setQ(e.target.value)} placeholder="Search…"/>
            {q && <button type="button" onClick={() => setQ('')}
              style={{background:'none',border:'none',cursor:'pointer',color:'var(--ink-4)',padding:0,display:'flex'}}>
              <Icons.X size={10}/>
            </button>}
          </div>
          <div className="oa-ss-list">
            {filtered.map(o => {
              const on = multi ? (value||[]).includes(o.id) : value === o.id;
              return (
                <div key={o.id} className={`oa-ss-opt${on?' on':''}`} onClick={() => toggle(o.id)}>
                  {o.person && <Avatar person={o.person} size={28}/>}
                  <div style={{flex:1,minWidth:0}}>
                    <div>{o.name}</div>
                    {o.sub && <div className="oa-ss-opt-sub">{o.sub}</div>}
                  </div>
                  {on && <span className="oa-ss-opt-check"><Icons.Check size={13}/></span>}
                </div>
              );
            })}
            {filtered.length === 0 && <div className="oa-ss-empty">No results for "{q}"</div>}
          </div>
        </div>
      )}
    </div>
  );
}

const fmt = {
  money: (n) => '$' + (n||0).toLocaleString('en-US'),
  moneyShort: (n) => {
    if (n >= 1000000) return '$' + (n/1000000).toFixed(1) + 'M';
    if (n >= 1000) return '$' + (n/1000).toFixed(0) + 'k';
    return '$' + n;
  },
  followers: (n) => {
    if (n >= 1000000) return (n/1000000).toFixed(1) + 'M';
    if (n >= 1000) return (n/1000).toFixed(0) + 'k';
    return n.toString();
  },
  date: (iso) => {
    if (!iso) return '—';
    const d = new Date(iso + 'T12:00:00');
    return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
  },
  dateLong: (iso) => {
    if (!iso) return '—';
    const d = new Date(iso + 'T12:00:00');
    return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
  },
  daysUntil: (iso) => {
    if (!iso) return null;
    const d = new Date(iso + 'T12:00:00');
    const now = new Date('2026-04-17T12:00:00'); // current date
    const days = Math.round((d - now) / 86400000);
    return days;
  },
};

// Radar (spider) chart — reusable SVG
function Radar({ values = [], axes = [], max = 10, size = 220, hue = 150, compact = false, showLabels = true }) {
  const n = axes.length || values.length;
  if (n < 3) return null;
  const pad = compact ? 12 : (showLabels ? 62 : 16);
  const r = (size - pad * 2) / 2;
  const cx = size / 2, cy = size / 2;

  const angleFor = (i) => -Math.PI / 2 + (i / n) * Math.PI * 2;
  const point = (i, mag) => {
    const a = angleFor(i);
    return [cx + Math.cos(a) * r * mag, cy + Math.sin(a) * r * mag];
  };

  const rings = [0.25, 0.5, 0.75, 1];
  const fill = `oklch(0.62 0.14 ${hue})`;
  const fillSoft = `oklch(0.62 0.14 ${hue} / 0.22)`;

  const poly = values.map((v, i) => point(i, Math.min(1, v / max)).join(',')).join(' ');

  return (
    <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`} className="oa-radar" overflow="visible">
      {/* rings */}
      {rings.map((ring, i) => {
        const pts = Array.from({ length: n }, (_, k) => point(k, ring).join(',')).join(' ');
        return <polygon key={i} points={pts} fill="none" stroke="var(--line)" strokeWidth="1" opacity={0.55}/>;
      })}
      {/* spokes */}
      {Array.from({ length: n }, (_, i) => {
        const [x, y] = point(i, 1);
        return <line key={i} x1={cx} y1={cy} x2={x} y2={y} stroke="var(--line)" strokeWidth="1" opacity={0.5}/>;
      })}
      {/* value polygon */}
      <polygon points={poly} fill={fillSoft} stroke={fill} strokeWidth="1.6" strokeLinejoin="round"/>
      {/* value dots */}
      {values.map((v, i) => {
        const [x, y] = point(i, Math.min(1, v / max));
        return <circle key={i} cx={x} cy={y} r={compact ? 1.8 : 2.6} fill={fill}/>;
      })}
      {/* labels */}
      {showLabels && axes.map((ax, i) => {
        const [x, y] = point(i, 1.18);
        const a = angleFor(i);
        const anchor = Math.cos(a) > 0.3 ? 'start' : Math.cos(a) < -0.3 ? 'end' : 'middle';
        return (
          <g key={i}>
            <text x={x} y={y} fontSize={compact ? 9 : 10.5} fontWeight={600}
              fill="var(--ink-2)" textAnchor={anchor} dominantBaseline="middle"
              style={{letterSpacing:'0.02em'}}>
              {ax}
            </text>
            <text x={x} y={y + (compact ? 10 : 12)} fontSize={compact ? 8 : 9.5}
              fill="var(--ink-3)" textAnchor={anchor} dominantBaseline="middle"
              fontFamily="var(--mono)">
              {values[i]}/{max}
            </text>
          </g>
        );
      })}
    </svg>
  );
}

window.Radar = Radar;

// Dashboard: KPIs + My Tasks + activity
function Dashboard({ state, setState, openCampaign, openAthlete, setView, currentUserId }) {
  const { CAMPAIGNS, ATHLETES, OPS_TASKS, TEAM } = state;

  const reviewCampaigns = CAMPAIGNS.filter(c => c.status === 'review');

  const allDeliv = CAMPAIGNS.flatMap(c => c.deliverables.map(d => ({ ...d, campaignTitle: c.title, campaignStatus: c.status })));
  const pendingDeliv = allDeliv.filter(d => !d.done);

  // My tasks: ops tasks + deliverables assigned to me (internal user)
  const myTasks = [
    ...OPS_TASKS.filter(t => t.assignee === me.id && !t.done).map(t => ({ ...t, kind: 'ops' })),
    ...allDeliv.filter(d => d.assignee === me.id && !d.done).map(d => ({ ...d, kind: 'deliverable' })),
  ].sort((a, b) => (a.due || '9999').localeCompare(b.due || '9999'));

  const totalEarnings = ATHLETES.reduce((s, a) => s + a.earningsYTD, 0);
  const totalBudget = activeCampaigns.reduce((s, c) => s + c.budget, 0);

  // Upcoming (next 14 days)
  const upcoming = allDeliv
    .filter(d => !d.done && d.due)
    .map(d => ({ ...d, daysOut: fmt.daysUntil(d.due) }))
    .filter(d => d.daysOut >= 0 && d.daysOut <= 14)
    .sort((a, b) => a.daysOut - b.daysOut);

  const bySport = ATHLETES.reduce((m, a) => { m[a.sport] = (m[a.sport] || 0) + 1; return m; }, {});
  const sportEntries = Object.entries(bySport).sort((a,b) => b[1]-a[1]);

  const toggleTask = (task) => {
    if (task.kind === 'ops') {
      setState(s => ({ ...s, OPS_TASKS: s.OPS_TASKS.map(t => t.id === task.id ? { ...t, done: !t.done } : t) }));
    } else {
      setState(s => ({
        ...s,
        CAMPAIGNS: s.CAMPAIGNS.map(c => c.id === task.campaign ? {
          ...c,
          deliverables: c.deliverables.map(d => d.id === task.id ? { ...d, done: !d.done } : d),

          <div className="oa-sub">
            <span>{activeCampaigns.length} active campaigns</span>
            <span className="oa-dotsep">·</span>
            <span>{pendingDeliv.length} deliverables open</span>

        </div>
      </div>

      <div className="oa-kpi-row">
        <KPI label="Athletes under management" value={ATHLETES.length} delta="+2 this qtr" onClick={() => setView('athletes')} />
        <KPI label="Active campaign value" value={fmt.moneyShort(totalBudget)} delta={`${activeCampaigns.length} running`} />
        <KPI label="Athlete earnings YTD" value={fmt.moneyShort(totalEarnings)} delta="+18% vs '25" />
        <KPI label="Pipeline (pitching)" value={fmt.moneyShort(pitchingCampaigns.reduce((s,c)=>s+c.budget,0))} delta={`${pitchingCampaigns.length} in play`} />
      </div>

      <ActivityHeatmap state={state} currentUserId={currentUserId} />

      <div className="oa-dash-grid">
        <section className="oa-panel oa-mytasks">
          <header className="oa-panel-head">
            <div>
              <h3>My tasks</h3>
              <span className="oa-panel-sub">Assigned to {me.name.split(' ')[0]}</span>
            </div>
            <div className="oa-tabs-mini">
              <span className="on">Open · {myTasks.length}</span>
            </div>
          </header>
          <div className="oa-tasklist">
            {myTasks.length === 0 && <div className="oa-empty">Inbox zero. Nice.</div>}
            {myTasks.map(t => {
              const days = fmt.daysUntil(t.due);
              const late = days != null && days < 0;
              const soon = days != null && days >= 0 && days <= 3;
              return (
                <div key={t.id} className="oa-task" onClick={() => t.campaign && openCampaign(t.campaign)}>

            <PipeRow label="In Review" count={reviewCampaigns.length} val={reviewCampaigns.reduce((s,c)=>s+c.budget,0)} tone="violet" max={CAMPAIGNS.length} />

                <div className="oa-sport-bar"><div style={{ width: (n / ATHLETES.length * 100) + '%' }} /></div>
                <span className="oa-sport-n">{n}</span>
              </div>
            ))}
          </div>
        </section>

        <section className="oa-panel oa-upcoming">
          <header className="oa-panel-head">
            <div><h3>Next 14 days</h3><span className="oa-panel-sub">{upcoming.length} deliverables due</span></div>
            <Button kind="ghost" size="sm" onClick={() => setView('campaigns')}>Calendar →</Button>
          </header>
          <div className="oa-upcoming-list">
            {upcoming.slice(0, 8).map(d => {
              const camp = CAMPAIGNS.find(c => c.id === d.campaign);
              const assignee = TEAM.find(t => t.id === d.assignee) || ATHLETES.find(a => a.id === d.assignee);
              return (
                <div key={d.id} className="oa-up-row" onClick={() => openCampaign(d.campaign)}>
                  <div className="oa-up-date">
                    <div className="oa-up-day">{new Date(d.due+'T12:00:00').getDate()}</div>
                    <div className="oa-up-mon">{new Date(d.due+'T12:00:00').toLocaleDateString('en-US',{month:'short'}).toUpperCase()}</div>
                  </div>
                  <div className="oa-up-body">
                    <div className="oa-up-title">{d.title}</div>
                    <div className="oa-up-ctx">{camp?.title}</div>
                  </div>
                  <Avatar person={assignee} size={22} />

          </div>
        </section>
      </div>

    </div>
  );
}

function ActivityHeatmap({ state, currentUserId }) {
  const { CAMPAIGNS, OPS_TASKS, OA_EVENTS = [], TEAM } = state;
  const me = TEAM.find(t => t.id === currentUserId) || TEAM[0];

  const [mode, setMode]         = React.useState('oa');
  const [tooltip, setTooltip]   = React.useState(null);
  const [isDragging, setDrag]   = React.useState(false);
  const [panX, setPanX]         = React.useState(0);
  const [isDark, setIsDark]     = React.useState(
    () => document.documentElement.getAttribute('data-theme') === 'dark'
  );
  const containerRef            = React.useRef(null);
  const drag                    = React.useRef({ active: false, startX: 0, startPan: 0 });

  // Track theme changes
  React.useEffect(() => {
    const obs = new MutationObserver(() => {
      setIsDark(document.documentElement.getAttribute('data-theme') === 'dark');
    });
    obs.observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
    return () => obs.disconnect();
  }, []);

  const CELL = 14, GAP = 2, STRIDE = 16;

  // Skeleton: date structure for full year 2026 (built once)
  const { weeks, monthLabels } = React.useMemo(() => {
    const start = new Date('2026-01-01T12:00:00');
    start.setDate(start.getDate() - start.getDay()); // back to Sunday
    const weeks = [], cur = new Date(start);
    while (cur <= new Date('2026-12-31T12:00:00')) {
      const week = [];
      for (let d = 0; d < 7; d++) {
        week.push({ date: new Date(cur), dateStr: cur.toISOString().slice(0,10) });
        cur.setDate(cur.getDate() + 1);
      }
      weeks.push(week);
    }
    // month label at col where month first appears
    const monthLabels = [], seen = new Set();
    weeks.forEach((week, wi) => {
      week.forEach(({ date }) => {
        const key = `${date.getFullYear()}-${date.getMonth()}`;
        if (date.getDate() <= 7 && !seen.has(key)) {
          seen.add(key);
          monthLabels.push({ wi, label: date.toLocaleDateString('en-US', { month: 'short' }) });
        }
      });
    });
    return { weeks, monthLabels };
  }, []);

  // Activity map: date → [{label, kind}]
  const allDeliv = React.useMemo(() =>
    CAMPAIGNS.flatMap(c => c.deliverables.map(d => ({ ...d, campaignTitle: c.title }))),
    [CAMPAIGNS]
  );

  const dayMap = React.useMemo(() => {
    const map = {};
    const add = (date, label, kind) => {
      if (!date) return;
      (map[date] || (map[date] = [])).push({ label, kind });
    };
    if (mode === 'oa' || mode === 'team') {
      OA_EVENTS.forEach(e => add(e.date, e.title, e.type));
      allDeliv.forEach(d => d.due && add(d.due, d.title, 'deliverable'));
    }
    if (mode === 'oa') {
      OPS_TASKS.forEach(t => t.due && add(t.due, t.title, 'task'));
    }
    if (mode === 'mine') {
      OPS_TASKS.filter(t => t.assignee === me.id).forEach(t => t.due && add(t.due, t.title, 'task'));
      allDeliv.filter(d => d.assignee === me.id).forEach(d => d.due && add(d.due, d.title, 'deliverable'));
    }
    return map;
  }, [mode, allDeliv, OPS_TASKS, OA_EVENTS, me.id]);

  const maxCount = Math.max(1, ...Object.values(dayMap).map(a => a.length));

  // Shared thermal stop interpolator
  const thermalColor = (t) => {
    // dark-mode stops: deep navy → blue → cyan → green → yellow → orange → fire red
    const darkStops = [
      { t:0.00, l:0.22, c:0.12, h:268 },
      { t:0.16, l:0.38, c:0.22, h:240 },
      { t:0.32, l:0.54, c:0.26, h:200 },
      { t:0.50, l:0.64, c:0.24, h:165 },
      { t:0.66, l:0.76, c:0.26, h: 95 },
      { t:0.82, l:0.74, c:0.30, h: 45 },
      { t:1.00, l:0.62, c:0.32, h: 18 },
    ];
    // light-mode stops: cool white → lavender → teal → lime → amber → deep orange → crimson
    const lightStops = [
      { t:0.00, l:0.93, c:0.02, h:250 },
      { t:0.16, l:0.82, c:0.12, h:265 },
      { t:0.32, l:0.72, c:0.18, h:215 },
      { t:0.50, l:0.66, c:0.20, h:175 },
      { t:0.66, l:0.70, c:0.22, h: 95 },
      { t:0.82, l:0.65, c:0.26, h: 45 },
      { t:1.00, l:0.52, c:0.30, h: 18 },
    ];
    const stops = isDark ? darkStops : lightStops;
    let a = stops[0], b = stops[stops.length - 1];
    for (let i = 0; i < stops.length - 1; i++) {
      if (t >= stops[i].t && t <= stops[i+1].t) { a = stops[i]; b = stops[i+1]; break; }
    }
    const s = a.t === b.t ? 0 : (t - a.t) / (b.t - a.t);
    const L = (x, y) => x + (y - x) * s;
    return `oklch(${L(a.l,b.l).toFixed(3)} ${L(a.c,b.c).toFixed(3)} ${L(a.h,b.h).toFixed(1)})`;
  };

  const cellColor = (count, inYear) => {
    if (!inYear) return 'transparent';
    if (count === 0) return isDark ? 'oklch(0.14 0.05 258)' : 'oklch(0.94 0.01 250)';
    const t = Math.min(1, count / Math.max(maxCount * 0.85, 2));
    return thermalColor(t);
  };

  // Multi-layer glow — much more aggressive in dark mode, subtle highlight in light mode
  const cellGlow = (count) => {
    if (count === 0) return 'none';
    const t = Math.min(1, count / Math.max(maxCount * 0.85, 2));
    if (isDark) {
      if (t < 0.25) return 'none';
      const i = Math.min(1, (t - 0.25) / 0.75); // 0→1
      const hue  = t > 0.82 ? 18  : t > 0.64 ? 42  : t > 0.46 ? 88  : 175;
      const hue2 = t > 0.82 ? 38  : t > 0.64 ? 68  : t > 0.46 ? 120 : 205;
      const hue3 = t > 0.82 ? 355 : t > 0.64 ? 28  : t > 0.46 ? 68  : 230;
      const b1 = Math.round(4  + i * 10);  // tight inner glow
      const b2 = Math.round(10 + i * 16);  // mid bloom
      const b3 = Math.round(20 + i * 20);  // wide halo
      const o1 = (0.55 + i * 0.40).toFixed(2);
      const o2 = (0.30 + i * 0.35).toFixed(2);
      const o3 = (0.15 + i * 0.22).toFixed(2);
      return [
        `0 0 ${b1}px oklch(0.88 0.34 ${hue}  / ${o1})`,
        `0 0 ${b2}px oklch(0.72 0.30 ${hue2} / ${o2})`,
        `0 0 ${b3}px oklch(0.58 0.25 ${hue3} / ${o3})`,
      ].join(', ');
    } else {
      // light mode: subtle drop shadow in the cell's color
      if (t < 0.45) return 'none';
      const i = (t - 0.45) / 0.55;
      const hue = t > 0.8 ? 18 : t > 0.6 ? 42 : 88;
      return `0 2px ${Math.round(5 + i * 8)}px oklch(0.55 0.28 ${hue} / ${(0.22 + i * 0.25).toFixed(2)})`;
    }
  };

  // Scroll to today on mount / when weeks ready
  React.useEffect(() => {
    const todayStr = new Date().toISOString().slice(0,10);
    const wi = weeks.findIndex(w => w.some(d => d.dateStr === todayStr));
    if (wi >= 0 && containerRef.current) {
      const cw = containerRef.current.offsetWidth;
      setPanX(Math.min(0, -(wi * STRIDE - cw / 2)));
    }
  }, [weeks.length]);

  const totalW = weeks.length * STRIDE;

  const onPointerDown = e => {
    drag.current = { active: true, startX: e.clientX, startPan: panX };
    setDrag(true);
    e.currentTarget.setPointerCapture(e.pointerId);
  };
  const onPointerMove = e => {
    if (!drag.current.active) return;
    const dx  = e.clientX - drag.current.startX;
    const cw  = containerRef.current?.offsetWidth || 600;
    const raw = drag.current.startPan + dx;
    setPanX(Math.min(0, Math.max(raw, -(totalW - cw + 24))));
  };
  const onPointerUp = () => { drag.current.active = false; setDrag(false); };

  const todayStr = new Date().toISOString().slice(0,10);
  const DAY_ABBR = ['S','M','T','W','T','F','S'];
  const MODES = [
    { id:'oa',   label:'Full OA' },
    { id:'team', label:'Team' },
    { id:'mine', label:'Mine' },
  ];

  const kindDot = kind => {
    if (kind === 'meeting')    return 'oklch(0.58 0.22 262)';
    if (kind === 'deadline')   return 'oklch(0.62 0.22 38)';
    if (kind === 'event')      return 'oklch(0.58 0.20 310)';
    if (kind === 'deliverable')return 'oklch(0.56 0.20 145)';
    return 'var(--ink-3)';
  };

  return (
    <React.Fragment>
    <section className="oa-panel" style={{padding:'18px 20px 14px', marginTop:'var(--gap)', marginBottom:'var(--gap)'}}>
      <header className="oa-panel-head" style={{marginBottom:14}}>
        <div>
          <h3>Activity Heatmap</h3>
          <span className="oa-panel-sub">Task &amp; event density — drag to pan</span>
        </div>
        <div style={{display:'flex', gap:4}}>
          {MODES.map(m => (
            <button key={m.id} onClick={() => setMode(m.id)} style={{
              padding:'4px 12px', borderRadius:20, fontSize:11, fontWeight:600,
              cursor:'pointer', border:'none',
              background: mode === m.id ? 'oklch(0.55 0.22 215)' : 'var(--panel-2)',
              color: mode === m.id ? '#fff' : 'var(--ink-2)',
              transition:'background 0.15s, color 0.15s',
            }}>{m.label}</button>
          ))}
        </div>
      </header>

      <div style={{display:'flex', gap:6, alignItems:'flex-start'}}>
        {/* Day-of-week labels */}
        <div style={{display:'flex', flexDirection:'column', gap:GAP, paddingTop:20, flexShrink:0, width:10}}>
          {DAY_ABBR.map((d, i) => (
            <div key={i} style={{
              height:CELL, fontSize:9,
              color: isDark ? 'oklch(0.55 0.04 260)' : 'oklch(0.45 0.05 250)',
              lineHeight:`${CELL}px`, textAlign:'right',
            }}>{i % 2 === 1 ? d : ''}</div>
          ))}
        </div>

        {/* Scrollable heatmap */}
        <div
          ref={containerRef}
          onPointerDown={onPointerDown}
          onPointerMove={onPointerMove}
          onPointerUp={onPointerUp}
          onPointerLeave={onPointerUp}
          style={{
            overflow:'hidden', flex:1, cursor: isDragging ? 'grabbing' : 'grab',
            position:'relative', userSelect:'none',
            background: isDark ? 'oklch(0.11 0.05 258)' : 'oklch(0.96 0.01 250)',
            borderRadius:8, padding:'8px 10px',
            boxShadow: isDark ? 'inset 0 0 40px oklch(0.08 0.04 258)' : 'inset 0 0 20px oklch(0.88 0.02 250)',
          }}
        >
          <div style={{transform:`translateX(${panX}px)`, willChange:'transform', display:'inline-block', verticalAlign:'top'}}>
            {/* Month labels */}
            <div style={{height:20, position:'relative', marginBottom:3, width: totalW}}>
              {monthLabels.map(({ wi, label }) => (
                <span key={label+wi} style={{
                  position:'absolute', left: wi * STRIDE,
                  fontSize:10, color: isDark ? 'oklch(0.62 0.06 260)' : 'oklch(0.42 0.06 250)', fontWeight:600, lineHeight:'20px', whiteSpace:'nowrap',
                }}>{label}</span>
              ))}
            </div>

            {/* Week columns */}
            <div style={{display:'flex', gap:GAP}}>
              {weeks.map((week, wi) => (
                <div key={wi} style={{display:'flex', flexDirection:'column', gap:GAP, flexShrink:0}}>
                  {week.map(({ date, dateStr }) => {
                    const inYear = date.getFullYear() === 2026;
                    const isToday = dateStr === todayStr;
                    const items  = dayMap[dateStr] || [];
                    return (
                      <div
                        key={dateStr}
                        onMouseEnter={e => {
                          if (!drag.current.active) {
                            const r = e.currentTarget.getBoundingClientRect();
                            setTooltip({ x: r.right + 6, y: r.top - 6, dateStr, items, date });
                          }
                        }}
                        onMouseLeave={() => setTooltip(null)}
                        style={{
                          width:CELL, height:CELL, borderRadius:1, flexShrink:0,
                          background: cellColor(items.length, inYear),
                          boxShadow: isToday
                            ? `0 0 0 2px oklch(${isDark ? '0.82 0.28 80' : '0.55 0.28 42'}), ${cellGlow(items.length)}`
                            : cellGlow(items.length),
                          transition:'background 0.12s',
                          zIndex: items.length > 0 ? 1 : 0, position:'relative',
                        }}
                      />
                    );
                  })}
                </div>
              ))}
            </div>
          </div>
        </div>
      </div>

      {/* Legend */}
      <div style={{display:'flex', alignItems:'center', gap:4, marginTop:10, justifyContent:'flex-end'}}>
        <span style={{fontSize:10, color:'var(--ink-4)'}}>Less</span>
        {[0, 0.18, 0.36, 0.54, 0.72, 0.88, 1.0].map((t, i) => (
          <div key={i} style={{
            width:CELL, height:CELL, borderRadius:1,
            background: cellColor(Math.round(t * Math.max(maxCount, 1)), true),
          }}/>
        ))}
        <span style={{fontSize:10, color:'var(--ink-4)'}}>More</span>
      </div>

    </section>
    {/* Portal: renders tooltip at <body> level to escape stacking context from backdrop-filter */}
    {tooltip && ReactDOM.createPortal(
      <div style={{
        position:'fixed',
        left: Math.min(tooltip.x + 10, window.innerWidth - 240),
        top:  Math.min(tooltip.y - 8, window.innerHeight - 180),
        background:'var(--panel)', border:'1px solid var(--line)',
        borderRadius:9, padding:'9px 13px', pointerEvents:'none', zIndex:2147483647,
        boxShadow:'0 4px 24px oklch(0 0 0 / 0.30)', minWidth:155, maxWidth:230,
        backdropFilter:'blur(12px)', WebkitBackdropFilter:'blur(12px)',
      }}>
        <div style={{fontSize:11, fontWeight:700, marginBottom: tooltip.items.length ? 5 : 0}}>
          {tooltip.date.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric',year:'numeric'})}
        </div>
        {tooltip.items.length === 0
          ? <div style={{fontSize:11, color:'var(--ink-4)'}}>No activity</div>
          : <>
              <div style={{fontSize:10, color:'var(--ink-3)', marginBottom:4}}>
                {tooltip.items.length} item{tooltip.items.length !== 1 ? 's' : ''}
              </div>
              {tooltip.items.slice(0, 6).map((item, i) => (
                <div key={i} style={{display:'flex', alignItems:'center', gap:5, fontSize:11, color:'var(--ink-2)', lineHeight:'1.6', overflow:'hidden'}}>
                  <div style={{width:6, height:6, borderRadius:'50%', flexShrink:0, background: kindDot(item.kind)}}/>
                  <span style={{overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap'}}>{item.label}</span>
                </div>
              ))}
              {tooltip.items.length > 6 && (
                <div style={{fontSize:10, color:'var(--ink-4)', marginTop:3}}>+{tooltip.items.length - 6} more</div>
              )}
            </>
        }
      </div>,
      document.body
    )}
    </React.Fragment>
  );
}
