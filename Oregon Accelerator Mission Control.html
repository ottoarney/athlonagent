              <div key={d.id} style={{display:'flex', alignItems:'center', gap:10, marginBottom:10}}>
                <div style={{width:32, textAlign:'center', flexShrink:0}}>
                  <div style={{fontSize:15, fontWeight:700, lineHeight:1, color:'var(--ink-1)'}}>{new Date(d.due+'T12:00:00').getDate()}</div>
                  <div style={{fontSize:10, color:'var(--ink-3)', textTransform:'uppercase'}}>{new Date(d.due+'T12:00:00').toLocaleDateString('en-US',{month:'short'})}</div>
                </div>
                <div style={{flex:1, minWidth:0}}>
                  <div style={{fontSize:13, fontWeight:500, overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap'}}>{d.title}</div>
                  {person && <div style={{fontSize:11.5, color:'var(--ink-3)'}}>{person.name.split(' ')[0]}</div>}
                </div>
                <span style={{fontSize:11, color: days===0?'oklch(0.7 0.2 25)':'var(--ink-3)', fontFamily:'var(--mono)'}}>
                  {days===0?'Today':days+'d'}
                </span>
              </div>
            );
          })}
        </div>
      </div>

      {/* Progress bar */}
      <div className="oa-panel" style={{padding:'14px 20px'}}>
        <div style={{display:'flex', justifyContent:'space-between', fontSize:13, marginBottom:8}}>
          <span style={{fontWeight:600}}>Overall progress</span>
          <span style={{fontFamily:'var(--mono)', color:'var(--ink-3)', fontSize:12}}>{done}/{total} complete</span>
        </div>
        <div className="oa-progbar big"><div style={{width:pct+'%'}}/></div>
      </div>
    </div>
  );
}

// ── Messages view ────────────────────────────────────────
function CampMessagesView({ c, state, setState }) {
  const { TEAM } = state;
  const [text, setText] = useState('');
  const comments = c.comments || [];
  const updateC = patch => setState(s => ({...s, CAMPAIGNS: s.CAMPAIGNS.map(x => x.id===c.id?{...x,...patch}:x)}));
  const send = () => {
    if (!text.trim()) return;
    updateC({ comments: [...comments, {id:'cm'+Date.now(), userId:'u4', at:new Date().toISOString(), text}] });
    setText('');
  };
  return (
    <div style={{display:'flex', flexDirection:'column', flex:1, minHeight:0, padding:'20px 24px', gap:16}}>
      <div style={{flex:1, overflowY:'auto', display:'flex', flexDirection:'column', gap:12}}>
        {comments.length === 0 && <div className="oa-empty big" style={{marginTop:32}}>No messages yet. Start the conversation.</div>}
        {comments.map(cm => {
          const u = TEAM.find(t => t.id===cm.userId);
          return (
            <div key={cm.id} className="oa-comment" style={{display:'flex', gap:12}}>
              <Avatar person={u} size={32}/>
              <div className="oa-comment-body" style={{flex:1}}>
                <div className="oa-comment-head">
                  <strong style={{fontSize:13}}>{u?.name || 'Unknown'}</strong>
                  <span className="oa-comment-time">{new Date(cm.at).toLocaleDateString('en-US',{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})}</span>
                </div>
                <div className="oa-comment-text" style={{fontSize:13, marginTop:4, lineHeight:1.5}}>{cm.text}</div>
              </div>
            </div>
          );
        })}
      </div>
      <div style={{display:'flex', gap:10, alignItems:'flex-end'}}>
        <Avatar person={TEAM.find(t=>t.id==='u4')} size={28}/>
        <textarea
          value={text} onChange={e=>setText(e.target.value)}
          onKeyDown={e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send();}}}
          placeholder="Add a message… (Enter to send)"
          style={{flex:1, resize:'none', minHeight:40, maxHeight:120, padding:'10px 14px',
            background:'var(--panel)', border:'1px solid var(--line)', borderRadius:10,
            fontFamily:'var(--font)', fontSize:13, color:'var(--ink-1)', outline:'none',}}
          rows={2}
        />
        <Button kind="primary" size="sm" onClick={send} disabled={!text.trim()}>Send</Button>
      </div>
    </div>
  );
}

// ── Files view ───────────────────────────────────────────
function CampFilesView({ c, state, setState }) {
  const fileInputRef = useRef(null);
  const [dragOver, setDragOver] = useState(false);

  // Normalise files array — seed data uses plain strings, real uploads use objects
  const files = (c.files || []).map(f =>
    typeof f === 'string'
      ? { id: f, name: f, size: '', type: f.split('.').pop().toLowerCase(), date: c.start || '2026-01-01', dataUrl: null }
      : f
  );

  const updateFiles = (next) => setState(s => ({
    ...s,
    CAMPAIGNS: s.CAMPAIGNS.map(x => x.id === c.id ? { ...x, files: next } : x),
  }));

  const fmtBytes = (bytes) => {
    if (!bytes) return '';
    if (bytes < 1024) return bytes + ' B';
    if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(0) + ' KB';
    return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
  };

  const processFiles = (fileList) => {
    Array.from(fileList).forEach(file => {
      const ext = file.name.split('.').pop().toLowerCase();
      const id = 'f' + Date.now() + Math.random().toString(36).slice(2);
      const entry = {
        id, name: file.name, size: fmtBytes(file.size),
        type: ext, date: new Date().toISOString().slice(0, 10),
        dataUrl: null,
      };
      // Read as data URL so we can offer download back
      const reader = new FileReader();
      reader.onload = e => {
        entry.dataUrl = e.target.result;
        updateFiles([...(c.files || []).map(f => typeof f === 'string'
          ? { id: f, name: f, size: '', type: f.split('.').pop().toLowerCase(), date: c.start || '2026-01-01', dataUrl: null }
          : f), entry]);
      };
      reader.readAsDataURL(file);
    });
  };

  const removeFile = (id) => updateFiles(files.filter(f => f.id !== id));

  const fileIcon = (type) => {
    const t = (type || '').toLowerCase();
    if (['pdf'].includes(t))                     return '📄';
    if (['zip','gz','tar','rar','7z'].includes(t)) return '📦';
    if (['xlsx','xls','csv'].includes(t))         return '📊';
    if (['docx','doc','txt','rtf'].includes(t))   return '📝';
    if (['pptx','ppt','key'].includes(t))         return '📑';
    if (['jpg','jpeg','png','gif','webp','svg','avif'].includes(t)) return '🖼️';
    if (['mp4','mov','avi','webm'].includes(t))   return '🎬';
    if (['mp3','wav','aac'].includes(t))          return '🎵';
    return '📎';
  };

  return (
    <div style={{padding:'24px', flex:1, overflowY:'auto'}}
      onDragOver={e => { e.preventDefault(); setDragOver(true); }}
      onDragLeave={e => { if (!e.currentTarget.contains(e.relatedTarget)) setDragOver(false); }}
      onDrop={e => { e.preventDefault(); setDragOver(false); processFiles(e.dataTransfer.files); }}
    >
      {/* Header */}
      <div style={{display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:16}}>
        <span style={{fontWeight:600, fontSize:13}}>{files.length} file{files.length !== 1 ? 's' : ''}</span>
        <button className="oa-btn kind-primary" style={{fontSize:12, display:'flex', alignItems:'center', gap:6}}
          onClick={() => fileInputRef.current?.click()}>
          <Icons.Plus size={12}/> Upload
        </button>
        <input ref={fileInputRef} type="file" multiple style={{display:'none'}}
          onChange={e => { processFiles(e.target.files); e.target.value = ''; }}/>
      </div>

      {/* Drop zone (shown when empty or while dragging) */}
      {(files.length === 0 || dragOver) && (
        <div style={{
          border: `2px dashed ${dragOver ? 'var(--accent)' : 'var(--line-2)'}`,
          borderRadius: 12, padding: '40px 24px', textAlign: 'center',
          background: dragOver ? 'oklch(0.72 0.24 145 / 0.06)' : 'var(--panel-2)',
          marginBottom: files.length > 0 ? 16 : 0, transition: 'all 0.15s',
          cursor: 'pointer',
        }} onClick={() => fileInputRef.current?.click()}>
          <div style={{fontSize:32, marginBottom:10}}>📁</div>
          <div style={{fontSize:13, fontWeight:500, color:'var(--ink-2)', marginBottom:4}}>
            {dragOver ? 'Drop files to upload' : 'Drop files here or click Upload'}
          </div>
          <div style={{fontSize:11.5, color:'var(--ink-3)'}}>PDFs, images, ZIPs, spreadsheets — any file type</div>
        </div>
      )}

      {/* File list */}
      {files.length > 0 && (
        <div style={{display:'flex', flexDirection:'column', gap:3}}>
          {files.map(f => (
            <div key={f.id} className="oa-panel"
              style={{display:'flex', alignItems:'center', gap:14, padding:'11px 16px',
                background:'var(--panel-2)', border:'1px solid var(--line)', borderRadius:'var(--radius)',
                opacity: dragOver ? 0.4 : 1, transition:'opacity 0.15s'}}>
              <span style={{fontSize:22, flexShrink:0, lineHeight:1}}>{fileIcon(f.type)}</span>
              <div style={{flex:1, minWidth:0}}>
                <div style={{fontSize:13, fontWeight:500, overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap'}}>{f.name}</div>
                <div style={{fontSize:11.5, color:'var(--ink-3)'}}>
                  {[f.size, f.date ? 'Added ' + fmt.date(f.date) : ''].filter(Boolean).join(' · ')}
                </div>
              </div>
              {f.dataUrl && (
                <a href={f.dataUrl} download={f.name} className="oa-iconbtn sm" title="Download" style={{color:'var(--ink-2)'}}>
                  <Icons.Arrow size={12}/>
                </a>
              )}
              <button className="oa-iconbtn sm" title="Remove" style={{color:'var(--ink-3)'}}
                onClick={() => removeFile(f.id)}>
                <Icons.X size={11}/>
              </button>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

// Right-side task detail drawer — structured form style
function TaskDetail({ taskId, campaignId, state, setState, onClose }) {
  const c = state.CAMPAIGNS.find(x => x.id === campaignId);
  const task = c?.deliverables.find(d => d.id === taskId);
  if (!task) return null;
  const { TEAM, ATHLETES, BRANDS, PLAYBOOKS } = state;
  const brand = BRANDS.find(b => b.id === c.brandId);
  const peopleOpts = [...TEAM, ...c.athleteIds.map(id => ATHLETES.find(a => a.id === id)).filter(Boolean)];
  const me = TEAM.find(t => t.id === 'u4');

  const pb = PLAYBOOKS.find(p => p.id === c.playbookId);
  const stages = c.customStages || pb?.stages || [];

  const [desc, setDesc] = useState(task.description || '');
  const [comment, setComment] = useState('');
  const [comments, setComments] = useState(task.comments || []);
  const [commentTab, setCommentTab] = useState('comments');
  const [collabOpen, setCollabOpen] = useState(false);
  const [typeOpen, setTypeOpen] = useState(false);
  const descRef = useRef(null);

  useEffect(() => {
    setDesc(task.description || '');
    setComments(task.comments || []);
  }, [taskId]);

  const collabs = task.collaborators || (task.assignee && task.assignee !== 'u4' ? ['u4', task.assignee] : ['u4']);
  const updateCollabs = (next) => update({ collaborators: next });

  const insertMd = (before, after = '', placeholder = '') => {
    const el = descRef.current;
    if (!el) return;
    const start = el.selectionStart, end = el.selectionEnd;
    const sel = el.value.slice(start, end) || placeholder;
    const newVal = el.value.slice(0, start) + before + sel + after + el.value.slice(end);
    setDesc(newVal); update({ description: newVal });
    setTimeout(() => { el.focus(); const p = start + before.length + sel.length; el.setSelectionRange(p, p); }, 0);
  };

  const activityLog = useMemo(() => {
    const entries = [], allPeople = [...TEAM, ...ATHLETES];
    entries.push({ id: 'created', at: c.start || '2026-01-01', text: 'Task created', icon: '✨' });
    if (task.assignee) { const p = allPeople.find(x => x.id === task.assignee); entries.push({ id: 'assigned', at: c.start || '2026-01-01', text: `Assigned to ${p?.name || 'unknown'}`, icon: '👤' }); }
    if (task.due) entries.push({ id: 'due', at: task.due, text: `Due date set to ${fmt.date(task.due)}`, icon: '📅' });
    if (task.done) entries.push({ id: 'done', at: task.due || c.end || '2026-01-01', text: 'Marked complete', icon: '✅' });
    comments.forEach(cm => { const u = allPeople.find(x => x.id === cm.userId); entries.push({ id: cm.id, at: cm.at, text: `${u?.name || 'Someone'} added a comment`, icon: '💬' }); });
    return entries.sort((a, b) => new Date(b.at) - new Date(a.at));
  }, [task, comments, TEAM, ATHLETES, c]);

  const update = (patch) => {
    const teamMemberIds = new Set(TEAM.map(t => t.id));
    setState(s => {
      const camp = s.CAMPAIGNS.find(x => x.id === c.id);
      const extraTeam = patch.assignee && teamMemberIds.has(patch.assignee)
        ? [...new Set([...(camp?.teamIds || []), patch.assignee])] : camp?.teamIds;
      return { ...s, CAMPAIGNS: s.CAMPAIGNS.map(x => x.id === c.id ? {
        ...x,
        deliverables: x.deliverables.map(d => d.id === taskId ? {...d, ...patch} : d),
        ...(extraTeam !== camp?.teamIds ? { teamIds: extraTeam } : {}),
      } : x) };
    });
  };

  const addComment = () => {
    if (!comment.trim()) return;
    const next = [...comments, { id: 'tc'+Date.now(), userId: 'u4', at: new Date().toISOString(), text: comment }];
    setComments(next); setComment(''); update({ comments: next });
  };

  const daysLeft = fmt.daysUntil(task.due);
  const isOverdue = daysLeft != null && daysLeft < 0 && !task.done;
  const isDueSoon = daysLeft != null && daysLeft >= 0 && daysLeft <= 2 && !task.done;

  // Task types
  const TASK_TYPES = [
    { id: 'social',     label: 'Social Post',       icon: '📱' },
    { id: 'video',      label: 'Video Content',      icon: '🎬' },
    { id: 'email',      label: 'Email / Newsletter', icon: '📧' },
    { id: 'appearance', label: 'Athlete Appearance', icon: '🏟️' },
    { id: 'deal',       label: 'Brand Deal',         icon: '🤝' },
    { id: 'general',    label: 'General Task',       icon: '✅' },
  ];
  const taskType = task.taskType || null;
  const typeInfo = TASK_TYPES.find(t => t.id === taskType);

  // Approval
  const approvalStatus = task.approvalStatus || null;
  const APPROVAL = {
    null:     { label: 'Approve',   bg: 'oklch(0.38 0.06 240)', hov: 'oklch(0.44 0.10 240)' },
    pending:  { label: 'In Review', bg: 'oklch(0.68 0.18 55)',  hov: 'oklch(0.73 0.18 55)'  },
    approved: { label: 'Approved',  bg: 'oklch(0.56 0.18 145)', hov: 'oklch(0.62 0.18 145)' },
    rejected: { label: 'Rejected',  bg: 'oklch(0.50 0.20 15)',  hov: 'oklch(0.56 0.20 15)'  },
  };
  const aprvCfg = APPROVAL[approvalStatus] || APPROVAL[null];
  const cycleApproval = () => {
    const order = [null, 'pending', 'approved', 'rejected'];
    update({ approvalStatus: order[(order.indexOf(approvalStatus) + 1) % order.length] });
  };

  // Platforms
  const PLATFORMS = ['TikTok', 'Instagram', 'Facebook', 'X', 'LinkedIn'];
  const togglePlatform = (p) => {
    const cur = task.platforms || [];
    update({ platforms: cur.includes(p) ? cur.filter(x => x !== p) : [...cur, p] });
  };

  // Form field helper
  const FormInput = ({ field, placeholder, multiline, rows = 4 }) => multiline
    ? <textarea className="oa-tdetail-form-textarea" rows={rows} value={task[field] || ''}
        onChange={e => update({ [field]: e.target.value })} placeholder={placeholder} />
    : <input className="oa-tdetail-form-input" value={task[field] || ''}
        onChange={e => update({ [field]: e.target.value })} placeholder={placeholder} />;

  return (
    <div className="oa-tdetail">
      {/* Top bar: breadcrumb + actions */}
      <div className="oa-tdetail-head">
        <button className="oa-iconbtn sm" onClick={onClose} title="Close"><Icons.X size={13}/></button>
        <span className="oa-tdetail-crumb">{c.title}</span>
        <div style={{flex:1}}/>
        <div className="oa-tdetail-head-actions">
          <button onClick={cycleApproval}
            style={{display:'flex', alignItems:'center', gap:5, padding:'5px 13px', borderRadius:7,
              fontSize:12, fontWeight:600, cursor:'pointer', border:'none', color:'#fff',
              background: aprvCfg.bg, transition:'background 0.15s'}}
            onMouseEnter={e => e.currentTarget.style.background = aprvCfg.hov}
            onMouseLeave={e => e.currentTarget.style.background = aprvCfg.bg}>
            {approvalStatus === 'approved' && <Icons.Check size={10}/>}
            {aprvCfg.label}
          </button>
        </div>
      </div>

      <div className="oa-tdetail-body">
        {/* Title hero: circle toggle + large editable title */}
        <div className="oa-tdetail-hero">
          <button
            className={`oa-tdetail-circle${task.done ? ' done' : ''}`}
            onClick={() => update({ done: !task.done })}
            title={task.done ? 'Mark incomplete' : 'Mark complete'}>
            {task.done && <Icons.Check size={11}/>}
          </button>
          <textarea
            className="oa-tdetail-title-big"
            value={task.title}
            rows={1}
            onChange={e => { update({title: e.target.value}); e.target.style.height='auto'; e.target.style.height=e.target.scrollHeight+'px'; }}
            placeholder="Task name"
          />
        </div>

        {/* Metadata pill row */}
        <div className="oa-tdetail-meta-row">
          {/* Assignee */}
          <SelectPill value={task.assignee || ''} onChange={v => update({assignee: v || null})}
            options={toPeopleOpts(peopleOpts)} searchable
            render={o => {
              if (!o.value) return <span className="oa-meta-pill"><Icons.UserPlus size={11}/> Assign</span>;
              const p = peopleOpts.find(x => x.id === o.value);
              return <span className="oa-meta-pill"><Avatar person={p} size={16}/>{p?.name}</span>;
            }} placeholder="Assign" />

          {/* Due date */}
          <div style={{position:'relative', display:'inline-flex'}}>
            <span className={`oa-meta-pill ${isOverdue ? 'overdue' : isDueSoon ? 'soon' : ''}`}>
              <Icons.Calendar size={11}/>
              {task.due ? fmt.dateLong(task.due) : 'Add due date'}
            </span>
            <input type="date" value={task.due || ''} onChange={e => update({due: e.target.value || null})}
              style={{position:'absolute', inset:0, opacity:0, cursor:'pointer', width:'100%', height:'100%'}}/>
          </div>

          {/* Stage */}
          {stages.length > 0 && (
            <SelectPill value={task.stageId || ''} onChange={v => update({stageId: v || null})}
              options={[{value:'', label:'No stage'}, ...stages.map(s => ({value: s.id, label: s.label}))]}
              render={o => <span className="oa-meta-pill"><Icons.Hash size={11}/>{o.value ? o.label : 'Stage'}</span>} />
          )}

          {/* Task type picker */}
          <div style={{position:'relative'}}>
            <button className={`oa-meta-pill type-btn ${taskType ? 'has-type' : ''}`} onClick={() => setTypeOpen(o => !o)}>
              {typeInfo ? <>{typeInfo.icon} {typeInfo.label}</> : <><Icons.Hash size={11}/> Add type</>}
            </button>
            {typeOpen && ReactDOM.createPortal(
              <div onClick={() => setTypeOpen(false)} style={{position:'fixed', inset:0, zIndex:2147483640}}>
                <div onClick={e => e.stopPropagation()}
                  style={{position:'fixed', zIndex:2147483641, top:120, right:20,
                    background:'var(--panel-solid)', border:'1px solid var(--line)', borderRadius:12,
                    boxShadow:'var(--shadow-pop)', padding:6, minWidth:210}}>
                  {TASK_TYPES.map(t => (
                    <button key={t.id} onClick={() => { update({taskType: t.id}); setTypeOpen(false); }}
                      style={{display:'flex', alignItems:'center', gap:9, width:'100%', padding:'7px 10px', borderRadius:7,
                        background: taskType === t.id ? 'var(--panel-2)' : 'transparent', border:'none', cursor:'pointer',
                        fontSize:13, color:'var(--ink)', textAlign:'left'}}>
                      <span>{t.icon}</span>{t.label}
                      {taskType === t.id && <Icons.Check size={11} style={{marginLeft:'auto', color:'oklch(0.56 0.18 145)'}}/>}
                    </button>
                  ))}
                  {taskType && <>
                    <div style={{height:1, background:'var(--line)', margin:'4px 6px'}}/>
                    <button onClick={() => { update({taskType: null}); setTypeOpen(false); }}
                      style={{display:'flex', alignItems:'center', gap:9, width:'100%', padding:'7px 10px', borderRadius:7,
                        background:'transparent', border:'none', cursor:'pointer', fontSize:12.5, color:'var(--ink-3)'}}>
                      <Icons.X size={11}/> Remove type
                    </button>
                  </>}
                </div>
              </div>,
              document.body
            )}
          </div>
        </div>

        {/* ── Social Post form ── */}
        {taskType === 'social' && (
          <div className="oa-tdetail-form">
            <p className="oa-tdetail-form-intro">
              Pop in the main message, tick the platforms, and add your caption. We'll work our magic and send it back for review before it goes live. Let's make it scroll-stopping ✨
            </p>
            <div className="oa-tdetail-form-block">
              <label className="oa-tdetail-form-label">What's the main message or purpose of this post?</label>
              <FormInput field="mainMessage" placeholder="e.g. Promote new partnership with Nike, highlight training routine…" />
            </div>
            <div className="oa-tdetail-form-block">
              <label className="oa-tdetail-form-label">Post this content to…</label>
              <div className="oa-tdetail-platforms">
                {PLATFORMS.map(p => {
                  const checked = (task.platforms || []).includes(p);
                  return (
                    <div key={p} className={`oa-tdetail-platform-row ${checked ? 'checked' : ''}`} onClick={() => togglePlatform(p)}>
                      <div className={`oa-tdetail-checkbox ${checked ? 'checked' : ''}`}>{checked && <Icons.Check size={10}/>}</div>
                      <span>{p}</span>
                    </div>
                  );
                })}
              </div>
            </div>
            <div className="oa-tdetail-form-block">
              <label className="oa-tdetail-form-label">Post Copy</label>
              <FormInput field="postCopy" placeholder="Write your caption here (emojis welcome 👀)…" multiline rows={5} />
            </div>
            <div className="oa-tdetail-form-block">
              <label className="oa-tdetail-form-label">Visual / Creative brief</label>
              <FormInput field="visualBrief" placeholder="Describe the image or video needed…" />
            </div>
          </div>
        )}

        {/* ── Video Content form ── */}
        {taskType === 'video' && (
          <div className="oa-tdetail-form">
            <div className="oa-tdetail-form-block">
              <label className="oa-tdetail-form-label">Video brief / concept</label>
              <FormInput field="videoBrief" placeholder="Describe the video concept…" multiline rows={3} />
            </div>
            <div style={{display:'grid', gridTemplateColumns:'1fr 1fr', gap:12}}>
              <div className="oa-tdetail-form-block">
                <label className="oa-tdetail-form-label">Platform</label>
                <FormInput field="videoPlatform" placeholder="TikTok, YouTube, Instagram…" />
              </div>
              <div className="oa-tdetail-form-block">
                <label className="oa-tdetail-form-label">Duration</label>
                <FormInput field="videoDuration" placeholder="e.g. 60s, 3 min…" />
              </div>
            </div>
            <div className="oa-tdetail-form-block">
              <label className="oa-tdetail-form-label">Script / Storyboard notes</label>
              <FormInput field="videoScript" placeholder="Key scenes, talking points, call to action…" multiline rows={4} />
            </div>
          </div>
        )}

        {/* ── Email / Newsletter form ── */}
        {taskType === 'email' && (
          <div className="oa-tdetail-form">
            <div className="oa-tdetail-form-block">
              <label className="oa-tdetail-form-label">Subject line</label>
              <FormInput field="emailSubject" placeholder="What will the email subject be?" />
            </div>
            <div className="oa-tdetail-form-block">
              <label className="oa-tdetail-form-label">Audience / Segment</label>
              <FormInput field="emailAudience" placeholder="e.g. All subscribers, Oregon fans, Brand partners…" />
            </div>
            <div className="oa-tdetail-form-block">
              <label className="oa-tdetail-form-label">Body copy</label>
              <FormInput field="emailBody" placeholder="Write the email content here…" multiline rows={6} />
            </div>
          </div>
        )}

        {/* ── Athlete Appearance form ── */}
        {taskType === 'appearance' && (
          <div className="oa-tdetail-form">
            <div className="oa-tdetail-form-block">
              <label className="oa-tdetail-form-label">Event name</label>
              <FormInput field="eventName" placeholder="Name of the event or activation…" />
            </div>
            <div style={{display:'grid', gridTemplateColumns:'1fr 1fr', gap:12}}>
              <div className="oa-tdetail-form-block">
                <label className="oa-tdetail-form-label">Location</label>
                <FormInput field="eventLocation" placeholder="Venue / city…" />
              </div>
              <div className="oa-tdetail-form-block">
                <label className="oa-tdetail-form-label">Duration</label>
                <FormInput field="eventDuration" placeholder="e.g. 2 hours…" />
              </div>
            </div>
            <div className="oa-tdetail-form-block">
              <label className="oa-tdetail-form-label">Athlete requirements</label>
              <FormInput field="eventRequirements" placeholder="What does the athlete need to do, wear, bring?" multiline rows={3} />
            </div>
          </div>
        )}

        {/* ── Brand Deal form ── */}
        {taskType === 'deal' && (
          <div className="oa-tdetail-form">
            <div style={{display:'grid', gridTemplateColumns:'1fr 1fr', gap:12}}>
              <div className="oa-tdetail-form-block">
                <label className="oa-tdetail-form-label">Deal value</label>
                <FormInput field="dealValue" placeholder="$0.00" />
              </div>
              <div className="oa-tdetail-form-block">
                <label className="oa-tdetail-form-label">Contract type</label>
                <FormInput field="dealType" placeholder="NIL, Endorsement, Licensing…" />
              </div>
            </div>
            <div className="oa-tdetail-form-block">
              <label className="oa-tdetail-form-label">Deliverables / Terms</label>
              <FormInput field="dealTerms" placeholder="List what's expected from the athlete and brand…" multiline rows={4} />
            </div>
          </div>
        )}

        {/* Description / Notes */}
        <div className="oa-tdetail-section" style={{marginTop:0}}>
          <div className="oa-k" style={{fontSize:11, letterSpacing:'0.07em'}}>{taskType ? 'Additional notes' : 'Description'}</div>
          <textarea className="oa-tdetail-desc" ref={descRef} value={desc}
            placeholder={taskType ? 'Any additional notes…' : 'Add a description…'}
            onChange={e => { setDesc(e.target.value); update({description: e.target.value}); }} />
          <div className="oa-tdetail-toolbar">
            <button className="oa-iconbtn sm" title="Bold" onClick={() => insertMd('**', '**', 'bold text')}><Icons.Bold size={11}/></button>
            <button className="oa-iconbtn sm" title="Italic" onClick={() => insertMd('_', '_', 'italic text')}><Icons.Italic size={11}/></button>
            <span className="oa-tdetail-sep"/>
            <button className="oa-iconbtn sm" title="Link" onClick={() => { const url = window.prompt('URL:','https://'); if (url) insertMd('[', `](${url})`, 'link text'); }}><Icons.Link size={11}/></button>
            <button className="oa-iconbtn sm" title="Bulleted list" onClick={() => insertMd('• ', '', 'list item')}><Icons.Listbul size={11}/></button>
            <button className="oa-iconbtn sm" title="Numbered list" onClick={() => insertMd('1. ', '', 'list item')}><Icons.Listnum size={11}/></button>
            <span className="oa-tdetail-sep"/>
            <button className="oa-iconbtn sm" title="Mention" onClick={() => insertMd('@', '', '')}><Icons.At size={11}/></button>
          </div>
        </div>

        {/* Quick fields: hours + cost */}
        <div className="oa-tdetail-section" style={{marginTop:0}}>
          <div style={{display:'grid', gridTemplateColumns:'1fr 1fr', gap:8}}>
            <div className="oa-tdetail-fieldrow">
              <Icons.Hash size={11}/><span>Est. hours</span>
              <input value={task.estimatedHours || ''} onChange={e => update({estimatedHours: e.target.value})}
                placeholder="—" style={{background:'transparent',border:'none',outline:'none',fontSize:13,color:'var(--asa-ink)',width:'100%',fontFamily:'inherit'}}/>
            </div>
            <div className="oa-tdetail-fieldrow">
              <Icons.Hash size={11}/><span>Cost</span>
              <input value={task.cost || ''} onChange={e => update({cost: e.target.value})}
                placeholder="—" style={{background:'transparent',border:'none',outline:'none',fontSize:13,color:'var(--asa-ink)',width:'100%',fontFamily:'inherit'}}/>
            </div>
          </div>
        </div>

        {/* Comments + Activity in scrollable body */}
        <div className="oa-tdetail-comments">
          <div className="oa-tdetail-tabs">
            <button className={commentTab==='comments'?'on':''} onClick={() => setCommentTab('comments')}>Comments</button>
            <button className={commentTab==='activity'?'on':''} onClick={() => setCommentTab('activity')}>All activity</button>
          </div>

          {commentTab === 'comments' && (
            <>
              {comments.length === 0 && <div style={{fontSize:12, color:'var(--asa-ink-3)', textAlign:'center', padding:'12px 0'}}>No comments yet</div>}
              {comments.map(cm => {
                const u = TEAM.find(t => t.id === cm.userId);
                return (
                  <div key={cm.id} className="oa-comment">
                    <Avatar person={u} size={28}/>
                    <div className="oa-comment-body">
                      <div className="oa-comment-head">
                        <strong>{u?.name}</strong>
                        <span className="oa-comment-time">{new Date(cm.at).toLocaleString('en-US',{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})}</span>
                      </div>
                      <div className="oa-comment-text">{cm.text}</div>
                    </div>
                  </div>
                );
              })}
            </>
          )}

          {commentTab === 'activity' && (
            <div style={{display:'flex', flexDirection:'column', gap:0}}>
              {activityLog.map(entry => (
                <div key={entry.id} style={{display:'flex', alignItems:'flex-start', gap:10, padding:'8px 0', borderBottom:'1px solid var(--asa-line-2,var(--line-2))'}}>
                  <span style={{fontSize:13, flexShrink:0, marginTop:1}}>{entry.icon}</span>
                  <div style={{flex:1}}>
                    <div style={{fontSize:12.5, color:'var(--asa-ink,var(--ink))'}}>{entry.text}</div>
                    <div style={{fontSize:11, color:'var(--asa-ink-3,var(--ink-3))', marginTop:2}}>{new Date(entry.at).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})}</div>
                  </div>
                </div>
              ))}
            </div>
          )}

          {/* Collaborators row */}
          <div className="oa-tdetail-collab" style={{position:'relative'}}>
            <span>Collaborators</span>
            <AvatarStack people={collabs.map(id => peopleOpts.find(p => p.id === id)).filter(Boolean)} size={20} max={4}/>
            <button className="oa-iconbtn sm" title="Add collaborator" onClick={() => setCollabOpen(o=>!o)}><Icons.Plus size={10}/></button>
            {collabOpen && (
              <div style={{position:'absolute', bottom:'calc(100% + 6px)', left:0, zIndex:50,
                background:'var(--panel-solid)', border:'1px solid var(--line)', borderRadius:10,
                boxShadow:'var(--shadow-pop)', padding:6, minWidth:200, maxHeight:240, overflowY:'auto'}}>
                <div style={{fontSize:11, color:'var(--ink-3)', padding:'4px 8px 6px', fontWeight:600, textTransform:'uppercase', letterSpacing:'0.06em'}}>Add collaborator</div>
                {peopleOpts.filter(p => !collabs.includes(p.id)).map(p => (
                  <button key={p.id} onClick={() => { updateCollabs([...collabs, p.id]); setCollabOpen(false); }}
                    style={{display:'flex', alignItems:'center', gap:8, width:'100%', padding:'6px 8px', borderRadius:7,
                      background:'transparent', border:'none', cursor:'pointer', fontSize:12.5, color:'var(--ink)'}}>
                    <Avatar person={p} size={20}/> {p.name}
                  </button>
                ))}
                {peopleOpts.filter(p => !collabs.includes(p.id)).length === 0 && (
                  <div style={{fontSize:12, color:'var(--ink-3)', padding:'8px 10px'}}>Everyone is already added.</div>
                )}
              </div>
            )}
            <div style={{flex:1}}/>
            {collabs.includes('u4') && (
              <button className="oa-tdetail-leave" onClick={() => updateCollabs(collabs.filter(id => id !== 'u4'))}>
                <Icons.X size={11}/> Leave task
              </button>
            )}
          </div>
        </div>

        {/* Bottom padding so content clears the pinned comment bar */}
        <div style={{height:8}}/>
      </div>

      {/* Pinned comment bar */}
      <div className="oa-tdetail-commentbar">
        <Avatar person={me} size={28}/>
        <input
          placeholder="Add a comment…"
          value={comment}
          onChange={e => setComment(e.target.value)}
          onKeyDown={e => e.key === 'Enter' && !e.shiftKey && addComment()}
        />
        {comment.trim() && (
          <button className="oa-btn kind-primary" style={{fontSize:12, padding:'5px 12px', flexShrink:0}} onClick={addComment}>Send</button>
        )}
      </div>
    </div>
  );
}

function Field({ label, children, stacked }) {
  return (
    <div className={`oa-tdetail-field ${stacked ? 'stacked':''}`}>

          <div className="oa-stat"><div className="oa-stat-v">{pct}%</div><div className="oa-stat-l">Done</div></div>
          <div className="oa-stat">

  return (
    <div className="oa-page">

        <div>
          <div className="oa-eyebrow">Projects</div>

function DeliverableReviewView({ c, state, setState }) {
  const { TEAM, ATHLETES } = state;
  const updateC = (patch) => setState(s => ({
    ...s, CAMPAIGNS: s.CAMPAIGNS.map(x => x.id === c.id ? {...x, ...patch} : x),
  }));
  const updateDeliv = (id, patch) => updateC({
    customDeliverables: (c.customDeliverables||[]).map(d => d.id === id ? {...d, ...patch} : d),
  });

  const all = c.customDeliverables || [];
  const [filter, setFilter] = React.useState('all');

  const RS_CONFIG = {
    draft:           { label:'Draft',           color:'var(--tone-slate-bg)',  ink:'var(--tone-slate-ink)'  },
    submitted:       { label:'Submitted',        color:'var(--tone-amber-bg)',  ink:'var(--tone-amber-ink)'  },
    approved:        { label:'Approved',         color:'var(--tone-green-bg)',  ink:'var(--tone-green-ink)'  },
    needs_revisions: { label:'Needs Revisions',  color:'var(--tone-coral-bg)',  ink:'var(--tone-coral-ink)'  },
  };

  const counts = {
    all:             all.length,
    submitted:       all.filter(d=>d.reviewStatus==='submitted').length,
    needs_revisions: all.filter(d=>d.reviewStatus==='needs_revisions').length,
    approved:        all.filter(d=>d.reviewStatus==='approved').length,
    draft:           all.filter(d=>d.reviewStatus==='draft'||!d.reviewStatus).length,
  };

  const visible = filter === 'all' ? all : all.filter(d => (d.reviewStatus||'draft') === filter);

  return (
    <div style={{padding:'24px 24px 32px', overflowY:'auto', flex:1}}>
      {/* Header */}
      <div style={{display:'flex', alignItems:'center', justifyContent:'space-between', marginBottom:20}}>
        <div>
          <h2 style={{margin:0, fontSize:18, fontWeight:700}}>Deliverable Review</h2>
          <div style={{fontSize:13, color:'var(--ink-3)', marginTop:3}}>
            Review and approve content deliverables for this campaign.
          </div>
        </div>
        <div style={{display:'flex', gap:4}}>
          {[
            { key:'all',             label:'All',              cnt: counts.all             },
            { key:'submitted',       label:'Submitted',        cnt: counts.submitted       },
            { key:'needs_revisions', label:'Needs Revision',   cnt: counts.needs_revisions },
            { key:'approved',        label:'Approved',         cnt: counts.approved        },
            { key:'draft',           label:'Draft',            cnt: counts.draft           },
          ].map(({key, label, cnt}) => (
            <button key={key} onClick={() => setFilter(key)}
              style={{
                padding:'5px 11px', borderRadius:7, border:'1px solid var(--line)',
                background: filter === key ? 'var(--panel-3)' : 'transparent',
                color: filter === key ? 'var(--ink)' : 'var(--ink-3)',
                fontSize:12, fontWeight:600, cursor:'pointer', display:'flex', alignItems:'center', gap:5,
              }}>
              {label}
              {cnt > 0 && (
                <span style={{background:'var(--panel-2)', color:'var(--ink-2)', fontSize:10.5, fontWeight:700, padding:'1px 6px', borderRadius:10, minWidth:18, textAlign:'center'}}>
                  {cnt}
                </span>
              )}
            </button>
          ))}
        </div>
      </div>

      {/* Summary bar */}
      <div style={{display:'flex', gap:10, marginBottom:20, flexWrap:'wrap'}}>
        {Object.entries(RS_CONFIG).map(([key, cfg]) => {
          const n = counts[key];
          return (
            <div key={key} style={{display:'flex', alignItems:'center', gap:8, padding:'8px 14px', background:'var(--panel)', borderRadius:10, border:'1px solid var(--line)', flex:'1 1 140px', minWidth:120}}>
              <div style={{width:10, height:10, borderRadius:'50%', background:cfg.color, border:`2px solid ${cfg.ink}`, flexShrink:0}}/>
              <div>
                <div style={{fontSize:18, fontWeight:700, lineHeight:1}}>{n}</div>
                <div style={{fontSize:11, color:'var(--ink-3)', marginTop:2}}>{cfg.label}</div>
              </div>
            </div>
          );
        })}
      </div>

      {/* Deliverable cards */}
      {visible.length === 0 && (
        <div className="oa-empty big">No deliverables in this category.</div>
      )}
      <div style={{display:'flex', flexDirection:'column', gap:10}}>
        {visible.map(d => {
          const person = TEAM.find(t=>t.id===d.assignee) || ATHLETES.find(a=>a.id===d.assignee);
          const rs = d.reviewStatus || 'draft';
          const cfg = RS_CONFIG[rs] || RS_CONFIG.draft;
          return (
            <div key={d.id} style={{
              background:'var(--panel)', border:'1px solid var(--line)',
              borderRadius:12, padding:'14px 16px',
              display:'flex', alignItems:'flex-start', gap:14,
              opacity: d.done ? 0.6 : 1,
            }}>
              {/* Status color bar */}
              <div style={{width:4, borderRadius:4, alignSelf:'stretch', background:cfg.color, border:`1.5px solid ${cfg.ink}`, flexShrink:0, minHeight:36}}/>

              {/* Main content */}
              <div style={{flex:1, minWidth:0}}>
                <div style={{display:'flex', alignItems:'center', gap:10, flexWrap:'wrap', marginBottom:6}}>
                  <span style={{fontWeight:600, fontSize:14}}>{d.title}</span>
                  {d.done && <span style={{fontSize:11, color:'var(--tone-green-ink)', background:'var(--tone-green-bg)', padding:'1px 7px', borderRadius:5, fontWeight:600}}>Completed</span>}
                </div>
                <div style={{display:'flex', alignItems:'center', gap:14, flexWrap:'wrap'}}>
                  {person && (
                    <span style={{display:'flex', alignItems:'center', gap:5, fontSize:12, color:'var(--ink-3)'}}>
                      <Avatar person={person} size={16}/>{person.name}
                    </span>
                  )}
                  {d.due && (
                    <span style={{fontSize:12, color:'var(--ink-4)'}}>
                      Due {new Date(d.due+'T00:00').toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})}
                    </span>
                  )}
                  {d.link ? (
                    <a href={d.link} target="_blank" rel="noopener noreferrer"
                      style={{display:'flex', alignItems:'center', gap:4, fontSize:12, color:'var(--accent-ink)', textDecoration:'none', fontWeight:500}}>
                      <Icons.Link size={11}/> View Deliverable
                    </a>
                  ) : (
                    <span style={{fontSize:12, color:'var(--ink-4)', fontStyle:'italic'}}>No link attached</span>
                  )}
                </div>
                {/* Inline link editor */}
                <DelivLinkEditor d={d} onSave={link => updateDeliv(d.id, {link})}/>
              </div>

              {/* Status selector */}
              <div style={{flexShrink:0, display:'flex', flexDirection:'column', alignItems:'flex-end', gap:8}}>
                <select
                  value={rs}
                  onChange={e => updateDeliv(d.id, { reviewStatus: e.target.value })}
                  style={{
                    fontSize:12, fontWeight:700, padding:'4px 10px', borderRadius:7,
                    border:'none', background:cfg.color, color:cfg.ink,
                    cursor:'pointer', outline:'none', appearance:'none', WebkitAppearance:'none',
                  }}>
                  <option value="draft">Draft</option>
                  <option value="submitted">Submitted</option>
                  <option value="approved">Approved</option>
                  <option value="needs_revisions">Needs Revisions</option>
                </select>
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

function DelivLinkEditor({ d, onSave }) {
  const [editing, setEditing] = React.useState(false);
  const [val, setVal] = React.useState(d.link || '');
  React.useEffect(() => { setVal(d.link || ''); }, [d.link]);
  if (!editing) {
    return (
      <button onClick={() => setEditing(true)}
        style={{marginTop:6, fontSize:11, color:'var(--ink-4)', background:'none', border:'none', cursor:'pointer', padding:0, textDecoration:'underline dotted'}}>
        {d.link ? 'Edit link' : '+ Add link'}
      </button>
    );
  }
  return (
    <div style={{display:'flex', gap:6, alignItems:'center', marginTop:8}}>
      <input autoFocus value={val} onChange={e=>setVal(e.target.value)}
        placeholder="https://..."
        style={{flex:1, background:'var(--panel-2)', border:'1px solid var(--line)', borderRadius:6, padding:'4px 8px', fontSize:12, color:'var(--ink)', outline:'none'}}
        onKeyDown={e=>{ if(e.key==='Enter'){onSave(val);setEditing(false);} if(e.key==='Escape') setEditing(false); }}
      />
      <Button size="sm" kind="primary" onClick={()=>{onSave(val);setEditing(false);}}>Save</Button>
      <Button size="sm" kind="ghost" onClick={()=>setEditing(false)}>Cancel</Button>
    </div>
  );
}

function ProjectDashboard({ campaignId, state, setState, openTaskView, openAthlete, inline, hideHeader }) {
  const { CAMPAIGNS, BRANDS, ATHLETES, TEAM } = state;
  const c = CAMPAIGNS.find(x => x.id === campaignId);
  if (!c) return <div className="oa-empty big">Project not found.</div>;

  const brand = BRANDS.find(b => b.id === c.brandId);
  const owner = TEAM.find(t => t.id === c.ownerId);
  const athletes = c.athleteIds.map(id => ATHLETES.find(a => a.id === id)).filter(Boolean);
  const done = c.deliverables.filter(d => d.done).length;
  const total = c.deliverables.length;
  const pct = total ? Math.round(done / total * 100) : 0;
  const daysLeft = fmt.daysUntil(c.end);
  const overdue = c.deliverables.filter(d => !d.done && fmt.daysUntil(d.due) < 0).length;
  const updateC = (patch) => setState(s => ({
    ...s, CAMPAIGNS: s.CAMPAIGNS.map(x => x.id === c.id ? {...x, ...patch} : x),
  }));
  const toggleDeliv = (did) => updateC({
    deliverables: c.deliverables.map(d => d.id === did ? {...d, done:!d.done} : d),
  });

  // Custom deliverables (content pieces — separate from workflow steps)
  const customDeliverables = c.customDeliverables || [];
  const [newDelivTitle, setNewDelivTitle] = useState('');
  const [newDelivLink, setNewDelivLink] = useState('');
  const addCustomDeliv = () => {
    const title = newDelivTitle.trim();
    if (!title) return;
    const id = 'cd' + Date.now();
    updateC({ customDeliverables: [...customDeliverables, { id, title, done: false, assignee: null, due: null, link: newDelivLink.trim(), reviewStatus: 'draft' }] });
    setNewDelivTitle('');
    setNewDelivLink('');
  };
  const toggleCustomDeliv = (id) => updateC({
    customDeliverables: customDeliverables.map(d => d.id === id ? {...d, done: !d.done} : d),
  });
  const updateCustomDeliv = (id, patch) => updateC({
    customDeliverables: customDeliverables.map(d => d.id === id ? {...d, ...patch} : d),
  });
  const removeCustomDeliv = (id) => updateC({
    customDeliverables: customDeliverables.filter(d => d.id !== id),
  });

  return (
    <div className={inline ? '' : 'oa-page'}>
      {/* Header — hidden in inline/tab mode, shown as standalone page */}
      {!inline && (
        <div className="oa-dash-head" style={{marginBottom:20}}>
          <div style={{display:'flex', alignItems:'center', gap:14}}>
            <div style={{width:44, height:44, borderRadius:10, background:campColorVal(c), display:'grid', placeItems:'center', flexShrink:0, color:'oklch(0.1 0.02 160)'}}>
              {campIconEl(c, 20)}
            </div>
            <div>
              <div className="oa-eyebrow">{brand?.name}</div>
              <h1 className="oa-h1" style={{margin:'2px 0'}}>{c.title}</h1>
              <div className="oa-sub">
                <StatusChip status={c.status}/>
                <span className="oa-dotsep">·</span>
                <span>{fmt.dateLong(c.start)} → {fmt.dateLong(c.end)}</span>
              </div>
            </div>
          </div>
          <div className="oa-dash-head-actions">
            <Button kind="ghost" icon={<Icons.Grid size={14}/>} onClick={openTaskView}>Task view</Button>
          </div>
        </div>
      )}
      {/* Compact inline header strip shown inside the tab panel — hidden when host already provides a header */}
      {inline && !hideHeader && (
        <div style={{display:'flex', alignItems:'center', gap:12, marginBottom:20}}>
          <div style={{width:36, height:36, borderRadius:8, background:campColorVal(c), display:'grid', placeItems:'center', flexShrink:0, color:'oklch(0.1 0.02 160)'}}>
            {campIconEl(c, 16)}
          </div>
          <div style={{flex:1, minWidth:0}}>
            <div style={{fontWeight:600, fontSize:14, color:'var(--ink-1)'}}>{c.title}</div>
            <div className="oa-sub" style={{marginTop:1}}>
              <span style={{color:'var(--ink-2)', fontSize:12}}>{brand?.name}</span>
              <span className="oa-dotsep">·</span>
              <span style={{color:'var(--ink-3)', fontSize:12}}>{fmt.dateLong(c.start)} → {fmt.dateLong(c.end)}</span>
            </div>
          </div>
          <Button kind="ghost" size="sm" icon={<Icons.Grid size={12}/>} onClick={openTaskView}>Task view</Button>
        </div>
      )}

      {/* KPIs */}
      <div className="oa-kpi-row">
        <div className="oa-kpi">
          <div className="oa-kpi-label">Budget</div>
          <div className="oa-kpi-value">{fmt.moneyShort(c.budget)}</div>
          <div className="oa-kpi-delta">{c.exclusivity}</div>
        </div>
        <div className="oa-kpi">
          <div className="oa-kpi-label">Progress</div>
          <div className="oa-kpi-value">{pct}%</div>

const PLATFORMS = [
  { id:'instagram', label:'Instagram', color:'oklch(0.65 0.22 330)', bg:'oklch(0.65 0.22 330 / 0.12)', Icon: () => <Icons.Instagram size={13}/> },
  { id:'tiktok',    label:'TikTok',    color:'oklch(0.72 0.18 192)', bg:'oklch(0.72 0.18 192 / 0.12)', Icon: () => <Icons.TikTok size={13}/> },
  { id:'twitter',   label:'X / Twitter', color:'oklch(0.80 0.02 240)', bg:'oklch(0.80 0.02 240 / 0.10)', Icon: () => <Icons.TwitterX size={13}/> },
  { id:'linkedin',  label:'LinkedIn',  color:'oklch(0.55 0.18 242)', bg:'oklch(0.55 0.18 242 / 0.12)', Icon: () => <Icons.LinkedIn size={13}/> },
  { id:'youtube',   label:'YouTube',   color:'oklch(0.55 0.22 25)',  bg:'oklch(0.55 0.22 25 / 0.12)',  Icon: () => <Icons.YouTube size={13}/> },
];

const PLATFORM_TYPES = {
  instagram: ['Post','Reel','Story','Carousel'],
  tiktok:    ['Video','Live'],
  twitter:   ['Tweet','Thread'],
  linkedin:  ['Post','Article','Poll'],
  youtube:   ['Video','Short','Live'],
};

const POST_STATUS = [
  { id:'draft',     label:'Draft',     color:'var(--ink-3)',            bg:'var(--panel-2)' },
  { id:'scheduled', label:'Scheduled', color:'oklch(0.72 0.22 82)',    bg:'oklch(0.72 0.22 82 / 0.12)' },
  { id:'published', label:'Published', color:'oklch(0.72 0.24 145)',   bg:'oklch(0.72 0.24 145 / 0.12)' },
  { id:'archived',  label:'Archived',  color:'var(--ink-4)',            bg:'var(--panel-2)' },
];

function platformOf(id) { return PLATFORMS.find(p => p.id === id) || PLATFORMS[0]; }
function statusOf(id)   { return POST_STATUS.find(s => s.id === id) || POST_STATUS[0]; }
// Normalize: supports both old `platform` string and new `platforms` array
function getPlatforms(post) {
  if (Array.isArray(post.platforms) && post.platforms.length) return post.platforms;
  if (post.platform) return [post.platform];
  return ['instagram'];
}

function PlatformBadge({ platform, platforms, size = 'sm' }) {
  // Accepts either a single platform id or an array
  const ids = platforms || (platform ? [platform] : ['instagram']);
  const pad = size === 'sm' ? '3px 7px 3px 5px' : '4px 9px 4px 7px';
  if (ids.length === 1) {
    const p = platformOf(ids[0]);
    return (
      <span style={{display:'inline-flex', alignItems:'center', gap:5, padding:pad, borderRadius:999,
        background:p.bg, color:p.color, fontSize: size==='sm'?11:12, fontWeight:600, whiteSpace:'nowrap'}}>
        <p.Icon/> {p.label}
      </span>
    );
  }
  // Multiple: show stacked icon-only badges + "+N more" if needed
  const show = ids.slice(0, 3);
  return (
    <span style={{display:'inline-flex', alignItems:'center', gap:4}}>
      {show.map(id => {
        const p = platformOf(id);
        return (
          <span key={id} title={p.label}
            style={{display:'inline-flex', alignItems:'center', justifyContent:'center',
              width:22, height:22, borderRadius:999, background:p.bg, color:p.color, fontSize:11}}>
            <p.Icon/>
          </span>
        );
      })}
      {ids.length > 3 && <span style={{fontSize:10, color:'var(--ink-4)', fontWeight:600}}>+{ids.length-3}</span>}
    </span>
  );
}

function StatusBadge({ status }) {
  const s = statusOf(status);
  return (
    <span style={{display:'inline-flex', alignItems:'center', gap:4, padding:'2px 8px', borderRadius:999,
      background:s.bg, color:s.color, fontSize:11, fontWeight:600}}>
      {s.label}
    </span>
  );
}

// ── File Links Editor ────────────────────────────────────
function FileLinksEditor({ files, onChange }) {
  const [newName, setNewName] = useState('');
  const [newUrl,  setNewUrl]  = useState('');

  const addFile = () => {
    const url = newUrl.trim();
    if (!url) return;
    const name = newName.trim() || url.replace(/^https?:\/\//,'').slice(0,40);
    onChange([...(files||[]), {id:'f_'+Date.now(), name, url}]);
    setNewName(''); setNewUrl('');
  };

  const removeFile = (id) => onChange((files||[]).filter(f => f.id !== id));

  const onKeyDown = (e) => { if (e.key === 'Enter') { e.preventDefault(); addFile(); } };

  return (
    <div style={{marginBottom:0}}>
      <label style={{fontSize:11, fontWeight:600, color:'var(--ink-3)', textTransform:'uppercase', letterSpacing:'0.07em', display:'block', marginBottom:8}}>
        Files &amp; Links
      </label>

      {/* Existing files */}
      {(files||[]).length > 0 && (
        <div style={{display:'flex', flexDirection:'column', gap:6, marginBottom:10}}>
          {(files||[]).map(f => (
            <div key={f.id} style={{display:'flex', alignItems:'center', gap:8, padding:'7px 10px',
              borderRadius:8, border:'1px solid var(--line)', background:'var(--panel-2)'}}>
              <Icons.Link size={12} style={{color:'var(--accent)', flexShrink:0}}/>
              <a href={f.url} target="_blank" rel="noopener noreferrer"
                onClick={e => e.stopPropagation()}
                style={{flex:1, fontSize:13, color:'var(--accent-ink)', textDecoration:'none',
                  overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap'}}
                title={f.url}>
                {f.name}
              </a>
              <button onClick={() => removeFile(f.id)}
                style={{background:'none', border:'none', cursor:'pointer', color:'var(--ink-4)',
                  padding:'2px 4px', borderRadius:4, lineHeight:1, flexShrink:0}}
                title="Remove">
                <Icons.X size={11}/>
              </button>
            </div>
          ))}
        </div>
      )}

      {/* Add new file row */}
      <div style={{display:'flex', gap:8, alignItems:'center'}}>
        <input value={newName} onChange={e => setNewName(e.target.value)} onKeyDown={onKeyDown}
          placeholder="Label (optional)"
          style={{flex:'0 0 140px', padding:'7px 10px', borderRadius:8, border:'1px solid var(--line)',
            background:'var(--panel-2)', color:'var(--ink)', fontSize:12, outline:'none', boxSizing:'border-box'}}/>
        <input value={newUrl} onChange={e => setNewUrl(e.target.value)} onKeyDown={onKeyDown}
          placeholder="https://…"
          style={{flex:1, padding:'7px 10px', borderRadius:8, border:'1px solid var(--line)',
            background:'var(--panel-2)', color:'var(--ink)', fontSize:12, outline:'none', boxSizing:'border-box'}}/>
        <button onClick={addFile} disabled={!newUrl.trim()}
          style={{padding:'7px 14px', borderRadius:8, fontSize:12, fontWeight:600, cursor:'pointer',
            border:'1px solid var(--line)', background: newUrl.trim() ? 'var(--accent-wash)' : 'transparent',
            color: newUrl.trim() ? 'var(--accent-ink)' : 'var(--ink-4)', whiteSpace:'nowrap',
            transition:'all 0.15s'}}>
          Add
        </button>
      </div>
      <div style={{fontSize:11, color:'var(--ink-4)', marginTop:5}}>Add links to Figma files, Google Docs, Dropbox folders, or any asset.</div>
    </div>
  );
}

// ── Add/Edit Post Modal ───────────────────────────────────
function PostModal({ post, state, onSave, onClose }) {
  const { TEAM } = state;
  const isNew = !post;
  const [form, setForm] = useState(() => {
    let base = post || {
      platforms:['instagram'], type:'Reel', status:'draft',
      title:'', caption:'', hashtags:[], scheduledAt:'', assignee:'u4', tags:[], notes:'', files:[],
    };
    // Normalize legacy single-platform posts
    if (!base.platforms) base = {...base, platforms: base.platform ? [base.platform] : ['instagram']};
    if (!base.files) base = {...base, files:[]};
    return base;
  });
  const set = (k, v) => setForm(f => ({...f, [k]: v}));

  // Multi-platform toggle
  const togglePlatform = (id) => {
    setForm(f => {
      const cur = f.platforms || [];
      const next = cur.includes(id) ? cur.filter(p => p !== id) : [...cur, id];
      if (next.length === 0) return f; // must keep at least one
      // Rebuild available types from all selected platforms
      const allTypes = [...new Set(next.flatMap(p => PLATFORM_TYPES[p] || ['Post']))];
      const type = allTypes.includes(f.type) ? f.type : allTypes[0];
      return {...f, platforms: next, type};
    });
  };
  const selectedPlatforms = form.platforms || ['instagram'];
  const types = [...new Set(selectedPlatforms.flatMap(p => PLATFORM_TYPES[p] || ['Post']))];

  const hashtagStr = (form.hashtags||[]).join(' ');
  const setHashtags = (str) => set('hashtags', str.replace(/#/g,'').split(/[\s,]+/).filter(Boolean));

  const save = () => {
    if (!form.title?.trim() && !form.caption?.trim()) return;
    onSave(form);
  };

  return (
    <div style={{position:'fixed', inset:0, zIndex:200, display:'flex', alignItems:'center', justifyContent:'center'}}>
      <div style={{position:'absolute', inset:0, background:'oklch(0.05 0.02 200 / 0.6)', backdropFilter:'blur(8px)'}}
        onClick={onClose}/>
      <div style={{position:'relative', zIndex:1, background:'var(--panel-solid)', border:'1px solid var(--line)',
        borderRadius:16, boxShadow:'var(--shadow-pop)', width:560, maxHeight:'90vh', overflowY:'auto', padding:'28px 32px'}}>

        <div style={{display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:24}}>
          <h3 style={{margin:0, fontSize:17, fontWeight:700}}>{isNew ? 'New post' : 'Edit post'}</h3>
          <button className="oa-iconbtn sm" onClick={onClose}><Icons.X size={14}/></button>
        </div>

        {/* Platform + Type */}
        <div style={{display:'grid', gridTemplateColumns:'1fr 1fr', gap:14, marginBottom:18}}>
          <div>
            <label style={{fontSize:11, fontWeight:600, color:'var(--ink-3)', textTransform:'uppercase', letterSpacing:'0.07em', display:'block', marginBottom:6}}>

            </label>
            <div style={{display:'flex', flexWrap:'wrap', gap:6}}>
              {PLATFORMS.map(p => {

                  <button key={p.id} onClick={() => togglePlatform(p.id)}

                      color: on ? p.color : 'var(--ink-3)',

                    <p.Icon/> {p.label}

                      borderRadius:'50%', background:'var(--accent)', display:'flex', alignItems:'center',
                      justifyContent:'center'}}>
                      <Icons.Check size={8} style={{color:'var(--accent-ink)', strokeWidth:3}}/>
                    </span>}

            <label style={{fontSize:11, fontWeight:600, color:'var(--ink-3)', textTransform:'uppercase', letterSpacing:'0.07em', display:'block', marginBottom:6}}>Content type</label>
            <div style={{display:'flex', flexWrap:'wrap', gap:6}}>
              {types.map(t => (
                <button key={t} onClick={() => set('type', t)}
                  style={{padding:'5px 12px', borderRadius:8,
                    border: form.type===t ? '1.5px solid var(--accent)' : '1px solid var(--line)',
                    background: form.type===t ? 'var(--accent-wash)' : 'transparent',

          <label style={{fontSize:11, fontWeight:600, color:'var(--ink-3)', textTransform:'uppercase', letterSpacing:'0.07em', display:'block', marginBottom:6}}>Title</label>
          <input value={form.title||''} onChange={e => set('title', e.target.value)}
            placeholder="Short label for this post…"
            style={{width:'100%', padding:'8px 12px', borderRadius:9, border:'1px solid var(--line)',
              background:'var(--panel-2)', color:'var(--ink)', fontSize:13, outline:'none', boxSizing:'border-box'}}/>
        </div>

        {/* Caption */}
        <div style={{marginBottom:16}}>
          <label style={{fontSize:11, fontWeight:600, color:'var(--ink-3)', textTransform:'uppercase', letterSpacing:'0.07em', display:'block', marginBottom:6}}>Caption</label>
          <textarea value={form.caption} onChange={e => set('caption', e.target.value)}
            placeholder="Write your caption…"
            rows={5}
            style={{width:'100%', padding:'10px 12px', borderRadius:9, border:'1px solid var(--line)',
              background:'var(--panel-2)', color:'var(--ink)', fontSize:13, outline:'none',
              resize:'vertical', fontFamily:'inherit', boxSizing:'border-box', lineHeight:1.6}}/>
          <div style={{display:'flex', justifyContent:'flex-end', marginTop:4}}>
            <span style={{fontSize:11, color:'var(--ink-4)'}}>{form.caption.length} chars</span>
          </div>
        </div>

        {/* Hashtags */}
        <div style={{marginBottom:16}}>
          <label style={{fontSize:11, fontWeight:600, color:'var(--ink-3)', textTransform:'uppercase', letterSpacing:'0.07em', display:'block', marginBottom:6}}>Hashtags</label>
          <input value={hashtagStr} onChange={e => setHashtags(e.target.value)}
            placeholder="OregonAccelerator NIL CollegiateAthletes…"
            style={{width:'100%', padding:'8px 12px', borderRadius:9, border:'1px solid var(--line)',
              background:'var(--panel-2)', color:'var(--ink)', fontSize:13, outline:'none', boxSizing:'border-box'}}/>
          <div style={{fontSize:11, color:'var(--ink-4)', marginTop:4}}>Separate with spaces or commas. # is added automatically.</div>
        </div>

        {/* Date + Assignee row */}
        <div style={{display:'grid', gridTemplateColumns:'1fr 1fr', gap:14, marginBottom:16}}>
          <div>
            <label style={{fontSize:11, fontWeight:600, color:'var(--ink-3)', textTransform:'uppercase', letterSpacing:'0.07em', display:'block', marginBottom:6}}>Schedule date &amp; time</label>
            <input type="datetime-local" value={form.scheduledAt ? form.scheduledAt.slice(0,16) : ''}
              onChange={e => set('scheduledAt', e.target.value ? e.target.value + ':00' : '')}
              style={{width:'100%', padding:'8px 12px', borderRadius:9, border:'1px solid var(--line)',
                background:'var(--panel-2)', color:'var(--ink)', fontSize:13, outline:'none', boxSizing:'border-box'}}/>
          </div>
          <div>
            <label style={{fontSize:11, fontWeight:600, color:'var(--ink-3)', textTransform:'uppercase', letterSpacing:'0.07em', display:'block', marginBottom:6}}>Assigned to</label>
            <SelectPill value={form.assignee || ''} onChange={v => set('assignee', v)}
              options={toPeopleOpts(TEAM, false)}
              searchable
              render={o => {
                const p = TEAM.find(x => x.id === o.value);
                return p ? <span style={{display:'flex', alignItems:'center', gap:6, fontSize:13}}><Avatar person={p} size={20}/>{p.name.split(' ')[0]}</span>
