<!DOCTYPE html>
<html lang="en" data-theme="light" data-density="dense">
<head>
<meta charset="UTF-8"/>
<title>Oregon Accelerator — Mission Control</title>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script>
  window.__TWEAK_DEFAULTS = { "home": "dashboard", "density": "dense", "dark": false };
  document.documentElement.setAttribute('data-theme', 'light');
  document.documentElement.setAttribute('data-density', window.__TWEAK_DEFAULTS.density);
  window.onerror = function(msg, src, line, col, err) {
    document.body.innerHTML = '<pre style="position:fixed;top:0;left:0;right:0;bottom:0;background:#fff;color:#c00;padding:24px;overflow:auto;z-index:9999;font-size:13px;font-family:monospace">' + msg + '\nLine: ' + line + ', Col: ' + col + '\n\n' + (err && err.stack || '') + '</pre>';
  };
</script>
<style>
/* Oregon Accelerator Mission Control — stylesheet */

:root {
  --green: oklch(0.36 0.14 148);          /* kept for status chips */
  --green-2: oklch(0.44 0.16 148);
  --green-bright: oklch(0.78 0.28 145);
  --silver: linear-gradient(135deg, oklch(0.9 0.01 220), oklch(0.72 0.02 230), oklch(0.88 0.01 200));
  --yellow: #FEE11A;

  /* ── Light mode: clean SaaS white with pastel blobs ── */
  --bg: oklch(0.988 0.004 280);
  --bg-grad:
    radial-gradient(ellipse 110% 55% at  0%  0%,  oklch(0.90 0.07 340 / 0.70), transparent 52%),
    radial-gradient(ellipse 80%  50% at 100% 0%,  oklch(0.90 0.07 280 / 0.65), transparent 50%),
    radial-gradient(ellipse 100% 60% at 90% 105%, oklch(0.90 0.06 185 / 0.60), transparent 52%),
    radial-gradient(ellipse 70%  55% at  0% 105%, oklch(0.93 0.06 80  / 0.55), transparent 55%),
    linear-gradient(165deg, oklch(0.995 0.002 290), oklch(0.980 0.005 265));

  /* ── Glass surfaces ── */
  --panel:       oklch(1 0 0 / 0.78);
  --panel-2:     oklch(1 0 0 / 0.58);
  --panel-3:     oklch(1 0 0 / 0.36);
  --panel-solid: oklch(0.998 0.003 270 / 0.95);
  --sidebar-bg:  oklch(1 0 0 / 0.72);
  --glass-1:     oklch(1 0 0 / 0.58);
  --glass-2:     oklch(1 0 0 / 0.42);

  /* ── Ink — near-black with cool tint ── */
  --ink:   oklch(0.11 0.018 265);
  --ink-2: oklch(0.22 0.016 268);
  --ink-3: oklch(0.42 0.012 268);
  --ink-4: oklch(0.58 0.008 268);

  /* ── Borders ── */
  --line:         oklch(0.12 0.01 268 / 0.11);
  --line-2:       oklch(0.12 0.01 268 / 0.06);
  --stroke-inner: inset 0 1px 0 oklch(1 0 0 / 0.85), inset 0 0 0 1px oklch(0 0 0 / 0.06);

  /* ── Accent — indigo/blue-violet ── */
  --accent:      oklch(0.48 0.22 265);
  --accent-wash: oklch(0.91 0.07 265 / 0.28);
  --accent-ink:  oklch(0.38 0.20 265);

  /* ── Status tones ── */
  --tone-green-bg:   oklch(0.88 0.10 148 / 0.65);
  --tone-green-ink:  oklch(0.28 0.13 148);
  --tone-amber-bg:   oklch(0.90 0.10 78  / 0.65);
  --tone-amber-ink:  oklch(0.36 0.13 65);
  --tone-violet-bg:  oklch(0.88 0.09 298 / 0.65);
  --tone-violet-ink: oklch(0.34 0.12 298);
  --tone-slate-bg:   oklch(0.90 0.02 228 / 0.65);
  --tone-slate-ink:  oklch(0.34 0.04 228);
  --tone-coral-bg:   oklch(0.88 0.10 28  / 0.65);
  --tone-coral-ink:  oklch(0.36 0.14 28);

  --radius-sm: 6px;
  --radius: 10px;
  --radius-lg: 14px;
  --radius-xl: 20px;

  --blur: saturate(180%) blur(24px);
  --blur-strong: saturate(200%) blur(36px);

  --shadow-pop:  0 24px 64px -18px oklch(0.15 0.10 265 / 0.22), 0 6px 18px -6px oklch(0.15 0.10 265 / 0.12);
  --shadow-card: 0 2px 12px -4px oklch(0.15 0.10 265 / 0.12);

  --row-h: 40px;
  --gap: 14px;

  --font: 'Inter', -apple-system, 'Segoe UI', sans-serif;
  --mono: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace;
}

html[data-theme="dark"] {
  /* ── Base — deep space, near-black blue-green ── */
  --bg: oklch(0.055 0.018 205);
  --bg-grad:
    radial-gradient(ellipse 130% 60% at  0% -8%,  oklch(0.28 0.22 148 / 0.70), transparent 52%),
    radial-gradient(ellipse 85%  60% at 100% 2%,  oklch(0.18 0.16 262 / 0.60), transparent 52%),
    radial-gradient(ellipse 110% 70% at 82% 110%, oklch(0.20 0.18 192 / 0.65), transparent 55%),
    radial-gradient(ellipse 75%  60% at  2%  98%, oklch(0.22 0.14 130 / 0.55), transparent 60%),
    linear-gradient(172deg, oklch(0.072 0.022 195), oklch(0.042 0.014 218));

  /* ── Glass surfaces — translucent so backdrop-filter actually shows ── */
  --panel:        oklch(0.22 0.028 168 / 0.68);
  --panel-2:      oklch(0.28 0.024 166 / 0.58);
  --panel-3:      oklch(0.34 0.020 163 / 0.46);
  --panel-solid:  oklch(0.11 0.026 172 / 0.97);
  --sidebar-bg:   oklch(0.09 0.024 178 / 0.88);
  --glass-1:      oklch(0.18 0.026 170 / 0.55);
  --glass-2:      oklch(0.24 0.022 167 / 0.45);

  /* ── Ink — crisp, high contrast ── */
  --ink:   oklch(0.97 0.010 148);
  --ink-2: oklch(0.88 0.014 152);
  --ink-3: oklch(0.74 0.014 155);
  --ink-4: oklch(0.58 0.012 160);

  /* ── Borders — white-with-opacity, slightly stronger ── */
  --line:         oklch(1 0 0 / 0.15);
  --line-2:       oklch(1 0 0 / 0.08);
  --stroke-inner: inset 0 1px 0 oklch(1 0 0 / 0.18), inset 0 0 0 1px oklch(1 0 0 / 0.08);

  /* ── Accent — neon green stays vivid ── */
  --accent:      var(--green-bright);
  --accent-wash: oklch(0.78 0.28 145 / 0.18);
  --accent-ink:  oklch(0.86 0.26 145);

  /* ── Status tones — punchy, saturated ── */
  --tone-green-bg:   oklch(0.72 0.26 145 / 0.22);
  --tone-green-ink:  oklch(0.88 0.24 145);
  --tone-amber-bg:   oklch(0.68 0.22 78  / 0.22);
  --tone-amber-ink:  oklch(0.92 0.20 82);
  --tone-violet-bg:  oklch(0.55 0.18 290 / 0.22);
  --tone-violet-ink: oklch(0.88 0.16 294);
  --tone-slate-bg:   oklch(0.22 0.03 228 / 0.65);
  --tone-slate-ink:  oklch(0.84 0.04 226);
  --tone-coral-bg:   oklch(0.58 0.20 28  / 0.22);
  --tone-coral-ink:  oklch(0.92 0.18 32);

  /* ── Shadows — deep ── */
  --shadow-pop:  0 32px 80px -18px oklch(0 0 0 / 0.90), 0 8px 24px -6px oklch(0 0 0 / 0.65);
  --shadow-card: 0 3px 14px -4px oklch(0 0 0 / 0.65);
}

html[data-density="dense"]       { --row-h: 32px; --gap: 10px; }
html[data-density="comfortable"] { --row-h: 40px; --gap: 14px; }
html[data-density="spacious"]    { --row-h: 52px; --gap: 20px; }

* { box-sizing: border-box; }
html, body, #root { height: 100%; margin: 0; }
body {
  font-family: var(--font);
  background: var(--bg);
  background-image: var(--bg-grad);
  background-attachment: fixed;
  background-size: cover;
  color: var(--ink);
  font-size: 14px;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
  font-feature-settings: 'ss01','cv11';
  min-height: 100vh;
}
/* Drifting ambient blobs for the liquid effect */
body::before, body::after {
  content: ""; position: fixed; z-index: 0; pointer-events: none;
  width: 620px; height: 620px; border-radius: 50%;
  filter: blur(80px); opacity: 0.55;
  animation: oa-drift 28s ease-in-out infinite alternate;
}
body::before { background: radial-gradient(circle, oklch(0.82 0.14 340 / 0.70), transparent 70%); top: -160px; left: -140px; opacity: 0.60; }
body::after  { background: radial-gradient(circle, oklch(0.84 0.12 280 / 0.65), transparent 70%); bottom: -200px; right: -160px; animation-delay: -10s; opacity: 0.50; }
html[data-theme="dark"] body::before { background: radial-gradient(circle, oklch(0.42 0.26 145 / 0.55), transparent 70%); opacity: 0.70; }
html[data-theme="dark"] body::after  { background: radial-gradient(circle, oklch(0.28 0.18 262 / 0.45), transparent 70%); opacity: 0.60; }

/* Dot grid with gradient opacity falloff */
html::before {
  content: ''; position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background-image: radial-gradient(circle, oklch(0.38 0.08 268 / 0.28) 1px, transparent 1px);
  background-size: 22px 22px;
  mask-image:
    radial-gradient(ellipse 70% 70% at 100% 0%, oklch(0 0 0 / 0.9) 0%, transparent 65%),
    radial-gradient(ellipse 40% 50% at 0% 100%, oklch(0 0 0 / 0.5) 0%, transparent 60%);
  mask-composite: add;
  -webkit-mask-image:
    radial-gradient(ellipse 70% 70% at 100% 0%, oklch(0 0 0 / 0.9) 0%, transparent 65%),
    radial-gradient(ellipse 40% 50% at 0% 100%, oklch(0 0 0 / 0.5) 0%, transparent 60%);
  -webkit-mask-composite: source-over;
}
html[data-theme="dark"]::before {
  background-image: radial-gradient(circle, oklch(0.75 0.10 265 / 0.18) 1px, transparent 1px);
}
@keyframes oa-drift {
  0%   { transform: translate3d(0,0,0) scale(1); }
  50%  { transform: translate3d(60px, 40px, 0) scale(1.12); }
  100% { transform: translate3d(-40px, 80px, 0) scale(0.95); }
}
.oa-app { position: relative; z-index: 1; }
.mono { font-family: var(--mono); font-size: 0.92em; }
.num, .oa-table td.num { font-variant-numeric: tabular-nums; text-align: right; }
.subtle { color: var(--ink-3); }
.strong { font-weight: 600; color: var(--ink); }
button { font-family: inherit; cursor: pointer; border: none; background: transparent; color: inherit; padding: 0; }
input, select, textarea { font-family: inherit; color: inherit; }

/* ── App shell ─────────────────────────────── */
.oa-app { display: grid; grid-template-columns: 248px 1fr; grid-template-rows: 100vh; height: 100vh; }
.oa-sidebar {
  border-right: 1px solid var(--line);
  background: var(--sidebar-bg);
  backdrop-filter: var(--blur);
  -webkit-backdrop-filter: var(--blur);
  padding: 18px 14px 14px;
  display: flex; flex-direction: column; gap: 6px;
  overflow-y: auto;
  min-height: 0;
  box-shadow: var(--stroke-inner);
}
.oa-brand { display: flex; align-items: center; gap: 10px; padding: 0 6px 14px; }
.oa-brand-mark {
  flex: 0 0 auto; width: 36px; height: 36px; border-radius: 8px;
  background: #0d1a0f; display: grid; place-items: center;
  box-shadow: inset 0 0 0 1px oklch(1 0 0 / 0.08);
  overflow: hidden;
}
.oa-brand-mark img { width: 30px; height: 30px; object-fit: contain; display: block; }
.oa-brand-name { font-weight: 700; letter-spacing: -0.01em; font-size: 14px; }
.oa-brand-sub { color: var(--ink-3); font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; }

.oa-nav { display: flex; flex-direction: column; gap: 2px; margin-top: 4px; }
.oa-navitem {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 10px; border-radius: var(--radius); color: var(--ink-2);
  font-size: 13.5px; font-weight: 500; text-align: left;
}
.oa-navitem:hover { background: var(--panel); color: var(--ink); }
.oa-navitem.on { background: var(--panel); color: var(--ink); box-shadow: var(--shadow-card); }
.oa-navitem.on .oa-navitem-icon { color: var(--accent); }
.oa-navitem-icon { color: var(--ink-3); display: grid; place-items: center; }
.oa-navitem-label { flex: 1; }
.oa-navitem-n {
  font-size: 11px; color: var(--ink-3);
  background: var(--panel-3); padding: 2px 7px; border-radius: 999px;
  font-variant-numeric: tabular-nums;
}
.oa-navitem.on .oa-navitem-n { background: var(--accent-wash); color: var(--accent-ink); }

.oa-nav-section {
  font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.08em;
  color: var(--ink-3); padding: 18px 10px 6px; font-weight: 600;
}
.oa-team-list { display: flex; flex-direction: column; gap: 2px; }
.oa-team-item {
  display: flex; align-items: center; gap: 10px;
  padding: 6px 10px; border-radius: var(--radius);
}
.oa-team-item:hover { background: var(--panel); }
.oa-team-item.me { background: var(--panel); }
.oa-team-name { font-size: 12.5px; font-weight: 500; }
.oa-team-role { font-size: 11px; color: var(--ink-3); }
.oa-you {
  display: inline-block; margin-left: 6px; font-size: 9.5px; font-weight: 600;
  color: var(--accent-ink); background: var(--accent-wash);
  padding: 1px 6px; border-radius: 3px; vertical-align: 2px;
}

.oa-sidebar-foot { padding-top: 10px; border-top: 1px solid var(--line); padding: 10px 0 0; }
/* New menu */
.oa-new-menu-wrap { padding: 10px 0 0; border-top: 1px solid var(--line); position: relative; }
.oa-new-btn {
  width: 100%; display: flex; align-items: center; justify-content: center; gap: 7px;
  padding: 9px 0; border-radius: var(--radius); border: none; cursor: pointer;
  font-size: 13px; font-weight: 600; transition: background 0.15s, box-shadow 0.15s;
  background: oklch(0.48 0.22 265); color: #fff;
}
.oa-new-btn:hover { background: oklch(0.44 0.24 265); }
html[data-theme="dark"] .oa-new-btn {
  background: oklch(0.55 0.22 265);
  color: #fff;
  box-shadow: 0 0 20px oklch(0.55 0.22 265 / 0.40), 0 2px 8px oklch(0 0 0 / 0.4);
}
html[data-theme="dark"] .oa-new-btn:hover {
  background: oklch(0.60 0.22 265);
  box-shadow: 0 0 28px oklch(0.55 0.22 265 / 0.55), 0 2px 10px oklch(0 0 0 / 0.45);
}
.oa-new-popover {
  position: absolute; bottom: calc(100% + 6px); left: 0; right: 0;
  background: var(--panel-solid); border: 1px solid var(--line);
  border-radius: 10px; overflow: hidden;
  box-shadow: var(--shadow-pop); z-index: 9999;
  animation: newMenuIn 0.12s ease;
}
@keyframes newMenuIn {
  from { opacity:0; transform: translateY(6px); }
  to   { opacity:1; transform: translateY(0); }
}
.oa-new-option {
  display: flex; align-items: center; gap: 11px;
  padding: 11px 14px; cursor: pointer; transition: background 0.1s;
  border: none; background: transparent; width: 100%; text-align: left;
}
.oa-new-option:hover { background: var(--panel-2); }
.oa-new-option + .oa-new-option { border-top: 1px solid var(--line-2); }
.oa-new-option-icon {
  width: 32px; height: 32px; border-radius: 8px; display: grid; place-items: center;
  font-size: 16px; flex-shrink: 0;
}
.oa-new-option-text { display: flex; flex-direction: column; gap: 1px; }
.oa-new-option-label { font-size: 13px; font-weight: 600; color: var(--ink-1); }
.oa-new-option-desc  { font-size: 11px; color: var(--ink-3); }

/* ── Sidebar campaign project list ───────────────────── */
.oa-sb-projects {
  flex: 1; overflow-y: auto; min-height: 0;
  padding: 6px 0 4px;
  scrollbar-width: thin; scrollbar-color: var(--line) transparent;
}
.oa-sb-projects::-webkit-scrollbar { width: 3px; }
.oa-sb-projects::-webkit-scrollbar-thumb { background: var(--line); border-radius: 3px; }

.oa-sb-sect-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 12px 4px;
  font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em;
  color: var(--ink-3);
}
.oa-sb-sect-toggle {
  display: flex; align-items: center; gap: 5px;
  background: none; border: none; cursor: pointer;
  font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em;
  color: var(--ink-3); padding: 0; line-height: 1;
}
.oa-sb-sect-toggle:hover { color: var(--ink-1); }
.oa-sb-sect-caret {
  display: inline-block; transition: transform 0.18s; font-size: 9px; line-height: 1;
}
.oa-sb-sect-add {
  display: grid; place-items: center; width: 18px; height: 18px;
  border-radius: 4px; color: var(--ink-3);
  background: none; border: none; cursor: pointer;
}
.oa-sb-sect-add:hover { background: var(--panel); color: var(--ink-1); }

.oa-sb-camp-list { padding: 2px 6px; }
.oa-sb-camp-item {
  display: flex; align-items: center; gap: 9px;
  padding: 6px 8px; border-radius: 7px;
  width: 100%; text-align: left; cursor: pointer;
  font-size: 12.5px; font-weight: 500; color: var(--ink-2);
  transition: background 0.1s, color 0.1s; border: none; background: none;
}
.oa-sb-camp-item:hover { background: var(--panel); color: var(--ink-1); }
.oa-sb-camp-item.on { background: var(--panel); color: var(--ink-1); }
html[data-theme="dark"] .oa-sb-camp-item.on { background: oklch(0.78 0.28 145 / 0.12); box-shadow: inset 2px 0 0 oklch(0.78 0.28 145 / 0.7); }

.oa-sb-camp-icon {
  width: 20px; height: 20px; border-radius: 5px; flex-shrink: 0;
  display: grid; place-items: center;
  font-size: 8.5px; font-weight: 700; letter-spacing: -0.02em; color: #fff;
  box-shadow: inset 0 1px 0 oklch(1 0 0 / 0.18);
}
.oa-sb-camp-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.oa-sb-camp-arrow { color: var(--ink-4); font-size: 11px; flex-shrink: 0; opacity: 0; transition: opacity 0.1s; }
.oa-sb-camp-item:hover .oa-sb-camp-arrow,
.oa-sb-camp-item.on .oa-sb-camp-arrow { opacity: 1; }

.oa-sb-camp-item.archived { opacity: 0.55; }
.oa-sb-camp-item.archived:hover { opacity: 1; }

/* Star button on sidebar campaign items */
.oa-sb-star {
  flex-shrink: 0; width: 18px; height: 18px; display: grid; place-items: center;
  background: none; border: none; padding: 0; cursor: pointer;
  color: var(--ink-4); border-radius: 4px; opacity: 0; transition: opacity 0.1s, color 0.1s;
}
.oa-sb-camp-item:hover .oa-sb-star { opacity: 1; }
.oa-sb-star.starred { opacity: 1; color: oklch(0.82 0.22 82); }
.oa-sb-star:hover { color: oklch(0.82 0.22 82) !important; }

/* Drag-to-archive / drag-to-star drop zones */
.oa-sb-drop-zone {
  display: none;
  border: 1.5px dashed var(--ink-4); border-radius: 8px;
  background: var(--panel-2); margin: 4px 6px;
  padding: 8px 10px; text-align: center;
  font-size: 11.5px; color: var(--ink-3); font-weight: 500;
  transition: border-color 0.15s, background 0.15s;
}
.oa-sb-projects.is-dragging .oa-sb-drop-zone { display: block; }

/* Archive zone highlight */
.oa-sb-projects.dragging-over-archive .oa-sb-drop-zone.archive-zone {
  border-color: var(--tone-amber-ink); background: var(--tone-amber-bg);
  color: var(--tone-amber-ink);
}
.oa-sb-projects.dragging-over-archive .oa-sb-sect-head.archive-head {
  background: var(--tone-amber-bg); border-radius: 8px; color: var(--tone-amber-ink);
}

/* Starred zone highlight */
.oa-sb-projects.dragging-over-starred .oa-sb-drop-zone.star-zone {
  border-color: oklch(0.82 0.22 82); background: oklch(0.82 0.22 82 / 0.12);
  color: oklch(0.72 0.22 82);
}
.oa-sb-projects.dragging-over-starred .oa-sb-sect-head.starred-head {
  background: oklch(0.82 0.22 82 / 0.12); border-radius: 8px;
}
/* Unstar zone highlight */
.oa-sb-projects.dragging-over-unstar .oa-sb-drop-zone.unstar-zone {
  border-color: oklch(0.65 0.20 25); background: oklch(0.65 0.20 25 / 0.10);
  color: oklch(0.65 0.20 25);
}

.oa-sb-camp-item[draggable] { cursor: grab; }
.oa-sb-camp-item[draggable]:active { cursor: grabbing; opacity: 0.7; }

/* Confirm archive modal */
.oa-confirm-body { padding: 8px 4px 4px; font-size: 14px; color: var(--ink-2); line-height: 1.55; }

/* Archive icon button in campaign header */
.oa-btn-archive {
  display: flex; align-items: center; gap: 5px;
  padding: 4px 10px; border-radius: 6px; border: 1px solid var(--line);
  background: transparent; font-size: 12px; font-weight: 500;
  color: var(--ink-3); cursor: pointer; transition: all 0.12s;
  font-family: var(--font);
}
.oa-btn-archive:hover { background: var(--tone-amber-bg); color: var(--tone-amber-ink); border-color: var(--tone-amber-ink); }

/* Starred section divider */
.oa-sb-starred-head {
  display: flex; align-items: center; gap: 5px;
  padding: 0 10px 4px; margin-bottom: 2px;
  font-size: 10.5px; font-weight: 700; text-transform: uppercase;
  letter-spacing: 0.07em; color: oklch(0.82 0.22 82);
}
.oa-sb-starred-sep {
  height: 1px; background: var(--line-2); margin: 6px 10px 8px;
}

/* Topbar */
.oa-main { display: flex; flex-direction: column; min-width: 0; min-height: 0; background: transparent; }
.oa-topbar {
  display: flex; align-items: center; gap: 16px;
  padding: 12px 24px; border-bottom: 1px solid var(--line);
  background: var(--panel);
  backdrop-filter: var(--blur);
  -webkit-backdrop-filter: var(--blur);
  box-shadow: var(--stroke-inner);
  position: sticky; top: 0; z-index: 20;
}
.oa-search-wrap { position: relative; flex: 1; max-width: 480px; }
.oa-search-results {
  position: absolute; top: calc(100% + 6px); left: 0; right: 0; z-index: 30;
  background: var(--panel-solid); border: 1px solid var(--line); border-radius: var(--radius-lg);
  backdrop-filter: var(--blur-strong); -webkit-backdrop-filter: var(--blur-strong);
  box-shadow: var(--shadow-pop), var(--stroke-inner); padding: 6px; max-height: 420px; overflow-y: auto;
}
.oa-search-head { font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--ink-3); padding: 8px 10px 4px; font-weight: 600; }
.oa-search-hit {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 10px; border-radius: var(--radius); cursor: pointer;
}
.oa-search-hit:hover { background: var(--panel-2); }
.oa-search-hit svg { color: var(--ink-3); flex: 0 0 auto; }
.oa-search-hit span:nth-child(2) { flex: 1; font-weight: 500; }
.oa-search-sub { color: var(--ink-3); font-size: 12px; }

.oa-topbar-right { margin-left: auto; display: flex; align-items: center; gap: 12px; }
/* Theme toggle */
.oa-theme-toggle {
  display: flex; align-items: center; gap: 1px;
  background: var(--panel-2); border: 1px solid var(--line);
  border-radius: 20px; padding: 3px; cursor: pointer;
}
.oa-theme-btn {
  width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center;
  border: none; background: transparent; cursor: pointer;
  color: var(--ink-3); transition: background 0.18s, color 0.18s;
}
.oa-theme-btn.active {
  background: var(--bg); color: var(--ink-1);
  box-shadow: 0 1px 4px oklch(0 0 0 / 0.18);
}
html[data-theme="dark"] .oa-theme-btn.active {
  background: oklch(0.18 0.03 165);
  color: oklch(0.82 0.24 145);
  box-shadow: 0 0 8px oklch(0.78 0.28 145 / 0.25);
}
.oa-divider-v { width: 1px; height: 22px; background: var(--line); }
.oa-iconbtn {
  width: 32px; height: 32px; border-radius: var(--radius); display: grid; place-items: center;
  color: var(--ink-2); position: relative;
}
.oa-iconbtn:hover { background: var(--panel-2); color: var(--ink); }
.oa-iconbtn.sm { width: 22px; height: 22px; }
.oa-iconbtn .oa-dot {
  position: absolute; top: 7px; right: 8px; width: 7px; height: 7px;
  background: oklch(0.6 0.2 25); border-radius: 999px; border: 2px solid var(--panel);
}
.oa-me { display: flex; align-items: center; gap: 8px; padding: 4px 8px 4px 4px; border-radius: var(--radius); font-weight: 500; }
.oa-me:hover { background: var(--panel-2); }

.oa-content { flex: 1; overflow-y: auto; min-height: 0; padding: 24px 28px 60px; }

/* ── Buttons ─────────────────────────── */
.oa-btn {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 8px 12px; border-radius: var(--radius); font-weight: 500; font-size: 13px;
  transition: all 120ms;
  border: 1px solid transparent;
}
.oa-btn.size-sm { padding: 5px 9px; font-size: 12px; }
.oa-btn.kind-primary { background: oklch(0.48 0.22 265); color: #fff; }
.oa-btn.kind-primary:hover { background: oklch(0.44 0.24 265); }
.oa-btn.kind-ghost { color: var(--ink); border-color: var(--line); background: var(--panel); backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur); box-shadow: var(--stroke-inner); }
.oa-btn.kind-ghost:hover { background: var(--panel-solid); }
.oa-btn.kind-subtle { background: var(--panel-2); color: var(--ink-2); }
.oa-btn.kind-subtle:hover { background: var(--panel-3); color: var(--ink); }
.oa-btn-icon { display: grid; place-items: center; }

/* ── Inputs ──────────────────────────── */
.oa-input {
  display: flex; align-items: center; gap: 8px; width: 100%;
  background: var(--panel); border: 1px solid var(--line);
  border-radius: var(--radius); padding: 7px 11px;
  backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur);
  box-shadow: var(--stroke-inner);
  transition: border-color 120ms, background 120ms;
}
.oa-input:focus-within { border-color: oklch(0.55 0.18 265 / 0.6); background: var(--panel-solid); }
.oa-input-icon { color: var(--ink-3); }
.oa-input input { background: transparent; border: none; outline: none; width: 100%; font-size: 13px; }

.oa-inline-input {
  background: var(--panel-2); border: 1px solid var(--ink-4);
  border-radius: var(--radius-sm); padding: 4px 8px; font-size: inherit;
  outline: none; width: 100%; color: inherit;
}
.oa-inline-select {
  background: var(--panel-2); border: 1px solid var(--line);
  border-radius: var(--radius-sm); padding: 3px 6px; font-size: 12px;
  color: var(--ink-1); outline: none; cursor: pointer;
}
/* Board view */
.oa-board-col { flex: 0 0 272px; display: flex; flex-direction: column; border-radius: 10px; transition: background 0.15s; }
.oa-board-col.drag-over { background: oklch(0.78 0.28 145 / 0.06); }
.oa-board-col-head { display:flex; align-items:center; gap:8px; padding: 6px 4px 12px; border-bottom: 2px solid var(--col-color, var(--line)); }
.oa-board-card { background: var(--panel); border: 1px solid var(--line); border-radius: 9px; padding: 12px 13px; cursor: pointer; user-select: none; transition: border-color 0.15s, box-shadow 0.15s, opacity 0.15s; }
.oa-board-card:hover { border-color: var(--line-2); box-shadow: 0 2px 8px var(--shadow); }
.oa-board-card.dragging { opacity: 0.35; cursor: grabbing; }
.oa-board-card.expanded { border-color: oklch(0.78 0.28 145 / 0.45); box-shadow: 0 0 0 2px oklch(0.78 0.28 145 / 0.12); }
.oa-board-drop-zone { height:42px; border: 2px dashed oklch(0.78 0.28 145 / 0.4); border-radius:8px; display:flex; align-items:center; justify-content:center; font-size:12px; color: oklch(0.78 0.28 145 / 0.55); }
.oa-board-add-btn { display:flex; align-items:center; gap:6px; padding:8px 4px; background:transparent; border:none; cursor:pointer; color:var(--ink-4); font-size:12px; border-radius:6px; width:100%; text-align:left; transition:color 0.12s; }
.oa-board-add-btn:hover { color: var(--ink-1); }
/* Playbook Browser panel */
.oa-pb-browser {
  width: 272px; flex-shrink: 0; background: var(--panel-solid);
  border: 1px solid var(--line); border-radius: 12px;
  display: flex; flex-direction: column; overflow: hidden;
  position: sticky; top: 20px; align-self: flex-start; max-height: calc(100vh - 120px);
}
.oa-pb-browser-head {
  display: flex; align-items: flex-start; justify-content: space-between;
  padding: 14px 14px 10px; border-bottom: 1px solid var(--line); gap: 10px; flex-shrink: 0;
}
.oa-pb-browser-body { overflow-y: auto; flex: 1; padding: 6px 0; }
.oa-pb-stage-btn {
  width: 100%; display: flex; align-items: center; gap: 6px;
  padding: 7px 14px; background: none; border: none; cursor: pointer;
  text-align: left; border-radius: 0; transition: background 0.1s;
}
.oa-pb-stage-btn:hover { background: var(--panel-2); }
.oa-pb-step-row {
  display: flex; align-items: center; gap: 6px;
  padding: 5px 14px 5px 22px;
}
.oa-pb-step-row:hover { background: var(--panel-2); }
.oa-pb-add-btn {
  font-size: 11px; padding: 3px 9px; border-radius: 5px; flex-shrink: 0;
  border: 1px solid oklch(0.72 0.24 145 / 0.5);
  background: oklch(0.72 0.24 145 / 0.1);
  color: oklch(0.65 0.22 145); cursor: pointer; font-weight: 500;
  transition: background 0.1s, border-color 0.1s;
}
.oa-pb-add-btn:hover { background: oklch(0.72 0.24 145 / 0.2); border-color: oklch(0.72 0.24 145 / 0.8); }
.oa-pb-add-btn.added {
  border-color: var(--line); background: transparent;
  color: var(--ink-4); cursor: default;
}
.oa-board-toolbar {
  display: flex; align-items: center; justify-content: flex-end;
  padding: 14px 24px 4px; gap: 8px; flex-shrink: 0;
}
/* Campaign icon/color picker */
.oa-icon-picker {
  background: var(--panel-solid); border: 1px solid var(--line); border-radius: 12px;
  padding: 13px 13px 12px; width: 284px; z-index: 9999;
  box-shadow: var(--shadow-pop); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
}
.oa-icon-picker-label { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--ink-3); margin-bottom: 7px; }
.oa-icon-picker-colors { display: flex; flex-wrap: wrap; gap: 7px; }
.oa-icon-picker-swatch {
  width: 22px; height: 22px; border-radius: 50%; background: var(--sw-col, #888);
  border: 2px solid transparent; cursor: pointer;
  transition: transform 0.1s, border-color 0.1s, box-shadow 0.1s;
}
.oa-icon-picker-swatch:hover { transform: scale(1.2); }
.oa-icon-picker-swatch.on { border-color: var(--ink-1); box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--sw-col, #888); transform: scale(1.1); }
.oa-emoji-btn {
  font-size: 17px; line-height: 1; padding: 4px 2px; border: none; border-radius: 6px;
  background: transparent; cursor: pointer; text-align: center;
  transition: background 0.1s, transform 0.1s; outline: 2px solid transparent; outline-offset: 1px;
}
.oa-emoji-btn:hover { background: var(--panel); transform: scale(1.2); }
.oa-emoji-btn.on { transform: scale(1.15); }
/* Trigger wrapper in sidebar */
.oa-sb-camp-icon-wrap { position: relative; flex-shrink: 0; }
.oa-sb-camp-icon { cursor: pointer; transition: filter 0.15s; }
.oa-sb-camp-icon:hover { filter: brightness(1.15); }
.oa-icon-picker-pop { position: absolute; top: calc(100% + 6px); left: 0; z-index: 9999; }
.oa-inline-cell {
  display: inline-block; padding: 4px 8px; border-radius: var(--radius-sm);
  cursor: text; min-height: 24px; min-width: 60px;
}
.oa-inline-cell:hover { background: var(--panel-2); box-shadow: inset 0 0 0 1px var(--line); }
.oa-ph { color: var(--ink-4); font-style: normal; }

/* ── Select pill ───────────────────────── */
.oa-select { position: relative; display: inline-block; }
.oa-select-btn {
  display: inline-flex; align-items: center; gap: 7px;
  padding: 5px 10px; border-radius: var(--radius);
  background: var(--panel); border: 1px solid var(--line); font-size: 12.5px;
  color: var(--ink); backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur);
  box-shadow: var(--stroke-inner);
}
.oa-select-btn:hover { background: var(--panel-solid); }
.oa-select-menu {
  position: absolute; top: calc(100% + 4px); left: 0; z-index: 500;
  background: var(--panel-solid); border: 1px solid var(--line); border-radius: var(--radius);
  backdrop-filter: var(--blur-strong); -webkit-backdrop-filter: var(--blur-strong);
  box-shadow: var(--shadow-pop), var(--stroke-inner); min-width: 180px; padding: 4px;
  max-height: 260px; overflow-y: auto;
}
/* People-grouped variant */
.oa-select-menu--people {
  min-width: 260px; max-height: 380px; padding: 0;
  left: auto; right: 0;
}
.oa-select-menu--people .oa-select-search {
  margin: 0; padding: 9px 12px; border-bottom: 1px solid var(--line); position: sticky; top: 0;
  background: var(--panel-solid); z-index: 1;
}
.oa-select-menu--people .oa-select-search input { font-size: 13px; }
.oa-select-groups-body { padding: 4px; }
.oa-select-group { margin-bottom: 4px; }
.oa-select-group-hd {
  font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.09em;
  color: var(--ink-4); padding: 8px 10px 4px;
}
.oa-select-opt { padding: 6px 10px; border-radius: var(--radius-sm); cursor: pointer; font-size: 13px; display: flex; align-items: center; gap: 8px; }
.oa-select-opt:hover { background: var(--panel-2); }
.oa-select-opt.on { background: var(--accent-wash); }
.oa-select-opt--person { padding: 6px 10px; border-radius: 8px; }
.oa-select-opt--person:hover { background: var(--panel-2); }
.oa-select-opt--person.on { background: var(--accent-wash); }
.oa-select-opt--unassign { display: flex; align-items: center; gap: 9px; padding: 6px 8px; border-radius: 8px; cursor: pointer; }
.oa-select-opt--unassign:hover { background: var(--panel-2); }
/* Search inside SelectPill */
.oa-select-search {
  display: flex; align-items: center; gap: 6px; padding: 6px 8px;
  border-bottom: 1px solid var(--line); margin: -4px -4px 4px;
}
.oa-select-search input {
  flex:1; border:none; outline:none; background:transparent;
  font-size: 12px; color: var(--ink-1); min-width: 0;
}

/* ── SearchSelect (modal-grade searchable picker) ── */
.oa-ss { position: relative; }
.oa-ss-trigger {
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  width: 100%; padding: 11px 14px; border: 1px solid var(--line-2);
  border-radius: var(--radius); background: var(--panel-2); cursor: pointer;
  font-size: 14px; color: var(--ink-1); text-align: left; transition: border-color 0.12s;
}
.oa-ss-trigger:hover, .oa-ss-trigger:focus-within { border-color: oklch(0.72 0.24 145 / 0.5); outline: none; }
.oa-ss-val { display: flex; align-items: center; gap: 7px; min-width: 0; overflow: hidden; }
.oa-ss-menu {
  position: absolute; top: calc(100% + 6px); left: 0; right: 0; z-index: 600;
  background: var(--panel-solid); border: 1px solid var(--line);
  border-radius: 12px; box-shadow: var(--shadow-pop); overflow: hidden;
  min-width: 280px;
}
.oa-ss-input-wrap {
  display: flex; align-items: center; gap: 8px; padding: 10px 14px;
  border-bottom: 1px solid var(--line);
}
.oa-ss-input-wrap input {
  flex: 1; border: none; outline: none; background: transparent;
  font-size: 13.5px; color: var(--ink-1); min-width: 0;
}
.oa-ss-list { max-height: 340px; overflow-y: auto; scrollbar-width: thin; }
.oa-ss-opt {
  display: flex; align-items: center; gap: 11px; padding: 9px 14px;
  cursor: pointer; transition: background 0.1s; font-size: 13.5px; color: var(--ink-1);
}
.oa-ss-opt:hover { background: var(--panel-2); }
.oa-ss-opt.on { background: var(--accent-wash); }
.oa-ss-opt-check { margin-left: auto; color: var(--accent-ink); flex-shrink: 0; }
.oa-ss-opt-sub { font-size: 12px; color: var(--ink-3); margin-top: 1px; }
.oa-ss-empty { padding: 12px 14px; font-size: 13px; color: var(--ink-4); }
/* Chips for multi-select */
.oa-ss-chips { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 6px; }
.oa-ss-chip {
  display: flex; align-items: center; gap: 4px; padding: 2px 4px 2px 5px;
  background: var(--panel); border: 1px solid var(--line);
  border-radius: 99px; font-size: 11.5px; color: var(--ink-2);
}
.oa-ss-chip-x {
  background: none; border: none; cursor: pointer; color: var(--ink-4);
  padding: 0 1px; font-size: 15px; line-height: 1; display: flex; align-items: center;
}
.oa-ss-chip-x:hover { color: var(--ink-1); }

/* ── Chips / status ───────────────────── */
.oa-chip {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 3px 8px; border-radius: 999px; font-size: 11.5px; font-weight: 500;
  background: var(--tone-slate-bg); color: var(--tone-slate-ink); white-space: nowrap;
}
.oa-chip.dense { padding: 2px 7px; font-size: 11px; }
.oa-chip-dot { width: 6px; height: 6px; border-radius: 999px; background: currentColor; opacity: 0.8; }
.oa-chip.tone-green  { background: var(--tone-green-bg); color: var(--tone-green-ink); }
.oa-chip.tone-amber  { background: var(--tone-amber-bg); color: var(--tone-amber-ink); }
.oa-chip.tone-violet { background: var(--tone-violet-bg); color: var(--tone-violet-ink); }
.oa-chip.tone-slate  { background: var(--tone-slate-bg); color: var(--tone-slate-ink); }
.oa-chip.tone-coral  { background: var(--tone-coral-bg); color: var(--tone-coral-ink); }

/* ── Avatar ────────────────────────────── */
.oa-avatar {
  border-radius: 999px; display: grid; place-items: center;
  font-family: var(--font); flex: 0 0 auto; letter-spacing: -0.02em;
}
.oa-stack { display: inline-flex; align-items: center; }

/* ── Dashboard ─────────────────────────── */
.oa-eyebrow { font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--ink-3); font-weight: 600; }
.oa-h1 { font-size: 28px; letter-spacing: -0.018em; margin: 4px 0 6px; font-weight: 600; }
.oa-h2 { font-size: 20px; letter-spacing: -0.012em; margin: 4px 0 6px; font-weight: 600; }
.oa-sub { display: flex; gap: 8px; color: var(--ink-2); font-size: 13px; align-items: center; flex-wrap: wrap; }
.oa-dotsep { color: var(--ink-4); }

.oa-dash-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 20px; margin-bottom: 22px; }
.oa-dash-head-actions { display: flex; gap: 8px; }

.oa-kpi-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--gap); margin-bottom: var(--gap); }
.oa-kpi {
  background: var(--panel); border: 1px solid var(--line);
  border-radius: var(--radius-lg); padding: 16px 18px;
  display: flex; flex-direction: column; gap: 4px;
  backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur);
  box-shadow: var(--shadow-card), var(--stroke-inner);
}
.oa-kpi.clickable { cursor: pointer; transition: transform 150ms, box-shadow 150ms; }
.oa-kpi.clickable:hover { transform: translateY(-2px); box-shadow: var(--shadow-pop), var(--stroke-inner); }
.oa-kpi-label { font-size: 12px; color: var(--ink-3); font-weight: 500; }
.oa-kpi-value { font-size: 28px; font-weight: 600; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
.oa-kpi-delta { font-size: 11.5px; color: var(--ink-3); font-variant-numeric: tabular-nums; }

.oa-dash-grid {
  display: grid;
  grid-template-columns: 1.4fr 1fr;
  grid-template-rows: auto auto;
  gap: var(--gap);
}
.oa-mytasks { grid-row: span 2; }
.oa-panel {
  background: var(--panel); border: 1px solid var(--line);
  border-radius: var(--radius-lg); padding: 18px 20px;
  backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur);
  box-shadow: var(--shadow-card), var(--stroke-inner);
}
.oa-panel-head { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
.oa-panel-head h3 { margin: 0; font-size: 14px; font-weight: 600; letter-spacing: -0.005em; flex-shrink: 0; }
.oa-panel-head .oa-panel-sub { margin-left: 0; }
.oa-panel-head > *:last-child:not(h3):not(.oa-panel-sub) { margin-left: auto; }
.oa-panel-sub { color: var(--ink-3); font-size: 11.5px; }
.oa-sep { height: 1px; background: var(--line-2); margin: 18px -20px; }

.oa-tabs-mini { display: flex; gap: 4px; }
.oa-tabs-mini span { font-size: 11.5px; color: var(--ink-3); padding: 3px 8px; border-radius: 4px; }
.oa-tabs-mini .on { background: var(--accent-wash); color: var(--accent-ink); font-weight: 600; }

.oa-tasklist { display: flex; flex-direction: column; gap: 2px; }
.oa-task {
  display: flex; align-items: center; gap: 12px; padding: 10px 8px;
  border-radius: var(--radius); cursor: pointer; min-height: var(--row-h);
}
.oa-task:hover { background: var(--panel-2); }
.oa-task-body { flex: 1; min-width: 0; }
.oa-task-title { font-size: 13px; font-weight: 500; }
.oa-task-meta { display: flex; gap: 8px; margin-top: 2px; font-size: 11.5px; color: var(--ink-3); align-items: center; }
.oa-task-ctx { color: var(--ink-3); }
.oa-prio { padding: 1px 6px; border-radius: 3px; font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; }
.oa-prio.prio-high { background: var(--tone-coral-bg); color: var(--tone-coral-ink); }
.oa-prio.prio-med  { background: var(--tone-amber-bg); color: var(--tone-amber-ink); }
.oa-prio.prio-low  { background: var(--tone-slate-bg); color: var(--tone-slate-ink); }

.oa-due {
  display: flex; flex-direction: column; align-items: flex-end;
  font-size: 12px; font-variant-numeric: tabular-nums; color: var(--ink-2);
  gap: 1px;
}
.oa-due.late { color: oklch(0.52 0.18 25); font-weight: 600; }
.oa-due.soon { color: oklch(0.52 0.14 65); font-weight: 600; }
.oa-due-date { font-family: var(--mono); font-size: 10.5px; color: var(--ink-3); font-weight: 400; }

.oa-check {
  width: 20px; height: 20px; border-radius: 5px;
  border: 1.5px solid var(--ink-4); background: var(--panel);
  display: grid; place-items: center; transition: all 140ms;
  color: #fff; flex: 0 0 auto;
}
.oa-check:hover { border-color: var(--green); }
.oa-check.done { background: var(--green); border-color: var(--green); }
.oa-check.ghost { border: 1.5px dashed var(--ink-4); color: var(--ink-3); }

/* Pipeline */
.oa-pipe { display: flex; flex-direction: column; gap: 10px; }
.oa-pipe-row { display: grid; grid-template-columns: 92px 1fr 28px 52px; align-items: center; gap: 10px; font-size: 12.5px; }
.oa-pipe-bar { height: 6px; background: var(--panel-2); border-radius: 999px; overflow: hidden; }
.oa-pipe-bar > div { height: 100%; border-radius: 999px; }
.oa-pipe-bar > div.tone-green  { background: oklch(0.62 0.14 150); }
.oa-pipe-bar > div.tone-amber  { background: oklch(0.72 0.15 70); }
.oa-pipe-bar > div.tone-violet { background: oklch(0.62 0.12 300); }
.oa-pipe-bar > div.tone-slate  { background: oklch(0.65 0.01 240); }
.oa-pipe-n { text-align: right; font-variant-numeric: tabular-nums; color: var(--ink-2); }
.oa-pipe-v { text-align: right; font-family: var(--mono); font-size: 11.5px; color: var(--ink-3); }

/* Sport list */
.oa-sportlist { display: flex; flex-direction: column; gap: 8px; }
.oa-sport-row { display: grid; grid-template-columns: 1fr 120px 24px; gap: 10px; align-items: center; font-size: 12.5px; }
.oa-sport-name { color: var(--ink-2); }
.oa-sport-bar { height: 4px; background: var(--panel-2); border-radius: 999px; overflow: hidden; }
.oa-sport-bar > div { height: 100%; background: var(--green); }
.oa-sport-n { text-align: right; font-variant-numeric: tabular-nums; color: var(--ink-3); }

/* Upcoming */
.oa-upcoming-list { display: flex; flex-direction: column; gap: 4px; }
.oa-up-row { display: flex; align-items: center; gap: 12px; padding: 8px; border-radius: var(--radius); cursor: pointer; }
.oa-up-row:hover { background: var(--panel-2); }
.oa-up-date {
  width: 42px; text-align: center;
  background: var(--panel-2); border-radius: var(--radius-sm);
  padding: 5px 0;
}
.oa-up-day { font-size: 18px; font-weight: 600; line-height: 1; }
.oa-up-mon { font-size: 9.5px; color: var(--ink-3); letter-spacing: 0.08em; margin-top: 2px; font-weight: 600; }
.oa-up-body { flex: 1; min-width: 0; }
.oa-up-title { font-size: 13px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.oa-up-ctx { font-size: 11.5px; color: var(--ink-3); }

.oa-empty { color: var(--ink-3); font-size: 12.5px; padding: 16px 4px; text-align: center; font-style: italic; }
.oa-empty.big { padding: 60px 0; font-size: 14px; }

/* ── Page head + toolbars ─────────────── */
.oa-page-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 20px; margin-bottom: 20px; flex-wrap: wrap; }
.oa-toolbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.oa-filterbar { display: flex; gap: 8px; align-items: center; margin-bottom: 16px; flex-wrap: wrap; }

.oa-seg {
  display: inline-flex; background: var(--panel); border: 1px solid var(--line);
  border-radius: var(--radius); padding: 2px; gap: 2px;
  backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur);
  box-shadow: var(--stroke-inner);
}
.oa-seg button {
  padding: 5px 10px; border-radius: var(--radius-sm); font-size: 12.5px;
  color: var(--ink-2); font-weight: 500; display: inline-flex; align-items: center; gap: 5px;
}
.oa-seg.sm button { padding: 4px 9px; font-size: 11.5px; }
.oa-seg button:hover { color: var(--ink); }
.oa-seg button.on { background: var(--accent-wash); color: var(--accent-ink); }
.oa-seg.full { display: flex; width: 100%; }
.oa-seg.full button { flex: 1; justify-content: center; text-transform: capitalize; }

/* ── Athletes grid ────────────────────── */
.oa-athletes-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: var(--gap);
}
.oa-ath-card {
  background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius-lg);
  padding: 16px; cursor: pointer; transition: transform 180ms, box-shadow 180ms;
  display: flex; flex-direction: column; gap: 12px;
  backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur);
  box-shadow: var(--shadow-card), var(--stroke-inner);
}
.oa-ath-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-pop), var(--stroke-inner); }
.oa-ath-head { display: flex; align-items: center; gap: 12px; }
.oa-ath-avatar {
  width: 40px; height: 40px; border-radius: 999px;
  color: #fff; font-weight: 600; font-size: 14px;
  display: grid; place-items: center; flex: 0 0 auto;
  overflow: hidden;
}
img.oa-ath-avatar, img.oa-ath-avatar.sm, img.oa-ath-avatar.lg {
  display: block; object-fit: cover; object-position: top center;
}
.oa-ath-avatar.sm { width: 28px; height: 28px; font-size: 11px; }
.oa-ath-avatar.lg { width: 56px; height: 56px; font-size: 20px; }
.oa-ath-name { font-weight: 600; font-size: 14px; }
.oa-ath-meta { font-size: 11.5px; color: var(--ink-3); }
.oa-ath-tags { display: flex; flex-wrap: wrap; gap: 4px; }
.oa-tag {
  font-size: 10.5px; padding: 2px 7px; border-radius: 3px;
  background: var(--panel-2); color: var(--ink-2); font-weight: 500;
}
.oa-tag.year { background: oklch(0.96 0.06 85); color: oklch(0.4 0.09 70); }

.oa-compdot {
  width: 10px; height: 10px; border-radius: 999px; flex: 0 0 auto;
  background: oklch(0.65 0.14 150);
}
.oa-compdot.tone-green { background: oklch(0.65 0.14 150); }
.oa-compdot.tone-amber { background: oklch(0.75 0.16 70); }
.oa-compdot.tone-coral { background: oklch(0.65 0.18 25); }

.oa-ath-stats {
  display: grid; grid-template-columns: repeat(4, 1fr);
  gap: 4px; padding: 10px 0; border-top: 1px solid var(--line-2); border-bottom: 1px solid var(--line-2);
}
.oa-stat { text-align: center; }
.oa-stat-v { font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; }
.oa-stat-l { font-size: 10px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-3); margin-top: 2px; }

.oa-ath-foot {
  display: flex; justify-content: space-between; align-items: center;
  font-size: 12px; color: var(--ink-2);
}
.oa-ath-arrow { color: var(--ink-3); }

/* ── Drawer ────────────────────────────── */
.oa-scrim { position: fixed; inset: 0; background: oklch(0.2 0.05 170 / 0.35); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); opacity: 0; pointer-events: none; transition: opacity 200ms; z-index: 100; }
.oa-scrim.open { opacity: 1; pointer-events: auto; }
.oa-drawer {
  position: fixed; top: 0; right: 0; bottom: 0;
  background: var(--panel-solid); border-left: 1px solid var(--line);
  backdrop-filter: var(--blur-strong); -webkit-backdrop-filter: var(--blur-strong);
  transform: translateX(100%); transition: transform 260ms cubic-bezier(0.4, 0, 0.2, 1);
  z-index: 110; display: flex; flex-direction: column;
  box-shadow: var(--shadow-pop), var(--stroke-inner);
}
.oa-drawer.open { transform: translateX(0); }
.oa-drawer-inner { display: flex; flex-direction: column; height: 100%; min-height: 0; }
.oa-drawer-head {
  padding: 18px 22px; border-bottom: 1px solid var(--line);
  display: flex; justify-content: space-between; align-items: flex-start; gap: 16px;
  flex: 0 0 auto;
}
.oa-drawer-body { padding: 20px 22px 40px; overflow-y: auto; flex: 1; }

/* Athlete URL import drop zone */
.oa-url-drop-zone {
  border: 1.5px dashed var(--line-2); border-radius: 10px;
  padding: 12px 14px; margin-bottom: 16px; cursor: default;
  display: flex; align-items: center; gap: 10px;
  background: var(--panel-2); transition: all 0.15s;
}
.oa-url-drop-zone.dragover {
  border-color: oklch(0.72 0.24 145 / 0.7); background: oklch(0.72 0.24 145 / 0.07);
}
.oa-url-drop-zone.loading { opacity: 0.7; }
.oa-url-import-preview {
  background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px;
  padding: 14px; margin-bottom: 16px; display: flex; flex-direction: column; gap: 10px;
}
.oa-url-import-field {
  display: flex; align-items: baseline; gap: 8px; font-size: 12px;
}
.oa-url-import-field--check {
  align-items: center; transition: background 120ms, opacity 120ms; user-select: none;
}
.oa-url-import-field--check:hover { background: var(--panel-2) !important; opacity: 1 !important; }
.oa-url-import-field-label { color: var(--ink-4); width: 72px; flex-shrink: 0; font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; }
.oa-url-import-field-val { color: var(--ink-1); font-weight: 500; }
.oa-url-import-input {
  flex: 1; min-width: 0; background: transparent; border: none; outline: none;
  font-size: 12px; color: var(--ink); font-family: var(--mono);
}
.oa-url-import-input::placeholder { color: var(--ink-3); font-family: inherit; }
.oa-spinner {
  width: 20px; height: 20px; border-radius: 50%;
  border: 2.5px solid var(--line); border-top-color: var(--accent);
  animation: oa-spin 0.7s linear infinite; flex-shrink: 0;
}
@keyframes oa-spin { to { transform: rotate(360deg); } }
.oa-dsection { margin-top: 22px; }
.oa-dsection:first-child { margin-top: 0; }
.oa-dsection h4 {
  font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.1em;
  color: var(--ink-3); margin: 0 0 10px; font-weight: 600;
}

.oa-ath-banner {
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px;
  background: var(--line); border-radius: var(--radius-lg); overflow: hidden;
  border: 1px solid var(--line);
}
.oa-banner-stat { background: var(--panel); padding: 14px 16px; }
.oa-banner-v { font-size: 22px; font-weight: 600; letter-spacing: -0.01em; font-variant-numeric: tabular-nums; }
.oa-banner-l { font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--ink-3); margin-top: 4px; font-weight: 600; }
.oa-banner-s { font-size: 11px; color: var(--ink-3); margin-top: 2px; }

.oa-compliance { display: flex; flex-direction: column; gap: 6px; }
.oa-comp-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 10px; background: var(--panel-2); border-radius: var(--radius); }
.oa-k { font-size: 11px; color: var(--ink-3); text-transform: uppercase; letter-spacing: 0.06em; font-weight: 600; }
.oa-v { font-size: 13px; }
.oa-kv { display: flex; flex-direction: column; gap: 6px; }
.oa-kv > div { display: flex; justify-content: space-between; padding: 8px 10px; background: var(--panel-2); border-radius: var(--radius); align-items: center; }

.oa-perf { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.oa-perf-cell { background: var(--panel-2); border-radius: var(--radius); padding: 12px; text-align: center; }
.oa-perf-v { font-size: 18px; font-weight: 600; font-variant-numeric: tabular-nums; }
.oa-perf-k { font-size: 10.5px; text-transform: uppercase; color: var(--ink-3); letter-spacing: 0.06em; margin-top: 2px; font-weight: 600; }

.oa-minirow {
  display: flex; align-items: center; gap: 10px; padding: 10px 12px;
  background: var(--panel-2); border-radius: var(--radius); cursor: pointer;
  margin-bottom: 4px;
}
.oa-minirow:hover { background: var(--panel-3); }
.oa-minirow.subtle { opacity: 0.7; }
.oa-minirow-title { flex: 1; font-size: 13px; font-weight: 500; }
.oa-minirow-meta { font-size: 12px; color: var(--ink-3); font-variant-numeric: tabular-nums; font-family: var(--mono); }

.oa-note { font-size: 13.5px; line-height: 1.55; color: var(--ink-2); text-wrap: pretty; }

/* ── Campaign drawer ──────────────────── */
.oa-c-grid {
  display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px 20px; margin-bottom: 18px;
}
.oa-c-grid .oa-k { margin-bottom: 4px; display: block; }
.oa-brand-pill { padding: 6px 10px; background: var(--panel-2); border-radius: var(--radius); font-size: 13px; font-weight: 500; }
.oa-num-big { font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }

.oa-prog-big { background: var(--panel-2); border-radius: var(--radius); padding: 12px 14px; margin-bottom: 20px; }
.oa-progbar { height: 6px; background: oklch(0.86 0.008 268 / 0.55); border-radius: 999px; overflow: hidden; flex: 1; box-shadow: inset 0 0 0 1px oklch(0.60 0.01 268 / 0.18); }
.oa-progbar > div { height: 100%; background: linear-gradient(90deg, oklch(0.55 0.22 265), oklch(0.62 0.18 295)); transition: width 300ms; }
.oa-progbar.big { height: 8px; }
.oa-prog-txt { font-size: 12px; color: var(--ink-2); margin-top: 8px; font-variant-numeric: tabular-nums; }

.oa-chip-row { display: flex; gap: 8px; flex-wrap: wrap; }
.oa-person-chip {
  display: flex; align-items: center; gap: 10px; padding: 8px 12px 8px 8px;
  background: var(--panel-2); border-radius: var(--radius); cursor: pointer;
  transition: background 120ms;
}
.oa-person-chip:hover { background: var(--panel-3); }
.oa-person-name { font-size: 13px; font-weight: 500; }
.oa-person-sub { font-size: 11px; color: var(--ink-3); }

.oa-deliv-list { display: flex; flex-direction: column; gap: 2px; }
.oa-deliv {
  display: grid; grid-template-columns: 20px 1fr 140px 100px 20px;
  align-items: center; gap: 12px; padding: 8px 8px; border-radius: var(--radius);
  min-height: var(--row-h);
}
.oa-deliv:hover { background: var(--panel-2); }
.oa-deliv.done .oa-deliv-title { color: var(--ink-3); text-decoration: line-through; }
.oa-deliv-title { font-size: 13px; min-width: 0; }
.oa-deliv-due { font-size: 12px; font-family: var(--mono); text-align: right; }
.oa-deliv-due.late { color: oklch(0.52 0.18 25); font-weight: 600; }
.oa-deliv.add { background: var(--panel-2); margin-top: 6px; padding: 6px 8px; }
.oa-deliv.add input { flex: 1; background: transparent; border: none; outline: none; font-size: 13px; grid-column: 2 / -1; }

.oa-files { display: flex; flex-direction: column; gap: 4px; }
.oa-file {
  display: flex; align-items: center; gap: 10px; padding: 8px 12px;
  background: var(--panel-2); border-radius: var(--radius); font-size: 12.5px;
}
.oa-file svg { color: var(--ink-3); }
.oa-file span:nth-child(2) { flex: 1; }
.oa-file-size { color: var(--ink-3); font-size: 10.5px; }

.oa-comments { display: flex; flex-direction: column; gap: 14px; margin-bottom: 14px; }
.oa-comment { display: flex; gap: 10px; }
.oa-comment-body { flex: 1; }
.oa-comment-head { display: flex; gap: 8px; align-items: baseline; margin-bottom: 2px; }
.oa-comment-head strong { font-size: 13px; }
.oa-comment-time { font-size: 11px; color: var(--ink-3); font-family: var(--mono); }
.oa-comment-text { font-size: 13px; line-height: 1.5; color: var(--ink); background: var(--panel-2); padding: 8px 10px; border-radius: var(--radius); }
.oa-mention { color: var(--accent-ink); background: var(--accent-wash); padding: 1px 5px; border-radius: 3px; font-weight: 500; }

.oa-comment-compose { display: flex; gap: 10px; position: relative; }
.oa-comment-compose textarea {
  width: 100%; min-height: 68px; padding: 10px 12px;
  border: 1px solid var(--line); border-radius: var(--radius); outline: none;
  background: var(--panel-2); font-size: 13px; resize: vertical;
}
.oa-comment-compose textarea:focus { border-color: var(--ink-4); background: var(--panel); }
.oa-comment-actions { display: flex; justify-content: space-between; align-items: center; margin-top: 6px; }
.oa-comment-hint { color: var(--ink-3); font-size: 11px; }
.oa-mention-menu {
  position: absolute; bottom: 70px; left: 0; z-index: 20;
  background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
  box-shadow: var(--shadow-pop); padding: 4px; min-width: 220px;
}
.oa-mention-item { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: var(--radius-sm); cursor: pointer; font-size: 13px; }
.oa-mention-item:hover { background: var(--panel-2); }

/* ── Kanban ───────────────────────────── */
.oa-kanban-wrap { overflow-x: auto; margin: 0 -4px; padding: 0 4px 8px; }
.oa-kanban {
  display: grid; grid-template-columns: repeat(4, minmax(240px, 1fr));
  gap: var(--gap); min-width: 960px;
}
.oa-kcol {
  background: var(--panel-2); border: 1px solid var(--line);
  border-radius: var(--radius-lg); padding: 12px; min-height: 300px;
  transition: background 140ms, border-color 140ms;
  backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur);
  box-shadow: var(--stroke-inner);
}
.oa-kcol.over { background: var(--panel); border-color: oklch(0.7 0.12 150 / 0.6); }
.oa-kcol-head { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
.oa-kcol-n { font-size: 12px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.oa-kcol-v { margin-left: auto; font-family: var(--mono); font-size: 11.5px; color: var(--ink-3); }
.oa-kcol-list { display: flex; flex-direction: column; gap: 8px; }
.oa-kcol-empty {
  font-size: 12px; color: var(--ink-4); text-align: center; padding: 32px 12px;
  border: 1.5px dashed var(--line); border-radius: var(--radius); font-style: italic;
}
.oa-kcard {
  background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 12px; cursor: grab; transition: all 200ms;
  backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur);
  box-shadow: var(--shadow-card), var(--stroke-inner);
}
.oa-kcard:hover { transform: translateY(-2px); box-shadow: var(--shadow-pop), var(--stroke-inner); }
.oa-kcard.dragging { opacity: 0.5; cursor: grabbing; }
.oa-kcard-brand { font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--ink-3); font-weight: 600; }
.oa-kcard-title { font-size: 13.5px; font-weight: 600; margin: 4px 0 6px; letter-spacing: -0.005em; text-wrap: pretty; }
.oa-kcard-meta { font-size: 11.5px; color: var(--ink-3); display: flex; gap: 6px; align-items: center; font-variant-numeric: tabular-nums; }
.oa-kcard-progress { display: flex; align-items: center; gap: 8px; margin: 10px 0 6px; }
.oa-progtxt { font-size: 10.5px; font-family: var(--mono); color: var(--ink-3); }
.oa-kcard-foot { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--line-2); }

/* ── Table ────────────────────────────── */
.oa-table-wrap {
  background: var(--panel); border: 1px solid var(--line);
  border-radius: var(--radius-lg); overflow: hidden;
  backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur);
  box-shadow: var(--shadow-card), var(--stroke-inner);
}
.oa-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.oa-table thead th {
  text-align: left; padding: 10px 14px; font-size: 10.5px;
  text-transform: uppercase; letter-spacing: 0.06em;
  color: var(--ink-3); font-weight: 600; background: var(--panel-2);
  backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur);
  border-bottom: 1px solid var(--line); white-space: nowrap;
}
.oa-table tbody td {
  padding: 0 14px; height: var(--row-h);
  border-bottom: 1px solid var(--line-2); vertical-align: middle;
}
.oa-table tbody tr { cursor: pointer; }
.oa-table tbody tr:hover { background: oklch(1 0 0 / 0.25); }
html[data-theme="dark"] .oa-table tbody tr:hover { background: oklch(1 0 0 / 0.04); }
.oa-table tbody tr:last-child td { border-bottom: none; }
.oa-table td.num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.oa-barleft { display: block; width: 3px; height: 22px; border-radius: 2px; background: oklch(0.7 0.01 240); }
.oa-barleft.tone-green { background: oklch(0.62 0.14 150); }
.oa-barleft.tone-amber { background: oklch(0.72 0.15 70); }
.oa-barleft.tone-violet { background: oklch(0.62 0.12 300); }
.oa-barleft.tone-slate { background: oklch(0.7 0.01 240); }
.oa-owner-cell { display: flex; align-items: center; gap: 6px; font-size: 12.5px; }
.oa-tbl-prog { display: flex; align-items: center; gap: 8px; min-width: 100px; }

/* ── Timeline ─────────────────────────── */
.oa-tl {
  background: var(--panel); border: 1px solid var(--line);
  border-radius: var(--radius-lg); padding: 14px; overflow: hidden; position: relative;
  backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur);
  box-shadow: var(--shadow-card), var(--stroke-inner);
}
.oa-tl-head { display: flex; border-bottom: 1px solid var(--line); padding-bottom: 8px; margin-bottom: 8px; }
.oa-tl-head-l { width: 280px; flex: 0 0 auto; font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-3); font-weight: 600; }
.oa-tl-head-r { flex: 1; display: flex; }
.oa-tl-month { font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-3); font-weight: 600; border-left: 1px solid var(--line-2); padding-left: 6px; }
.oa-tl-body { position: relative; }
.oa-tl-today { position: absolute; top: 0; bottom: 0; width: 2px; background: oklch(0.55 0.2 25); z-index: 2; pointer-events: none; }
.oa-tl-row { display: flex; align-items: center; min-height: 44px; border-bottom: 1px solid var(--line-2); cursor: pointer; }
.oa-tl-row:hover { background: var(--panel-2); }
.oa-tl-row:last-child { border-bottom: none; }
.oa-tl-row-l { width: 280px; flex: 0 0 auto; padding: 8px 12px 8px 0; }
.oa-tl-row-title { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.oa-tl-row-sub { font-size: 11px; color: var(--ink-3); }
.oa-tl-row-r { flex: 1; position: relative; height: 28px; }
.oa-tl-bar {
  position: absolute; top: 4px; height: 22px;
  border-radius: var(--radius-sm); padding: 0 10px;
  display: flex; align-items: center; font-size: 11px; font-weight: 500;
  background: var(--tone-slate-bg); color: var(--tone-slate-ink);
  white-space: nowrap; overflow: hidden;
}
.oa-tl-bar.tone-green { background: var(--tone-green-bg); color: var(--tone-green-ink); }
.oa-tl-bar.tone-amber { background: var(--tone-amber-bg); color: var(--tone-amber-ink); }
.oa-tl-bar.tone-violet { background: var(--tone-violet-bg); color: var(--tone-violet-ink); }

/* ── Calendar ────────────────────────── */
.oa-cal { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius-lg); padding: 16px; backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur); box-shadow: var(--shadow-card), var(--stroke-inner); }
.oa-cal-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
.oa-cal-head h3 { margin: 0; font-size: 16px; font-weight: 600; }
.oa-cal-nav { display: flex; gap: 4px; }
.oa-cal-nav button {
  border: 1px solid var(--line); background: var(--panel); border-radius: var(--radius-sm);
  padding: 4px 10px; font-size: 12px; color: var(--ink-2); min-width: 32px;
}
.oa-cal-nav button:hover { border-color: var(--ink-4); color: var(--ink); }
.oa-cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); border: 1px solid var(--line-2); border-radius: var(--radius); overflow: hidden; }
.oa-cal-dow {
  padding: 8px 10px; font-size: 10.5px; text-transform: uppercase;
  letter-spacing: 0.06em; color: var(--ink-3); font-weight: 600;
  background: var(--panel-2); border-bottom: 1px solid var(--line-2);
}
.oa-cal-cell {
  min-height: 96px; padding: 6px 8px;
  border-right: 1px solid var(--line-2); border-bottom: 1px solid var(--line-2);
  display: flex; flex-direction: column; gap: 3px;
  background: var(--panel);
}
.oa-cal-cell.empty { background: var(--panel-2); }
.oa-cal-cell.today { background: oklch(0.98 0.03 90); }
html[data-theme="dark"] .oa-cal-cell.today { background: oklch(0.28 0.04 150); }
.oa-cal-num { font-size: 12px; font-weight: 600; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.oa-cal-cell.today .oa-cal-num { color: var(--accent-ink); background: var(--accent-wash); border-radius: 4px; padding: 0 5px; display: inline-block; width: fit-content; }
.oa-cal-items { display: flex; flex-direction: column; gap: 2px; }
.oa-cal-item {
  font-size: 10.5px; padding: 2px 6px; border-radius: 3px;
  cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  background: var(--tone-slate-bg); color: var(--tone-slate-ink);
  display: flex; align-items: center; gap: 3px;
}
.oa-cal-item.tone-green { background: var(--tone-green-bg); color: var(--tone-green-ink); }
.oa-cal-item.tone-amber { background: var(--tone-amber-bg); color: var(--tone-amber-ink); }
.oa-cal-item.tone-violet { background: var(--tone-violet-bg); color: var(--tone-violet-ink); }
.oa-cal-item { cursor: pointer; }
.oa-cal-item:hover { filter: brightness(1.12); }
.oa-cal-item.done { opacity: 0.55; text-decoration: line-through; }
.oa-cal-more { font-size: 10px; color: var(--ink-3); padding: 0 6px; cursor: pointer; }
.oa-cal-more:hover { color: var(--ink-2); }
/* Add-task button inside each day cell */
.oa-cal-cell-add {
  opacity: 0; transition: opacity 0.12s;
  background: none; border: none; cursor: pointer;
  color: var(--ink-4); padding: 1px 4px; border-radius: 4px; line-height: 1;
  display: flex; align-items: center; justify-content: center;
}
.oa-cal-cell:not(.empty):hover .oa-cal-cell-add { opacity: 1; }
.oa-cal-cell-add:hover { background: var(--panel-2); color: var(--ink-2); }
/* Content calendar new-style cells */
.oa-content-cal-cell:hover .oa-cal-cell-add { opacity: 1 !important; }
/* Normalize SearchSelect height inside the calendar modal to match date input */
.oa-cal-modal-select { flex: 1; }
.oa-cal-modal-select .oa-ss-trigger { padding: 7px 12px; font-size: 12px; height: 36px; box-sizing: border-box; }
/* Calendar event popover */
.oa-cal-popover {
  position: fixed; z-index: 9999;
  background: var(--panel-solid); border: 1px solid var(--line);
  border-radius: 11px; padding: 14px 14px 12px;
  width: 248px;
  box-shadow: 0 8px 32px oklch(0 0 0 / 0.28), 0 2px 8px oklch(0 0 0 / 0.12);
}

/* ── Workload ────────────────────────── */
.oa-wl { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius-lg); padding: 8px; backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur); box-shadow: var(--shadow-card), var(--stroke-inner); }
.oa-wl-row {
  display: grid; grid-template-columns: 220px 240px 1fr;
  align-items: center; gap: 16px; padding: 14px 12px;
  border-bottom: 1px solid var(--line-2);
}
.oa-wl-row:last-child { border-bottom: none; }
.oa-wl-user { display: flex; align-items: center; gap: 10px; }
.oa-wl-name { font-weight: 600; font-size: 13px; }
.oa-wl-role { font-size: 11px; color: var(--ink-3); }
.oa-wl-bar { display: flex; align-items: center; gap: 10px; }
.oa-wl-barfill {
  height: 22px; background: var(--accent-wash); border-radius: var(--radius-sm);
  display: flex; align-items: center; padding: 0 10px;
  font-size: 11px; font-weight: 600; color: var(--accent-ink);
  min-width: 50px; transition: width 300ms;
}
.oa-wl-late {
  font-size: 10.5px; font-weight: 600; color: var(--tone-coral-ink);
  background: var(--tone-coral-bg); padding: 2px 7px; border-radius: 3px;
}
.oa-wl-tasks { display: flex; flex-direction: column; gap: 2px; }
.oa-wl-task {
  display: flex; justify-content: space-between; gap: 10px;
  padding: 4px 8px; border-radius: var(--radius-sm); cursor: pointer; font-size: 12px;
}
.oa-wl-task:hover { background: var(--panel-2); }
.oa-wl-task.more { color: var(--ink-3); font-size: 11px; padding-left: 8px; cursor: default; }
.oa-wl-t-title { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.oa-wl-t-due { font-family: var(--mono); font-size: 11px; color: var(--ink-3); flex: 0 0 auto; }
.oa-wl-t-due.late { color: oklch(0.52 0.18 25); font-weight: 600; }
.oa-wl-t-due.soon { color: oklch(0.52 0.14 65); font-weight: 600; }

/* ── Modal ────────────────────────────── */
.oa-modal-wrap {
  position: fixed; inset: 0; background: oklch(0.2 0.05 170 / 0.4); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  display: grid; place-items: center; z-index: 200; padding: 20px;
}
.oa-modal {
  background: var(--panel-solid); border-radius: var(--radius-xl); border: 1px solid var(--line);
  backdrop-filter: var(--blur-strong); -webkit-backdrop-filter: var(--blur-strong);
  box-shadow: var(--shadow-pop), var(--stroke-inner); max-height: 92vh; overflow: visible;
  display: flex; flex-direction: column;
}
.oa-modal-head { padding: 22px 28px; border-bottom: 1px solid var(--line-2); display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; }
.oa-modal-head h3 { margin: 0; font-size: 18px; font-weight: 600; }
.oa-modal-foot { padding: 18px 28px; border-top: 1px solid var(--line-2); display: flex; justify-content: flex-end; gap: 10px; flex-shrink: 0; }

.oa-form { padding: 26px 28px; display: flex; flex-direction: column; gap: 20px; overflow-y: auto; }
.oa-form-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 18px; }
.oa-form label { display: flex; flex-direction: column; gap: 7px; font-size: 13px; }
.oa-form label > span { color: var(--ink-3); font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; font-size: 11px; }
.oa-form input, .oa-form select {
  padding: 11px 14px; border: 1px solid var(--line); border-radius: var(--radius);
  background: var(--panel); outline: none; font-size: 14px;
}
.oa-form input:focus, .oa-form select:focus { border-color: var(--ink-4); }

/* ── Playbook stage groups (drawer) ─────── */
.oa-stage-group { margin-bottom: 2px; }
.oa-stage-head {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 0 6px; cursor: pointer; user-select: none;
}
.oa-stage-head:hover .oa-stage-label { color: var(--ink-1); }
.oa-stage-label { font-size: 11px; font-weight: 700; color: var(--ink-2); text-transform: uppercase; letter-spacing: 0.07em; flex: 1; }
.oa-stage-count-pill {
  font-size: 11px; color: var(--ink-3); font-family: var(--mono); font-weight: 600;
  background: var(--panel); border: 1px solid var(--line);
  border-radius: 99px; padding: 2px 9px;
}
.oa-stage-count-pill.done { background: var(--accent-wash); color: var(--accent-ink); border-color: transparent; }
.oa-stage-divider { height: 1px; background: var(--line); margin: 4px 0 10px; }

/* ── Playbook preview in AddCampaignModal ─ */
.oa-pb-row { display: flex; align-items: center; gap: 14px; padding: 13px 16px; background: var(--panel-2); border: 1px solid var(--line); border-radius: var(--radius-lg); }
.oa-pb-row-info { flex: 1; min-width: 0; }
.oa-pb-row-name { font-size: 14px; font-weight: 600; color: var(--ink-1); display: flex; align-items: center; gap: 8px; }
.oa-pb-row-meta { font-size: 12px; color: var(--ink-3); margin-top: 3px; }
.oa-pb-badge { font-size: 10px; padding: 2px 7px; background: var(--green); color: #fff; border-radius: 99px; font-weight: 700; letter-spacing: 0.04em; }
.oa-pb-stages-preview { margin-top: 10px; display: flex; flex-direction: column; gap: 4px; }
.oa-pb-stage-row { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--ink-2); }
.oa-pb-stage-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent-ink); flex-shrink: 0; }
.oa-pb-stage-steps { font-size: 11px; color: var(--ink-4); margin-left: auto; font-family: var(--mono); }

/* ── Manage + create playbook modals ───── */
.oa-pb-list { display: flex; flex-direction: column; gap: 10px; }
.oa-pb-mgr-row { display: flex; align-items: center; gap: 12px; padding: 14px 16px; background: var(--panel-2); border: 1px solid var(--line); border-radius: var(--radius-lg); }
.oa-pb-mgr-info { flex: 1; }
.oa-pb-mgr-name { font-size: 14px; font-weight: 600; color: var(--ink-1); }
.oa-pb-mgr-meta { font-size: 12px; color: var(--ink-3); margin-top: 2px; }

.oa-cpb-stage { background: var(--panel-2); border: 1px solid var(--line); border-radius: var(--radius-lg); margin-bottom: 10px; overflow: visible; }
.oa-cpb-stage-head { display: flex; align-items: center; gap: 8px; padding: 10px 14px; border-bottom: 1px solid var(--line); }
.oa-cpb-stage-name { flex: 1; background: transparent; border: none; outline: none; font-size: 13px; font-weight: 600; color: var(--ink-1); }
.oa-cpb-stage-name::placeholder { color: var(--ink-4); font-weight: 400; }
.oa-cpb-steps { padding: 8px 12px; display: flex; flex-direction: column; gap: 7px; }
.oa-cpb-step { display: flex; align-items: center; gap: 8px; }
.oa-cpb-step-title { flex: 1; padding: 8px 12px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--panel); outline: none; font-size: 13px; color: var(--ink-1); }
.oa-cpb-step-title::placeholder { color: var(--ink-4); }
.oa-cpb-step-title:focus { border-color: var(--ink-4); }
.oa-cpb-roles { display: flex; flex-wrap: wrap; gap: 4px; }
.oa-cpb-role { padding: 3px 9px; border-radius: 99px; font-size: 11px; font-weight: 600; cursor: pointer; border: 1px solid var(--line); background: var(--panel); color: var(--ink-3); transition: all 0.1s; }
.oa-cpb-role.on { background: var(--accent-wash); color: var(--accent-ink); border-color: var(--accent-ink); }
.oa-cpb-add-step { display: flex; align-items: center; gap: 6px; padding: 7px 12px 10px; font-size: 12px; color: var(--ink-4); cursor: pointer; background: none; border: none; }
.oa-cpb-add-step:hover { color: var(--ink-1); }
.oa-cpb-add-stage { display: flex; align-items: center; justify-content: center; gap: 6px; padding: 11px; border: 1px dashed var(--line); border-radius: var(--radius-lg); font-size: 13px; color: var(--ink-3); cursor: pointer; background: none; width: 100%; margin-top: 4px; }
.oa-cpb-add-stage:hover { border-color: var(--ink-3); color: var(--ink-1); }

.oa-pb-select-wrap { display: flex; gap: 10px; align-items: stretch; }
.oa-pb-select-wrap select { flex: 1; }
.oa-pb-manage-link { padding: 11px 14px; background: var(--panel-2); border: 1px solid var(--line); border-radius: var(--radius); font-size: 13px; color: var(--ink-2); cursor: pointer; white-space: nowrap; }
.oa-pb-manage-link:hover { background: var(--panel-3, var(--panel-2)); color: var(--ink-1); }

.oa-roles-row { display: flex; flex-wrap: wrap; gap: 5px; }
.oa-role-tag { display: inline-flex; align-items: center; padding: 2px 9px; border-radius: 99px; font-size: 11px; font-weight: 700; background: var(--panel); border: 1px solid var(--line); color: var(--ink-2); letter-spacing: 0.02em; }

/* Workflow task rows — reveal grip + delete on hover */
.oa-workflow-task-row:hover { background: var(--panel-2); }
.oa-workflow-task-row:hover .oa-wf-grip { opacity: 0.7 !important; }
.oa-workflow-task-row:hover .oa-wf-delete { opacity: 0.45 !important; }
.oa-wf-delete:hover { opacity: 1 !important; color: oklch(0.65 0.20 25) !important; }
input[type="date"].oa-date-inline::-webkit-calendar-picker-indicator { display: none; }
input[type="date"].oa-date-inline { cursor: pointer; }

.oa-athlete-picker { display: flex; flex-wrap: wrap; gap: 6px; padding: 6px; background: var(--panel-2); border-radius: var(--radius); max-height: 160px; overflow-y: auto; }
.oa-pick {
  padding: 5px 10px; background: var(--panel); border: 1px solid var(--line);
  border-radius: 999px; font-size: 12px; color: var(--ink-2);
}
.oa-pick:hover { border-color: var(--ink-4); }
.oa-pick.on { background: var(--accent); color: #fff; border-color: var(--accent); }

/* ── Tweaks panel ─────────────────────── */
.oa-tweaks {
  position: fixed; right: 24px; bottom: 24px; z-index: 300;
  background: var(--panel-solid); border: 1px solid var(--line); border-radius: var(--radius-lg);
  backdrop-filter: var(--blur-strong); -webkit-backdrop-filter: var(--blur-strong);
  box-shadow: var(--shadow-pop), var(--stroke-inner); width: 280px; padding: 14px;
}
.oa-tweaks-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
.oa-tweaks-head h4 { margin: 0; font-size: 13px; font-weight: 600; }
.oa-tweak-group { margin-bottom: 12px; }
.oa-tweak-group:last-child { margin-bottom: 0; }
.oa-tweak-label { font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-3); font-weight: 600; margin-bottom: 6px; }

/* ── Radar ─────────────────────────────── */
.oa-radar { display: block; }
.oa-member-radar-wrap {
  display: flex; justify-content: center; padding: 14px 52px; background: var(--panel-2);
  border-radius: var(--radius-lg); box-shadow: var(--stroke-inner);
}

/* ── Form row ──────────────────────────── */
.oa-form-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.oa-form-row > label { min-width: 0; }

/* ── Clients page ──────────────────────── */
.oa-clients-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
  gap: 14px;
}
.oa-client-card {
  background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius-lg);
  backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur);
  padding: 16px; cursor: pointer; transition: transform .14s ease, box-shadow .14s ease;
  box-shadow: var(--shadow-card), var(--stroke-inner);
  display: flex; flex-direction: column; gap: 12px;
}
.oa-client-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-pop), var(--stroke-inner); }
.oa-client-head { display: flex; align-items: center; gap: 12px; }
.oa-client-logo {
  width: 40px; height: 40px; border-radius: var(--radius); background: var(--panel-2);
  display: flex; align-items: center; justify-content: center;
  font-size: 12px; font-weight: 700; letter-spacing: 0.04em; color: var(--ink);
  box-shadow: var(--stroke-inner); flex-shrink: 0;
}
.oa-client-logo.lg { width: 48px; height: 48px; font-size: 14px; border-radius: var(--radius-lg); }
.oa-client-name { font-size: 14.5px; font-weight: 600; color: var(--ink); }
.oa-client-meta { font-size: 11.5px; color: var(--ink-3); margin-top: 2px; }
.oa-client-tags { display: flex; gap: 6px; flex-wrap: wrap; }
.oa-client-stats {
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px;
  background: var(--line); border-radius: var(--radius); overflow: hidden;
  box-shadow: var(--stroke-inner);
}
.oa-client-stats .oa-stat { background: var(--panel-2); padding: 10px 6px; text-align: center; }
.oa-client-foot {
  display: flex; justify-content: space-between; align-items: center;
  font-size: 12px; color: var(--ink-3); padding-top: 4px;
  border-top: 1px solid var(--line-2);
}
.oa-client-contact { font-family: var(--mono); font-size: 11px; }

/* ── Team page ─────────────────────────── */
.oa-dept-stack { display: flex; flex-direction: column; gap: 28px; }
.oa-dept {
  background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius-xl);
  backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur);
  padding: 20px; box-shadow: var(--shadow-card), var(--stroke-inner);
}
.oa-dept-head {
  display: flex; align-items: center; gap: 14px; margin-bottom: 18px;
  padding-bottom: 16px; border-bottom: 1px solid var(--line-2);
}
.oa-dept-mark {
  width: 44px; height: 44px; border-radius: var(--radius);
  display: flex; align-items: center; justify-content: center;
  font-size: 13px; font-weight: 700; letter-spacing: 0.06em;
  box-shadow: var(--stroke-inner); flex-shrink: 0;
}
.oa-dept-title { margin: 0; font-size: 18px; font-weight: 600; letter-spacing: -0.01em; }
.oa-dept-comp {
  display: flex; flex-direction: column; align-items: center; gap: 2px;
  padding: 6px 14px; background: var(--panel-2); border-radius: var(--radius-lg);
  box-shadow: var(--stroke-inner);
}
.oa-dept-comp-label {
  font-size: 9.5px; text-transform: uppercase; letter-spacing: 0.08em;
  color: var(--ink-3); font-weight: 600;
}

.oa-team-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  gap: 12px;
}
.oa-team-card {
  background: var(--panel-2); border: 1px solid var(--line-2); border-radius: var(--radius-lg);
  padding: 14px; cursor: pointer; transition: background .14s;
  box-shadow: var(--stroke-inner);
  display: flex; flex-direction: column; gap: 4px;
}
.oa-team-card:hover { background: var(--panel); }
.oa-team-card-top { display: flex; align-items: center; gap: 10px; }
.oa-team-card-name { font-size: 13.5px; font-weight: 600; color: var(--ink); }
.oa-team-card-role { font-size: 11.5px; color: var(--ink-3); margin-top: 1px; }
.oa-team-card-load {
  text-align: center; padding: 4px 10px; background: var(--panel-3); border-radius: var(--radius);
  box-shadow: var(--stroke-inner);
}
.oa-team-load-v { font-size: 16px; font-weight: 700; font-family: var(--mono); color: var(--ink); line-height: 1; }
.oa-team-load-l { font-size: 9px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--ink-3); font-weight: 600; margin-top: 2px; }
.oa-team-radar {
  display: flex; justify-content: center; align-items: center;
  padding: 6px 0;
}

/* ── Department tab bar ──────────────── */
.oa-dept-tabs {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
  gap: 10px; margin-bottom: 20px;
}
.oa-dept-tab {
  display: flex; align-items: center; gap: 12px; text-align: left;
  padding: 12px 14px; background: var(--panel-2); border: 1px solid var(--line-2);
  border-radius: var(--radius-lg); cursor: pointer; transition: all .14s ease;
  box-shadow: var(--stroke-inner);
}
.oa-dept-tab:hover { background: var(--panel); transform: translateY(-1px); }
.oa-dept-tab.on {
  background: var(--panel);
  border-color: oklch(0.6 0.14 var(--tab-hue) / 0.5);
